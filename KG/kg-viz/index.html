<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱可视化与增量变更</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 32 32" width="18" height="18" fill="none">
      <circle cx="16" cy="15" r="4" fill="#fff"/><circle cx="7" cy="8" r="2.4" fill="#fff" opacity=".9"/>
      <circle cx="25" cy="9" r="2.4" fill="#fff" opacity=".9"/><circle cx="8" cy="24" r="2.4" fill="#fff" opacity=".9"/>
      <circle cx="24" cy="24" r="2.4" fill="#fff" opacity=".9"/>
      <path d="M16 15 L7 8 M16 15 L25 9 M16 15 L8 24 M16 15 L24 24" stroke="#fff" stroke-width="1.5" opacity=".7"/>
    </svg></div>
    <div class="brand-name">知识图谱可视化<small>Knowledge Graph · 增量变更</small></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="stDocTotal">—</b>后端文档</div>
    <div class="stat"><b id="stNodes">0</b>已加载节点</div>
    <div class="stat"><b id="stEdges">0</b>关系</div>
    <div class="stat"><b id="stChanges">0</b>变更</div>
  </div>
  <div class="spacer"></div>
  <div class="search-in">⌕<input type="text" id="search" placeholder="搜索节点（在百万级后端里检索）…"></div>
  <button class="btn sm" id="syncBtn">⟳ 同步增量</button>
  <button class="btn sm" id="playBtn">▶ 演示增量更新</button>
  <button class="btn sm" id="exportBtn">↧ 导出</button>
  <button class="btn sm" id="importBtn">↥ 导入</button>
  <input type="file" id="importFile" accept="application/json" style="display:none">
  <button class="btn sm" id="resetBtn">⟲ 重置</button>
</div>

<div class="wrap">
  <!-- 左：增量操作面板 -->
  <div class="panel left">
    <div class="sec">
      <div class="sec-t">增量操作</div>
      <div class="note">每一次增 / 删 / 改都会以<b>增量方式</b>更新图谱（局部动画 + 力学重算），并记录到右侧变更日志，可随时撤销。</div>
      <div class="field"><label>① 新增节点</label>
        <input type="text" id="nName" placeholder="节点名称，如「航意险」">
      </div>
      <div class="field"><label>节点类型</label>
        <div class="type-pick" id="typePick"></div>
      </div>
      <button class="btn primary full" id="addNodeBtn">＋ 添加节点</button>
    </div>

    <div class="sec">
      <div class="field"><label>② 新增关系</label>
        <div class="row2">
          <select id="eFrom"></select>
          <select id="eTo"></select>
        </div>
      </div>
      <div class="field"><label>关系名称</label>
        <input type="text" id="eLabel" placeholder="如「包含 / 关联 / 触发」">
      </div>
      <button class="btn primary full" id="addEdgeBtn">＋ 添加关系</button>
    </div>

    <div class="sec" style="flex:1">
      <div class="sec-t">类型图例 / 过滤<span class="n" id="legendTotal"></span></div>
      <div class="legend" id="legend"></div>
      <div style="font-size:11px;color:var(--ink-faint);margin-top:10px">点击图例可隐藏 / 显示对应类型节点</div>
    </div>
  </div>

  <!-- 中：画布 -->
  <div class="panel canvas-wrap" style="padding:0;background-clip:padding-box">
    <svg id="graph"><g id="viewport"><g id="edgeLayer"></g><g id="nodeLayer"></g></g></svg>
    <div class="float playing-tag" id="playingTag"><span class="sp"></span>正在演示增量更新…</div>
    <div class="float zoom">
      <button id="zoomIn">＋</button><button id="zoomReset">⊙</button><button id="zoomOut">－</button>
    </div>
    <div class="float hint-bar">
      <span><b>双击</b> 展开邻居</span><span><b>拖拽</b> 移动节点</span><span><b>滚轮</b> 缩放</span><span><b>空白拖拽</b> 平移</span><span><b>单击</b> 看切片</span>
    </div>
  </div>

  <!-- 右：详情 + 变更日志 -->
  <div class="panel right">
    <div class="sec">
      <div class="sec-t">节点详情</div>
      <div id="detail"><div class="detail-empty">点击任意节点查看详情<br>并进行编辑 / 删除</div></div>
    </div>
    <div class="sec" style="flex:1">
      <div class="sec-t">变更日志<span class="n"><button class="btn sm" id="undoBtn" style="padding:2px 9px" disabled>↶ 撤销</button></span></div>
      <div class="log" id="log"><div class="log-empty">暂无变更。试试左侧的增量操作，<br>或点顶部「演示增量更新」。</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
