<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>评估分析 · Badcase 详情</title>
<style>
  :root{
    --accent:#e8631a; --accent-ghost:#fdeee2; --surface:#faf7f1; --canvas:#fffdf9; --card:#fff;
    --ink:#2a241e; --ink-soft:#6b6358; --line:#eadfce;
    --good:#3f9d58; --warn:#d9972f; --bad:#cc4b37; --frag:#b9842f;
    --c-empty:#8a7f6d; --c-miss:#cc4b37; --c-frag:#b9842f; --c-noise:#7a5bb0; --c-gen:#2f7d9a; --c-other:#9a9284;
    --shadow:0 1px 2px rgba(42,36,30,.05),0 8px 22px rgba(42,36,30,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--surface);color:var(--ink);font-size:13px}
  .wrap{max-width:1180px;margin:0 auto;padding:22px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  h1{margin:0;font-size:20px;font-weight:700}
  header .sub{margin:4px 0 0;color:var(--ink-soft);font-size:12.5px}
  .btn{border:1px solid var(--accent);background:var(--accent-ghost);color:var(--accent);font:inherit;font-size:12.5px;font-weight:600;border-radius:8px;padding:7px 13px;cursor:pointer}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .card .v{font-size:26px;font-weight:700;line-height:1}
  .card .l{color:var(--ink-soft);font-size:12px;margin-top:6px}
  .card .n{color:var(--ink-soft);font-size:11px;margin-top:3px}
  .panelrow{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0;margin-bottom:16px}
  .box h2{margin:0 0 12px;font-size:13px;font-weight:700}
  .catbar{display:flex;flex-direction:column;gap:9px}
  .catrow{display:grid;grid-template-columns:120px 1fr 32px;align-items:center;gap:10px;cursor:pointer}
  .catrow:hover .catname{color:var(--accent)}
  .catname{font-size:12px;display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .track{height:16px;background:var(--surface);border-radius:5px;overflow:hidden}
  .fill{height:100%;border-radius:5px}
  .catcnt{font-size:12px;font-weight:700;text-align:right}
  .dims{display:flex;flex-direction:column;gap:10px}
  .dim{display:grid;grid-template-columns:84px 1fr 34px;align-items:center;gap:10px}
  .dim .dl{font-size:12px;color:var(--ink-soft)}
  .dim .dtrack{height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
  .dim .dfill{height:100%;background:var(--accent);border-radius:4px}
  .dim .dv{font-size:12px;font-weight:700;text-align:right}
  .insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .insights li{display:flex;gap:9px;font-size:12.5px;line-height:1.5;align-items:flex-start}
  .insights li .ic{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:6px}
  .insights li b{color:var(--accent)}
  .listbox{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
  .chip{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;background:#fff;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
  .chip.on{background:var(--accent-ghost);border-color:#f3d9c4;color:var(--accent)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
  th{color:var(--ink-soft);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-ghost)}
  .badge{font-size:10.5px;font-weight:600;color:#fff;border-radius:5px;padding:2px 8px;white-space:nowrap}
  .sc{font-weight:700}
  .sc.lo{color:var(--bad)} .sc.mid{color:var(--warn)} .sc.hi{color:var(--good)}
  .overlay{position:fixed;inset:0;background:rgba(42,36,30,.35);display:none;z-index:40}
  .overlay.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,94vw);background:var(--card);box-shadow:-8px 0 30px rgba(42,36,30,.18);transform:translateX(100%);transition:transform .22s ease;z-index:41;overflow-y:auto}
  .drawer.show{transform:translateX(0)}
  .dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
  .dh .q{font-size:15px;font-weight:700;line-height:1.35;margin:8px 0 0}
  .dsec{padding:14px 20px;border-bottom:1px solid var(--line)}
  .dsec h3{margin:0 0 9px;font-size:11px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .summary{font-size:12.5px;line-height:1.55;background:var(--surface);border-left:3px solid var(--accent);border-radius:6px;padding:10px 12px}
  .fix{background:var(--accent-ghost);border:1px solid #f3d9c4;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#8a3d10}
  .ev{font-size:12.5px;color:var(--ink);line-height:1.55}
  .signals{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .sig{font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--ink-soft)}
  .sig b{color:var(--ink)}
  .dimdetail{display:flex;flex-direction:column;gap:11px}
  .dd .ddh{display:flex;align-items:center;justify-content:space-between}
  .dd .ddh span:first-child{font-size:12.5px;font-weight:600}
  .dd .ddv{font-size:15px;font-weight:700}
  .dd .reason{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:2px}
  .dd .ddtrack{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:5px}
  .dd .ddbar{height:100%;border-radius:3px}
  .srcitem{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .srcitem.hit{border-color:#bfe0c8;background:#f4fbf6}
  .srchead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
  .srchead .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .srcitem.hit .fn{color:var(--good)}
  .srchead .sm{color:var(--ink-soft);font-size:11px;flex:none}
  .srccontent{margin-top:7px;font-size:11.5px;color:var(--ink);line-height:1.5;background:var(--surface);border-radius:6px;padding:8px 10px;max-height:120px;overflow:auto;white-space:pre-wrap}
  .ans{font-size:12.5px;line-height:1.55;border-radius:8px;padding:10px 12px;white-space:pre-wrap}
  .ans.exp{background:#f4fbf6;border:1px solid #bfe0c8} .ans.act{background:#fcf1ef;border:1px solid #ecccc5}
  .close{position:absolute;top:14px;right:16px;cursor:pointer;border:none;background:none;font-size:22px;color:var(--ink-soft);line-height:1}
  @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}.panelrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>评估分析 · Badcase 详情</h1>
      <p class="sub">自动归类低分题 · 根因与修复建议 · 检索内容/评分/理由逐题展示 · 本地离线</p>
    </div>
    <div>
      <button class="btn" id="loadBtn">载入评估结果 JSON</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="box" id="insightsBox"><h2>分析洞察</h2><ul class="insights" id="insights"></ul></div>

  <div class="panelrow">
    <div class="box" style="margin-bottom:0"><h2>Badcase 根因分布</h2><div class="catbar" id="catbar"></div></div>
    <div class="box" style="margin-bottom:0"><h2>四维平均分</h2><div class="dims" id="dims"></div></div>
  </div>

  <div class="listbox">
    <div class="filters" id="filters"></div>
    <table>
      <thead><tr><th>题</th><th>问题</th><th>正确性</th><th>根因</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer"></aside>

<script>
"use strict";
const CAT = {
  empty_retrieval:{label:"检索为空", color:"var(--c-empty)", fix:"检索没召回任何内容：查扩展、放宽门禁、确认该文档已入库。"},
  retrieval_miss:{label:"漏召回", color:"var(--c-miss)", fix:"正确文档没进 top-k：查询扩展(Phase2→フェーズ2)、提升向量权重、扩大候选池。"},
  context_fragment:{label:"上下文碎片", color:"var(--c-frag)", fix:"正确文档命中但关键行不在召回的 chunk：答案时表格重组 / 父文档召回 / 改 Excel chunk 策略。"},
  noise_wrong_level:{label:"噪声·层级不符", color:"var(--c-noise)", fix:"召回被无关来源淹没：rerank 调权、来源一致性门槛、doc-type 加权。"},
  generation_issue:{label:"生成问题", color:"var(--c-gen)", fix:"素材里有但答错 / 没答到：检查判官 prompt、completeness 口径、温度。"},
  other:{label:"其它", color:"var(--c-other)", fix:"需人工复核。"},
};
const CAT_ORDER = ["retrieval_miss","context_fragment","noise_wrong_level","empty_retrieval","generation_issue","other"];
const DIMS = [["faithfulness","忠实度"],["answer_relevance","答案相关性"],["completeness","完整性"],["correctness","正确性"]];

let DATA = [
  {id:"Q7", question:"画面ID D3010 の画面名称は？", expected_file:"业务设计要约", expected_answer:"「新契約一覧」。分類は「新契約」。",
   actual_output:"画面ID D3010の画面名称は、素材内では確認できません。",
   judge_summary:"答案忠于素材但素材里不含正确行 → 问题在检索/切块，不在生成。",
   scores:{faithfulness:5,answer_relevance:3,completeness:1,correctness:1},
   rationales:{faithfulness:"答案完全基于素材，未编造；素材里确实没有 D3010 行。",answer_relevance:"回应了问题，但只能回答『无法确认』。",completeness:"未给出画面名称，关键信息缺失。",correctness:"正确答案是『新契約一覧』，模型没答出。"},
   retrieval:{context_relevance:0.55,toehold_recall:1,sources:[
     {source_file:"【业务设计要約】Medical Revision2…FWDnavi.xlsx",score:2.20,term_coverage:0.42,content:"[行]A17:No|T17分類|Z17画面ID|AD17画面名称\n[行]A18:D0000 認証\n[行]A19:D1030 利用規程 …（表头+前两行，D3010 在更后面的行，被 chunk 边界切断）"},
     {source_file:"SalesTool设计书.xlsx",score:1.1,term_coverage:0.2,content:"画面遷移の概要…（与 D3010 无关）"}]}},
  {id:"Q8", question:"システム分類「嘱託医」に属する画面は？", expected_file:"业务设计要约", expected_answer:"D6010「嘱託医検索」とD6020「嘱託医詳細」。",
   actual_output:"確認できた範囲では、特定できませんでした。",
   judge_summary:"正确 chunk 命中但截断；其余 chunk 的『嘱託医扱』来自别系统，噪声干扰。",
   scores:{faithfulness:5,answer_relevance:2,completeness:1,correctness:1},
   rationales:{faithfulness:"未编造，诚实说无法确定。",answer_relevance:"几乎没回应到具体画面。",completeness:"未列出任何画面 ID。",correctness:"应为 D6010/D6020，未答出。"},
   retrieval:{context_relevance:0.5,toehold_recall:1,sources:[
     {source_file:"【业务设计要約】Medical Revision2…FWDnavi.xlsx",score:3.87,term_coverage:0.4,content:"同一张表的表头+前两行，嘱託医分类的 D6010/D6020 不在此 chunk。"},
     {source_file:"SalesTool画面要件定义书.xlsx",score:2.0,term_coverage:0.3,content:"診査区分の選択肢に『嘱託医扱』…（不同系统，概念不同）"},
     {source_file:"服务器基础概念.pptx",score:1.2,term_coverage:0.1,content:"サーバ構成の概要…"},
     {source_file:"系统全体概要.pptx",score:1.0,term_coverage:0.1,content:"バッチ処理・DB概要…"}]}},
  {id:"Q11", question:"Phase2で影響を受ける他システムは？", expected_file:"NewMedicalRevision2023_Ph2", expected_answer:"SalesTool(PPL)、FWD Navi/Xuras、LifeJ…",
   actual_output:"システム間インターフェースは「変更なし」です。VPMS、Common…",
   judge_summary:"正确文档完全没进 top-k，模型只能从无关文档拼凑 → 漏召回。",
   scores:{faithfulness:4,answer_relevance:2,completeness:1,correctness:1},
   rationales:{faithfulness:"大体基于召回内容，但召回本身不对。",answer_relevance:"答非所问，列的是测试对象系统。",completeness:"缺少真正受影响的系统清单。",correctness:"与 gold 的系统列表不符。"},
   retrieval:{context_relevance:0.2,toehold_recall:0,sources:[
     {source_file:"性能测试计划书.xlsx",score:1.3,term_coverage:0.1,content:"パフォーマンステスト対象：VPMS、Common、Life/J…"},
     {source_file:"系统一览.pptx",score:1.0,term_coverage:0.1,content:"システム一覧（一般）…"}]}},
  {id:"Q12", question:"Phase2のリリース日とMagnum査定の目的は？", expected_file:"NewMedicalRevision2023_Ph2", expected_answer:"2023年8月20日。目的は新発売特約商品の査定判定を可能にすること。",
   actual_output:"リリース日は確認できません。Magnum査定の目的は…判定することです。",
   judge_summary:"检索失败＋层级不符：召回的是 PPL/IWF 实现细节，不是业务设计层的『目的/日期』。",
   scores:{faithfulness:4,answer_relevance:3,completeness:2,correctness:2},
   rationales:{faithfulness:"Magnum 细节忠于素材，但层级不对。",answer_relevance:"答到了 Magnum，但把『功能』当『目的』。",completeness:"缺リリース日，目的层级不符。",correctness:"日期缺失、目的口径错。"},
   retrieval:{context_relevance:0.45,toehold_recall:0,sources:[
     {source_file:"画面要件定义书(IWF).xlsx",score:2.6,term_coverage:0.5,content:"Magnum査定結果の判定定型：ノックアウト/謝絶/優良体…（实现细节）"},
     {source_file:"画面要件定义书(PPL).xlsx",score:2.2,term_coverage:0.4,content:"募集人操作の画面要件…"},
     {source_file:"画面要件定义书(SalesTool).xlsx",score:1.8,term_coverage:0.3,content:"SalesTool 画面の要件…"}]}},
  {id:"Q3", question:"QlikSense とは何ですか？", expected_file:"#18_QlikSense.pptx", expected_answer:"大量データ収集・分析の BI ツール。",
   actual_output:"QlikSense は大量データの収集と分析に用いる BI ツールです。",
   judge_summary:"检索精准、答案到位，典型 good case。",
   scores:{faithfulness:5,answer_relevance:5,completeness:4,correctness:5},
   rationales:{faithfulness:"完全基于素材。",answer_relevance:"直接回答定义。",completeness:"覆盖主要用途，略缺细项。",correctness:"与 gold 一致。"},
   retrieval:{context_relevance:0.8,toehold_recall:1,sources:[{source_file:"#18_QlikSense.pptx",score:4.7,term_coverage:0.6,content:"QlikSense は大量のデータ収集・分析のための BI ツール。QVD/QVF/Hub/Stream…"}]}},
  {id:"Q5", question:"契約移管の前提ステップは？", expected_file:"业务设计要约", expected_answer:"新契約成立後に移管処理を行う。",
   actual_output:"（関連文書なし）",
   judge_summary:"检索为空，模型直接拒答 → 先确认该文档是否已入库。",
   scores:{faithfulness:5,answer_relevance:1,completeness:1,correctness:1},
   rationales:{faithfulness:"无素材可依，未编造。",answer_relevance:"未提供任何有效回答。",completeness:"完全缺失。",correctness:"未答出前提步骤。"},
   retrieval:{context_relevance:0,toehold_recall:0,sources:[]}},
  {id:"Q9", question:"募集人登録の管理システムは？", expected_file:"募集人登録", expected_answer:"募集人登録システムが代理店を管理。",
   actual_output:"募集人登録システムが担当します。",
   judge_summary:"good case，检索命中、答案正确。",
   scores:{faithfulness:5,answer_relevance:4,completeness:4,correctness:4},
   rationales:{faithfulness:"基于素材。",answer_relevance:"直接作答。",completeness:"主体正确，略简。",correctness:"与 gold 一致。"},
   retrieval:{context_relevance:0.75,toehold_recall:1,sources:[{source_file:"募集人登録システム概要.pptx",score:3.1,term_coverage:0.5,content:"募集人登録システムは代理店・募集人の登録と管理を担う…"}]}},
];

function hitExpected(r){const ef=r.expected_file||"";return (r.retrieval?.sources||[]).some(s=>s.source_file&&ef&&(s.source_file.includes(ef)||ef.includes(s.source_file)));}
function classify(r){
  const s=r.scores||{}, ret=r.retrieval||{}, srcs=ret.sources||[];
  if(!srcs.length) return "empty_retrieval";
  const toe = ret.toehold_recall!=null?ret.toehold_recall:(hitExpected(r)?1:0);
  if(!toe) return "retrieval_miss";
  if(s.faithfulness>=4 && s.correctness<=2){
    const ef=r.expected_file||"";
    const other=srcs.filter(x=>!(ef&&x.source_file&&(x.source_file.includes(ef)||ef.includes(x.source_file)))).length/srcs.length;
    return other>0.6 ? "noise_wrong_level" : "context_fragment";
  }
  if((ret.context_relevance||0)>=0.6 && s.correctness<=2) return "generation_issue";
  return "other";
}
const isBad=r=>(r.scores?.correctness||0)<3;
function scColor(v){return v>=4?"var(--good)":v>=3?"var(--warn)":"var(--bad)";}
function scClass(v){return v>=4?"hi":v>=3?"mid":"lo";}

let activeCat="all";
function compute(){
  DATA.forEach(r=>r._cat=classify(r));
  const bad=DATA.filter(isBad); const total=DATA.length, passed=total-bad.length;
  const means={}; DIMS.forEach(([k])=>means[k]=DATA.reduce((a,r)=>a+(r.scores?.[k]||0),0)/(total||1));
  const retNotGen=bad.filter(r=>(r.scores?.faithfulness||0)>=4).length;
  const counts={}; CAT_ORDER.forEach(c=>counts[c]=0); bad.forEach(r=>counts[r._cat]=(counts[r._cat]||0)+1);
  return {total,passed,bad,means,retNotGen,counts};
}

function render(){
  const m=compute();
  document.getElementById("cards").innerHTML=`
    <div class="card"><div class="v">${Math.round(m.passed/m.total*100)}%</div><div class="l">通过率</div><div class="n">${m.passed}/${m.total} 题 correctness≥3</div></div>
    <div class="card"><div class="v" style="color:var(--bad)">${m.bad.length}</div><div class="l">Badcase 数</div><div class="n">correctness<3</div></div>
    <div class="card"><div class="v" style="color:var(--frag)">${m.retNotGen}</div><div class="l">检索问题（非生成）</div><div class="n">忠实度≥4 的差题</div></div>
    <div class="card"><div class="v">${DIMS.map(([k,l])=>[l,m.means[k]]).sort((a,b)=>a[1]-b[1])[0][0]}</div><div class="l">最弱维度</div><div class="n">平均分最低</div></div>`;

  const ins=[]; const topCat=CAT_ORDER.filter(c=>m.counts[c]>0).sort((a,b)=>m.counts[b]-m.counts[a])[0];
  if(m.bad.length){
    ins.push(`<b>${m.retNotGen}/${m.bad.length}</b> 的 badcase 忠实度≥4 → 多数是<b>检索/内容</b>问题，不是生成，优先修检索。`);
    if(topCat) ins.push(`最常见根因：<b>${CAT[topCat].label}</b>（${m.counts[topCat]} 题）→ ${CAT[topCat].fix}`);
    const weak=DIMS.map(([k,l])=>[l,m.means[k]]).sort((a,b)=>a[1]-b[1])[0];
    ins.push(`最弱维度：<b>${weak[0]}</b>（均分 ${weak[1].toFixed(1)}）。`);
    if(m.counts.empty_retrieval) ins.push(`<b>${m.counts.empty_retrieval}</b> 题完全没召回内容，先确认对应文档是否已入库。`);
  } else ins.push("没有 badcase 🎉");
  document.getElementById("insights").innerHTML=ins.map(t=>`<li><span class="ic"></span><span>${t}</span></li>`).join("");

  const maxc=Math.max(1,...Object.values(m.counts));
  document.getElementById("catbar").innerHTML=CAT_ORDER.filter(c=>m.counts[c]>0).map(c=>`
    <div class="catrow" data-cat="${c}"><span class="catname"><span class="dot" style="background:${CAT[c].color}"></span>${CAT[c].label}</span>
      <div class="track"><div class="fill" style="width:${m.counts[c]/maxc*100}%;background:${CAT[c].color}"></div></div>
      <span class="catcnt">${m.counts[c]}</span></div>`).join("")||'<span style="color:var(--ink-soft);font-size:12px">无 badcase 🎉</span>';
  document.querySelectorAll(".catrow").forEach(el=>el.onclick=()=>{activeCat=el.dataset.cat;renderList();syncChips();});

  document.getElementById("dims").innerHTML=DIMS.map(([k,l])=>`
    <div class="dim"><span class="dl">${l}</span><div class="dtrack"><div class="dfill" style="width:${m.means[k]/5*100}%"></div></div><span class="dv">${m.means[k].toFixed(1)}</span></div>`).join("");

  const cats=["all",...CAT_ORDER.filter(c=>m.counts[c]>0)];
  document.getElementById("filters").innerHTML=cats.map(c=>`<span class="chip${activeCat===c?' on':''}" data-cat="${c}">${c==="all"?"全部 badcase":`<span class="dot" style="background:${CAT[c].color}"></span>${CAT[c].label}`} <b>${c==="all"?m.bad.length:m.counts[c]}</b></span>`).join("");
  document.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{activeCat=el.dataset.cat;renderList();syncChips();});
  renderList();
}
function syncChips(){document.querySelectorAll(".chip").forEach(el=>el.classList.toggle("on",el.dataset.cat===activeCat));}
function renderList(){
  const bad=DATA.filter(isBad).filter(r=>activeCat==="all"||r._cat===activeCat);
  document.getElementById("rows").innerHTML=bad.map(r=>`
    <tr data-id="${r.id}"><td><b>${r.id}</b></td>
      <td style="max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.question)}</td>
      <td><span class="sc ${scClass(r.scores.correctness)}">${r.scores.correctness}</span></td>
      <td><span class="badge" style="background:${CAT[r._cat].color}">${CAT[r._cat].label}</span></td></tr>`).join("")
    ||`<tr><td colspan="4" style="color:var(--ink-soft);padding:20px 16px">该类别下没有 badcase</td></tr>`;
  document.querySelectorAll("#rows tr[data-id]").forEach(el=>el.onclick=()=>openDrawer(el.dataset.id));
}
function openDrawer(id){
  const r=DATA.find(x=>x.id===id); if(!r)return;
  const srcs=(r.retrieval?.sources||[]); const ef=r.expected_file||"";
  const toe=r.retrieval?.toehold_recall!=null?r.retrieval.toehold_recall:(hitExpected(r)?1:0);
  const rat=r.rationales||{};
  document.getElementById("drawer").innerHTML=`
    <button class="close" id="x">×</button>
    <div class="dh"><span class="badge" style="background:${CAT[r._cat].color}">${CAT[r._cat].label}</span><div class="q">${r.id} · ${esc(r.question)}</div></div>
    ${r.judge_summary?`<div class="dsec"><h3>判官总评</h3><div class="summary">${esc(r.judge_summary)}</div></div>`:""}
    <div class="dsec"><h3>四维评分与判分理由</h3><div class="dimdetail">
      ${DIMS.map(([k,l])=>`<div class="dd"><div class="ddh"><span>${l}</span><span class="ddv" style="color:${scColor(r.scores[k])}">${r.scores[k]}<span style="font-size:11px;color:var(--ink-soft)">/5</span></span></div>
        <div class="ddtrack"><div class="ddbar" style="width:${r.scores[k]/5*100}%;background:${scColor(r.scores[k])}"></div></div>
        ${rat[k]?`<div class="reason">${esc(rat[k])}</div>`:""}</div>`).join("")}
    </div></div>
    <div class="dsec"><h3>根因判定依据</h3>
      <div class="signals"><span class="sig">toehold recall <b>${toe}</b></span><span class="sig">context_rel <b>${r.retrieval?.context_relevance??0}</b></span><span class="sig">召回 <b>${srcs.length}</b> 段</span><span class="sig">正确文档 <b>${hitExpected(r)?"命中":"未命中"}</b></span></div>
      <p class="ev">${evidence(r)}</p></div>
    <div class="dsec"><h3>修复建议</h3><div class="fix">${CAT[r._cat].fix}</div></div>
    <div class="dsec"><h3>检索到的内容（${srcs.length} 段）</h3>
      ${srcs.length?srcs.map(s=>{const hit=ef&&s.source_file&&(s.source_file.includes(ef)||ef.includes(s.source_file));return `<div class="srcitem ${hit?'hit':''}"><div class="srchead"><span class="fn">${hit?'✓ ':''}${esc(s.source_file)}</span><span class="sm">score ${s.score} · cov ${s.term_coverage}</span></div>${s.content?`<div class="srccontent">${esc(s.content)}</div>`:""}</div>`;}).join(""):'<div class="ev" style="color:var(--bad)">没有召回任何来源</div>'}</div>
    <div class="dsec"><h3>期望答案</h3><div class="ans exp">${esc(r.expected_answer)}</div></div>
    <div class="dsec"><h3>实际答案</h3><div class="ans act">${esc(r.actual_output)}</div></div>`;
  document.getElementById("x").onclick=closeDrawer;
  document.getElementById("drawer").classList.add("show"); document.getElementById("overlay").classList.add("show");
}
function evidence(r){
  const s=r.scores,ret=r.retrieval||{},srcs=ret.sources||[];
  if(!srcs.length) return "检索没有返回任何 chunk —— 典型空检索。模型只能拒答（忠实度高、其余低）。";
  const toe=ret.toehold_recall!=null?ret.toehold_recall:(hitExpected(r)?1:0);
  if(!toe) return `正确文档「${r.expected_file}」没有出现在 top-${srcs.length} 里（toehold recall=0），召回的全是无关文档 → 漏召回。`;
  if(r._cat==="context_fragment") return `正确文档「${r.expected_file}」命中了，忠实度 ${s.faithfulness}（答案忠于素材）但正确性 ${s.correctness} —— 命中的 chunk 里没有真正答案，关键内容被 chunk 边界切在外面。`;
  if(r._cat==="noise_wrong_level") return `正确文档命中，但召回里超过 6 成是其它来源，无关内容把正确信息淹没 → 噪声/层级不符。`;
  if(r._cat==="generation_issue") return `检索信号不差（context_rel ${ret.context_relevance}），但正确性仍低 —— 偏向生成/判官环节的问题。`;
  return "信号不典型，建议人工复核。";
}
function closeDrawer(){document.getElementById("drawer").classList.remove("show");document.getElementById("overlay").classList.remove("show");}
document.getElementById("overlay").onclick=closeDrawer;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

document.getElementById("loadBtn").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{try{const j=JSON.parse(rd.result);
    const arr=Array.isArray(j)?j:(j.results||j.cases||j.items||j.badcases||[]);
    if(arr.length){DATA=arr.map((r,i)=>({id:r.id||r.question_id||("Q"+(i+1)),question:r.question||r.query||"",
      expected_file:r.expected_file||r.expected_source||"",expected_answer:r.expected_answer||r.expected||"",
      actual_output:r.actual_output||r.answer||"",judge_summary:r.judge_summary||r.summary||"",
      scores:r.scores||{faithfulness:r.faithfulness,answer_relevance:r.answer_relevance,completeness:r.completeness,correctness:r.correctness},
      rationales:r.rationales||r.reasons||{},
      retrieval:r.retrieval||{toehold_recall:r.toehold_recall,context_relevance:r.context_relevance,sources:r.sources||r.retrieval_context||[]}}));
      activeCat="all";render();}else alert("没找到结果数组（支持顶层数组或 results/cases/items/badcases 字段）。");
  }catch(err){alert("解析失败："+err.message);}};
  rd.readAsText(f);
};
render();
</script>
</body>
</html>
