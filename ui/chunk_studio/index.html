<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档切片</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 32 32" width="18" height="18" fill="none">
      <circle cx="16" cy="15" r="4" fill="#fff"/><circle cx="7" cy="8" r="2.4" fill="#fff" opacity=".9"/>
      <circle cx="25" cy="9" r="2.4" fill="#fff" opacity=".9"/><circle cx="8" cy="24" r="2.4" fill="#fff" opacity=".9"/>
      <circle cx="24" cy="24" r="2.4" fill="#fff" opacity=".9"/>
      <path d="M16 15 L7 8 M16 15 L25 9 M16 15 L8 24 M16 15 L24 24" stroke="#fff" stroke-width="1.5" opacity=".7"/>
    </svg></div>
    <div class="brand-name">知识库智能体<small>文档切片</small></div>
  </div>
  <span class="sub">分块预览 · chunk 可视化</span>
  <div class="spacer"></div>
</div>

<div class="content">

  <div class="tools">
    <span class="lab">知识库</span>
    <select id="slKb"></select>
    <span class="lab">文档</span>
    <select id="slDoc"></select>
    <div class="spacer"></div>
    <button class="btn sm" id="resliceBtn">⟳ 重新切片</button>
  </div>

  <div class="mini-cards" id="slMini"></div>

  <div class="card">
    <div class="card-h"><h3><span class="hi">⧈</span>切片配置</h3><button class="btn sm" id="cfgBtn">调整</button></div>
    <div class="pad" id="slCfg"></div>
  </div>

  <div class="slice-legend">
    <span><i style="background:var(--amber-soft);border:1px solid #e3cf8f"></i>重叠区（与相邻块共享）</span>
    <span><i style="background:var(--navy-soft)"></i>正文内容</span>
    <span style="color:var(--ink-faint)">共 <b id="slCount">—</b> 个切片</span>
  </div>
  <div id="sliceList"></div>

</div>

<!-- 切片配置弹窗 -->
<div class="mask" id="cfgMask">
  <div class="modal">
    <div class="modal-h"><h3>⧈ 切片参数</h3><button class="x" data-close="cfgMask">×</button></div>
    <div class="modal-b">
      <div class="field"><div class="row2">
        <div><label>分块大小 (tokens)</label>
          <select id="cfgChunk"><option>128</option><option>256</option><option>512</option><option>768</option><option>1024</option></select></div>
        <div><label>切分策略</label>
          <select id="cfgStrategy"><option>递归字符 + 语义边界</option><option>固定长度</option><option>按段落</option><option>按标题层级</option></select></div>
      </div></div>
      <div class="field"><label>重叠 overlap (tokens)</label>
        <div class="rng"><input type="range" id="cfgOverlap" min="0" max="256" step="8" value="64"><span class="val" id="cfgOvVal">64</span></div>
        <div class="hintline">重叠需小于分块大小；越大相邻块共享内容越多，召回更稳但存储更多。</div>
      </div>
    </div>
    <div class="modal-f"><button class="btn" data-close="cfgMask">取消</button>
      <button class="btn primary" id="cfgSaveBtn">保存并重新切片</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
