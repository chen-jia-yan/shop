<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回归失败分诊 Skill 交互说明</title>
<style>
:root {
  --paper: #f6f9fc;
  --paper-2: #e9f1f9;
  --card: #ffffff;
  --ink: #1d3047;
  --ink-2: #405670;
  --muted: #6f8297;
  --line: #d6e2ee;
  --accent: #2b6cb0;
  --accent-soft: #e4effb;
  --ok: #2f6b3a;
  --todo: #b06a00;
  --todo-soft: #fff6e6;
  --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --serif: "Iowan Old Style", "Songti SC", "Noto Serif SC", Georgia, serif;
  --sans: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
body { min-height: 100vh; padding-bottom: 60px; }
button { font: inherit; cursor: pointer; }

/* ------------ 顶部 ------------ */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 26px 32px 18px; border-bottom: 1px solid var(--line); background: #fff; flex-wrap: wrap; }
.top .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.top h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; margin: 4px 0 4px; letter-spacing: .01em; }
.top p { margin: 0; color: var(--ink-2); font-size: 14px; max-width: 720px; line-height: 1.6; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.tools { display: flex; gap: 8px; }
.tools button { border: 1px solid var(--ink); background: transparent; padding: 7px 12px; font-size: 13px; }
.tools button:hover, .tools button.primary { background: var(--ink); color: #fff; }

/* ------------ 主体布局 ------------ */
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100vh - 120px); }
.rail { border-right: 1px solid var(--line); padding: 18px 0 40px; background: var(--paper-2); }
.rail h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted); margin: 0 22px 10px; font-weight: 400; }
.step { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 10px 18px 10px 18px; color: var(--ink); }
.step::before { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.step:first-of-type::before { top: 50%; }
.step:last-of-type::before { bottom: 50%; }
.step .no { position: relative; z-index: 1; width: 32px; height: 32px; border: 1.5px solid var(--ink); background: var(--card); display: grid; place-items: center; font-family: var(--mono); font-size: 13px; }
.step .t { font-size: 14px; line-height: 1.3; }
.step .who { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.chip { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; border: 1px solid currentColor; }
.chip.脚本 { color: #2d5f73; } .chip.AI { color: #7b3fa0; } .chip.你 { color: var(--accent); } .chip.IT { color: var(--muted); }
.flag { font-family: var(--mono); font-size: 10.5px; padding: 1px 6px; }
.flag.todo { background: var(--todo-soft); color: var(--todo); }
.flag.mixed { background: #eaf4ee; color: #5d6b2c; }
.step:hover { background: #e1ecf8; }
.step.active { background: var(--card); }
.step.active .no { background: var(--accent); border-color: var(--accent); color: #fff; }
.step.visited .no { border-color: var(--ok); }

.main { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 0; min-width: 0; }
.explain { padding: 24px 26px 40px; border-right: 1px solid var(--line); min-width: 0; }
.explain .stage { font-family: var(--mono); font-size: 12px; color: var(--accent); letter-spacing: .1em; }
.explain h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 4px 0 10px; }
.explain .what { font-size: 15px; line-height: 1.7; color: var(--ink); margin: 0 0 16px; }
.explain h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--muted); font-weight: 400; margin: 18px 0 6px; text-transform: uppercase; }
.explain ul { margin: 0; padding-left: 18px; }
.explain li { font-size: 13.5px; line-height: 1.65; margin: 3px 0; color: var(--ink-2); }
.files code, .cmd code { font-family: var(--mono); font-size: 12px; }
.files { display: flex; flex-direction: column; gap: 4px; }
.files code { background: var(--paper-2); padding: 3px 7px; align-self: flex-start; }
.cmd { background: var(--ink); color: #e9e4d8; padding: 10px 12px; font-family: var(--mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
.say { border-left: 3px solid #7b3fa0; background: #f3effa; padding: 8px 12px; font-size: 13.5px; line-height: 1.6; }
.todo-box { margin-top: 18px; background: var(--todo-soft); border: 1px dashed var(--todo); padding: 10px 12px; }
.todo-box h4 { margin-top: 0; color: var(--todo); }
.todo-box li { color: #6b4a12; }
.nav-steps { display: flex; gap: 8px; margin-top: 24px; }
.nav-steps button { border: 1px solid var(--ink); background: transparent; padding: 7px 14px; font-size: 13px; }
.nav-steps button.next { background: var(--ink); color: #fff; }
.nav-steps button:disabled { opacity: .35; cursor: default; }

/* ------------ 原型画框 ------------ */
.proto { padding: 22px 24px 40px; min-width: 0; }
.proto-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
.proto-label span { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.frame { background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(43,108,176,.10); min-width: 0; }
.frame-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #f3f7fc; }
.frame-bar .lights { display: flex; gap: 5px; }
.frame-bar .lights i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.frame-bar .addr { font-family: var(--mono); font-size: 11.5px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen { padding: 18px 20px 22px; min-height: 460px; }
.screen h5 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0 0 4px; }
.screen .hint { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.6; }
.hl { outline: 2px dashed var(--accent); outline-offset: 3px; }

/* 通用组件 */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { border: 1px solid var(--line); padding: 10px 12px; }
.kpi b { display: block; font-family: var(--serif); font-weight: 500; font-size: 28px; }
.kpi span { font-size: 12px; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 400; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; border-bottom: 1.5px solid var(--ink); padding: 6px 8px; }
table.t td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; line-height: 1.5; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: #f2f7fd; }
.tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; color: #fff; white-space: nowrap; }
.st { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid; white-space: nowrap; }
.st.confirmed { color: var(--ok); } .st.suspected { color: var(--todo); }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: 8px 14px; font-size: 13px; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.warn { background: var(--accent); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.toggle { display: inline-flex; border: 1px solid var(--ink); }
.toggle button { border: none; background: transparent; padding: 3px 9px; font-size: 12px; }
.toggle button.on { background: var(--ink); color: #fff; }
.toggle button.on.no { background: #8b8b8b; }

/* 看板 */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.col { border-top: 3px solid; background: #f7fafd; padding: 8px; min-height: 120px; min-width: 0; }
.col h6 { margin: 0 0 8px; font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; }
.card { background: var(--card); border: 1px solid var(--line); padding: 8px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px; line-height: 1.45; }
.card:hover { border-color: var(--ink); }
.card .id { font-family: var(--mono); font-weight: 600; }

/* 截图模拟 */
.shot { position: relative; border: 1px solid var(--line); background: #eef1f4; height: 170px; overflow: hidden; font-size: 11px; }
.shot .hdr { height: 22px; background: #1f3b57; color: #cfe0f0; padding: 4px 8px; font-family: var(--mono); font-size: 10px; }
.shot .body { padding: 10px; }
.shot .fld { height: 10px; background: #d5dbe2; margin: 6px 0; width: 70%; }
.shot .fld.s { width: 40%; }
.shot .btnx { display: inline-block; background: #2b6cb0; color: #fff; padding: 3px 10px; margin-top: 6px; }
.shot .veil { position: absolute; inset: 22px 0 0 0; background: rgba(20, 30, 40, .35); }
.shot .modal { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); background: #fff; border: 1px solid #999; padding: 10px 14px; min-width: 60%; text-align: center; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.shot .modal .ok { display: inline-block; margin-top: 6px; background: #2b6cb0; color: #fff; padding: 2px 12px; }
.shot .alert { position: absolute; left: 50%; top: 0; transform: translateX(-50%); background: #fff; border: 1px solid #888; padding: 8px 12px; width: 70%; font-size: 11px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.shot .err { color: #b23a2a; border: 1px solid #e3b2aa; background: #fbecea; padding: 4px 8px; margin: 6px 0; }
.shot .big { position: absolute; inset: 22px 0 0 0; display: grid; place-items: center; font-size: 20px; color: #666; background: #fff; }
.shot .spin { width: 26px; height: 26px; border: 3px solid #c9d2db; border-top-color: #2b6cb0; border-radius: 50%; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.shot-cap { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* 抽屉、表单、弹窗 */
.evi { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.evi .box { border: 1px solid var(--line); padding: 8px 10px; }
.evi .box h6 { margin: 0 0 6px; font-size: 12px; font-weight: 500; }
.evi .box.cause { border-color: var(--ok); }
.evi .box.cause h6 { color: var(--ok); }
.evi .eitem { font-size: 12.5px; line-height: 1.5; margin: 4px 0; }
.evi .eitem b { font-family: var(--mono); font-weight: 600; margin-right: 4px; }
.field { margin: 10px 0; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); background: #fff; }
.field textarea { min-height: 110px; font-family: var(--mono); font-size: 12px; line-height: 1.55; }
.field input.edit, .field textarea.edit, .field select.edit { background: #fffbea; }
.errs { background: #fbecea; border-left: 3px solid #b23a2a; padding: 8px 12px; font-size: 12.5px; line-height: 1.6; }
.pass { background: #e9f3ea; border-left: 3px solid var(--ok); padding: 8px 12px; font-size: 12.5px; }
.progress { height: 6px; background: var(--paper-2); margin: 10px 0; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

.overlay { position: fixed; inset: 0; background: rgba(24, 36, 43, .45); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
.overlay.open { display: flex; }
.dialog { background: var(--card); border: 1.5px solid var(--ink); width: min(620px, 100%); max-height: 86vh; overflow: auto; box-shadow: 8px 8px 0 rgba(0,0,0,.15); animation: pop .18s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.dialog header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.dialog header h3 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 19px; }
.dialog header button { border: none; background: none; font-size: 20px; line-height: 1; }
.dialog .dbody { padding: 14px 16px; font-size: 13.5px; line-height: 1.6; }
.dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: #f3f7fc; }
.dialog .design-note { margin-top: 12px; font-size: 12px; color: var(--todo); background: var(--todo-soft); padding: 6px 10px; }

/* 弹窗图鉴 */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.gcard { border: 1px solid var(--line); padding: 12px; background: #f7fafd; }
.gcard h6 { margin: 0 0 4px; font-size: 14px; font-weight: 500; }
.gcard p { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }

#toast { position: fixed; right: 24px; bottom: 70px; background: var(--ink); color: #fff; padding: 10px 16px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
#toast.show { opacity: 1; }

@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .explain { border-right: none; border-bottom: 1px solid var(--line); }
}
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: none; border-bottom: 1px solid var(--line); max-height: 300px; overflow-y: auto; }
  .board, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .evi { grid-template-columns: minmax(0, 1fr); }
}
@media print {
  .tools, .nav-steps, .overlay { display: none !important; }
  .layout, .main { display: block; }
  .rail { display: none; }
  .frame { box-shadow: none; }
}

/* 起草 Jira：左列表 + 右侧 Jira 表单预览 */
.explainer-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
.explainer-strip div { background: var(--paper-2); padding: 8px 10px; font-size: 12.5px; line-height: 1.5; }
.explainer-strip b { display: block; font-size: 13px; color: var(--accent); margin-bottom: 2px; }
.dgrid { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 14px; }
.dlist button { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; padding: 9px 10px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.5; }
.dlist button.on { border-color: var(--accent); background: var(--accent-soft); }
.dlist .ok { color: var(--ok); } .dlist .bad { color: #b23a2a; }
.jira { border: 1px solid var(--line); background: #fff; }
.jira .jh { background: #f3f7fc; border-bottom: 1px solid var(--line); padding: 8px 12px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.jira .jf { display: grid; grid-template-columns: 120px minmax(0, 1fr); border-bottom: 1px solid #eef3f8; }
.jira .jf > span { padding: 8px 12px; font-size: 12px; color: var(--muted); background: #fafcfe; border-right: 1px solid #eef3f8; }
.jira .jf > div { padding: 8px 12px; font-size: 13px; min-width: 0; }
.jira .jf pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12px; line-height: 1.55; max-height: 260px; overflow: auto; }
.jira .src { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-left: 6px; }
.jira .src.ai { color: #7b3fa0; } .jira .src.sc { color: #2d5f73; }
@media (max-width: 820px) { .dgrid, .explainer-strip { grid-template-columns: minmax(0, 1fr); } }

</style>
</head>
<body>
  <header class="top">
    <div>
      <div class="kicker">regression-triage-jira · 交互说明</div>
      <h1>从失败用例到 Jira，一步一步看</h1>
      <p>左边是 11 个步骤，中间讲这一步做什么、怎么判断，右边是对应的界面，可以直接点。界面里装着 8 个虚构的示例用例，点击会实时重新计算分类和分组。</p>
    </div>
    <div>
      <div class="legend" style="margin-bottom:10px">
        <span><span class="chip 脚本">脚本</span>自动执行</span>
        <span><span class="chip AI">AI</span>AI 执行</span>
        <span><span class="chip 你">你</span>需要你操作</span>
        <span><span class="flag todo">待改进</span>尚未写进代码</span>
      </div>
      <div class="tools">
        <button class="primary" data-act="download">下载离线版 HTML</button>
        <button data-act="gallery">弹窗图鉴</button>
        <button data-act="reset">重置演示</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <div class="main">
      <section class="explain" id="explain"></section>
      <section class="proto">
        <div class="proto-label"><span id="protoLabel">界面原型</span><span>示例数据 · 虚构</span></div>
        <div class="frame">
          <div class="frame-bar"><span class="lights"><i></i><i></i><i></i></span><span class="addr" id="addr"></span></div>
          <div class="screen" id="screen"></div>
        </div>
      </section>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="dialog" role="dialog" aria-modal="true">
      <header><h3 id="dlgTitle"></h3><button id="dlgX" aria-label="关闭">×</button></header>
      <div class="dbody" id="dlgBody"></div>
      <footer id="dlgFoot"></footer>
    </div>
  </div>
  <div id="toast"></div>

  <script>
/* 示例数据与步骤说明。数据为虚构，与 evals/sample_run 一致。 */
window.SKILL = {};

SKILL.CATS = {
  PRODUCT_DEFECT:     { cn: "产品缺陷",   owner: "开发",       color: "#b23a2a" },
  TEST_DATA:          { cn: "测试数据问题", owner: "测试",       color: "#b07a12" },
  ENVIRONMENT:        { cn: "环境问题",   owner: "环境负责人", color: "#5b4fa3" },
  POPUP_INTERFERENCE: { cn: "弹窗干扰",   owner: "测试",       color: "#1f7a8c" },
  SCRIPT_ISSUE:       { cn: "脚本问题",   owner: "测试",       color: "#3d6b2f" },
  RERUN_PASS:         { cn: "重跑可过",   owner: "测试",       color: "#6d7a80" },
  NEEDS_HUMAN:        { cn: "需人工判断", owner: "测试",       color: "#8a5a44" },
};

SKILL.CASES = [
  { id: "S01", name: "BM new business with agent 40100", market: "HK", module: "BM", step: "Click Submit on agent selection page",
    exc: "TimeoutException", msg: "waiting for element #nextStep to be clickable",
    popup: { type: "html_modal", text: "Agent record not found  [OK]" }, biz: "Agent record not found",
    data: { agent_code: "40100", product_code: "UR67" }, shot: "modal-error",
    rerun: { suggest: false, why: "页面有业务报错。重跑解决不了，还会消耗测试数据" } },
  { id: "S02", name: "Policy alteration change address", market: "HK", module: "PS", step: "Search policy",
    exc: "NoSuchElementException", msg: "Unable to locate element: #policyRow",
    popup: null, biz: "Policy not found", data: { policy_no: "P26110001" }, shot: "inline-error",
    rerun: { suggest: false, why: "页面有业务报错“Policy not found”，需要先查数据" } },
  { id: "S03", name: "UW manual review", market: "MO", module: "UW", step: "Open UW workbench",
    exc: "TimeoutException", msg: "Page shows 503 Service Unavailable",
    popup: null, biz: null, data: {}, shot: "503",
    rerun: { suggest: true, why: "报错匹配环境故障特征（503）。建议确认环境恢复后重跑" }, rerunResult: "passed" },
  { id: "S04", name: "BM quotation premium check", market: "HK", module: "BM", step: "Click Calculate",
    exc: "ElementClickInterceptedException",
    msg: "Other element would receive the click: <div class=\"modal-backdrop fade show\">",
    popup: { type: "html_modal", text: "System Notice: SIT2 maintenance tonight 22:00" }, biz: null, data: {}, shot: "modal-notice",

/* 状态、分类推演、分组、草稿生成。全部是界面演示用的模拟逻辑，规则与 classify_rules.py 一致。 */
(function () {
  const S = window.SKILL;

  S.initialState = function () {
    const sel = {};

    return {
      step: 0, visited: { 0: true },
      setupDone: {}, jiraType: null,
      rerunSel: sel, planConfirmed: false, rerunDone: false, rerunLog: [],
      check40200: null, check40200Meta: null,
      review: {}, edits: {}, manualCat: {},
      brokenDraft: false, submitMode: "api", submitted: null,
    };
  };
  S.state = S.initialState();

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  S.esc = esc;

  /* ---------------- 证据 ---------------- */
  S.evidenceOf = function (c, st) {
    const ev = [];
    const add = (kind, text) => { const id = "E" + (ev.length + 1); ev.push({ id, kind, text }); return id; };
    add("报错信息", c.exc + ": " + c.msg);
    add("失败截图", c.id + "_fail.png");
    if (c.popup) add(c.popup.type === "js_alert" ? "原生对话框文字" : "页面弹框文字", c.popup.text);
    if (c.biz) add("页面业务报错", c.biz);
    if (st.rerunDone && st.rerunSel[c.id]) add("重跑记录", "第 1 次重跑：" + (c.rerunResult === "passed" ? "通过" : "失败"));
    Object.entries(c.data).forEach(([k, v]) => {
      const key = k + "=" + v;
      const done = S.CHECKS_DONE.find(x => x.key === key);
      if (done) add("数据核查", key + "：" + done.result + "（" + done.by + "，" + done.at + "，" + done.method + "）");
      else if (key === "agent_code=40200" && st.check40200) {
        const m = st.check40200Meta || {};
        add("数据核查", key + "：" + st.check40200 + "（" + (m.by || "同事B") + "，" + (m.method || "只读查询") + "）");
      }
    });
    return ev;
  };

  const pick = (ev, kinds) => ev.filter(e => kinds.includes(e.kind)).map(e => e.id);

  /* ---------------- 分类（与 taxonomy.md 顺序一致） ---------------- */
  S.classify = function (c, st) {
    const ev = S.evidenceOf(c, st);
    const rerunPassed = st.rerunDone && st.rerunSel[c.id] && c.rerunResult === "passed";
    const r = (cat, status, rule, reason, causeKinds, phenKinds, extra) =>
      Object.assign({ cat, status, rule, reason, ev, cause: pick(ev, causeKinds), phen: pick(ev, phenKinds) }, extra || {});

    if (/503|502|504|ERR_CONNECTION/i.test(c.msg))
      return r("ENVIRONMENT", "confirmed", "ENV2", "报错匹配环境故障特征“503 Service Unavailable”" + (rerunPassed ? "；重跑已通过，说明是临时故障" : ""),
        ["报错信息"], ["失败截图", "重跑记录"], { passedOnRerun: rerunPassed });
    if (rerunPassed)
      return r("RERUN_PASS", "confirmed", "R1", "自动重跑通过，原失败中没有业务报错", ["重跑记录"], ["报错信息", "失败截图"]);
    if (c.popup && c.popup.type === "js_alert")
      return r("POPUP_INTERFERENCE", "confirmed", "POP1", "原生对话框文字在干扰清单中：“" + c.popup.text + "”", ["原生对话框文字"], ["报错信息"]);
    if (c.biz) {
      const keys = Object.entries(c.data).map(([k, v]) => k + "=" + v);
      const res = keys.map(k => {
        const d = S.CHECKS_DONE.find(x => x.key === k);
        if (d) return d.result;
        if (k === "agent_code=40200") return st.check40200;
        return null;
      });
      const kinds = ["页面业务报错", "页面弹框文字", "数据核查"];
      if (res.some(x => ["missing", "used", "invalid_state"].includes(x)))
        return r("TEST_DATA", "confirmed", "BIZ1", "业务报错“" + c.biz + "”，数据核查发现数据不可用", kinds, ["报错信息", "失败截图"]);
      if (res.every(x => x === "ok"))
        return r("PRODUCT_DEFECT", "confirmed", "BIZ2", "业务报错“" + c.biz + "”，但相关数据核查均正常", kinds, ["报错信息", "失败截图"]);
      return r("NEEDS_HUMAN", "suspected", "BIZ3", "业务报错“" + c.biz + "”，待核查数据：" + keys.filter((k, i) => !res[i]).join("、"),
        ["页面业务报错", "页面弹框文字"], ["报错信息", "失败截图"], { pending: keys.filter((k, i) => !res[i]) });
    }
    if (c.popup)
      return r("POPUP_INTERFERENCE", "confirmed", "POP2", "失败时页面有干扰弹框“" + c.popup.text.slice(0, 40) + "”，且点击被遮挡", ["页面弹框文字", "失败截图"], ["报错信息"]);
    if (c.exc === "InvalidSelectorException")
      return r("SCRIPT_ISSUE", "confirmed", "SCR2", "定位表达式本身无效", ["报错信息"], []);
    return r("SCRIPT_ISSUE", "suspected", "SCR1", "等待超时，页面没有弹框和业务报错；需看截图确认页面是否正常", [], ["报错信息", "失败截图"],

              note: "看起来更像接口响应慢，而不是脚本定位错误。只有一项证据，置信度 medium，不会自动改分类" } });

  S.classifyAll = st => S.CASES.map(c => Object.assign({ c }, S.classify(c, st)));

  const ORDER = ["PRODUCT_DEFECT", "ENVIRONMENT", "TEST_DATA", "SCRIPT_ISSUE", "POPUP_INTERFERENCE", "RERUN_PASS", "NEEDS_HUMAN"];
  S.groups = function (st) {
    const rows = S.classifyAll(st);

      const sig = cat === "ENVIRONMENT" ? "env" : (x.c.biz || x.c.popup && x.c.popup.text || x.c.exc).toLowerCase() + "|" + x.c.step + "|" + x.c.market + "|" + x.c.module;
      const key = cat + "#" + sig;
      if (!map.has(key)) map.set(key, { cat, rows: [], hint: (x.c.biz || (x.c.popup && x.c.popup.text) || x.c.msg).replace(/\s+\[OK\]$/, "") });
      map.get(key).rows.push(x);
    });
    const list = Array.from(map.values()).sort((a, b) => ORDER.indexOf(a.cat) - ORDER.indexOf(b.cat) || b.rows.length - a.rows.length);
    list.forEach((g, i) => {
      g.id = "G" + String(i + 1).padStart(2, "0");
      g.needsJira = ["PRODUCT_DEFECT", "ENVIRONMENT", "TEST_DATA"].includes(g.cat);
      g.market = [...new Set(g.rows.map(r => r.c.market))].join("/");
      g.module = [...new Set(g.rows.map(r => r.c.module))].join("/");
      g.dup = (g.cat === "PRODUCT_DEFECT" && /agent record not found/i.test(g.hint))

      g.priority = g.cat === "TEST_DATA" ? "Low" : g.cat === "ENVIRONMENT" ? "High" : (g.module.includes("BM") ? "High" : "Medium");
    });
    return list;
  };

  const CAUSE = { ENVIRONMENT: () => "NBS test environment returned 503" };
  S.draft = function (g, st) {

    const summary = "[NBS Regression] " + g.market + " - " + g.module + " " + (n === 1 ? "case" : "cases") + " failed due to " + cause;
    const r0 = g.rows[0];
    const checks = g.rows.flatMap(r => r.ev.filter(e => e.kind === "数据核查").map(e => "* " + e.text));
    const desc = [
      "h3. 1. 现象",
      g.cat === "ENVIRONMENT" ? "打开页面时返回 {{503 Service Unavailable}}。" : "在 " + r0.c.step + " 时系统提示 {{" + g.hint + "}}。",
      "", "h3. 2. 受影响的用例（共 " + n + " 个）",
      "|| 用例编号 || 用例名称 || 失败步骤 || 截图 ||",
      ...g.rows.map(r => "| " + r.c.id + " | " + r.c.name + " | " + r.c.step + " | !" + r.c.id + "_fail.png|thumbnail! |"),
      "", "h3. 3. 重现步骤", g.cat === "ENVIRONMENT" ? "待补充：环境问题无固定重现步骤" : "# 以测试账号登录 NBS SIT2\n# 按用例步骤操作至 " + r0.c.step,
      "", "h3. 4. 预期结果", g.cat === "ENVIRONMENT" ? "页面正常打开" : "流程继续进入下一步",
      "", "h3. 5. 实际结果", "{{" + (g.cat === "ENVIRONMENT" ? "503 Service Unavailable" : g.hint) + "}}",
      "", "h3. 6. 已做的排查",
      ...(checks.length ? checks : []),
      ...(g.rows.some(r => r.ev.some(e => e.kind === "重跑记录")) ? ["* " + g.rows.map(r => (r.ev.find(e => e.kind === "重跑记录") || {}).text).filter(Boolean).join("；")] : ["* 未重跑（业务报错类不建议重跑）"]),
      "", "h3. 7. 测试数据",
      ...Object.entries(r0.c.data).map(([k, v]) => "* " + k + ": " + v),
      ...(Object.keys(r0.c.data).length ? [] : ["不适用"]),
      "", "h3. 8. 推测与待确认",
      g.cat === "PRODUCT_DEFECT" ? "* 推测：代理人查询接口读取的数据源可能与 AGENT 表不一致，请开发确认" :
        g.cat === "ENVIRONMENT" ? "* 待确认：该时段 SIT2 是否有部署或重启" : "* 待确认：是否需要准备新的测试保单",
    ].join("\n");
    const e = st.edits[g.id] || {};
    return { summary: e.summary || summary, desc: e.desc || desc, priority: e.priority || g.priority, assignee: e.assignee || "", cause };
  };

  S.validate = function (g, d) {
    const errs = [];
    if (!/^\[NBS Regression\] [A-Z/]+ - .+ cases? failed due to .+$/.test(d.summary)) errs.push("Summary 格式不符合模板");
    const pool = (g.hint + " " + g.rows.map(r => r.ev.map(e => e.text).join(" ") + " " + r.c.name + " " + r.c.step).join(" ")).toLowerCase();
    const generic = ["test", "environment", "returned", "nbs", "error", "page"];
    const words = d.cause.toLowerCase().split(/\s+/).filter(w => w && !generic.includes(w));
    const miss = words.filter(w => !pool.includes(w));
    if (words.length && miss.length / words.length > 0.4)
      errs.push("根因短语“" + d.cause + "”中的 " + miss.map(w => "“" + w + "”").join("、") + " 在证据里找不到，请使用证据原文（参考：“" + g.hint + "”）");
    const n = g.rows.length, noun = / (cases?) failed/.exec(d.summary);
    if (noun && noun[1] !== (n === 1 ? "case" : "cases")) errs.push("组内有 " + n + " 个用例，应写 " + (n === 1 ? "case" : "cases"));
    ["h3. 1. 现象", "h3. 6. 已做的排查", "h3. 8. 推测与待确认"].forEach(s => { if (!d.desc.includes(s)) errs.push("Description 缺少小节：" + s); });
    if (/\b[A-Z]{1,2}\d{6}\(?[0-9A]\)?(?!\d)/.test(d.desc + " " + d.summary)) errs.push("疑似包含香港身份证号");
    return errs;
  };
})();

  </script>
  <script>
/* 每一步对应的界面原型 */
(function () {

  S.shot = function (c) {

      case "modal-notice": return '<div class="shot">' + page + form + '<div class="veil"></div><div class="modal"><b>System Notice</b><br>SIT2 maintenance tonight 22:00<br><span class="ok">Close</span></div></div>';
      case "inline-error": return '<div class="shot">' + page + '<div class="body"><div class="fld s"></div><div class="err">Policy not found</div><div class="fld"></div></div></div>';
      case "503": return '<div class="shot">' + page + '<div class="big">503 Service Unavailable</div></div>';
      case "loading": return '<div class="shot">' + page + '<div class="body"><div class="fld"></div><div class="fld s"></div></div><div class="big" style="background:transparent"><div class="spin"></div></div></div>';
      case "js-alert": return '<div class="shot">' + page + form + '<div class="alert"><b>nbs-sit2 显示</b><br>Your session has expired<br><span class="mono">[确定]</span></div></div>';
      default: return '<div class="shot">' + page + form + "</div>";

  };

  const T = {};
  S.screens = T;

  T.setup = function (s) {
    const items = [
      ["plugin", "把 popup_evidence.py 放进测试仓库，conftest.py 加一行", "失败时才能抓到弹窗文字和整屏截图"],
      ["labels", "给用例打上 case_id / market / module / system 标签", "Jira 标题里的 HK、BM 就来自这里"],
      ["config", "复制并填写 config.yaml", "项目编号 ROTQA、重跑方式、优先级规则"],
      ["rules", "把团队见过的弹窗文字、业务报错补进 rules.yaml", "清单越全，“需人工判断”越少"],
      ["token", "申请 Jira 访问凭证（或确认可用 CSV 导入）", "决定第 10 步走哪种提交方式"],
    ];
    return "<h5>准备清单</h5><p class=\"hint\">只需要做一次。勾选只是演示，不会改动任何东西。</p>" +
      '<table class="t"><tr><th></th><th>事项</th><th>为什么</th></tr>' +
      items.map(([k, t, w]) => '<tr><td><input type="checkbox" data-act="setup" data-k="' + k + '"' + (s.setupDone[k] ? " checked" : "") + "></td><td>" + t + '</td><td class="muted">' + w + "</td></tr>").join("") +
      "</table><div class=\"row\" style=\"margin-top:16px\"><button class=\"btn\" data-act=\"dlg\" data-d=\"jiraType\">确认 Jira 版本</button>" +
      '<span class="muted">' + (s.jiraType ? "已选择：" + s.jiraType : "尚未确认") + "</span></div>";
  };

  T.overview = function () {
    return "<h5>本次回归：2026-11-03_142142</h5><p class=\"hint\">读取完成后先看这一屏，判断数据是否齐全。点任意一行可查看原始证据。</p>" +
      '<div class="kpis"><div class="kpi"><b>8</b><span>失败用例</span></div><div class="kpi"><b>0</b><span>缺少截图</span></div>' +
      '<div class="kpi"><b>0</b><span>缺少弹窗证据</span></div><div class="kpi"><b>0</b><span>缺少市场/模块标签</span></div></div>' +
      '<table class="t"><tr><th>用例</th><th>市场/模块</th><th>失败步骤</th><th>异常类型</th></tr>' +
      S.CASES.map(c => '<tr class="click" data-act="dlg" data-d="case" data-id="' + c.id + '"><td class="mono">' + c.id + "</td><td>" + c.market + " / " + c.module + "</td><td>" + esc(c.step) + '</td><td class="mono">' + c.exc + "</td></tr>").join("") +
      "</table>";

  T.rerunPlan = function (s) {

      S.CASES.map(c => "<tr><td class=\"mono\">" + c.id + '</td><td class="mono" style="font-size:11.5px">' + esc(c.exc) + "</td><td>" +

      '<button class="btn" data-act="dlg" data-d="rerunConfirm"' + (s.planConfirmed ? " disabled" : "") + ">" + (s.planConfirmed ? "已确认" : "确认重跑计划") + "</button></div>";
  };

  T.rerunProgress = function (s) {
    if (!s.planConfirmed) return '<h5>重跑</h5><p class="hint">还没有确认重跑计划。</p><button class="btn" data-act="go" data-i="2">回到第 2 步确认</button>';
    const sel = S.CASES.filter(c => s.rerunSel[c.id]);
    const done = s.rerunLog.length;

      '<table class="t"><tr><th>用例</th><th>状态</th><th>耗时</th></tr>' +
      sel.map(c => { const l = s.rerunLog.find(x => x.id === c.id);

          '</td><td class="mono">' + (l ? l.t + "s" : "") + "</td></tr>"; }).join("") +
      '</table><div class="row" style="margin-top:14px"><button class="btn" data-act="runRerun"' + (s.rerunDone || s.running ? " disabled" : "") + ">" +
      (s.rerunDone ? "重跑完成" : s.running ? "重跑中…" : "开始重跑") + "</button>" +
      '<span class="muted">真实环境里由脚本或平台执行；这里只是模拟</span></div>';
  };

  T.board = function (s) {
    const rows = S.classifyAll(s);
    const cats = Object.keys(S.CATS);
    return "<h5>初步分类看板</h5><p class=\"hint\">点卡片查看判定依据：绿色框是<b>原因证据</b>，灰色框是<b>现象证据</b>。" +
      (s.rerunDone ? "" : " 重跑还没做，所以 S05 现在显示为“脚本问题（疑似）”。") + "</p>" +
      '<div class="board">' + cats.map(k => {
        const items = rows.filter(r => r.cat === k);
        return '<div class="col" style="border-color:' + S.CATS[k].color + '"><h6>' + S.CATS[k].cn + "<span>" + items.length + "</span></h6>" +
          items.map(r => '<div class="card" data-act="dlg" data-d="case" data-id="' + r.c.id + '"><span class="id">' + r.c.id + "</span> " + st(r.status) +
            '<br><span class="muted">' + r.rule + " · " + esc(r.reason.slice(0, 34)) + "…</span></div>").join("") + "</div>";
      }).join("") + "</div>";
  };

  T.dataCheck = function (s) {
    const pend = S.classifyAll(s).filter(r => r.pending).flatMap(r => r.pending.map(k => ({ k, id: r.c.id })));
    const extra = s.check40200 ? [{ key: "agent_code=40200", result: s.check40200, by: (s.check40200Meta || {}).by || "同事B", at: "刚刚", method: (s.check40200Meta || {}).method || "只读查询", note: (s.check40200Meta || {}).note || "" }] : [];
    return "<h5>数据核查</h5><p class=\"hint\">页面出现业务报错时，要由人去数据库查，才能区分是测试数据问题还是产品缺陷。</p>" +
      "<h6 style=\"margin:8px 0\">待核查（" + pend.length + "）</h6>" +
      (pend.length ? '<table class="t"><tr><th>数据</th><th>涉及用例</th><th></th></tr>' + pend.map(p =>
        '<tr><td class="mono">' + p.k + '</td><td class="mono">' + p.id + '</td><td><button class="btn" data-act="dlg" data-d="check">填写核查结果</button></td></tr>').join("") + "</table>"
        : '<div class="pass">没有待核查的数据。</div>') +
      '<h6 style="margin:16px 0 8px">已核查</h6><table class="t"><tr><th>数据</th><th>结果</th><th>核查人 / 方式</th><th>说明</th></tr>' +
      S.CHECKS_DONE.concat(extra).map(x => '<tr><td class="mono">' + x.key + '</td><td class="mono">' + x.result + "</td><td>" + esc(x.by) + " · " + esc(x.method) + '</td><td class="muted">' + esc(x.note) + "</td></tr>").join("") + "</table>";
  };

  T.aiReview = function (s) {
    const rows = S.classifyAll(s);
    return "<h5>AI 复核</h5><p class=\"hint\">AI 只看“疑似”的用例；规则已确定的不复核、也不能改。置信度只有 high 才会被采用。</p>" +
      '<table class="t"><tr><th>用例</th><th>规则分类</th><th>AI 是否复核</th><th>AI 看到的内容 / 意见</th></tr>' +

        let ai = '<span class="muted">规则已确定，不复核</span>';

      '<div class="explainer-strip"><div><b>一组 = 一张 Jira 单</b>上一步把 8 个失败合成了 ' + total + " 组，其中 " + gs.length + " 组需要建单，所以这里有 " + gs.length + " 份草稿。</div>" +

      '<div class="dgrid"><div class="dlist">' + list +

      '<div><div class="jira"><div class="jh"><span>Jira 新建单预览 · ' + g.id + "（" + cases.length + " 个用例）</span>" +
      '<span><span class="src sc">脚本</span> 自动填写　<span class="src ai">AI</span> 起草</span></div>' +
      field("Project", "ROTQA", src("配置", "sc")) +
      field("Issue type", g.cat === "PRODUCT_DEFECT" ? "Bug" : "Task", src("按分类", "sc")) +
      field("Summary", "<b>" + esc(d.summary) + "</b>", src("AI 按模板", "ai")) +
      field("System", "NBS", src("用例标签", "sc")) +
      field("Components", "SYSTEM-QA", src("配置", "sc")) +
      field("Priority", d.priority, src("规则建议", "sc")) +
      field("Labels", "regression, auto-triage, run-2026-11-03_142142, triage-…-" + g.id, src("脚本", "sc")) +
      field("Assignee", '<span class="muted">留空，由你在审核时填写</span>') +
      field("Environment", "<pre>" + env + "</pre>", src("运行记录", "sc")) +
      field("Description", "<pre>" + esc(d.desc) + "</pre>", src("AI 按 8 小节模板", "ai")) +
      field("Attachments", cases.map(c => '<span class="mono">' + c + "_fail.png</span>").join("　"), src("失败截图", "sc")) +
      "</div>" +
      (errs.length ? '<div class="errs" style="margin-top:10px"><b>校验未通过（' + errs.length + "）</b><br>" + errs.map(e => "· " + esc(e)).join("<br>") + "<br>不通过就不能生成审核表，AI 会按提示修改后重新校验。</div>"

  T.review = function (s) {

      '<table class="t"><tr><th>组</th><th>分类</th><th>Summary</th><th>优先级</th><th>审核状态</th><th></th></tr>' +
      gs.map(g => { const d = S.draft(g, s), v = s.review[g.id] || "待审核";

      document.body.appendChild(a); a.click(); a.remove();

    const s = S.state;
    $("#rail").innerHTML = "<h3>流程 · 点击任一步</h3>" + S.STEPS.map((p, i) =>
      '<button class="step' + (i === s.step ? " active" : "") + (s.visited[i] && i !== s.step ? " visited" : "") + '" data-act="go" data-i="' + i + '">' +

      "</span></span></button>").join("");
  }

  function renderExplain() {
    const s = S.state, p = S.STEPS[s.step];

      "<h4>用到的文件</h4><div class=\"files\">" + p.files.map(f => "<code>" + esc(f) + "</code>").join("") + "</div>" +
      (p.say ? "<h4>你怎么操作</h4><div class=\"say\">" + esc(p.say) + "</div>" : "") +

      (p.cmd ? "<h4>AI 实际执行的命令</h4><div class=\"cmd\">" + esc(p.cmd) + "</div>" : "") +
      "<h4>内部怎么判断</h4><ul>" + p.inside.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" +
      (p.out ? "<h4>产出</h4><div class=\"files\"><code>" + esc(p.out) + "</code></div>" : "") +
      (p.todo ? '<div class="todo-box"><h4>待改进（已讨论，尚未写进代码）</h4><ul>' + p.todo.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>" : "") +
      '<div class="nav-steps"><button data-act="go" data-i="' + (s.step - 1) + '"' + (s.step === 0 ? " disabled" : "") + '>← 上一步</button>' +
      '<button class="next" data-act="go" data-i="' + (s.step + 1) + '"' + (s.step === S.STEPS.length - 1 ? " disabled" : "") + ">下一步 →</button></div>";

  function renderProto() {

        const v = s.review[g.id];
        if (s.submitMode === "csv") { if (["通过"].includes(v)) out.push(g.id + " → 已写入 jira_import.csv（截图需导入后手动上传）"); return; }
        if (s.submitMode === "copy") { if (["通过", "追加到已有单"].includes(v)) out.push(g.id + " → 已生成可复制的标题和描述"); return; }
        if (v === "通过") out.push(g.id + " → 已新建 ROTQA-" + (n++) + "，上传截图 " + g.rows.length + " 张（示例单号）");
        if (v === "追加到已有单") out.push(g.id + " → 已在 " + (g.dup[0] ? g.dup[0].key : "?") + " 下追加评论和截图");
      });
      s.submitted = out.length ? out : ["没有需要提交的组"];
      closeDialog(); render(); toast("提交完成（模拟）");
    },
    jira(b) { S.state.jiraType = b.v; closeDialog(); render(); },
  };

  /* ---------------- 动作 ---------------- */
  function runRerun() {
    const s = S.state, sel = S.CASES.filter(c => s.rerunSel[c.id]);
    s.running = true; s.rerunLog = []; render();
    let i = 0;
    (function next() {
      if (i >= sel.length) { s.running = false; s.rerunDone = true; render(); toast("重跑完成"); return; }
      const c = sel[i++];
      setTimeout(() => { s.rerunLog.push({ id: c.id, res: c.rerunResult || "failed", t: 40 + Math.round(Math.random() * 60) }); render(); next(); }, 650);
    })();
  }

  document.addEventListener("click", e => {
    const dbtn = e.target.closest("[data-dlg]");
    if (dbtn && dlgCtx) { const b = dlgCtx.spec.buttons[+dbtn.dataset.dlg]; DLG_ACTS[b.act](b); return; }
    if (e.target.id === "overlay" || e.target.id === "dlgX") { closeDialog(); return; }
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const s = S.state, a = el.dataset.act;
    if (a === "go") go(+el.dataset.i);
    else if (a === "dlg") openDialog(el.dataset.d, { id: el.dataset.id });
    else if (a === "rsel") { if (s.planConfirmed) { toast("重跑计划已确认，不能再修改"); return; } s.rerunSel[el.dataset.id] = el.dataset.v === "1"; render(); }
    else if (a === "runRerun") runRerun();
    else if (a === "dsel") { s.draftSel = el.dataset.id; render(); }
    else if (a === "broken") { s.brokenDraft = !s.brokenDraft; render(); }
    else if (a === "mode") { s.submitMode = el.dataset.v; s.submitted = null; render(); }
    else if (a === "gallery") openDialog("gallery");
    else if (a === "download") saveFile("回归失败分诊Skill_交互说明.html", SOURCE);
    else if (a === "reset") { S.state = S.initialState(); render(); toast("演示已重置"); }
  });
  document.addEventListener("change", e => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    if (el.dataset.act === "setup") S.state.setupDone[el.dataset.k] = el.checked;
    if (el.dataset.act === "rstat") { S.state.review[el.dataset.id] = el.value; S.state.submitted = null; render(); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDialog(); });

  render();
})();

  </script>
</body>
</html>
