# 模型识图配置（可选功能）
# 复制为 vision.yaml 后填写。这个文件只放“用哪个接口、怎么问”，不放密钥。
# 说明见 references/vision-model.md。

vision:
  # 使用方式：
  #   off    不使用模型，只用 Windows 文字识别（默认）
  #   manual 手动：页面复制“识图指令”，在公司批准的对话工具里发图提问，把回答粘贴回页面
  #   api    接口：由本机脚本调用模型接口，批量识图
  mode: off

  # ---------- 接口（mode: api 时填写，内容以公司提供的为准） ----------
  # azure_openai：公司的 Azure OpenAI
  # openai_compatible：公司 AI 网关或其他兼容 OpenAI 格式的接口
  provider: azure_openai
  endpoint: "https://<公司资源名>.openai.azure.com"     # 网关填完整地址，例如 https://ai-gateway.xxx/v1
  deployment: "<部署名>"                                 # azure_openai 使用
  api_version: "<公司提供的版本号>"                      # azure_openai 使用
  model: "<模型名>"                                      # openai_compatible 使用，例如公司批准的视觉模型
  api_key_env: VISION_API_KEY                            # 密钥放在这个环境变量里，不要写在本文件
  timeout_seconds: 60
  temperature: 0

  # ---------- 发送范围 ----------
  send_only:                       # 只发这些用例的截图
    status: [suspected]            # 待复核
    categories: [NEEDS_HUMAN]      # 需人工判断
  max_images_per_run: 30
  mask_pii_before_send: true       # 发送前打码（证件号、手机号、邮箱、卡号、人名清单）；没有文字识别结果的截图不发送
  max_width: 1600                  # 超过这个宽度先缩小

  # ---------- 指令（改动后把 prompt_version 加 1，结果里会记录用的是哪一版） ----------
  prompt_version: 1
  system_prompt: |
    你在看自动化测试失败时的截图，被测系统是保险业务系统（LAS / NBS 等）。
    只描述截图上能直接看到的内容，不推测原因，不补全看不清的文字。
    文字一律逐字照抄原文（保留大小写和标点），看不清的写 unknown。
    只用 JSON 回答，不要输出其他内容。
  user_prompt: |
    用例：{case_id}
    失败步骤：{failed_step}
    报错信息：{error}
    请看截图，按下面的格式回答：
    {
      "screen": "normal | popup | blank | error_page | other_window | locked_or_black | unknown",
      "popup_text": "弹窗上的原文，没有弹窗则为空字符串",
      "popup_buttons": ["弹窗上的按钮文字"],
      "target_control": {"name": "失败步骤要操作的控件，看不出写 unknown", "visible": "yes | no | unknown", "enabled": "yes | no | unknown"},
      "checkboxes": [{"label": "选项文字", "checked": "yes | no | unknown"}],
      "other_messages": ["页面上其他提示或报错的原文"],
      "region": [x, y, w, h],
      "confidence": "high | medium | low",
      "note": "一句话描述看到的现象（中文）"
    }
    region 是最关键内容（弹窗或报错）在截图上的位置，单位是像素；没有就写 []。
