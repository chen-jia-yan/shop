# 复制为 config/config.yaml 后填写。标注“待确认”的项目必须与实际 Jira 和测试框架核对。

jira:
  project_key: ROTQA
  # 问题类型名称以 ROTQA 项目实际为准（待确认）
  issue_type_by_category:
    PRODUCT_DEFECT: Bug
    TEST_DATA: Task
    ENVIRONMENT: Task
    default: Bug
  # 哪些类别需要建 Jira
  create_for_categories: [PRODUCT_DEFECT, ENVIRONMENT, TEST_DATA]
  default_components: [SYSTEM-QA]
  default_labels: [regression, auto-triage]
  # 自定义字段 ID：运行 python scripts/submit_jira.py --discover-fields --config config/config.yaml 查询
  fields:
    system: null            # 例如 customfield_10234（待确认）
    system_value_type: option   # option（下拉单选）/ text（文本）
    environment: environment    # Jira 自带 Environment 字段；没有则设为 null
  # environment 字段为 null 时，环境信息放在 Description 最前面
  environment_mode: field       # field / description
  priority_rules:
    high_impact_modules: [UW, BM, PAY, NB]          # 待确认：哪些模块属于出单、核保、支付
    high_impact_keywords: [premium, payment, underwriting, issuance, 保费, 核保, 出单, 支付]
    high_if_cases_at_least: 10
    default: Medium
    low_categories: [TEST_DATA]
  duplicate_search:
    lookback_days: 30
    max_results: 5
  # 描述中最多列出的用例数，其余放入附件 CSV
  max_cases_in_table: 20
  # 单张单最多上传的截图数量
  max_screenshots_per_issue: 10

rerun:
  attempts: 1
  # 重跑单个用例的命令模板。{nodeid}、{junit_out} 会被替换。
  # pytest 示例；如使用其他框架请修改。
  command: "python -m pytest \"{nodeid}\" -p no:cacheprovider -q --junitxml=\"{junit_out}\""
  workdir: "D:/automation/nbs-regression"     # 待确认：测试代码所在目录
  timeout_sec: 900
  parallel: 1        # 共用测试环境时建议保持 1，避免互相干扰

classify:
  # 测试代码所在目录（用于判断 Python 错误是否发生在测试脚本中）
  test_code_paths: ["tests/", "pages/", "utils/"]
  environment:
    mass_failure_min_cases: 5
    mass_failure_ratio: 0.3
    mass_failure_window_minutes: 15
  history_flaky_window: 10

grouping:
  # 合并时考虑的维度
  keys: [category, signature, failed_step, market, module]
  # 环境问题跨市场、跨模块合并为一组
  merge_environment_across_modules: true

pii:
  # 额外需要替换的字段名（出现在 test_data 中时会被替换）
  sensitive_fields: [name, insured_name, owner_name, id_no, hkid, phone, mobile, email, address]
  # 允许保留的业务编码
  allowed_fields: [agent_code, product_code, policy_no, proposal_no, plan_code, case_id]
