      '<div style="margin-top:12px"><textarea class="ta" id="paste" rows="5" placeholder="也可以从 Excel 或平台页面复制表格（含表头）粘贴到这里，或粘贴 SDK 接口返回的 JSON"></textarea><div style="margin-top:8px;display:flex;gap:8px"><button class="btn pri" id="pasteGo">解析粘贴内容</button><button class="btn" id="pasteClr">清空</button></div></div></div>';
    if (v.parsed) html += mapCard(v);
    html += '<div class="card"><h3>匹配截图 <span class="sub">文件名中包含用例标识的截图会挂到对应用例，作为证据；刷新页面后需要重新选择</span></h3>' +
      (S.runs.length ? '<div class="form"><label class="fi"><span>批次</span><select class="sel" id="sRun">' + S.runs.map(r => '<option value="' + r.id + '">' + esc(r.name) + "</option>").join("") + '</select></label><button class="btn" id="sFiles">选择截图文件</button><button class="btn" id="sDir">选择截图文件夹</button><input type="file" id="sFileIn" multiple accept="image/*" style="display:none"><input type="file" id="sDirIn" webkitdirectory multiple style="display:none"></div><div class="hint" id="sMsg" style="margin-top:8px"></div>'
        : '<p class="hint" style="margin:0">先导入执行结果，再匹配截图。</p>') + "</div>";
    if (S.runs.length) html += '<div class="card"><h3>已导入批次</h3>' + A.runTable() + "</div>";
    root.innerHTML = html;

    const keep = () => { v.info.name = $("#iName").value; v.info.plan = $("#iPlan").value; v.info.device = $("#iDevice").value; v.info.env = $("#iEnv").value; if ($("#iRerunOf")) v.info.rerunOf = $("#iRerunOf").value; };
    $("#iMode").onchange = e => { keep(); v.info.mode = e.target.value; A.render(); };
    ["iName", "iPlan", "iDevice", "iEnv"].forEach(id => $("#" + id).oninput = keep);
    if ($("#iRerunOf")) $("#iRerunOf").onchange = keep;
    const drop = $("#drop");
    $("#pick").onclick = () => $("#file").click();
    $("#file").onchange = e => handleFiles(Array.from(e.target.files), v);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); handleFiles(Array.from(e.dataTransfer.files), v); };
    $("#pasteGo").onclick = () => { const t = $("#paste").value.trim(); if (!t) { A.toast("请先粘贴内容", true); return; } handleTexts([{ name: "粘贴内容", text: t }], v); };
    $("#pasteClr").onclick = () => { $("#paste").value = ""; };
    if (v.parsed) bindMap(root, v);
    if (S.runs.length) {
      $("#sFiles").onclick = () => $("#sFileIn").click();
      $("#sDir").onclick = () => $("#sDirIn").click();
      $("#sFileIn").onchange = e => matchShots($("#sRun").value, Array.from(e.target.files));
      $("#sDirIn").onchange = e => matchShots($("#sRun").value, Array.from(e.target.files));
      A.bindRunTable(root);
    }
  };
  const inp = (id, label, val, ph) => '<label class="fi"><span>' + label + '</span><input class="inp" id="' + id + '" value="' + esc(val) + '" placeholder="' + esc(ph) + '"></label>';

  async function handleFiles(files, v) {
    if (!files.length) return;
    const list = [];
    for (const f of files) { try { list.push({ name: f.name, text: await A.readFile(f) }); } catch (e) { A.toast("读取失败：" + f.name, true); } }
    handleTexts(list, v);
  }
  function handleTexts(list, v) {
    const tables = [], kinds = new Set(), errs = [];
    list.forEach(({ name, text }) => {
      try { const p = E.parseFile(name, text); kinds.add(p.kind); p.tables.forEach(t => tables.push(Object.assign({ file: name }, t))); }
      catch (e) { errs.push(name + "：" + e.message); }
    });
    if (errs.length) A.toast("有 " + errs.length + " 个文件无法解析：" + errs[0], true);
    if (!tables.length) return;
    // 多个文件、每个只有一张表时合并成一张
    let merged = tables;
    if (list.length > 1 && tables.length === list.length) merged = [{ file: list.length + " 个文件", path: "合并", rows: [].concat(...tables.map(t => t.rows)) }];
    merged = merged.filter(t => t.rows.length);
    if (!merged.length) { A.toast("没有读到任何数据行", true); return; }
    merged.sort((a, b) => b.rows.length - a.rows.length);
    v.parsed = { kind: Array.from(kinds).join("、"), files: list.map(x => x.name), tables: merged };
    v.tableIdx = 0;
    v.map = E.guessMapping(colsOf(merged[0]), S.mapping);
    if (!v.info.name) v.info.name = list[0].name.replace(/\.[^.]+$/, "");
    A.render();
    setTimeout(() => { const el = $("#mapCard"); if (el) el.scrollIntoView({ behavior: "smooth" }); }, 50);
  }
  function colsOf(t) { const s = new Set(); t.rows.slice(0, 200).forEach(r => Object.keys(r).forEach(k => s.add(k))); return Array.from(s); }

  function mapCard(v) {
    const t = v.parsed.tables[v.tableIdx], cols = colsOf(t);
    const cases = E.toCases(t.rows, v.map, S.rules, "preview", 0);
    const resVals = {};
    cases.forEach(c => { const k = c.result || "(空)"; resVals[k] = (resVals[k] || 0) + 1; });
    const nFail = cases.filter(c => c.failed).length;
    const miss = E.FIELDS.filter(f => f.req && !v.map[f.key]);
    let html = '<div class="card" id="mapCard"><h3>字段对应 <span class="sub">' + esc(v.parsed.kind) + " · " + esc(v.parsed.files.join("、")).slice(0, 120) + "</span></h3>";
    if (v.parsed.tables.length > 1) html += '<div class="form" style="margin-bottom:12px"><label class="fi"><span>用例列表</span><select class="sel" id="mTable">' + v.parsed.tables.map((x, i) => '<option value="' + i + '"' + (i === v.tableIdx ? " selected" : "") + ">" + esc(x.path) + "（" + x.rows.length + " 行）</option>").join("") + '</select></label><span class="hint">文件里有多个列表，请选择哪个是用例结果</span></div>';
    html += '<div class="map">' + E.FIELDS.map(f => '<label><span>' + f.name + (f.req ? "<i>*</i>" : "") + '</span><select class="sel" data-f="' + f.key + '"><option value="">（不使用）</option>' + cols.map(c => '<option value="' + esc(c) + '"' + (v.map[f.key] === c ? " selected" : "") + ">" + esc(c) + "</option>").join("") + "</select></label>").join("") + "</div>";
    html += '<div style="margin:14px 0 8px;display:flex;gap:16px;flex-wrap:wrap" class="hint"><span>共 <b style="color:#303133">' + cases.length + '</b> 行</span><span>判定为失败 <b style="color:#f56c6c">' + nFail + "</b> 行</span><span>执行结果取值：" +
      Object.keys(resVals).slice(0, 12).map(k => esc(k) + " × " + resVals[k]).join("，") + '</span><a id="mFailWords">失败判断不对？</a></div>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>用例标识</th><th>用例名称</th><th>执行结果</th><th>判定</th><th>识别的异常类型</th><th>报错信息</th></tr></thead><tbody>' +
      (cases.filter(c => c.failed).slice(0, 4).concat(cases.filter(c => !c.failed).slice(0, 2))).map(c => '<tr><td class="mono">' + esc(c.id) + "</td><td>" + esc(c.name) + "</td><td>" + esc(c.result) + "</td><td>" + (c.failed ? '<span class="tag red">失败</span>' : '<span class="tag gray">不分析</span>') + '</td><td class="mono">' + esc(c.exception || "-") + '</td><td class="clip">' + esc((c.error || c.stack || "-").split("\n")[0]) + "</td></tr>").join("") + "</tbody></table></div>";
    html += '<div style="margin-top:14px;display:flex;gap:8px;align-items:center">' + (miss.length ? '<span class="hint" style="color:#f56c6c">请先对应：' + miss.map(f => f.name).join("、") + "</span>" : "") +
      '<span style="flex:1"></span><button class="btn" id="mCancel">取消</button><button class="btn pri" id="mOk"' + (miss.length ? " disabled" : "") + ">" + (v.info.mode === "rerun" ? "导入重跑结果" : "确认导入") + "</button></div></div>";
    return html;
  }
  function bindMap(root, v) {
    if ($("#mTable")) $("#mTable").onchange = e => { v.tableIdx = +e.target.value; v.map = E.guessMapping(colsOf(v.parsed.tables[v.tableIdx]), S.mapping); A.render(); };
    $$("[data-f]", root).forEach(s => s.onchange = () => { v.map[s.dataset.f] = s.value; if (!s.value) delete v.map[s.dataset.f]; A.render(); $("#mapCard").scrollIntoView(); });
    $("#mCancel").onclick = () => { v.parsed = null; A.render(); };
    $("#mFailWords").onclick = () => A.go("rules", { focus: "fail_words" });
    $("#mOk").onclick = () => doImport(v);
  }
  function doImport(v) {
    const t = v.parsed.tables[v.tableIdx];
    S.mapping = Object.assign({}, v.map);
    const now = new Date(), at = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0") + " " + now.toTimeString().slice(0, 8);
    if (v.info.mode === "rerun") {
      const target = v.info.rerunOf || (S.runs[0] && S.runs[0].id);
      const rc = E.toCases(t.rows, v.map, S.rules, "rerun", 0);
      const byId = {}; rc.forEach(c => { byId[c.id] = c; });
      let hit = 0, pass = 0;
      S.cases.filter(c => c.run === target && c.failed).forEach(c => {
        const r = byId[c.id]; if (!r) return;
        hit++; c.rerun = r.failed ? "fail" : "pass"; if (!r.failed) pass++;
        c.rerunNote = (v.info.name || "重跑") + " " + at + (r.failed && r.error ? "，报错：" + r.error.split("\n")[0].slice(0, 200) : "");
      });
      A.reclassify(); A.save(); v.parsed = null;
      A.toast("已匹配 " + hit + " 条重跑结果，其中通过 " + pass + " 条");
      A.go("rerun");
      return;
    }
    const id = "R" + now.getTime();
    const cases = E.toCases(t.rows, v.map, S.rules, id, 0);
    S.runs.push({ id, name: v.info.name || "批次" + (S.runs.length + 1), plan: v.info.plan, device: v.info.device, env: v.info.env, file: v.parsed.files.join("、").slice(0, 200), at, total: cases.length });
    S.cases = S.cases.concat(cases);
    A.reclassify(); A.save();
    v.parsed = null; v.info = { name: "", plan: "", device: "", env: "", mode: "new", rerunOf: "" };
    A.toast("已导入 " + cases.length + " 条，其中失败 " + cases.filter(c => c.failed).length + " 条");
    A.go("triage", { run: id, page: 1, tab: "all" });
  }
  function matchShots(runId, files) {
    const imgs = files.filter(f => /\.(png|jpe?g|gif|bmp|webp)$/i.test(f.name));
    const cs = S.cases.filter(c => c.run === runId && c.failed).sort((a, b) => b.id.length - a.id.length);
    let matched = 0; const un = [];
    imgs.forEach(f => {
      const n = (f.webkitRelativePath || f.name).toLowerCase();
      const base = f.name.toLowerCase();
      const c = cs.find(c => c.screenshot && c.screenshot.toLowerCase().split(/[\\/;]/).map(s => s.trim()).includes(base)) || cs.find(c => c.id && n.includes(c.id.toLowerCase()));
      if (!c) { un.push(f.name); return; }
      (S.shots[c.uid] = S.shots[c.uid] || []).push({ name: f.webkitRelativePath || f.name, src: URL.createObjectURL(f) });
      matched++;
    });
    A.reclassify();
    $("#sMsg").innerHTML = "共 " + imgs.length + " 张图片，已匹配 " + matched + " 张。" + (un.length ? "未匹配 " + un.length + " 张（文件名中没有找到失败用例的标识），例如：" + un.slice(0, 5).map(esc).join("、") : "");
    A.refreshMenu();
  }

  /* ============================== 规则配置 ============================== */
  const RULE_SECTIONS = [
    ["环境问题", [["env_exceptions", "异常类型（命中即环境问题）"], ["env_patterns", "报错关键字"]], "ENV1 / ENV2：命中即“环境问题·规则确认”。以 re: 开头的按正则表达式匹配，其他不区分大小写的包含匹配。"],
    ["大面积相同报错", [["mass_min_cases", "至少几个用例", "num"], ["mass_ratio", "占失败数比例（%）", "num"], ["mass_window_min", "时间窗口（分钟）", "num"]], "ENV3：同一报错特征同时满足这三个条件时，判为“环境问题·待复核”。没有开始时间时不检查时间窗口。"],
    ["弹窗清单", [["noise_popups", "干扰弹窗文字（与被测功能无关）"], ["business_errors", "业务报错文字（系统返回的真实错误）"], ["overlay_keywords", "遮挡元素特征（class / id 关键字）"]], "弹窗文字在“干扰”清单中 → 弹窗干扰；在“业务报错”清单中 → 进入数据核查；都不在 → 需人工判断（未知弹窗）。新出现的弹窗请补充到这里。"],
    ["异常类型", [["alert_exceptions", "原生对话框"], ["intercept_exceptions", "点击被遮挡"], ["locator_exceptions", "找不到元素 / 超时"], ["invalid_selector", "定位表达式错误"], ["code_errors", "测试代码运行错误"], ["assertion_exceptions", "断言失败"]], "Selenium、Appium、pytest、Java 常见异常类型。异常类型从“异常类型”字段读取，没有时从报错信息中识别。"],
    ["其他", [["test_code_paths", "测试代码路径特征（判断代码错误是否发生在测试代码）"], ["expected_actual", "断言中“期望值/实际值”的格式"], ["fail_words", "执行结果中表示失败的文字"]], ""],
    ["日志解析（Python / BeautifulReport）", [["framework_paths", "框架和第三方库的路径（这些堆栈帧不算业务步骤）"], ["handler_funcs", "失败后才执行的处理函数（截图、清理）"], ["success_marks", "步骤日志中表示业务操作已成功的文字"]], "日志按 “During handling of the above exception” 拆成多段：第一段是最先发生的异常，后面是处理过程中又发生的异常。SystemExit 和截图函数里的异常不作为失败原因。"],
    ["系统提示的含义", [["lock_messages", "数据被其他会话占用 → 测试数据问题"], ["config_messages", "缺少配置 → 需确认（环境或缺陷）"], ["crash_messages", "程序未处理异常对话框 → 疑似产品缺陷"]], "系统提示来自弹窗处理函数读到的文字（pop-up error: …）和步骤日志里的 Validation Error。弹窗按文字含义分类，不按“是不是弹窗”分类。"],
    ["桌面端控件异常（pywinauto）", [["masked_patterns", "掩盖型报错（前一步返回了 False/None）"], ["desk_ambiguous", "定位条件匹配到多个控件"], ["desk_not_found", "找不到窗口 / 控件"], ["desk_not_visible", "控件不可见"], ["desk_not_enabled", "控件不可用（灰色）"], ["desk_option_missing", "下拉框没有该选项"], ["desk_datetime", "日期控件设置失败"]], ""],
  ];
  A.PAGES.rules = function (root, v) {
    let html = '<div class="card"><h3>规则配置 <span class="sub">每行一项；保存后所有用例立即重新分类，人工修改过的结论不受影响</span><span class="acts"><button class="btn" id="rReset">恢复默认</button><button class="btn" id="rExport">导出规则</button><button class="btn pri" id="rSave">保存并重新分类</button></span></h3>' +
      '<p class="hint" style="margin:0">判断顺序：先看整批（大面积相同报错、环境中断的起点）→ 环境 → 重跑 → 系统提示（数据占用、缺少配置、程序崩溃、读不到文字的弹窗）→ 原生弹窗 → 业务报错 → 掩盖型报错 → 桌面端控件异常 → 网页弹框 → 脚本 → 断言 → 需人工。先命中的规则生效。</p></div>';
    RULE_SECTIONS.forEach(([t, items, note]) => {
      html += '<div class="card"><h3>' + t + "</h3>" + (note ? '<p class="hint" style="margin:-4px 0 12px">' + note + "</p>" : "") + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">' +
        items.map(([k, label, type]) => '<label><div style="margin-bottom:6px;color:#606266">' + label + "</div>" + (type === "num" ? '<input class="inp" type="number" data-r="' + k + '" value="' + S.rules[k] + '">' : '<textarea class="ta" rows="7" data-r="' + k + '" id="r_' + k + '">' + esc((S.rules[k] || []).join("\n")) + "</textarea>") + "</label>").join("") + "</div></div>";
    });
    root.innerHTML = html;
    if (v.focus) { const el = $("#r_" + v.focus); if (el) { el.scrollIntoView(); el.focus(); } v.focus = null; }
    $("#rSave").onclick = () => {
      const before = {}; S.cases.forEach(c => { if (c.failed) before[c.uid] = c.final; });
      $$("[data-r]", root).forEach(el => { const k = el.dataset.r; S.rules[k] = el.type === "number" ? +el.value : el.value.split("\n").map(s => s.trim()).filter(Boolean); });
      A.reclassify(); A.save();
      const changed = S.cases.filter(c => c.failed && before[c.uid] !== c.final).length;
      A.toast("已保存，" + changed + " 条用例的分类发生变化"); A.refreshMenu();
    };
    $("#rReset").onclick = () => A.dialog("恢复默认规则", "确定把所有规则恢复为默认值？你补充的弹窗文字和关键字会丢失。", [{ t: "取消" }, { t: "恢复", pri: true, fn: () => { S.rules = Object.assign({}, E.DEFAULT_RULES); A.reclassify(); A.save(); A.render(); A.toast("已恢复默认"); } }]);
    $("#rExport").onclick = () => A.showText("规则（JSON，可以发给同事或留档）", JSON.stringify(S.rules, null, 2));
  };
})();

</script>
<script>
/* 页面：失败分诊（含证据详情）、原因分组、重跑清单、数据核查 */
(function () {
  const A = APP, E = ENG, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;
  const runName = id => (S.runs.find(r => r.id === id) || {}).name || "-";
  const runSelect = (id, val, all) => '<select class="sel" id="' + id + '">' + (all ? '<option value="">全部批次</option>' : "") + S.runs.map(r => '<option value="' + r.id + '"' + (val === r.id ? " selected" : "") + ">" + esc(r.name) + "</option>").join("") + "</select>";
  const catOptions = (val, blank) => (blank ? '<option value="">' + blank + "</option>" : "") + Object.keys(E.CATS).map(k => '<option value="' + k + '"' + (val === k ? " selected" : "") + ">" + E.CATS[k].name + "</option>").join("");
  const firstLine = c => (c.error || c.stack || "").split("\n").find(s => s.trim()) || "";
  const noData = root => { root.innerHTML = '<div class="card">' + A.emptyBlock("还没有导入数据", "先在“数据导入”导入一次执行结果。", '<button class="btn pri" data-go="import">去导入</button>') + "</div>"; A.bindGo(root); };

  /* ============================== 失败分诊 ============================== */
  const TABS = [["all", "全部失败"], ["sus", "待复核"], ["conf", "规则确认"], ["manual", "人工已改"]];
  function filterCases(v) {
    const q = (v.q || "").toLowerCase();
    return S.cases.filter(c => c.failed &&
      (!v.run || c.run === v.run) &&
      (!v.cat || c.final === v.cat) &&
      (!v.owner || E.CATS[c.final].owner === v.owner) &&
      (!v.sig || c.sig === v.sig) &&
      (!q || (c.id + " " + c.name + " " + c.error + " " + c.module).toLowerCase().includes(q)) &&
      (v.tab === "sus" ? !c.override && c.auto.status === "suspected" : v.tab === "conf" ? !c.override && c.auto.status === "confirmed" : v.tab === "manual" ? !!c.override : true));
  }
  A.PAGES.triage = function (root, v) {
    if (!S.runs.length) return noData(root);
    v.tab = v.tab || "all"; v.page = v.page || 1; v.sel = v.sel || [];
    const list = filterCases(v);
    const size = 30, pages = Math.max(1, Math.ceil(list.length / size));
    if (v.page > pages) v.page = pages;
    const rows = list.slice((v.page - 1) * size, v.page * size);
    const owners = Array.from(new Set(Object.values(E.CATS).map(c => c.owner)));
    let html = '<div class="card"><div class="form">' +
      '<label class="fi"><span>批次</span>' + runSelect("fRun", v.run, true) + "</label>" +
      '<label class="fi"><span>用例</span><input class="inp" id="fQ" placeholder="标识 / 名称 / 报错关键字" value="' + esc(v.q || "") + '"></label>' +
      '<label class="fi"><span>分类</span><select class="sel" id="fCat">' + catOptions(v.cat, "请选择分类") + "</select></label>" +
      '<label class="fi"><span>处理方</span><select class="sel" id="fOwner"><option value="">请选择处理方</option>' + owners.map(o => '<option' + (v.owner === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select></label>" +
      '<button class="btn pri" id="fGo">查询</button><button class="btn okb" id="fReset">重置</button></div>' +
      (v.sig ? '<div class="hint" style="margin-top:10px">当前只看同一原因分组：<code>' + esc(v.sig.slice(0, 100)) + '</code> <a id="fSigX">取消</a></div>' : "") + "</div>";
    html += '<div class="card"><div class="bar"><div class="subtabs" style="margin:0;border:none">' + TABS.map(([k, n]) => {
      const cnt = filterCases(Object.assign({}, v, { tab: k })).length;
      return '<button data-tab="' + k + '" class="' + (v.tab === k ? "on" : "") + '">' + n + "（" + cnt + "）</button>";
    }).join("") + '</div><span class="sp"></span>' +
      '<button class="btn" id="bBatch"' + (v.sel.length ? "" : " disabled") + ">批量改分类" + (v.sel.length ? "（" + v.sel.length + "）" : "") + "</button>" +
      '<button class="btn" id="bAI">复制复核材料</button><button class="btn" id="bCsv">导出 CSV</button></div>';
    if (!list.length) html += A.emptyBlock("没有符合条件的用例", v.tab === "sus" ? "所有失败用例都已由规则确认或人工处理。" : "调整筛选条件试试。");
    else {
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th><input type="checkbox" id="selAll"' + (rows.every(c => v.sel.includes(c.uid)) ? " checked" : "") + '></th><th>序号</th><th>用例标识</th><th>用例名称</th><th>异常类型</th><th>报错摘要</th><th>分类</th><th>判定状态</th><th>规则</th><th>处理方</th><th>操作</th></tr></thead><tbody>' +
        rows.map(c => '<tr class="' + (v.sel.includes(c.uid) ? "sel" : "") + '"><td><input type="checkbox" data-sel="' + c.uid + '"' + (v.sel.includes(c.uid) ? " checked" : "") + "></td><td>" + c.seq + '</td><td class="mono">' + esc(c.id) + '</td><td style="min-width:120px">' + esc(c.name) + (v.run ? "" : '<div class="hint">' + esc(runName(c.run)) + "</div>") + '</td><td class="mono">' + esc(c.exception || "-") +
          '</td><td class="clip" title="' + esc(firstLine(c)) + '">' + esc(firstLine(c) || "-") + "</td><td>" + A.catTag(c.final) + (c.auto.flags.length ? '<div style="margin-top:4px">' + c.auto.flags.map(f => '<span class="tag orange">' + esc(f) + "</span>").join(" ") + "</div>" : "") +
          "</td><td>" + A.statusTag(c) + '</td><td class="mono">' + esc(c.override ? "人工" : c.auto.rule) + "</td><td>" + E.CATS[c.final].owner + '</td><td class="ops"><a data-open="' + c.uid + '">查看证据</a><a data-quick="' + c.uid + '">改分类</a></td></tr>').join("") +
        "</tbody></table></div>";
      const pg = A.pager(list.length, v.page, size, p => { v.page = p; A.render(); });
      html += pg.html; html += "</div>";
      root.innerHTML = html; pg.bind(root);
    }
    if (!list.length) { html += "</div>"; root.innerHTML = html; }

    const apply = () => { v.run = $("#fRun").value; v.q = $("#fQ").value.trim(); v.cat = $("#fCat").value; v.owner = $("#fOwner").value; v.page = 1; A.render(); };
    $("#fGo").onclick = apply;
    $("#fQ").onkeydown = e => { if (e.key === "Enter") apply(); };
    $("#fReset").onclick = () => { Object.assign(v, { run: "", q: "", cat: "", owner: "", sig: "", page: 1, sel: [] }); A.render(); };
    if ($("#fSigX")) $("#fSigX").onclick = () => { v.sig = ""; A.render(); };
    $$("[data-tab]", root).forEach(b => b.onclick = () => { v.tab = b.dataset.tab; v.page = 1; A.render(); });
    $$("[data-sel]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.sel; v.sel = cb.checked ? v.sel.concat(u) : v.sel.filter(x => x !== u); A.render(); });
    if ($("#selAll")) $("#selAll").onchange = e => { const ids = rows.map(c => c.uid); v.sel = e.target.checked ? Array.from(new Set(v.sel.concat(ids))) : v.sel.filter(x => !ids.includes(x)); A.render(); };
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    $$("[data-quick]", root).forEach(a => a.onclick = () => batchDialog([a.dataset.quick]));
    $("#bBatch").onclick = () => batchDialog(v.sel, () => { v.sel = []; });
    $("#bAI").onclick = () => {
      const pick = v.sel.length ? S.cases.filter(c => v.sel.includes(c.uid)) : list.filter(c => !c.override && c.auto.status === "suspected");
      if (!pick.length) { A.toast("当前没有待复核的用例；也可以先勾选要复核的用例", true); return; }
      A.showText("复核材料（已脱敏，共 " + pick.length + " 条" + (pick.length > 15 ? "，建议分批发送" : "") + "）", aiMaterial(pick));
    };
    $("#bCsv").onclick = () => exportDialog(list);
  };

  function batchDialog(uids, after) {
    const cs = S.cases.filter(c => uids.includes(c.uid));
    if (!cs.length) return;
    const one = cs.length === 1 ? cs[0] : null;
    A.dialog(one ? "修改分类：" + one.id : "批量修改分类（" + cs.length + " 条）",
      (one ? '<p class="hint" style="margin-top:0">自动分类：' + E.CATS[one.auto.cat].name + "（" + one.auto.rule + "）</p>" : "") +
      '<div style="display:grid;gap:10px"><label><div style="margin-bottom:4px">人工分类</div><select class="sel" id="bdCat" style="width:100%">' + catOptions(one && one.override ? one.override.cat : "", "请选择") + '</select></label>' +
      '<label><div style="margin-bottom:4px">修改原因 <span style="color:#f56c6c">*</span></div><textarea class="ta" id="bdReason" rows="3" placeholder="写下看到的证据，例如：截图 E4 中有“系統公告”弹窗挡住了提交按钮">' + esc(one && one.override ? one.override.reason : "") + "</textarea></label></div>",
      [{ t: "取消" }].concat(one && one.override ? [{ t: "恢复自动分类", fn: () => { delete one.override; done(); } }] : []).concat([{ t: "保存", pri: true, fn: () => {
        const cat = $("#bdCat").value, reason = $("#bdReason").value.trim();
        if (!cat || !reason) { A.toast("请选择分类并填写原因", true); return false; }
        const at = new Date().toLocaleString();
        cs.forEach(c => { c.override = { cat, reason, at }; });
        done();
      } }]));
    function done() { A.reclassify(); A.save(); if (after) after(); A.render(); if ($("#drawer").classList.contains("open") && one) openCase(one.uid); A.toast("已保存"); }
  }

  /* ---------- 用例详情（证据） ---------- */
  function openCase(uid) {
    const c = S.cases.find(x => x.uid === uid); if (!c) return;
    const a = c.auto, sus = a.status === "suspected";
    const hits = a.hits.concat(c.exception ? [c.exception] : []);
    let b = '<div class="sec"><h5>基本信息</h5><dl class="kv"><dt>批次</dt><dd>' + esc(runName(c.run)) + "</dd><dt>用例名称</dt><dd>" + esc(c.name || "-") + "</dd><dt>执行结果</dt><dd>" + esc(c.result) + "</dd>" +
      (c.module ? "<dt>模块/套件</dt><dd>" + esc(c.module) + "</dd>" : "") + (c.device ? "<dt>执行设备</dt><dd>" + esc(c.device) + "</dd>" : "") + (c.start ? "<dt>开始时间</dt><dd>" + esc(c.start) + "</dd>" : "") + (c.duration ? "<dt>耗时</dt><dd>" + esc(c.duration) + "</dd>" : "") +
      '<dt>原因分组</dt><dd><a id="dSig">同一报错特征共 ' + S.cases.filter(x => x.failed && x.sig === c.sig).length + " 条</a></dd></dl></div>";
    b += '<div class="sec"><h5>规则判定 ' + A.catTag(a.cat) + (sus ? '<span class="dot" style="--c:#e6a23c">待复核</span>' : '<span class="dot" style="--c:#67c23a">规则确认</span>') + '<span class="tag gray">' + esc(a.rule) + "</span>" + (a.reason ? '<span class="tag gray">' + esc(E.REASONS[a.reason]) + "</span>" : "") + "</h5>" +
      '<div class="verdict' + (sus ? " sus" : "") + '"><b>依据</b><ul>' + a.why.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" + (a.need.length ? '<b style="display:block;margin-top:6px">还需确认</b><ul>' + a.need.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" : "") + "</div></div>";
    if (c.override) b += '<div class="sec"><h5>人工结论 ' + A.catTag(c.override.cat) + '</h5><div class="verdict">' + esc(c.override.reason) + '<div class="hint">' + esc(c.override.at) + "</div></div></div>";
    b += '<div class="sec"><h5>证据 <span class="hint" style="font-weight:400">黄色标记是规则命中的文字</span></h5>' + (a.ev.length ? a.ev.map(e => '<div class="ev"><div class="eh"><b>' + e.id + "</b>" + esc(e.label) + (e.derived ? '<span class="tag gray">从报错中识别</span>' : "") + "</div>" +
      (e.kind === "shot" && e.src ? '<img src="' + e.src + '" alt=""><pre>' + esc(e.text) + "</pre>" : "<pre>" + A.highlight(e.text, hits) + "</pre>") + "</div>").join("") : '<p class="hint">没有任何证据材料。</p>') +
      (!c.shots && !c.screenshot ? '<p class="hint">没有截图。可以在“数据导入 → 匹配截图”中选择截图文件夹。</p>' : "") + "</div>";
    b += '<div class="sec"><h5>补充记录</h5><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
      '<label><div class="hint">重跑结果</div><select class="sel" id="dRerun" style="width:100%"><option value="">未重跑</option><option value="pass"' + (c.rerun === "pass" ? " selected" : "") + '>重跑通过</option><option value="fail"' + (c.rerun === "fail" ? " selected" : "") + ">重跑仍失败</option></select></label>" +
      '<label><div class="hint">数据核查</div><select class="sel" id="dData" style="width:100%"><option value="">未核查</option>' + Object.keys(E.DATA_CHECK).map(k => '<option value="' + k + '"' + (c.dataCheck === k ? " selected" : "") + ">" + E.DATA_CHECK[k] + "</option>").join("") + "</select></label>" +
      '<label style="grid-column:1/-1"><div class="hint">备注（重跑/核查说明，例如查询了哪张表、核查人）</div><textarea class="ta" id="dNote" rows="2">' + esc(c.dataNote || c.rerunNote || "") + "</textarea></label></div></div>";
    A.drawer(esc(c.id) + ' <span class="hint" style="font-weight:400">' + esc(c.name || "") + "</span>", b,
      '<button class="btn" id="dAI">复制本条复核材料</button><button class="btn" id="dSave">保存补充记录</button><button class="btn pri" id="dOver">' + (c.override ? "修改人工结论" : "确认 / 改分类") + "</button>");
    $("#dSig").onclick = () => { A.closeDrawer(); A.go("triage", { sig: c.sig, tab: "all", page: 1, run: "" }); };
    $("#dAI").onclick = () => A.copy(aiMaterial([c]));
    $("#dOver").onclick = () => batchDialog([c.uid]);
    $("#dSave").onclick = () => {
      c.rerun = $("#dRerun").value || null; c.dataCheck = $("#dData").value || null;
      const note = $("#dNote").value.trim();
      if (c.dataCheck) c.dataNote = note; else if (c.rerun) c.rerunNote = note;
      A.reclassify(); A.save(); A.render(); openCase(c.uid); A.toast("已保存，分类已重新计算");
    };
  }
  A.openCase = openCase;

  /* ---------- 复核材料（给 AI） ---------- */
  function aiMaterial(list) {
    const head = "你是测试失败分析助手。请根据下面每条用例的证据，给出初步分类。要求：\n" +
      "1. 只能使用给出的证据，结论必须引用证据编号（E1、E2…）；\n" +
      "2. 看截图时只描述能看到的页面状态（例如“保单录入页完整显示，Submit 按钮可见”），不要推测数据库或后台状态；\n" +
      "3. 证据不足时回答“需人工判断”，并写明还缺什么证据；\n" +
      "4. 如果你的结论与“规则初步结论”不同，说明理由；\n" +
      "5. 按表格输出：用例标识 | 分类 | 依据（含证据编号）| 还需确认。\n" +
      "可选分类：环境问题、重跑可过、弹窗干扰、脚本问题、测试数据问题、疑似产品缺陷、需人工判断。\n" +
      "判断要点：找不到元素可能是脚本定位过时，也可能是页面没加载出来（产品问题）或被弹窗挡住；弹窗文字是业务报错（如 record not found）时不是干扰；断言的期望值可能已过时。\n";
    const shots = [];
    const body = list.map(c => {
      const a = c.auto;
      let s = "\n==========\n用例 " + c.id + (c.name ? " " + c.name : "") + "\n规则初步结论：" + E.CATS[a.cat].name + "（" + (a.status === "confirmed" ? "规则确认" : "待复核") + "，" + a.rule + "）\n规则依据：" + a.why.join("；") + "\n";
      a.ev.forEach(e => {
        if (e.kind === "shot") { s += e.id + " 截图：" + e.text + "（请随本材料上传这张截图）\n"; shots.push(e.text); return; }
        let t = e.text; if (e.kind === "stack" && t.length > 1500) t = t.slice(0, 1500) + "\n…（已截断）";
        s += e.id + " " + e.label + "：\n" + t + "\n";
      });
      return s;
    }).join("");
    return E.mask(head + body + (shots.length ? "\n需要一并上传的截图：\n" + shots.join("\n") + "\n截图中如有客户姓名、证件号等个人信息，请先打码。\n" : ""));
  }

  /* ---------- 导出 ---------- */
  function exportDialog(list) {
    A.dialog("导出 CSV", '<p style="margin-top:0">导出当前筛选结果，共 ' + list.length + " 条。Excel 可直接打开。</p>" +
      '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="exMask" checked>导出时脱敏个人信息（证件号、手机号、邮箱、卡号）</label>',
      [{ t: "取消" }, { t: "复制内容", fn: () => { A.copy(csvOf(list, $("#exMask").checked)); } }, { t: "下载文件", pri: true, fn: () => { A.download("失败分诊_" + new Date().toISOString().slice(0, 10) + ".csv", csvOf(list, $("#exMask").checked), "text/csv;charset=utf-8"); } }]);
  }
  function csvOf(list, doMask) {
    const m = s => doMask ? E.mask(s) : s;
    const rows = [["批次", "序号", "用例标识", "用例名称", "执行结果", "异常类型", "报错首行", "自动分类", "判定状态", "命中规则", "依据", "还需确认", "人工分类", "修改原因", "最终分类", "处理方", "重跑", "数据核查", "备注", "原因特征"]];
    list.forEach(c => rows.push([runName(c.run), c.seq, c.id, c.name, c.result, c.exception, m(firstLine(c)), E.CATS[c.auto.cat].name, c.auto.status === "confirmed" ? "规则确认" : "待复核", c.auto.rule,
      m(c.auto.why.join("；")), c.auto.need.join("；"), c.override ? E.CATS[c.override.cat].name : "", c.override ? m(c.override.reason) : "", E.CATS[c.final].name, E.CATS[c.final].owner,
      c.rerun === "pass" ? "重跑通过" : c.rerun === "fail" ? "重跑仍失败" : "", c.dataCheck ? E.DATA_CHECK[c.dataCheck] : "", m(c.dataNote || c.rerunNote || ""), c.sig]));
    return A.toCSV(rows);
  }

  /* ============================== 原因分组 ============================== */
  A.PAGES.groups = function (root, v) {
    if (!S.runs.length) return noData(root);
    const fs = S.cases.filter(c => c.failed && (!v.run || c.run === v.run));
    const g = {};
    fs.forEach(c => { const k = c.final + "|" + (c.sig || "(无报错)"); (g[k] = g[k] || []).push(c); });
    const groups = Object.entries(g).map(([k, cs]) => ({ k, cat: cs[0].final, sig: cs[0].sig, cs })).sort((a, b) => b.cs.length - a.cs.length);
    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("gRun", v.run, true) + '</label><span class="hint">报错去掉数字、时间、网址等会变化的部分后相同的，归为一组。' + fs.length + " 条失败用例，共 " + groups.length + " 组。</span></div></div>";
    html += '<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>序号</th><th>分类</th><th>用例数</th><th>异常类型</th><th>代表性报错</th><th>涉及用例</th><th>操作</th></tr></thead><tbody>' +
      groups.map((x, i) => { const c0 = x.cs[0]; return "<tr><td>" + (i + 1) + "</td><td>" + A.catTag(x.cat) + "</td><td><b>" + x.cs.length + '</b></td><td class="mono">' + esc(c0.exception || "-") + '</td><td class="clip" style="max-width:420px" title="' + esc(firstLine(c0)) + '">' + esc(firstLine(c0) || "(无报错信息)") + '</td><td class="clip mono" style="max-width:240px" title="' + esc(x.cs.map(c => c.id).join(", ")) + '">' + esc(x.cs.map(c => c.id).join(", ")) + '</td><td class="ops"><a data-gv="' + i + '">查看用例</a><a data-ge="' + i + '">整组改分类</a><a data-gc="' + i + '">复制标识</a></td></tr>'; }).join("") +
      "</tbody></table></div>" + (groups.length ? "" : A.emptyBlock("没有失败用例")) + "</div>";
    root.innerHTML = html;
    $("#gRun").onchange = e => { v.run = e.target.value; A.render(); };
    $$("[data-gv]", root).forEach(a => a.onclick = () => A.go("triage", { sig: groups[+a.dataset.gv].sig, tab: "all", page: 1, run: v.run || "", cat: "" }));
    $$("[data-ge]", root).forEach(a => a.onclick = () => batchDialog(groups[+a.dataset.ge].cs.map(c => c.uid)));
    $$("[data-gc]", root).forEach(a => a.onclick = () => A.copy(groups[+a.dataset.gc].cs.map(c => c.id).join("\n")));
  };
  A.batchDialog = batchDialog;

  /* ============================== 重跑清单 ============================== */
  function rerunAdvice(c) {
    const a = c.auto, f = c.final;
    if (c.rerun) return { go: false, why: "已有重跑结果" };
    if (a.reason === "pending_data_check") return { go: false, why: "先做数据核查；数据有问题时重跑仍会失败" };
    if (f === "TEST_DATA") return { go: false, why: "先补测试数据再重跑" };
    if (f === "PRODUCT_DEFECT" && a.status === "confirmed") return { go: false, why: "已确认是产品问题" };
    if (a.rule === "SCR2" || (a.rule === "SCR3" && a.status === "confirmed")) return { go: false, why: "测试代码错误，重跑结果不会变，先修脚本" };
    if (f === "ENVIRONMENT") return { go: true, why: "等环境恢复后重跑，确认是否只受环境影响" };
    if (f === "POPUP_INTERFERENCE") return { go: true, why: "弹窗可能是偶发，重跑可确认" };
    if (f === "SCRIPT_ISSUE") return { go: true, why: "区分是偶发等待问题还是定位真的失效" };
    if (f === "PRODUCT_DEFECT") return { go: true, why: "断言失败重跑一次，排除偶发" };
    return { go: true, why: "证据不足，重跑可以补充信息" };
  }
  A.PAGES.rerun = function (root, v) {
    if (!S.runs.length) return noData(root);
    v.run = v.run || S.runs[S.runs.length - 1].id; v.sel = v.sel || null;
    const fs = S.cases.filter(c => c.failed && c.run === v.run).map(c => Object.assign(c, { _adv: rerunAdvice(c) }));
    if (!v.sel) v.sel = fs.filter(c => c._adv.go).map(c => c.uid);
    const done = fs.filter(c => c.rerun), pass = done.filter(c => c.rerun === "pass").length;
    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("rRun", v.run) + '</label><span class="hint">建议重跑 ' + fs.filter(c => c._adv.go).length + " 条；已有重跑结果 " + done.length + " 条，其中通过 " + pass + " 条</span></div>" +
      '<p class="hint" style="margin:10px 0 0">做法：勾选要重跑的用例 → 复制用例标识到平台重跑 → 重跑完成后在“数据导入”选择“重跑结果”导入，通过的用例会自动改为“重跑可过”。也可以在下表直接填写重跑结果。</p></div>';
    html += '<div class="card"><div class="bar"><span>已选 ' + v.sel.length + ' 条</span><span class="sp"></span><button class="btn" id="rCopy">复制用例标识（每行一个）</button><button class="btn" id="rCopy2">复制为逗号分隔</button><button class="btn pri" id="rImp">导入重跑结果</button></div>' +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th><input type="checkbox" id="rAll"></th><th>用例标识</th><th>用例名称</th><th>当前分类</th><th>建议</th><th>原因</th><th>重跑结果</th></tr></thead><tbody>' +
      fs.map(c => '<tr><td><input type="checkbox" data-rs="' + c.uid + '"' + (v.sel.includes(c.uid) ? " checked" : "") + '></td><td class="mono"><a data-open="' + c.uid + '">' + esc(c.id) + "</a></td><td>" + esc(c.name) + "</td><td>" + A.catTag(c.final) + "</td><td>" + (c.rerun ? '<span class="tag gray">已重跑</span>' : c._adv.go ? '<span class="tag blue">建议重跑</span>' : '<span class="tag gray">暂不重跑</span>') + '</td><td class="hint">' + esc(c._adv.why) +
        '</td><td><select class="sel" style="min-width:110px" data-rr="' + c.uid + '"><option value="">未重跑</option><option value="pass"' + (c.rerun === "pass" ? " selected" : "") + '>通过</option><option value="fail"' + (c.rerun === "fail" ? " selected" : "") + ">仍失败</option></select></td></tr>").join("") +
      "</tbody></table></div>" + (fs.length ? "" : A.emptyBlock("该批次没有失败用例")) + "</div>";
    root.innerHTML = html;
    $("#rRun").onchange = e => { v.run = e.target.value; v.sel = null; A.render(); };
    $$("[data-rs]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.rs; v.sel = cb.checked ? v.sel.concat(u) : v.sel.filter(x => x !== u); A.render(); });
    $("#rAll").onchange = e => { v.sel = e.target.checked ? fs.map(c => c.uid) : []; A.render(); };
    $$("[data-rr]", root).forEach(s => s.onchange = () => { const c = S.cases.find(x => x.uid === s.dataset.rr); c.rerun = s.value || null; c.rerunNote = s.value ? "手工填写 " + new Date().toLocaleString() : ""; A.reclassify(); A.save(); A.render(); A.toast("已保存，分类已重新计算"); });
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    const ids = () => S.cases.filter(c => v.sel.includes(c.uid)).map(c => c.id);
    $("#rCopy").onclick = () => { if (!v.sel.length) return A.toast("请先勾选用例", true); A.copy(ids().join("\n")); };
    $("#rCopy2").onclick = () => { if (!v.sel.length) return A.toast("请先勾选用例", true); A.copy(ids().join(",")); };
    $("#rImp").onclick = () => A.go("import", { info: { name: "", plan: "", device: "", env: "", mode: "rerun", rerunOf: v.run } });
  };

  /* ============================== 数据核查 ============================== */
  A.PAGES.datacheck = function (root, v) {
    if (!S.runs.length) return noData(root);
    const fs = S.cases.filter(c => c.failed && (!v.run || c.run === v.run) && /^BIZ/.test(c.auto.rule));
    const pend = fs.filter(c => !c.dataCheck).length;
    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("dcRun", v.run, true) + '</label><span class="hint">页面出现业务报错的用例 ' + fs.length + " 条，待核查 " + pend + " 条</span></div>" +
      '<p class="hint" style="margin:10px 0 0">只凭“record not found”这类报错，分不清是测试数据有问题还是系统有问题。请查库（或用公司批准的只读查询）后填写结果：数据正常但系统仍报错 → 疑似产品缺陷（规则确认）；数据不存在、已被使用、状态不对 → 测试数据问题。数据库状态必须由人核查，不能根据截图推断。</p></div>';
    html += '<div class="card">' + (fs.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>用例标识</th><th>用例名称</th><th>业务报错</th><th>页面/报错原文</th><th>核查结果</th><th>核查说明（查了什么、谁查的）</th><th>当前分类</th><th>操作</th></tr></thead><tbody>' +
      fs.map(c => {
        const same = fs.filter(x => x !== c && x.auto.hits[0] === c.auto.hits[0] && x.sig === c.sig).length;
        return '<tr><td class="mono"><a data-open="' + c.uid + '">' + esc(c.id) + "</a></td><td>" + esc(c.name) + '</td><td><span class="tag red">' + esc(c.auto.hits[0] || "") + '</span></td><td class="clip" style="max-width:280px" title="' + esc(c.pageText || c.alertText || firstLine(c)) + '">' + esc(c.pageText || c.alertText || firstLine(c)) +
          '</td><td><select class="sel" style="min-width:150px" data-dc="' + c.uid + '"><option value="">未核查</option>' + Object.keys(E.DATA_CHECK).map(k => '<option value="' + k + '"' + (c.dataCheck === k ? " selected" : "") + ">" + E.DATA_CHECK[k] + "</option>").join("") + '</select></td><td><input class="inp" style="min-width:200px" data-dn="' + c.uid + '" value="' + esc(c.dataNote || "") + '" placeholder="如：查 agent 表，40100 存在且有效"></td><td>' + A.catTag(c.final) +
          '</td><td class="ops">' + (same ? '<a data-same="' + c.uid + '">应用到相同报错的 ' + same + " 条</a>" : "") + "</td></tr>";
      }).join("") + "</tbody></table></div>" : A.emptyBlock("没有需要数据核查的用例", "只有页面或弹窗中出现业务报错的用例才会出现在这里。")) + "</div>";
    root.innerHTML = html;
    $("#dcRun").onchange = e => { v.run = e.target.value; A.render(); };
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    const upd = () => { A.reclassify(); A.save(); A.render(); };
    $$("[data-dc]", root).forEach(s => s.onchange = () => { const c = S.cases.find(x => x.uid === s.dataset.dc); c.dataCheck = s.value || null; upd(); A.toast("已保存，分类已重新计算"); });
    $$("[data-dn]", root).forEach(i => i.onchange = () => { const c = S.cases.find(x => x.uid === i.dataset.dn); c.dataNote = i.value.trim(); A.save(); });
    $$("[data-same]", root).forEach(a => a.onclick = () => {
      const c = S.cases.find(x => x.uid === a.dataset.same);
      if (!c.dataCheck) { A.toast("请先填写这一条的核查结果", true); return; }
      const others = fs.filter(x => x !== c && x.auto.hits[0] === c.auto.hits[0] && x.sig === c.sig);
      A.dialog("应用到相同报错", "把核查结果“" + E.DATA_CHECK[c.dataCheck] + "”应用到以下 " + others.length + " 条用例？只有它们用的是同一组数据时才适用。<p class=\"hint\">" + others.map(x => esc(x.id)).join("、") + "</p>",
        [{ t: "取消" }, { t: "应用", pri: true, fn: () => { others.forEach(x => { x.dataCheck = c.dataCheck; x.dataNote = (c.dataNote || "") + "（沿用 " + c.id + " 的核查）"; }); upd(); A.toast("已应用"); } }]);
    });
  };
})();

</script>
<script>
/* 页面：回归对比（读取 difflib 生成的 Total / Ignore HTML 报告，合并在一页查看） */
(function () {
  const A = APP, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;

  /* ---------- 解析 difflib.HtmlDiff 报告 ---------- */
  // 把单元格内容转成安全的 HTML：只保留文字和 diff_add / diff_chg / diff_sub 标记
  function cellHTML(td) {
    let out = "", changed = false;
    const walk = n => {
      n.childNodes.forEach(ch => {
        if (ch.nodeType === 3) out += esc(ch.nodeValue.replace(/ /g, " "));
        else if (ch.nodeType === 1) {
          const cls = (ch.className || "").match(/diff_(add|chg|sub)/);
          if (cls) { changed = true; out += '<span class="d_' + cls[1] + '">'; walk(ch); out += "</span>"; }
          else if (ch.tagName === "BR") out += "";
          else walk(ch);
        }
      });
    };
    walk(td);
    return { html: out, text: td.textContent.replace(/ /g, " "), changed };
  }
  function parseDiff(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const tables = Array.from(doc.querySelectorAll("table.diff")).filter(t => (t.getAttribute("summary") || "").toLowerCase() !== "legends" && t.querySelector("td.diff_header"));
    if (!tables.length) return { ok: false };
    const heads = Array.from(doc.querySelectorAll("table.diff thead th.diff_header, table.diff thead th[colspan]")).map(th => th.textContent.trim()).filter(Boolean);
    const rows = [];
    tables.forEach(t => {
      Array.from(t.tBodies).forEach((tb, bi) => {
        if (bi > 0 || rows.length) rows.push({ gap: true });
        Array.from(tb.rows).forEach(tr => {
          const tds = Array.from(tr.cells);
          const sides = [];
          tds.forEach((td, i) => { if (td.classList.contains("diff_header")) { const tx = tds[i + 1]; sides.push({ no: td.textContent.trim(), cell: tx ? cellHTML(tx) : { html: "", text: "", changed: false } }); } });
          if (sides.length < 2) {
            const txt = tr.textContent.trim();
            if (txt) rows.push({ note: txt });
            return;
          }
          const [L, R] = sides;
          rows.push({ ln: L.no, lh: L.cell.html, lt: L.cell.text, rn: R.no, rh: R.cell.html, rt: R.cell.text, chg: L.cell.changed || R.cell.changed || (!L.no !== !R.no) });
        });
      });
    });
    while (rows.length && rows[0].gap) rows.shift();
    const nd = rows.filter(r => r.chg).length;
    const noDiff = /No Differences Found/i.test(doc.body ? doc.body.textContent : "");
    return { ok: true, rows, nd: noDiff ? 0 : nd, from: heads[0] || "基线", to: heads[1] || "本次" };
  }

  const KIND_RE = /(^|[_\-\s.()\[\]])(total|ignore|ignored|full|filtered)(?=$|[_\-\s.()\[\]])/gi;
  function caseKey(name) { return name.replace(/\.[^.]+$/, "").replace(KIND_RE, "$1").replace(/[_\-\s.]+$/g, "").replace(/^[_\-\s.]+/g, "").replace(/[_\-\s.]{2,}/g, "_").toLowerCase(); }
  function kindOf(path, fallback) {
    const p = path.toLowerCase();
    if (/(^|[^a-z])ignored?([^a-z]|$)|filtered/.test(p.split("/").pop())) return "ignore";
    if (/(^|[^a-z])(total|full)([^a-z]|$)/.test(p.split("/").pop())) return "total";
    if (/(^|\/)(ignored?|filtered)[^/]*\//.test(p)) return "ignore";
    if (/(^|\/)(total|full)[^/]*\//.test(p)) return "total";
    return fallback;
  }

  async function loadFiles(files, fallback) {
    const C = S.cmp || (S.cmp = { items: {}, order: [] });
    const html = files.filter(f => /\.html?$/i.test(f.name));
    let n = 0, bad = 0;
    for (const f of html) {
      const text = await A.readFile(f);
      const kind = kindOf(f.webkitRelativePath || f.name, fallback);
      const key = caseKey(f.name);
      const p = parseDiff(text);
      const it = C.items[key] || (C.items[key] = { key, name: f.name.replace(/\.[^.]+$/, "").replace(KIND_RE, "$1").replace(/[_\-\s.]+$/, ""), total: null, ignore: null });
      it[kind] = Object.assign(p, { file: f.webkitRelativePath || f.name, raw: text });
      if (!p.ok) bad++;
      n++;
    }
    C.order = Object.keys(C.items).sort((a, b) => a.localeCompare(b, "zh", { numeric: true }));
    A.toast("已读取 " + n + " 个报告" + (bad ? "，其中 " + bad + " 个不是 difflib 格式" : "") + (files.length - html.length ? "，跳过 " + (files.length - html.length) + " 个非 HTML 文件" : ""), bad > 0);
    A.render();
  }

  const statusOf = it => {
    const ig = it.ignore, to = it.total;
    if ((ig && !ig.ok) || (to && !to.ok)) return "bad";
    if (!ig || !to) return "single";
    if (ig.nd > 0) return "real";
    if (to.nd > 0) return "noise";
    return "same";
  };
  const ST = { real: ["过滤后仍有差异", "red"], noise: ["只有噪声差异", "gray"], same: ["完全一致", "green"], single: ["缺少配对报告", "orange"], bad: ["无法识别", "orange"] };

  function clusters(C) {
    const m = {};
    C.order.forEach(k => {
      const it = C.items[k], d = it.ignore && it.ignore.ok ? it.ignore : (!it.total || !it.total.ok ? null : (it.ignore ? null : it.total));
      if (!d) return;
      const seen = new Set();
      d.rows.forEach(r => {
        if (!r.chg) return;
        const key = (r.lt || "").replace(/\s+/g, " ").trim() + " → " + (r.rt || "").replace(/\s+/g, " ").trim();
        if (seen.has(key)) return; seen.add(key);
        (m[key] = m[key] || { key, l: r.lt, r: r.rt, cases: [] }).cases.push(k);
      });
    });
    return Object.values(m).sort((a, b) => b.cases.length - a.cases.length);
  }

  A.PAGES.compare = function (root, v) {
    const C = S.cmp;
    v.view = v.view || "ignore"; v.mode = v.mode || "diff"; v.open = v.open || {};
    let html = '<div class="card"><h3>回归对比汇总 <span class="sub">读取已有的 Total / Ignore 对比报告（Python difflib 生成的 HTML），在一页里查看</span><span class="acts">' +
      '<button class="btn" id="cTot">导入 Total 报告</button><button class="btn" id="cIgn">导入 Ignore 报告</button><button class="btn" id="cDir">导入整个文件夹</button>' + (C ? '<button class="btn dang" id="cClr">清空</button>' : "") + "</span></h3>" +
      '<input type="file" id="cTotIn" multiple accept=".html,.htm" style="display:none"><input type="file" id="cIgnIn" multiple accept=".html,.htm" style="display:none"><input type="file" id="cDirIn" webkitdirectory multiple style="display:none">' +
      '<p class="hint" style="margin:0">Total、Ignore 可以分别选择文件（可多选），也可以选包含两者的文件夹：文件名或上级文件夹名含 total / ignore 的会自动区分。文件名去掉 total / ignore 字样后相同的，视为同一个 Case。报告只在本次打开页面期间有效，不会保存。</p></div>';
    if (!C || !C.order.length) {
      root.innerHTML = html + '<div class="card">' + A.emptyBlock("还没有导入对比报告", "选择同事 A 生成的 total 和 ignore HTML 报告后，这里会显示所有 Case 的差异汇总。") + "</div>";
      bindTop(root); return;
    }
    const items = C.order.map(k => C.items[k]);
    const cnt = s => items.filter(it => statusOf(it) === s).length;
    html += '<div class="kpis">' + [["", "报告 Case 数", items.length, "#409eff"], ["real", "过滤后仍有差异", cnt("real"), "#f56c6c"], ["noise", "只有噪声差异", cnt("noise"), "#909399"], ["same", "完全一致", cnt("same"), "#67c23a"], ["single", "缺少配对报告", cnt("single") + cnt("bad"), "#e6a23c"]]
      .map(([k, l, n, c]) => '<button class="kpi" style="--c:' + c + (v.st === k ? ";box-shadow:0 0 0 2px " + c : "") + '" data-st="' + k + '"><b>' + n + "</b><span>" + l + "</span></button>").join("") + "</div>";

    const cl = clusters(C);
    html += '<div class="card"><h3>差异聚类 <span class="sub">Ignore 报告中相同的“基线 → 本次”变化合并显示，点击只看相关 Case</span>' + (v.cl != null ? '<span class="acts"><button class="btn sm" id="clX">取消聚类筛选</button></span>' : "") + "</h3>" +
      (cl.length ? '<div class="tbl-wrap" style="max-height:260px;overflow-y:auto"><table class="tbl"><thead><tr><th>Case 数</th><th>基线</th><th>本次</th><th></th></tr></thead><tbody>' +
        cl.slice(0, 100).map((x, i) => '<tr class="' + (v.cl === i ? "sel" : "") + '"><td><b>' + x.cases.length + '</b></td><td class="mono clip" style="max-width:420px" title="' + esc(x.l) + '">' + esc(x.l || "（无此行）") + '</td><td class="mono clip" style="max-width:420px" title="' + esc(x.r) + '">' + esc(x.r || "（无此行）") + '</td><td class="ops"><a data-cl="' + i + '">只看这些 Case</a></td></tr>').join("") + "</tbody></table></div>"
        : '<p class="hint" style="margin:0">Ignore 报告中没有差异。</p>') + "</div>";

    let list = items;
    if (v.st) list = list.filter(it => v.st === "single" ? ["single", "bad"].includes(statusOf(it)) : statusOf(it) === v.st);
    if (v.cl != null && cl[v.cl]) list = list.filter(it => cl[v.cl].cases.includes(it.key));
    if (v.q) list = list.filter(it => (it.name + " " + (it.total ? it.total.file : "") + " " + (it.ignore ? it.ignore.file : "")).toLowerCase().includes(v.q.toLowerCase()));
    if (!v.cur || !list.find(it => it.key === v.cur)) v.cur = list[0] ? list[0].key : null;
    const it = v.cur ? C.items[v.cur] : null;

    html += '<div class="cmp"><div class="card" style="padding:12px;margin:0"><input class="inp" id="cQ" style="width:100%;min-width:0;margin-bottom:10px" placeholder="搜索 Case / 文件名" value="' + esc(v.q || "") + '"><div class="clist">' +
      list.map(x => { const s = statusOf(x), st = ST[s]; return '<button class="ci' + (x.key === v.cur ? " on" : "") + '" data-ci="' + esc(x.key) + '"><div><div class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</div><div class="meta">Ignore ' + (x.ignore ? (x.ignore.ok ? x.ignore.nd : "?") : "-") + " 处 · Total " + (x.total ? (x.total.ok ? x.total.nd : "?") : "-") + ' 处</div></div><span class="tag ' + st[1] + '">' + st[0] + "</span></button>"; }).join("") +
      (list.length ? "" : '<div class="empty">没有符合条件的 Case</div>') + '</div><div class="hint" style="margin-top:8px">快捷键 j / k 切换 Case</div></div>';
    html += '<div class="card" style="margin:0;min-width:0" id="cView">' + (it ? viewer(it, v) : A.emptyBlock("请选择 Case")) + "</div></div>";
    root.innerHTML = html;
    bindTop(root);
    $$("[data-st]", root).forEach(b => b.onclick = () => { v.st = v.st === b.dataset.st || !b.dataset.st ? "" : b.dataset.st; A.render(); });
    $$("[data-cl]", root).forEach(a => a.onclick = () => { v.cl = +a.dataset.cl; A.render(); });
    if ($("#clX")) $("#clX").onclick = () => { v.cl = null; A.render(); };
    $$("[data-ci]", root).forEach(b => b.onclick = () => { v.cur = b.dataset.ci; v.open = {}; A.render(); });
    $("#cQ").onchange = e => { v.q = e.target.value.trim(); A.render(); };
    if (it) bindViewer(root, it, v, list);
  };
  function bindTop(root) {
    $("#cTot").onclick = () => $("#cTotIn").click();
    $("#cIgn").onclick = () => $("#cIgnIn").click();
    $("#cDir").onclick = () => $("#cDirIn").click();
    $("#cTotIn").onchange = e => loadFiles(Array.from(e.target.files), "total");
    $("#cIgnIn").onchange = e => loadFiles(Array.from(e.target.files), "ignore");
    $("#cDirIn").onchange = e => loadFiles(Array.from(e.target.files), "total");
    if ($("#cClr")) $("#cClr").onclick = () => { S.cmp = null; A.S.view.compare = {}; A.render(); };
  }

  function viewer(it, v) {
    const has = { ignore: !!it.ignore, total: !!it.total };
    if (!has[v.view]) v.view = has.ignore ? "ignore" : "total";
    const d = it[v.view];
    let h = '<div class="bar" style="margin-bottom:12px"><b style="font-size:14px">' + esc(it.name) + '</b><span class="tag ' + ST[statusOf(it)][1] + '">' + ST[statusOf(it)][0] + '</span><span class="sp"></span>' +
      '<span class="seg"><button data-view="ignore" class="' + (v.view === "ignore" ? "on" : "") + '"' + (has.ignore ? "" : " disabled") + ">过滤版 Ignore" + (it.ignore && it.ignore.ok ? "（" + it.ignore.nd + "）" : "") + '</button><button data-view="total" class="' + (v.view === "total" ? "on" : "") + '"' + (has.total ? "" : " disabled") + ">完整版 Total" + (it.total && it.total.ok ? "（" + it.total.nd + "）" : "") + "</button></span>" +
      '<span class="seg"><button data-mode="diff" class="' + (v.mode === "diff" ? "on" : "") + '">只看差异</button><button data-mode="all" class="' + (v.mode === "all" ? "on" : "") + '">全文</button></span>' +
      '<button class="btn sm" id="cRaw">查看原报告</button><button class="btn sm" id="cCsv">导出差异</button></div>' +
      '<div class="hint" style="margin-bottom:8px;word-break:break-all">' + esc(d.file) + "</div>";
    if (!d.ok) return h + '<div class="empty"><b>无法识别这个报告的格式</b>目前只支持 Python difflib.HtmlDiff 生成的报告。可以点“查看原报告”直接查看。</div>';
    if (!d.nd) h += '<div class="verdict" style="margin-bottom:10px">' + (v.view === "ignore" ? "过滤后没有差异。" + (it.total && it.total.nd ? "完整版中有 " + it.total.nd + " 处差异，都已被过滤规则忽略，可切换到 Total 查看。" : "") : "完整版中没有差异。") + "</div>";
    h += '<div class="dv"><div class="row hd"><div class="no"></div><div class="tx">' + esc(d.from) + '</div><div class="no"></div><div class="tx">' + esc(d.to) + "</div></div>";
    const rows = d.rows, CTX = 2;
    const show = rows.map((r, i) => v.mode === "all" || r.gap || r.note || rows.slice(Math.max(0, i - CTX), i + CTX + 1).some(x => x.chg));
    let i = 0;
    while (i < rows.length) {
      if (!show[i] && !v.open[i]) {
        let j = i; while (j < rows.length && !show[j]) j++;
        h += '<button class="fold" data-fold="' + i + "-" + j + '">⋯ 折叠了 ' + (j - i) + " 行相同内容，点击展开</button>";
        i = j; continue;
      }
      const r = rows[i];
      if (r.gap) h += '<div class="row"><div class="tx" style="grid-column:1/-1;text-align:center;color:#c0c4cc;font-family:var(--sans)">⋯</div></div>';
      else if (r.note) h += '<div class="row"><div class="tx" style="grid-column:1/-1;font-family:var(--sans);color:#909399">' + esc(r.note) + "</div></div>";
      else h += '<div class="row' + (r.chg ? " chg" : "") + '"><div class="no">' + esc(r.ln) + '</div><div class="tx' + (r.ln ? "" : " blank") + '">' + r.lh + '</div><div class="no">' + esc(r.rn) + '</div><div class="tx' + (r.rn ? "" : " blank") + '">' + r.rh + "</div></div>";
      i++;
    }
    h += '</div><div class="hint" style="margin-top:8px"><span class="d_add" style="padding:0 4px">新增</span> <span class="d_chg" style="padding:0 4px">修改</span> <span class="d_sub" style="padding:0 4px">删除</span>　颜色与原报告一致</div>';
    return h;
  }
  function bindViewer(root, it, v, list) {
    $$("[data-view]", root).forEach(b => b.onclick = () => { if (b.disabled) return; v.view = b.dataset.view; v.open = {}; A.render(); });
    $$("[data-mode]", root).forEach(b => b.onclick = () => { v.mode = b.dataset.mode; A.render(); });
    $$("[data-fold]", root).forEach(b => b.onclick = () => { const [a, z] = b.dataset.fold.split("-").map(Number); for (let k = a; k < z; k++) v.open[k] = true; const top = $("#content").scrollTop; A.render(); $("#content").scrollTop = top; });
    $("#cRaw").onclick = () => {
      const d = it[v.view];
      A.dialog("原报告：" + d.file, '<iframe sandbox="" style="width:100%;height:62vh;border:1px solid #ebeef5" id="rawF"></iframe>', [{ t: "关闭" }]);
      $("#dlg").style.width = "min(1100px, 96vw)";
      $("#rawF").srcdoc = d.raw;
    };
    $("#cCsv").onclick = () => {
      const rows = [["Case", "报告类型", "基线行号", "基线内容", "本次行号", "本次内容"]];
      S.cmp.order.forEach(k => { const x = S.cmp.items[k], d = x[v.view]; if (!d || !d.ok) return; d.rows.filter(r => r.chg).forEach(r => rows.push([x.name, v.view, r.ln, r.lt, r.rn, r.rt])); });
      const text = A.toCSV(rows);
      A.dialog("导出差异（" + (v.view === "ignore" ? "过滤版" : "完整版") + "，全部 Case）", "共 " + (rows.length - 1) + " 行差异。", [{ t: "取消" }, { t: "复制内容", fn: () => A.copy(text) }, { t: "下载文件", pri: true, fn: () => A.download("回归差异_" + v.view + ".csv", text, "text/csv;charset=utf-8") }]);
    };
    document.onkeydown = e => {
      if (A.S.view && document.querySelector(".tab.on") && document.querySelector(".tab.on").dataset.tab !== "compare") return;
      if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if (e.key !== "j" && e.key !== "k") return;
      const i = list.findIndex(x => x.key === v.cur), n = i + (e.key === "j" ? 1 : -1);
      if (list[n]) { v.cur = list[n].key; v.open = {}; A.render(); }
    };
  }
})();

</script>
<script>
/* 页面：Jira 起草、提交与导出、Jira 配置。
   一组失败用例（同一分类 + 同一报错特征）= 一张 Jira 单。
   页面负责起草、审核、导出 CSV、生成接口请求；真正写入 Jira 由后端完成（见“流程讲解 → Jira 提报与接口”）。 */
(function () {
  const A = APP, E = ENG, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;

  /* ============================== 配置 ============================== */
  const DEFAULT_CFG = {
    deploy: "cloud", baseUrl: "", project: "ROTQA", issueType: "Bug", issueTypeEnv: "Task",
    system: "NBS", systemField: "", market: "HK", components: "SYSTEM-QA", labels: "regression, auto-triage",
    envMode: "field", titleTpl: "[{system} Regression] {market} - {module} {cases} failed due to {cause}",
    highKeywords: ["issue", "underwriting", "核保", "payment", "支付", "premium", "保费", "amount", "金额", "quotation", "报价"],
    draftCats: ["PRODUCT_DEFECT", "TEST_DATA", "ENVIRONMENT", "SCRIPT_ISSUE", "POPUP_INTERFERENCE", "NEEDS_HUMAN"],
    backendUrl: "", maskOnExport: true, reviewer: "",
  };
  const cfg = () => (S.jira = Object.assign({}, DEFAULT_CFG, S.jira || {}));
  S.drafts = S.drafts || []; S.jiraLog = S.jiraLog || [];

  const SECS = [["s1", "1. 现象"], ["s2", "2. 受影响的用例"], ["s3", "3. 重现步骤"], ["s4", "4. 预期结果"], ["s5", "5. 实际结果"], ["s6", "6. 已做的排查"], ["s7", "7. 测试数据"], ["s8", "8. 推测与待确认"]];
  const FIELD_NAMES = { summary: "Summary 标题", issueType: "Issue Type", priority: "Priority", system: "System", components: "Components", labels: "Labels", assignee: "Assignee", environment: "Environment" };
  const SRC = { 脚本: "blue", AI: "purple", 人工: "orange" };
  const ST = { draft: ["待审核", "orange"], approved: ["已审核", "blue"], submitted: ["已提交", "green"], discarded: ["已放弃", "gray"] };
  const runOf = id => S.runs.find(r => r.id === id) || {};
  const casesOf = d => d.uids.map(u => S.cases.find(c => c.uid === u)).filter(Boolean);
  const base = p => String(p || "").split(/[\\/]/).pop().trim();
  const firstLine = c => (c.error || c.stack || "").split("\n").find(s => s.trim()) || "";
  const most = arr => { const m = {}; arr.filter(Boolean).forEach(x => { m[x] = (m[x] || 0) + 1; }); return Object.keys(m).sort((a, b) => m[b] - m[a])[0] || ""; };
  const now = () => new Date().toLocaleString();

  /* ============================== 起草（脚本部分） ============================== */
  const EXC_EN = {
    NoSuchElementException: "element not found", TimeoutException: "page element wait timeout", StaleElementReferenceException: "stale element reference",
    ElementNotInteractableException: "element not interactable", ElementClickInterceptedException: "click intercepted by another element",
    InvalidSelectorException: "invalid element locator", SessionNotCreatedException: "browser session could not be created",
  };
  function causePhrase(cs) {
    const c = cs[0], a = c.auto, cat = c.final, hit = a.hits[0] || "";
    const words = s => s.replace(/\s+/g, " ").trim().split(" ").slice(0, 12).join(" ");
    if (/^BIZ/.test(a.rule) && hit) {
      const src = [c.pageText, c.alertText, c.error].filter(Boolean).join("\n");
      const line = src.split(/\n/).find(l => l.toLowerCase().includes(hit.toLowerCase())) || hit;
      return { text: words(line).toLowerCase(), sure: true };
    }
    if (cat === "ENVIRONMENT") return { text: "test environment error (" + words(hit || c.exception || "unknown") + ")", sure: !!hit };
    if (cat === "POPUP_INTERFERENCE") return { text: "unexpected popup" + (hit ? ' "' + words(hit) + '"' : ""), sure: !!hit };
    if (cat === "RERUN_PASS") return { text: "intermittent failure (passed on rerun)", sure: true };
    if (EXC_EN[c.exception]) return { text: EXC_EN[c.exception] + (c.module ? " on " + c.module : ""), sure: false };
    if (/^AST/.test(a.rule)) return { text: "assertion failed - " + words(firstLine(c).replace(/^[\w.]*(Error|Exception|Failure)\s*:?\s*/, "")), sure: false };
    return { text: "待确认原因", sure: false };
  }
  function priorityOf(cs, d) {
    const c = cs[0], cat = c.final, k = cfg().highKeywords;
    const runFailed = S.cases.filter(x => x.failed && x.run === d.run).length;
    if (cs.length >= 10) return { v: "High", why: "同一组影响用例 ≥ 10 个" };
    if (cat === "ENVIRONMENT" && cs.length * 2 >= runFailed) return { v: "High", why: "环境问题影响本次一半以上失败用例" };
    if (cat === "PRODUCT_DEFECT") {
      const txt = cs.map(x => [x.name, x.module, x.error].join(" ")).join(" ").toLowerCase();
      const kw = k.find(w => txt.includes(w.toLowerCase()));
      return kw ? { v: "High", why: "产品缺陷，涉及“" + kw + "”（出单/核保/支付/金额类）" } : { v: "Medium", why: "其他产品缺陷" };
    }
    if (["TEST_DATA", "SCRIPT_ISSUE", "POPUP_INTERFERENCE", "RERUN_PASS"].includes(cat)) return { v: "Low", why: "测试数据 / 脚本 / 弹窗类问题" };
    return { v: "Medium", why: "默认" };
  }
  function shotNames(cs) { return Array.from(new Set(cs.map(c => (c.shots && c.shots[0] && base(c.shots[0].name)) || base((c.screenshot || "").split(";")[0])).filter(Boolean))); }

  function scriptFields(d) {
    const C = cfg(), cs = casesOf(d), r = runOf(d.run), c0 = cs[0];
    if (!c0) return {};
    const mod = most(cs.map(c => c.module)) || "Regression";
    const cause = causePhrase(cs);
    const summary = C.titleTpl.replace("{system}", C.system).replace("{market}", C.market).replace("{module}", mod)
      .replace("{cases}", cs.length > 1 ? "cases" : "case").replace("{n}", cs.length).replace("{cause}", cause.text);
    const pr = priorityOf(cs, d);
    const starts = cs.map(c => c.start).filter(Boolean).sort();
    const environment = ["Environment: " + (r.env || "待补充"), "Device / Browser: " + (Array.from(new Set(cs.map(c => c.device).filter(Boolean))).join(", ") || r.device || "待补充"),
      "Run: " + (r.name || "-"), "Test plan: " + (r.plan || "-"), "Executed at: " + (starts[0] || r.at || "-") + " (UTC+8)"].join("\n");
    const shots = shotNames(cs);
    const table = "|| 用例编号 || 用例名称 || 截图 ||\n" + cs.slice(0, 20).map(c => {
      const s = (c.shots && c.shots[0] && base(c.shots[0].name)) || base((c.screenshot || "").split(";")[0]);
      return "| " + c.id + " | " + (c.name || "-").replace(/\|/g, "/") + " | " + (s ? "!" + s + "|thumbnail!" : "-") + " |";
    }).join("\n") + (cs.length > 20 ? "\n其余 " + (cs.length - 20) + " 个用例见附件 affected_cases.csv" : "");
    const err = (c0.pageText || c0.alertText) ? (c0.pageText || c0.alertText) + "\n" + firstLine(c0) : (c0.error || c0.stack || "").slice(0, 800);
    const checks = [];
    const rr = cs.filter(c => c.rerun), rp = rr.filter(c => c.rerun === "pass").length;
    if (rr.length) checks.push("* 已重跑 " + rr.length + " 个用例：" + rp + " 个通过，" + (rr.length - rp) + " 个仍失败");
    Array.from(new Set(cs.filter(c => c.dataCheck).map(c => E.DATA_CHECK[c.dataCheck] + (c.dataNote ? "（" + c.dataNote + "）" : "")))).forEach(t => checks.push("* 数据核查：" + t));
    Array.from(new Set(cs.filter(c => c.override).map(c => c.override.reason))).forEach(t => checks.push("* 人工复核：" + t));
    const a = c0.auto;
    return {
      summary, issueType: c0.final === "ENVIRONMENT" ? C.issueTypeEnv : C.issueType, priority: pr.v, system: C.system, components: C.components,
      labels: C.labels, assignee: "", environment,
      s1: "执行 " + mod + " 用例时失败" + (c0.exception ? "（" + c0.exception + "）" : "") + "，报错：{{" + firstLine(c0).slice(0, 200).replace(/[{}]/g, "") + "}}",
      s2: "共 " + cs.length + " 个\n" + table,
      s3: "待补充：请从平台复制用例步骤",
      s4: "待补充：根据用例描述或断言中的期望值",
      s5: "{noformat}\n" + err.slice(0, 1200) + "\n{noformat}",
      s6: checks.join("\n") || "待补充：尚未做额外排查（重跑、数据核查）",
      s7: "待补充：只写业务编码（Agent code、Product code、Policy no.），不写姓名、证件号、手机号",
      s8: "* 推测（规则初步分类：" + E.CATS[c0.final].name + "，" + (c0.override ? "人工确认" : a.rule) + "）：" + a.why.join("；") + (a.need.length ? "\n" + a.need.map(n => "* 待确认：" + n).join("\n") : ""),
      _priorityWhy: pr.why, _causeSure: cause.sure, _attach: shots.concat(cs.length > 20 ? ["affected_cases.csv"] : []),
    };
  }
  function newDraft(run, cat, sig, uids) {
    const d = { id: "D" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), run, cat, sig, uids, status: "draft", mode: "create", target: "", f: {}, src: {}, created: now(), history: [] };
    applyScript(d, true);
    return d;
  }
  // 只覆盖仍是“脚本”来源的字段，人工/AI 改过的保留
  function applyScript(d, all) {
    const sf = scriptFields(d);
    Object.keys(FIELD_NAMES).concat(SECS.map(s => s[0])).forEach(k => { if (all || !d.src[k] || d.src[k] === "脚本") { d.f[k] = sf[k] || ""; d.src[k] = "脚本"; } });
    d.meta = { priorityWhy: sf._priorityWhy, causeSure: sf._causeSure, attach: sf._attach };
  }
  const wiki = d => {
    const C = cfg();
    return (C.envMode === "description" ? "h3. Environment\n{noformat}\n" + d.f.environment + "\n{noformat}\n\n" : "") +
      SECS.map(([k, n]) => "h3. " + (k === "s2" ? n + "（共 " + casesOf(d).length + " 个）" : n) + "\n" + (k === "s2" ? d.f.s2.replace(/^共 \d+ 个\n/, "") : d.f[k])).join("\n\n");
  };

  /* ============================== 校验 ============================== */
  function validate(d) {
    const errs = [], warns = [], cs = casesOf(d);
    if (!cs.length) errs.push("这张单没有用例");
    if (!d.f.summary.trim()) errs.push("标题为空");
    if (/\{(system|market|module|cases|cause|n)\}/.test(d.f.summary)) errs.push("标题里还有未替换的占位符");
    if (d.f.summary.length > 255) errs.push("标题超过 255 个字符（" + d.f.summary.length + "）");
    if (/待确认原因/.test(d.f.summary)) errs.push("标题中的原因还是“待确认原因”，请写明原因");
    if (d.mode === "comment" && !/^[A-Z][A-Z0-9]+-\d+$/.test(d.target.trim())) errs.push("追加评论需要填写正确的单号，例如 ROTQA-5339");
    const txt = [d.f.summary, d.f.environment].concat(SECS.map(s => d.f[s[0]])).join("\n");
    if (E.mask(txt) !== txt) errs.push("内容中有疑似个人信息（证件号、手机号、邮箱、卡号）");
    const sus = cs.filter(c => !c.override && c.auto.status === "suspected");
    if (sus.length && !d.ack) warns.push({ k: "sus", t: sus.length + " 个用例的分类仍是“待复核”：" + sus.slice(0, 6).map(c => c.id).join("、") + (sus.length > 6 ? "…" : "") });
    if (d.meta && !d.meta.causeSure && d.src.summary === "脚本") warns.push({ t: "标题中的原因由异常类型推出，不一定是真正原因，请对照证据修改" });
    const todo = SECS.filter(s => /待补充/.test(d.f[s[0]])).map(s => s[1]);
    if (todo.length) warns.push({ t: "以下小节还是“待补充”：" + todo.join("、") });
    const dup = dupOf(d);
    if (dup && d.mode === "create") warns.push({ t: "可能重复：" + dup.text + "。建议改为“追加评论到已有单”" });
    if (!d.f.assignee) warns.push({ t: "没有填写 Assignee（经办人），提交后需在 Jira 里指派" });
    return { errs, warns, ok: !errs.length && !warns.some(w => w.k === "sus") };
  }
  // 本地查重：之前提交过、报错特征相同的单
  function dupOf(d) {
    const hit = S.drafts.find(x => x !== d && x.status === "submitted" && x.issueKey && x.sig === d.sig && x.cat === d.cat);
    if (hit) return { key: hit.issueKey, text: "之前提交的 " + hit.issueKey + " 报错特征相同" };
    const same = S.drafts.find(x => x !== d && x.status !== "discarded" && x.status !== "submitted" && x.sig === d.sig && x.cat === d.cat);
    if (same) return { key: "", text: "另一张草稿（" + runOf(same.run).name + "）报错特征相同，可以合并" };
    return null;
  }

  /* ============================== Jira 起草 ============================== */
  A.PAGES.jira = function (root, v) {
    cfg();
    if (!S.runs.length) { root.innerHTML = '<div class="card">' + A.emptyBlock("还没有导入数据", "先导入执行结果，完成失败分诊，再来起草 Jira。", '<button class="btn pri" data-go="import">去导入</button>') + "</div>"; A.bindGo(root); return; }
    v.run = v.run || S.runs[S.runs.length - 1].id; v.st = v.st || "open";
    const used = new Set(); S.drafts.filter(d => d.status !== "discarded").forEach(d => d.uids.forEach(u => used.add(u)));
    const avail = S.cases.filter(c => c.failed && c.run === v.run && !used.has(c.uid) && cfg().draftCats.includes(c.final));
    const availGroups = {}; avail.forEach(c => { const k = c.final + "|" + c.sig; (availGroups[k] = availGroups[k] || []).push(c); });
    const nG = Object.keys(availGroups).length;
    const drafts = S.drafts.filter(d => d.run === v.run && (v.st === "all" || (v.st === "open" ? ["draft", "approved"].includes(d.status) : d.status === v.st)));
    if (!v.cur || !drafts.find(d => d.id === v.cur)) v.cur = drafts[0] ? drafts[0].id : null;
    v.msel = v.msel || [];

    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span><select class="sel" id="jRun">' + S.runs.map(r => '<option value="' + r.id + '"' + (r.id === v.run ? " selected" : "") + ">" + esc(r.name) + "</option>").join("") + "</select></label>" +
      '<span class="hint">可起草的失败用例 <b style="color:#303133">' + avail.length + "</b> 条，可分为 <b style=\"color:#303133\">" + nG + '</b> 组（一组 = 一张 Jira 单）</span><span style="flex:1"></span>' +
      '<button class="btn" id="jCats">起草范围</button><button class="btn pri" id="jGen"' + (nG ? "" : " disabled") + ">为 " + nG + " 组起草</button></div>" +
      '<p class="hint" style="margin:10px 0 0">分组规则与“原因分组”页相同：最终分类相同、报错特征相同的用例合并成一张单。标题、环境、受影响用例、实际结果、已做排查由页面根据分诊结果填写；现象、预期结果、推测可以复制材料给 AI 补写；重现步骤和测试数据需要你补充。每张单都要审核后才能导出或提交。</p></div>';

    html += '<div class="cmp" style="grid-template-columns:330px minmax(0,1fr)"><div class="card" style="padding:12px;margin:0">' +
      '<div class="subtabs" style="margin-bottom:8px">' + [["open", "进行中"], ["submitted", "已提交"], ["discarded", "已放弃"], ["all", "全部"]].map(([k, n]) => '<button data-jst="' + k + '" class="' + (v.st === k ? "on" : "") + '">' + n + "</button>").join("") + "</div>" +
      '<div class="bar" style="margin-bottom:8px"><span class="hint">勾选多张可合并</span><span class="sp"></span><button class="btn sm" id="jMerge"' + (v.msel.length > 1 ? "" : " disabled") + ">合并" + (v.msel.length > 1 ? "（" + v.msel.length + "）" : "") + "</button></div>" +
      '<div class="clist">' + (drafts.length ? drafts.map(d => {
        const cs = casesOf(d), val = validate(d);
        return '<div class="ci' + (d.id === v.cur ? " on" : "") + '" style="cursor:pointer" data-jd="' + d.id + '"><div style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" data-jm="' + d.id + '"' + (v.msel.includes(d.id) ? " checked" : "") + ' style="margin-top:3px"><div style="min-width:0"><div class="nm" style="white-space:normal;line-height:1.45">' + esc(d.f.summary) + '</div><div class="meta" style="margin-top:4px">' + A.catTag(cs[0] ? cs[0].final : d.cat) + " " + cs.length + " 个用例 · " + esc(d.f.priority) + (d.mode === "comment" ? " · 追加到 " + esc(d.target) : "") + (d.issueKey ? " · " + esc(d.issueKey) : "") +
          '</div></div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="tag ' + ST[d.status][1] + '">' + ST[d.status][0] + "</span>" + (d.status === "draft" && val.errs.length ? '<span class="tag red">' + val.errs.length + " 个问题</span>" : "") + "</div></div>";
      }).join("") : '<div class="empty">' + (nG ? "点击上方“为 " + nG + " 组起草”" : "没有草稿") + "</div>") + "</div></div>";
    const d = v.cur ? S.drafts.find(x => x.id === v.cur) : null;
    html += '<div class="card" style="margin:0;min-width:0" id="jForm">' + (d ? form(d, v) : A.emptyBlock("请选择左侧的草稿")) + "</div></div>";
    root.innerHTML = html;

    $("#jRun").onchange = e => { v.run = e.target.value; v.cur = null; v.msel = []; A.render(); };
    $("#jCats").onclick = catsDialog;
    $("#jGen").onclick = () => {
      Object.values(availGroups).forEach(cs => S.drafts.push(newDraft(v.run, cs[0].final, cs[0].sig, cs.map(c => c.uid))));
      A.save(); v.st = "open"; A.render(); A.toast("已起草 " + nG + " 张");
    };
    $$("[data-jst]", root).forEach(b => b.onclick = () => { v.st = b.dataset.jst; v.cur = null; A.render(); });
    $$("[data-jd]", root).forEach(el => el.onclick = e => { if (e.target.dataset.jm) return; v.cur = el.dataset.jd; v.tab = "edit"; A.render(); });

  function bindForm(root, d, v) {

  /* ---------- 预览（简单渲染 Jira wiki 格式） ---------- */
  function renderWiki(t) {
    const out = []; let list = null, table = false, inNo = false, pre = [];
    const thumbs = [];
    const inline = s => esc(s).replace(/\{\{(.+?)\}\}/g, "<code>$1</code>").replace(/\u0001(\d+)\u0001/g, (_, i) => '<span class="tag gray">截图 ' + esc(thumbs[+i]) + "</span>").replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } if (table) { out.push("</table>"); table = false; } };
    t.split("\n").forEach(l => {
      if (l.trim() === "{noformat}") { if (inNo) { out.push('<pre style="background:#f5f7fa;padding:8px;font-size:11.5px;white-space:pre-wrap">' + esc(pre.join("\n")) + "</pre>"); pre = []; } else close(); inNo = !inNo; return; }
      if (inNo) { pre.push(l); return; }
      l = l.replace(/!([^!|]+)\|thumbnail!/g, (_, n) => { thumbs.push(n); return "\u0001" + (thumbs.length - 1) + "\u0001"; });
      let m;
      if ((m = /^h(\d)\.\s*(.*)/.exec(l))) { close(); out.push('<h4 style="margin:14px 0 6px;font-size:14px">' + inline(m[2]) + "</h4>"); }
      else if (/^\|/.test(l)) {
        if (list) { out.push("</" + list + ">"); list = null; }
        if (!table) { out.push('<table class="tbl" style="margin:4px 0">'); table = true; }
        const th = /^\|\|/.test(l), cells = l.split(th ? "||" : "|").slice(1, -1);
        out.push("<tr>" + cells.map(c => (th ? "<th>" : "<td>") + inline(c.trim()) + (th ? "</th>" : "</td>")).join("") + "</tr>");
      }
      else if ((m = /^([#*])\s+(.*)/.exec(l))) { const tg = m[1] === "#" ? "ol" : "ul"; if (table) { out.push("</table>"); table = false; } if (list !== tg) { if (list) out.push("</" + list + ">"); out.push("<" + tg + ' style="margin:4px 0;padding-left:20px">'); list = tg; } out.push("<li>" + inline(m[2]) + "</li>"); }
      else { close(); if (l.trim()) out.push('<p style="margin:4px 0">' + inline(l) + "</p>"); }
    });
    if (inNo && pre.length) out.push("<pre>" + esc(pre.join("\n")) + "</pre>");
    close();
    return out.join("");
  }
  function preview(d) {
    const C = cfg();
    return '<div style="border:1px solid #ebeef5;border-radius:4px;padding:16px"><div class="hint">' + esc(C.project) + " / " + esc(d.f.issueType) + (d.mode === "comment" ? " · 追加评论到 " + esc(d.target) : "") + '</div><h3 style="margin:4px 0 12px;font-size:17px">' + esc(d.f.summary) + "</h3>" +

      (C.envMode === "field" ? '<dt>Environment</dt><dd style="white-space:pre-wrap">' + esc(d.f.environment) + "</dd>" : "") + "</dl>" + renderWiki(wiki(d)) + "</div>";

  /* ---------- AI 起草材料 ---------- */
  function aiPrompt(d) {
    const cs = casesOf(d);
    const s = "你是测试缺陷单起草助手。请根据下面的证据，为这张 Jira 单补写内容。要求：\n" +
      "1. 只能使用给出的证据，不能编造步骤、数据或原因；证据不足的地方写“待补充：缺什么”；\n" +
      "2. 现象、实际结果引用报错原文，不要改写；\n" +
      "3. 所有推测写在“推测与待确认”里，并标明“推测”；\n" +
      "4. 标题原因用英文短语，不超过 12 个单词，必须来自证据；\n" +
      "5. 严格按下面的格式输出，每个【】标记单独一行，不要输出其他内容：\n" +
      "【标题原因】\n【1. 现象】\n【4. 预期结果】\n【8. 推测与待确认】\n\n" +
      "========== 当前草稿 ==========\n标题：" + d.f.summary + "\n分类：" + E.CATS[cs[0].final].name + "\n" + SECS.map(([k, n]) => n + "：\n" + d.f[k]).join("\n\n") +
      "\n\n========== 用例证据（最多 5 个） ==========\n" + cs.slice(0, 5).map(c => "用例 " + c.id + " " + (c.name || "") + "\n" + c.auto.ev.filter(e => e.kind !== "shot").map(e => e.id + " " + e.label + "：" + (e.text.length > 1200 ? e.text.slice(0, 1200) + "…（已截断）" : e.text)).join("\n")).join("\n\n");
    return E.mask(s);
  }
  function pasteDialog(d, v) {
    A.dialog("粘贴 AI 结果", '<p class="hint" style="margin-top:0">把 AI 按格式返回的内容整段粘贴进来，页面会按【】标记填到对应字段，来源标为“AI”。填好后请逐项核对。</p><textarea class="ta" id="jAiIn" rows="14"></textarea>',
      [{ t: "取消" }, { t: "填入", pri: true, fn: () => {
        const t = $("#jAiIn").value; const parts = {}; let cur = null;
        t.split("\n").forEach(l => { const m = /^\s*【(.+?)】\s*(.*)$/.exec(l); if (m) { cur = m[1].trim(); parts[cur] = m[2] ? [m[2]] : []; } else if (cur) parts[cur].push(l); });
        const get = k => (parts[k] || []).join("\n").trim();
        let n = 0;

          // 只替换标题中的原因部分，前缀（系统、市场、模块）保持不变

          put("summary", at > 0 ? d.f.summary.slice(0, at + 8) + cause : cfg().titleTpl.replace("{system}", d.f.system).replace("{market}", cfg().market).replace("{module}", most(casesOf(d).map(c => c.module)) || "Regression").replace("{cases}", d.uids.length > 1 ? "cases" : "case").replace("{n}", d.uids.length).replace("{cause}", cause));
        }
        put("s1", get("1. 现象")); put("s4", get("4. 预期结果")); put("s8", get("8. 推测与待确认"));
        if (!n) { A.toast("没有识别到【】标记，请确认 AI 按格式输出", true); return false; }
        if (d.status === "approved") d.status = "draft";
        d.history.push(now() + " 填入 AI 结果（" + n + " 项）"); A.save(); A.render(); A.toast("已填入 " + n + " 项，请核对");
      } }]);
