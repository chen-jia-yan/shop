    if ($("#dSave")) $("#dSave").onclick = () => { const before = c.final; c.dataCheck = $("#dData").value || null; c.dataNote = $("#dNote").value.trim(); reopen("核查结果已保存", before); };
    if ($("#dRerun")) $("#dRerun").onchange = e => { c.rerun = e.target.value || null; c.rerunNote = c.rerun ? "手工填写 " + new Date().toLocaleString() : ""; if (c.rerun) { c.rerunReq = null; c.r2 = c.r2 || { same: c.rerun === "fail" ? true : null }; } else delete c.r2; reopen("重跑结果已保存"); };
  }
  A.openCase = openCase;

  /* ---------- 复核材料：只有用例的判断和证据，不带提示词 ---------- */
  function aiMaterial(list) {
    return E.mask(list.map(c => {
      const a = c.auto;
      let s = "用例 " + c.id + (c.parent ? "（重跑第2次）" : "") + (c.name ? "  " + c.name : "") + "\n初步结论：" + E.CATS[c.final].name + "（" + (c.override ? "人工已改" : a.status === "confirmed" ? "规则确认" : "待复核") + " · " + E.ruleName(c) + "）\n判断依据：" + a.brief + "\n" +
        (a.why.length ? "详细依据：\n" + a.why.map(w => "  - " + w).join("\n") + "\n" : "") + (a.need.length ? "还需确认：\n" + a.need.map(w => "  - " + w).join("\n") + "\n" : "") + "证据：\n";
      a.ev.forEach(e => { let t = e.text; if (e.kind === "stack" && t.length > 1500) t = t.slice(0, 1500) + "\n…（已截断）"; s += "  " + e.id + " " + e.label + "：" + (t.indexOf("\n") >= 0 ? "\n" + t.split("\n").map(l => "    " + l).join("\n") : t) + "\n"; });
      return s;
    }).join("\n----------\n\n"));
  }

  /* ---------- 导出 ---------- */
  function exportDialog(list) {
    A.dialog("导出 CSV", '<p style="margin-top:0">导出当前筛选结果，共 ' + list.length + " 条。Excel 可直接打开。</p>" +
      '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="exMask" checked>导出时脱敏个人信息（证件号、手机号、邮箱、卡号）</label>',
      [{ t: "取消" }, { t: "复制内容", fn: () => { A.copy(csvOf(list, $("#exMask").checked)); } }, { t: "下载文件", pri: true, fn: () => { A.download("失败分诊_" + new Date().toISOString().slice(0, 10) + ".csv", csvOf(list, $("#exMask").checked), "text/csv;charset=utf-8"); } }]);
  }
  const rerunText = c => c.rerun === "pass" ? "重跑通过" : c.rerun === "fail" ? (c.r2 && c.r2.same === false ? "重跑失败（报错不同）" : "重跑失败（同一问题）") : "";
  function csvOf(list, doMask) {
    const m = s => doMask ? E.mask(s) : s;
    const rows = [["批次", "用例编号", "用例名称", "执行次数", "分类", "处理方", "判断依据", "判定状态", "命中规则", "重跑建议", "重跑结果", "详细依据", "还需确认", "自动分类", "人工分类", "修改原因", "人工核查", "截图观察", "备注", "报错首行", "原因"]];
    list.forEach(c => rows.push([runName(c.run), c.id, c.name, c.parent ? "重跑第2次" : "第1次", E.CATS[c.final].name, E.CATS[c.final].owner, m(c.auto.brief), c.override ? "人工已改" : c.auto.status === "confirmed" ? "规则确认" : "待复核", E.ruleName(c),
      c.plan ? E.PLAN[c.plan.b][0] : "", rerunText(c), m(c.auto.why.join("；")), c.auto.need.join("；"), E.CATS[c.auto.cat].name, c.override ? E.CATS[c.override.cat].name : "", c.override ? m(c.override.reason) : "",
      c.dataCheck ? E.DATA_CHECK[c.dataCheck] : "", c.obs ? [c.obs.kind ? E.OBS_KINDS[c.obs.kind] : "", c.obs.text].filter(Boolean).join("：") : "", m(c.dataNote || c.rerunNote || ""), m(firstLine(c)), causeName(c)]));
    return A.toCSV(rows);
  }

  /* ============================== ② 重跑 ============================== */
  const BK = [["go", "建议立即重跑"], ["fix", "处理后再重跑"], ["no", "不需要重跑"], ["done", "已重跑"]];
  function rerunPage(root, v) {
    if (!S.runs.length) return noData(root);
    v.run = S.runs.find(r => r.id === v.run) ? v.run : S.runs[S.runs.length - 1].id; v.tab = v.tab || "all";
    const fs = S.cases.filter(c => c.failed && c.run === v.run).sort((a, b) => a.seq - b.seq || (a.parent ? 1 : -1));
    if (!v.sel) v.sel = fs.filter(c => c.plan.b === "go").map(c => c.uid);
    v.sel = v.sel.filter(u => fs.some(c => c.uid === u && !c.parent && !c.rerun));
    const cnt = k => fs.filter(c => c.plan.b === k).length;
    const shown = fs.filter(c => v.tab === "all" || c.plan.b === v.tab);
    const sent = fs.filter(c => c.rerunReq && !c.rerun && !c.parent);
    const done = fs.filter(c => c.rerun), pass = done.filter(c => c.rerun === "pass").length;
    const C = S.jira || {};
    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("rRun", v.run) + '</label><span class="hint">先按根本原因分析，再按下面的标准判断要不要重跑。本批：建议立即重跑 ' + cnt("go") + "，处理后再重跑 " + cnt("fix") + "，不需要重跑 " + cnt("no") + "，已重跑 " + cnt("done") + (done.length ? "（通过 " + pass + "）" : "") + (sent.length ? "；已提交重跑、等待结果 " + sent.length + " 条" : "") + "</span></div>" +
      '<details class="std"' + (v.stdOpen ? " open" : "") + '><summary>重跑标准（点击展开）</summary><table class="tbl mini"><thead><tr><th style="width:110px">建议</th><th>适用情况</th><th>为什么</th></tr></thead><tbody>' +
      '<tr><td><span class="tag blue">建议立即重跑</span></td><td>环境问题（环境恢复后）、紧挨环境中断起点、弹窗干扰、找不到窗口或元素、控件不可见、断言不一致、截图中停在别的页面、有前面用例残留的窗口</td><td>可能是偶发，重跑一次就能区分偶发和必现</td></tr>' +
      '<tr><td><span class="tag orange">处理后再重跑</span></td><td>还没核查的业务报错、数据被占用、缺少配置、测试数据问题、脚本问题、真实原因被掩盖、证据不足</td><td>不先处理，重跑结果不会变</td></tr>' +
      '<tr><td><span class="tag gray">不需要重跑</span></td><td>已确认的产品问题（直接提 Jira）、重跑产生的第2次记录</td><td>结论已经明确</td></tr></tbody></table>' +
      '<p class="hint" style="margin:6px 0 0">重跑结果不改变分类：通过 → 偶发，不提单；失败且同一问题 → 问题必现，两次情况写进同一张 Jira；失败但报错不同 → 第2次单独成一条，单独分析、单独提单。</p></details></div>';
    html += '<div class="card"><div class="bar"><div class="chips"><button data-rt="all" class="' + (v.tab === "all" ? "on" : "") + '">全部 ' + fs.length + "</button>" + BK.map(([k, n]) => '<button data-rt="' + k + '" class="' + (v.tab === k ? "on" : "") + '">' + n + " " + cnt(k) + "</button>").join("") + '</div><span class="sp"></span>' +
      '<span class="hint">重跑名单 ' + v.sel.length + ' 条</span><button class="btn sm" id="rPickGo">勾选“建议立即重跑”</button><button class="btn sm" id="rClear">清空</button><button class="btn sm" id="rCopy">复制用例编号</button><button class="btn sm" id="rImp">导入重跑结果</button><button class="btn sm pri" id="rRun1"' + (v.sel.length ? "" : " disabled") + ">一键重跑（" + v.sel.length + "）</button></div>" +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="ck"><input type="checkbox" id="rAll"></th><th>用例</th><th>名称</th><th>分类</th><th>判断依据</th><th>重跑建议</th><th>理由</th><th>重跑结果</th></tr></thead><tbody>' +
      shown.map(c => {
        const can = !c.parent && !c.rerun;
        return '<tr class="' + (isSel(v, c.uid) ? "sel" : "") + '"><td class="ck">' + (can ? '<input type="checkbox" data-rs="' + c.uid + '"' + (isSel(v, c.uid) ? " checked" : "") + ">" : "") + '</td><td class="mono nw"><a data-open="' + c.uid + '">' + A.caseLabel(c) + '</a></td><td class="nm">' + esc(c.name) + "</td><td>" + A.catTag(c.final) + '</td><td class="basis">' + esc(c.auto.brief) + '</td><td class="nw">' + A.planTag(c) + (c.rerunReq && can ? '<div class="hint">已提交 ' + esc(String(c.rerunReq).slice(0, 16)) + "</div>" : "") + '</td><td class="hint">' + esc(c.plan.why) + "</td>" +
          "<td>" + (c.parent ? "-" : '<select class="sel xs" data-rr="' + c.uid + '"><option value="">未重跑</option><option value="pass"' + (c.rerun === "pass" ? " selected" : "") + '>通过</option><option value="fail"' + (c.rerun === "fail" ? " selected" : "") + ">仍失败</option></select>") + "</td></tr>";
      }).join("") + "</tbody></table></div>" + (shown.length ? "" : A.emptyBlock("这一类没有用例")) + "</div>";
    root.innerHTML = html;
    $("details.std", root).ontoggle = e => { v.stdOpen = e.target.open; };
    $("#rRun").onchange = e => { v.run = e.target.value; v.sel = null; A.render(); };
    $$("[data-rt]", root).forEach(b => b.onclick = () => { v.tab = b.dataset.rt; A.render(); });
    $$("[data-rs]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.rs; v.sel = cb.checked ? v.sel.concat(u) : v.sel.filter(x => x !== u); A.render(); });
    $("#rAll").onchange = e => { const ids = shown.filter(c => !c.parent && !c.rerun).map(c => c.uid); v.sel = e.target.checked ? Array.from(new Set(v.sel.concat(ids))) : v.sel.filter(x => !ids.includes(x)); A.render(); };
    $("#rPickGo").onclick = () => { v.sel = Array.from(new Set(v.sel.concat(fs.filter(c => c.plan.b === "go").map(c => c.uid)))); A.render(); };
    $("#rClear").onclick = () => { v.sel = []; A.render(); };
    $$("[data-rr]", root).forEach(s => s.onchange = () => {
      const c = S.cases.find(x => x.uid === s.dataset.rr);
      c.rerun = s.value || null; c.rerunNote = s.value ? "手工填写 " + new Date().toLocaleString() : "";
      if (c.rerun) { c.rerunReq = null; c.r2 = c.r2 || { same: c.rerun === "fail" ? true : null }; } else delete c.r2;
      A.reclassify(); A.save(); A.render(); A.toast("已保存");
    });
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    const picked = () => S.cases.filter(c => v.sel.includes(c.uid));
    $("#rCopy").onclick = () => { if (!v.sel.length) return A.toast("请先勾选用例", true); A.copy(picked().map(c => c.id).join("\n")); };
    $("#rImp").onclick = () => A.go("import", { info: { name: "", plan: "", device: "", env: "", mode: "rerun", rerunOf: v.run } });
    $("#rRun1").onclick = () => {
      const cs = picked(), fixN = cs.filter(c => c.plan.b === "fix").length, url = (C.rerunUrl || "").trim();
      A.dialog("一键重跑（" + cs.length + " 条）",
        (fixN ? '<p style="margin-top:0" class="orange">其中 ' + fixN + " 条属于“处理后再重跑”，请确认已经处理（核查、换数据、修脚本等），否则重跑多半仍会失败。</p>" : "") +
        '<p class="hint" style="margin-top:0">' + cs.map(c => esc(c.id)).join("、") + "</p>" +
        (url ? "<p>将发送到重跑接口：<code>" + esc(url) + "</code>（批次 " + esc(runName(v.run)) + "）。</p>" : "<p>还没有配置重跑接口（在“配置 → Jira 与接口”填写）。现在会复制用例编号，请粘贴到 SmartAutoTest 平台发起重跑。</p>") +
        '<p class="hint">重跑完成后点“导入重跑结果”，页面会自动对比两次报错。</p>',
        [{ t: "取消" }, { t: url ? "确认并发送" : "确认并复制编号", pri: true, fn: () => {
          const at = new Date().toLocaleString();
          const mark = () => { cs.forEach(c => { c.rerunReq = at; }); A.save(); A.render(); };
          if (!url) { A.copy(cs.map(c => c.id).join("\n")); mark(); return; }
          fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ run: runName(v.run), cases: cs.map(c => c.id) }) })
            .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); mark(); A.toast("已提交重跑 " + cs.length + " 条"); })
            .catch(e => { A.copy(cs.map(c => c.id).join("\n")); A.toast("重跑接口调用失败（" + e.message + "），已改为复制用例编号", true); });
        } }]);
    };
  }

  /* ============================== ③ 分派 ============================== */
  // 清单标准：一行一个用例；同一原因排在一起；“需要做什么”写清楚下一步。复制为表格，可直接粘贴到邮件 / Teams / Excel
  const PACK_COLS = ["序号", "用例编号", "用例名称", "分类", "原因", "判断依据", "需要做什么", "重跑", "截图"];
  function packRows(d, scope) {
    const cs = scope.filter(c => d.cats.includes(c.final) && c.rerun !== "pass");
    const rows = [];
    CAT_ORDER.filter(k => d.cats.includes(k)).forEach(k => causesOf(cs.filter(c => c.final === k)).forEach(x => x.cs.forEach(c => rows.push([
      rows.length + 1, c.id + (c.parent ? "（第2次）" : ""), c.name || "", E.CATS[c.final].name, E.ruleName(c), c.auto.brief, c.auto.need[0] || NEXT[c.final], c.rerun ? rerunText(c) : c.plan ? E.PLAN[c.plan.b][0] : "", (c.shots || []).length ? "有（" + c.shots.length + "）" : c.screenshot ? "见报告" : "无"]))));
    return rows.map(r => r.map(x => E.mask(String(x))));
  }
  function packHtml(title, rows) {
    const td = "border:1px solid #c8ccd2;padding:4px 6px;vertical-align:top;";
    return '<p style="font-family:Arial,Microsoft YaHei;font-size:12px;margin:0 0 6px"><b>' + esc(title) + '</b></p><table style="border-collapse:collapse;font-family:Arial,Microsoft YaHei;font-size:12px"><tr>' + PACK_COLS.map(h => '<th style="' + td + 'background:#eef1f5;text-align:left">' + h + "</th>").join("") + "</tr>" +
      rows.map(r => "<tr>" + r.map(x => '<td style="' + td + '">' + esc(x) + "</td>").join("") + "</tr>").join("") + "</table>";
  }
  function dispatchPage(root, v) {
    if (!S.runs.length) return noData(root);
    v.run = S.runs.find(r => r.id === v.run) ? v.run : S.runs[S.runs.length - 1].id;
    v.who = v.who || "dev";
    const scope = S.cases.filter(c => c.failed && c.run === v.run);
    const skip = scope.filter(c => c.rerun === "pass").length;
    const d = DISPATCH.find(x => x.k === v.who), rows = packRows(d, scope);
    const title = "【" + d.name + "】" + runName(v.run) + "：共 " + rows.length + " 条（" + d.cats.map(k => E.CATS[k].name + " " + rows.filter(r => r[3] === E.CATS[k].name).length).filter(s => !/ 0$/.test(s)).join("，") + "）";
    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("dRun", v.run) + '</label><span class="hint">按处理方打包本批的失败用例。重跑已通过的 ' + skip + " 条是偶发，不列入清单。</span></div></div>";
    html += '<div class="dispatch">' + DISPATCH.map(x => {
      const cs = scope.filter(c => x.cats.includes(c.final) && c.rerun !== "pass");
      return '<button class="dp' + (x.k === v.who ? " on" : "") + (cs.length ? "" : " zero") + '" data-who="' + x.k + '"><div class="dp-h"><b>' + x.name + '</b><span class="num">' + cs.length + '</span></div><div class="hint">' + x.cats.map(k => E.CATS[k].name + " " + cs.filter(c => c.final === k).length).join(" · ") + '</div><div class="hint">' + x.todo + "</div></button>";
    }).join("") + "</div>";
    html += '<div class="card"><div class="card-h"><b>' + esc(title) + '</b><span class="sp"></span><button class="btn sm pri" id="pkRich"' + (rows.length ? "" : " disabled") + '>复制为表格</button><button class="btn sm" id="pkText"' + (rows.length ? "" : " disabled") + '>复制为文字</button><button class="btn sm" id="pkCsv">导出全部（CSV）</button></div>' +
      '<p class="hint" style="margin:0 0 6px">清单格式：一行一个用例，同一原因的用例排在一起，“需要做什么”写明下一步。“复制为表格”粘贴到 Outlook、Teams、Excel 会保留表格；“复制为文字”是制表符分隔，适合粘贴到纯文本的地方。</p>' +
      (rows.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr>' + PACK_COLS.map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" + rows.map(r => "<tr>" + r.map((x, i) => "<td" + (i === 5 ? ' class="basis"' : i === 1 ? ' class="mono nw"' : "") + ">" + esc(x) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>" : A.emptyBlock("没有需要交给" + d.name.replace("交给", "") + "的用例")) + "</div>";
    root.innerHTML = html;
    $("#dRun").onchange = e => { v.run = e.target.value; A.render(); };
    $$("[data-who]", root).forEach(b => b.onclick = () => { v.who = b.dataset.who; A.render(); });
    const text = () => title + "\n" + [PACK_COLS].concat(rows).map(r => r.map(x => String(x).replace(/[\t\n]+/g, " ")).join("\t")).join("\n");
    if ($("#pkRich")) $("#pkRich").onclick = () => A.copyRich(packHtml(title, rows), text());
    if ($("#pkText")) $("#pkText").onclick = () => A.copy(text());
    $("#pkCsv").onclick = () => exportDialog(scope);
  }

  A.composite("triage", [
    ["main", "① 分诊", mainPage, () => S.cases.filter(c => c.failed && !c.override && c.auto && c.auto.status === "suspected").length],
    ["rerun", "② 重跑", rerunPage, () => S.cases.filter(c => c.failed && c.plan && c.plan.b === "go").length],
    ["dispatch", "③ 分派", dispatchPage],
  ]);
})();
</script>
<script>
/* 页面：回归对比（读取 difflib 生成的 Total / Ignore HTML 报告，合并在一页查看） */
(function () {
  const A = APP, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;

  /* ---------- 解析 difflib.HtmlDiff 报告 ---------- */
  // 把单元格内容转成安全的 HTML：只保留文字和 diff_add / diff_chg / diff_sub 标记
  function cellHTML(td) {
    let out = "", changed = false;
    const walk = n => {
      n.childNodes.forEach(ch => {
        if (ch.nodeType === 3) out += esc(ch.nodeValue.replace(/ /g, " "));
        else if (ch.nodeType === 1) {
          const cls = (ch.className || "").match(/diff_(add|chg|sub)/);
          if (cls) { changed = true; out += '<span class="d_' + cls[1] + '">'; walk(ch); out += "</span>"; }
          else if (ch.tagName === "BR") out += "";
          else walk(ch);
        }
      });
    };
    walk(td);
    return { html: out, text: td.textContent.replace(/ /g, " "), changed };
  }
  function parseDiff(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const tables = Array.from(doc.querySelectorAll("table.diff")).filter(t => (t.getAttribute("summary") || "").toLowerCase() !== "legends" && t.querySelector("td.diff_header"));
    if (!tables.length) return { ok: false };
    const heads = Array.from(doc.querySelectorAll("table.diff thead th.diff_header, table.diff thead th[colspan]")).map(th => th.textContent.trim()).filter(Boolean);
    const rows = [];
    tables.forEach(t => {
      Array.from(t.tBodies).forEach((tb, bi) => {
        if (bi > 0 || rows.length) rows.push({ gap: true });
        Array.from(tb.rows).forEach(tr => {
          const tds = Array.from(tr.cells);
          const sides = [];
          tds.forEach((td, i) => { if (td.classList.contains("diff_header")) { const tx = tds[i + 1]; sides.push({ no: td.textContent.trim(), cell: tx ? cellHTML(tx) : { html: "", text: "", changed: false } }); } });
          if (sides.length < 2) {
            const txt = tr.textContent.trim();
            if (txt) rows.push({ note: txt });
            return;
          }
          const [L, R] = sides;
          rows.push({ ln: L.no, lh: L.cell.html, lt: L.cell.text, rn: R.no, rh: R.cell.html, rt: R.cell.text, chg: L.cell.changed || R.cell.changed || (!L.no !== !R.no) });
        });
      });
    });
    while (rows.length && rows[0].gap) rows.shift();
    const nd = rows.filter(r => r.chg).length;
    const noDiff = /No Differences Found/i.test(doc.body ? doc.body.textContent : "");
    return { ok: true, rows, nd: noDiff ? 0 : nd, from: heads[0] || "基线", to: heads[1] || "本次" };
  }

  const KIND_RE = /(^|[_\-\s.()\[\]])(total|ignore|ignored|full|filtered)(?=$|[_\-\s.()\[\]])/gi;
  function caseKey(name) { return name.replace(/\.[^.]+$/, "").replace(KIND_RE, "$1").replace(/[_\-\s.]+$/g, "").replace(/^[_\-\s.]+/g, "").replace(/[_\-\s.]{2,}/g, "_").toLowerCase(); }
  function kindOf(path, fallback) {
    const p = path.toLowerCase();
    if (/(^|[^a-z])ignored?([^a-z]|$)|filtered/.test(p.split("/").pop())) return "ignore";
    if (/(^|[^a-z])(total|full)([^a-z]|$)/.test(p.split("/").pop())) return "total";
    if (/(^|\/)(ignored?|filtered)[^/]*\//.test(p)) return "ignore";
    if (/(^|\/)(total|full)[^/]*\//.test(p)) return "total";
    return fallback;
  }

  async function loadFiles(files, fallback) {
    const C = S.cmp || (S.cmp = { items: {}, order: [] });
    const html = files.filter(f => /\.html?$/i.test(f.name));
    let n = 0, bad = 0;
    for (const f of html) {
      const text = await A.readFile(f);
      const kind = kindOf(f.webkitRelativePath || f.name, fallback);
      const key = caseKey(f.name);
      const p = parseDiff(text);
      const it = C.items[key] || (C.items[key] = { key, name: f.name.replace(/\.[^.]+$/, "").replace(KIND_RE, "$1").replace(/[_\-\s.]+$/, ""), total: null, ignore: null });
      it[kind] = Object.assign(p, { file: f.webkitRelativePath || f.name, raw: text });
      if (!p.ok) bad++;
      n++;
    }
    C.order = Object.keys(C.items).sort((a, b) => a.localeCompare(b, "zh", { numeric: true }));
    A.toast("已读取 " + n + " 个报告" + (bad ? "，其中 " + bad + " 个不是 difflib 格式" : "") + (files.length - html.length ? "，跳过 " + (files.length - html.length) + " 个非 HTML 文件" : ""), bad > 0);
    A.render();
  }

  const statusOf = it => {
    const ig = it.ignore, to = it.total;
    if ((ig && !ig.ok) || (to && !to.ok)) return "bad";
    if (!ig || !to) return "single";
    if (ig.nd > 0) return "real";
    if (to.nd > 0) return "noise";
    return "same";
  };
  const ST = { real: ["过滤后仍有差异", "red"], noise: ["只有噪声差异", "gray"], same: ["完全一致", "green"], single: ["缺少配对报告", "orange"], bad: ["无法识别", "orange"] };

  function clusters(C) {
    const m = {};
    C.order.forEach(k => {
      const it = C.items[k], d = it.ignore && it.ignore.ok ? it.ignore : (!it.total || !it.total.ok ? null : (it.ignore ? null : it.total));
      if (!d) return;
      const seen = new Set();
      d.rows.forEach(r => {
        if (!r.chg) return;
        const key = (r.lt || "").replace(/\s+/g, " ").trim() + " → " + (r.rt || "").replace(/\s+/g, " ").trim();
        if (seen.has(key)) return; seen.add(key);
        (m[key] = m[key] || { key, l: r.lt, r: r.rt, cases: [] }).cases.push(k);
      });
    });
    return Object.values(m).sort((a, b) => b.cases.length - a.cases.length);
  }

  A.PAGES.compare = function (root, v) {
    const C = S.cmp;
    v.view = v.view || "ignore"; v.mode = v.mode || "diff"; v.open = v.open || {};
    let html = '<div class="card"><h3>回归对比汇总 <span class="sub">读取已有的 Total / Ignore 对比报告（Python difflib 生成的 HTML），在一页里查看</span><span class="acts">' +
      '<button class="btn" id="cTot">导入 Total 报告</button><button class="btn" id="cIgn">导入 Ignore 报告</button><button class="btn" id="cDir">导入整个文件夹</button>' + (C ? '<button class="btn dang" id="cClr">清空</button>' : "") + "</span></h3>" +
      '<input type="file" id="cTotIn" multiple accept=".html,.htm" style="display:none"><input type="file" id="cIgnIn" multiple accept=".html,.htm" style="display:none"><input type="file" id="cDirIn" webkitdirectory multiple style="display:none">' +
      '<p class="hint" style="margin:0">Total、Ignore 可以分别选择文件（可多选），也可以选包含两者的文件夹：文件名或上级文件夹名含 total / ignore 的会自动区分。文件名去掉 total / ignore 字样后相同的，视为同一个 Case。报告只在本次打开页面期间有效，不会保存。</p></div>';
    if (!C || !C.order.length) {
      root.innerHTML = html + '<div class="card">' + A.emptyBlock("还没有导入对比报告", "选择同事 A 生成的 total 和 ignore HTML 报告后，这里会显示所有 Case 的差异汇总。") + "</div>";
      bindTop(root); return;
    }
    const items = C.order.map(k => C.items[k]);
    const cnt = s => items.filter(it => statusOf(it) === s).length;
    html += '<div class="kpis">' + [["", "报告 Case 数", items.length, "#409eff"], ["real", "过滤后仍有差异", cnt("real"), "#f56c6c"], ["noise", "只有噪声差异", cnt("noise"), "#909399"], ["same", "完全一致", cnt("same"), "#67c23a"], ["single", "缺少配对报告", cnt("single") + cnt("bad"), "#e6a23c"]]
      .map(([k, l, n, c]) => '<button class="kpi" style="--c:' + c + (v.st === k ? ";box-shadow:0 0 0 2px " + c : "") + '" data-st="' + k + '"><b>' + n + "</b><span>" + l + "</span></button>").join("") + "</div>";

    const cl = clusters(C);
    html += '<div class="card"><h3>差异聚类 <span class="sub">Ignore 报告中相同的“基线 → 本次”变化合并显示，点击只看相关 Case</span>' + (v.cl != null ? '<span class="acts"><button class="btn sm" id="clX">取消聚类筛选</button></span>' : "") + "</h3>" +
      (cl.length ? '<div class="tbl-wrap" style="max-height:260px;overflow-y:auto"><table class="tbl"><thead><tr><th>Case 数</th><th>基线</th><th>本次</th><th></th></tr></thead><tbody>' +
        cl.slice(0, 100).map((x, i) => '<tr class="' + (v.cl === i ? "sel" : "") + '"><td><b>' + x.cases.length + '</b></td><td class="mono clip" style="max-width:420px" title="' + esc(x.l) + '">' + esc(x.l || "（无此行）") + '</td><td class="mono clip" style="max-width:420px" title="' + esc(x.r) + '">' + esc(x.r || "（无此行）") + '</td><td class="ops"><a data-cl="' + i + '">只看这些 Case</a></td></tr>').join("") + "</tbody></table></div>"
        : '<p class="hint" style="margin:0">Ignore 报告中没有差异。</p>') + "</div>";

    let list = items;
    if (v.st) list = list.filter(it => v.st === "single" ? ["single", "bad"].includes(statusOf(it)) : statusOf(it) === v.st);
    if (v.cl != null && cl[v.cl]) list = list.filter(it => cl[v.cl].cases.includes(it.key));
    if (v.q) list = list.filter(it => (it.name + " " + (it.total ? it.total.file : "") + " " + (it.ignore ? it.ignore.file : "")).toLowerCase().includes(v.q.toLowerCase()));
    if (!v.cur || !list.find(it => it.key === v.cur)) v.cur = list[0] ? list[0].key : null;
    const it = v.cur ? C.items[v.cur] : null;

    html += '<div class="cmp"><div class="card" style="padding:12px;margin:0"><input class="inp" id="cQ" style="width:100%;min-width:0;margin-bottom:10px" placeholder="搜索 Case / 文件名" value="' + esc(v.q || "") + '"><div class="clist">' +
      list.map(x => { const s = statusOf(x), st = ST[s]; return '<button class="ci' + (x.key === v.cur ? " on" : "") + '" data-ci="' + esc(x.key) + '"><div><div class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</div><div class="meta">Ignore ' + (x.ignore ? (x.ignore.ok ? x.ignore.nd : "?") : "-") + " 处 · Total " + (x.total ? (x.total.ok ? x.total.nd : "?") : "-") + ' 处</div></div><span class="tag ' + st[1] + '">' + st[0] + "</span></button>"; }).join("") +
      (list.length ? "" : '<div class="empty">没有符合条件的 Case</div>') + '</div><div class="hint" style="margin-top:8px">快捷键 j / k 切换 Case</div></div>';
    html += '<div class="card" style="margin:0;min-width:0" id="cView">' + (it ? viewer(it, v) : A.emptyBlock("请选择 Case")) + "</div></div>";
    root.innerHTML = html;
    bindTop(root);
    $$("[data-st]", root).forEach(b => b.onclick = () => { v.st = v.st === b.dataset.st || !b.dataset.st ? "" : b.dataset.st; A.render(); });
    $$("[data-cl]", root).forEach(a => a.onclick = () => { v.cl = +a.dataset.cl; A.render(); });
    if ($("#clX")) $("#clX").onclick = () => { v.cl = null; A.render(); };
    $$("[data-ci]", root).forEach(b => b.onclick = () => { v.cur = b.dataset.ci; v.open = {}; A.render(); });
    $("#cQ").onchange = e => { v.q = e.target.value.trim(); A.render(); };
    if (it) bindViewer(root, it, v, list);
  };
  function bindTop(root) {
    $("#cTot").onclick = () => $("#cTotIn").click();
    $("#cIgn").onclick = () => $("#cIgnIn").click();
    $("#cDir").onclick = () => $("#cDirIn").click();
    $("#cTotIn").onchange = e => loadFiles(Array.from(e.target.files), "total");
    $("#cIgnIn").onchange = e => loadFiles(Array.from(e.target.files), "ignore");
    $("#cDirIn").onchange = e => loadFiles(Array.from(e.target.files), "total");
    if ($("#cClr")) $("#cClr").onclick = () => { S.cmp = null; A.S.view.compare = {}; A.render(); };
  }

  function viewer(it, v) {
    const has = { ignore: !!it.ignore, total: !!it.total };
    if (!has[v.view]) v.view = has.ignore ? "ignore" : "total";
    const d = it[v.view];
    let h = '<div class="bar" style="margin-bottom:12px"><b style="font-size:14px">' + esc(it.name) + '</b><span class="tag ' + ST[statusOf(it)][1] + '">' + ST[statusOf(it)][0] + '</span><span class="sp"></span>' +
      '<span class="seg"><button data-view="ignore" class="' + (v.view === "ignore" ? "on" : "") + '"' + (has.ignore ? "" : " disabled") + ">过滤版 Ignore" + (it.ignore && it.ignore.ok ? "（" + it.ignore.nd + "）" : "") + '</button><button data-view="total" class="' + (v.view === "total" ? "on" : "") + '"' + (has.total ? "" : " disabled") + ">完整版 Total" + (it.total && it.total.ok ? "（" + it.total.nd + "）" : "") + "</button></span>" +
      '<span class="seg"><button data-mode="diff" class="' + (v.mode === "diff" ? "on" : "") + '">只看差异</button><button data-mode="all" class="' + (v.mode === "all" ? "on" : "") + '">全文</button></span>' +
      '<button class="btn sm" id="cRaw">查看原报告</button><button class="btn sm" id="cCsv">导出差异</button></div>' +
      '<div class="hint" style="margin-bottom:8px;word-break:break-all">' + esc(d.file) + "</div>";
    if (!d.ok) return h + '<div class="empty"><b>无法识别这个报告的格式</b>目前只支持 Python difflib.HtmlDiff 生成的报告。可以点“查看原报告”直接查看。</div>';
    if (!d.nd) h += '<div class="verdict" style="margin-bottom:10px">' + (v.view === "ignore" ? "过滤后没有差异。" + (it.total && it.total.nd ? "完整版中有 " + it.total.nd + " 处差异，都已被过滤规则忽略，可切换到 Total 查看。" : "") : "完整版中没有差异。") + "</div>";
    h += '<div class="dv"><div class="row hd"><div class="no"></div><div class="tx">' + esc(d.from) + '</div><div class="no"></div><div class="tx">' + esc(d.to) + "</div></div>";
    const rows = d.rows, CTX = 2;
    const show = rows.map((r, i) => v.mode === "all" || r.gap || r.note || rows.slice(Math.max(0, i - CTX), i + CTX + 1).some(x => x.chg));
    let i = 0;
    while (i < rows.length) {
      if (!show[i] && !v.open[i]) {
        let j = i; while (j < rows.length && !show[j]) j++;
        h += '<button class="fold" data-fold="' + i + "-" + j + '">⋯ 折叠了 ' + (j - i) + " 行相同内容，点击展开</button>";
        i = j; continue;
      }
      const r = rows[i];
      if (r.gap) h += '<div class="row"><div class="tx" style="grid-column:1/-1;text-align:center;color:#c0c4cc;font-family:var(--sans)">⋯</div></div>';
      else if (r.note) h += '<div class="row"><div class="tx" style="grid-column:1/-1;font-family:var(--sans);color:#909399">' + esc(r.note) + "</div></div>";
      else h += '<div class="row' + (r.chg ? " chg" : "") + '"><div class="no">' + esc(r.ln) + '</div><div class="tx' + (r.ln ? "" : " blank") + '">' + r.lh + '</div><div class="no">' + esc(r.rn) + '</div><div class="tx' + (r.rn ? "" : " blank") + '">' + r.rh + "</div></div>";
      i++;
    }
    h += '</div><div class="hint" style="margin-top:8px"><span class="d_add" style="padding:0 4px">新增</span> <span class="d_chg" style="padding:0 4px">修改</span> <span class="d_sub" style="padding:0 4px">删除</span>　颜色与原报告一致</div>';
    return h;
  }
  function bindViewer(root, it, v, list) {
    $$("[data-view]", root).forEach(b => b.onclick = () => { if (b.disabled) return; v.view = b.dataset.view; v.open = {}; A.render(); });
    $$("[data-mode]", root).forEach(b => b.onclick = () => { v.mode = b.dataset.mode; A.render(); });
    $$("[data-fold]", root).forEach(b => b.onclick = () => { const [a, z] = b.dataset.fold.split("-").map(Number); for (let k = a; k < z; k++) v.open[k] = true; const top = $("#content").scrollTop; A.render(); $("#content").scrollTop = top; });
    $("#cRaw").onclick = () => {
      const d = it[v.view];
      A.dialog("原报告：" + d.file, '<iframe sandbox="" style="width:100%;height:62vh;border:1px solid #ebeef5" id="rawF"></iframe>', [{ t: "关闭" }]);
      $("#dlg").style.width = "min(1100px, 96vw)";
      $("#rawF").srcdoc = d.raw;
    };
    $("#cCsv").onclick = () => {
      const rows = [["Case", "报告类型", "基线行号", "基线内容", "本次行号", "本次内容"]];
      S.cmp.order.forEach(k => { const x = S.cmp.items[k], d = x[v.view]; if (!d || !d.ok) return; d.rows.filter(r => r.chg).forEach(r => rows.push([x.name, v.view, r.ln, r.lt, r.rn, r.rt])); });
      const text = A.toCSV(rows);
      A.dialog("导出差异（" + (v.view === "ignore" ? "过滤版" : "完整版") + "，全部 Case）", "共 " + (rows.length - 1) + " 行差异。", [{ t: "取消" }, { t: "复制内容", fn: () => A.copy(text) }, { t: "下载文件", pri: true, fn: () => A.download("回归差异_" + v.view + ".csv", text, "text/csv;charset=utf-8") }]);
    };
    document.onkeydown = e => {
      if (A.S.view && document.querySelector(".tab.on") && document.querySelector(".tab.on").dataset.tab !== "compare") return;
      if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if (e.key !== "j" && e.key !== "k") return;
      const i = list.findIndex(x => x.key === v.cur), n = i + (e.key === "j" ? 1 : -1);
      if (list[n]) { v.cur = list[n].key; v.open = {}; A.render(); }
    };
  }
})();
</script>
<script>
/* 页面：Jira 提报（起草与审核、提交与导出）、配置 · Jira 与接口。
   一个失败用例 = 一张 Jira 单。描述用一两句话说清楚问题，再写第 1 次 / 第 2 次执行情况并附截图。
   页面负责起草、审核、导出 CSV、生成接口请求；真正写入 Jira 由后端完成。 */
(function () {
  const A = APP, E = ENG, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;

  /* ============================== 配置 ============================== */
  const OLD_TPL = "[{system} Regression] {market} - {module} {cases} failed due to {cause}";
  const DEFAULT_CFG = {
    deploy: "cloud", baseUrl: "", project: "ROTQA", issueType: "Bug", issueTypeEnv: "Task",
    system: "NBS", systemField: "", market: "HK", components: "SYSTEM-QA", labels: "regression, auto-triage",
    envMode: "field", titleTpl: "[{system} Regression] {market} - {module} {case} failed due to {cause}",
    descTpl: "{env} {system} - {module} encounter {problem} when {action}. Could you help to check? Thanks!",
    highKeywords: ["issue", "underwriting", "核保", "payment", "支付", "premium", "保费", "amount", "金额", "quotation", "报价"],
    draftCats: ["PRODUCT_DEFECT", "NEEDS_HUMAN"],
    backendUrl: "", rerunUrl: "", maskOnExport: true, reviewer: "",
  };
  const cfg = () => {
    const C = S.jira = Object.assign({}, DEFAULT_CFG, S.jira || {});
    if (C.titleTpl === OLD_TPL) C.titleTpl = DEFAULT_CFG.titleTpl;
    C.draftCats = (C.draftCats || []).filter(k => E.CATS[k]);
    return C;
  };
  S.drafts = S.drafts || []; S.jiraLog = S.jiraLog || [];

  const FIELD_NAMES = { summary: "Summary", issueType: "Issue Type", priority: "Priority", system: "System", components: "Components", labels: "Labels", assignee: "Assignee", environment: "Environment", data: "Test Data", desc: "Description" };
  const SRC = { 脚本: "blue", AI: "purple", 人工: "orange" };
  const ST = { draft: ["待审核", "orange"], approved: ["已审核", "blue"], submitted: ["已提交", "green"], discarded: ["已放弃", "gray"] };
  const runOf = id => S.runs.find(r => r.id === id) || {};
  const caseOf = d => S.cases.find(c => c.uid === d.uids[0]);
  const casesOf = d => d.uids.map(u => S.cases.find(c => c.uid === u)).filter(Boolean);
  const base = p => String(p || "").split(/[\\/]/).pop().trim();
  const firstLine = c => (c.error || c.stack || "").split("\n").find(s => s.trim()) || "";
  const now = () => new Date().toLocaleString();
  const words = s => String(s || "").replace(/\s+/g, " ").trim().split(" ").slice(0, 12).join(" ");

  /* ============================== 起草（页面生成的部分） ============================== */
  const EXC_EN = {
    NoSuchElementException: "element not found", TimeoutException: "page element wait timeout", StaleElementReferenceException: "stale element reference",
    ElementNotInteractableException: "element not interactable", ElementClickInterceptedException: "click intercepted by another element",
    InvalidSelectorException: "invalid element locator", SessionNotCreatedException: "browser session could not be created",
  };
  function causePhrase(c) {
    const a = c.auto, cat = c.final, hit = a.hits[0] || "", L = c.L || {}, fn = L.rootAt ? " in " + L.rootAt.func : "";
    const sys = (c.obs && c.obs.text) || (L.sysMsgs || []).find(Boolean) || "";
    if (/^BIZ/.test(a.rule) && hit) {
      const src = [c.pageText, c.alertText, sys, c.error].filter(Boolean).join("\n");
      return { text: words(src.split(/\n/).find(l => l.toLowerCase().includes(hit.toLowerCase())) || hit).toLowerCase(), sure: true };
    }
    if (sys && /^(SYS|DATA|CHK-LOCK|CHK-CFG|OBS-POP)/.test(a.rule)) return { text: 'popup error "' + words(sys) + '"', sure: true };
    if (cat === "ENVIRONMENT") return { text: "test environment error (" + words(hit || c.exception || "unknown") + ")", sure: !!hit };
    if (cat === "POPUP_INTERFERENCE") return { text: "unexpected popup" + (hit ? ' "' + words(hit) + '"' : ""), sure: !!hit };
    if (EXC_EN[c.exception]) return { text: EXC_EN[c.exception], sure: false };
    if (/^AST/.test(a.rule)) return { text: "assertion failed - " + words(firstLine(c).replace(/^[\w.]*(Error|Exception|Failure)\s*:?\s*/, "")), sure: false };
    const R = {
      "DSK-AMB": "locator matched multiple controls" + fn, "DSK-NF": (L.expectWin ? 'window "' + words(L.expectWin) + '" not found' : "window/control not found") + fn,
      "DSK-VIS": "control not visible" + fn, "DSK-DIS": "control disabled" + fn, "DSK-OPT": "dropdown option not found (" + words(hit) + ")", "DSK-DTP": "date picker value could not be set" + fn, "CHK-DTP": "date picker value could not be set" + fn,
      "MASK1": "control/data lookup returned empty" + fn, "GEN1": "generic error" + fn, "SYS-EMPTY": "unreadable popup after submission", "SYS-CRASH": "application unhandled exception",
      "SCR2": "invalid locator", "SCR3": "test code error (" + c.exception + ")" + fn, "OBS-OK": "element not found although the page is displayed" + fn, "OBS-BLANK": "page not displayed correctly",
      "OBS-OTHER": "previous step did not take effect" + fn, "OBS-DIS": "control disabled" + fn, "OBS-DESK": "execution machine desktop unavailable",
    };
    if (R[a.rule]) return { text: R[a.rule], sure: a.status === "confirmed" || !!c.override };
    return { text: "[cause TBD]", sure: false };
  }
  function priorityOf(c) {
    const cat = c.final, k = cfg().highKeywords;
    if (cat === "PRODUCT_DEFECT") {
      const txt = [c.name, c.module, c.error].join(" ").toLowerCase();
      const kw = k.find(w => txt.includes(w.toLowerCase()));
      return kw ? { v: "High", why: "产品问题，涉及“" + kw + "”（出单/核保/支付/金额类）" } : { v: "Medium", why: "其他产品问题" };
    }
    if (["TEST_DATA", "SCRIPT_ISSUE", "POPUP_INTERFERENCE"].includes(cat)) return { v: "Low", why: "测试数据 / 脚本 / 弹窗类问题" };
    return { v: "Medium", why: "默认" };
  }
  // 截图文件名：第 1 次（页面里的截图优先，其次报告路径），第 2 次（重跑结果）
  const shotList = (shots, path) => (shots && shots.length ? shots.map(s => base(s.name)) : String(path || "").split(";").map(base)).filter(Boolean).slice(0, 3);
  const fmtT = t => t ? " (" + String(t).replace("T", " ").slice(0, 16) + ")" : "";
  const imgs = list => list.map(n => "!" + n + "|thumbnail!").join(" ");
  function runLines(c) {
    const P = E.jiraPhrase(c), out = [];
    if (c.parent) {
      const p = S.cases.find(x => x.uid === c.parent);
      out.push("*1st run*" + fmtT(p && p.start) + ": " + (p && p.auto ? E.jiraPhrase(p).shortEn : "failed with a different error.") + (p ? " (handled separately)" : ""));
      out.push("*2nd run (rerun)*" + fmtT(c.start) + ": " + P.shortEn);
      const s = shotList(c.shots, c.screenshot); if (s.length) out.push(imgs(s));
      return out;
    }
    out.push("*1st run*" + fmtT(c.start) + ": " + P.shortEn);
    const s1 = shotList(c.shots, c.screenshot); if (s1.length) out.push(imgs(s1));
    if (c.rerun === "fail" && !(c.r2 && c.r2.same === false)) {
      out.push("*2nd run (rerun)*" + fmtT(c.r2 && c.r2.start) + ": Failed again with the same error. The issue is reproducible.");
      const s2 = shotList(c.shots2, c.r2 && c.r2.screenshot); if (s2.length) out.push(imgs(s2));
    } else if (c.rerun === "fail") out.push("*2nd run (rerun)*: Failed with a different error, reported in a separate ticket.");
    return out;
  }
  function scriptFields(d) {
    const C = cfg(), c = caseOf(d), r = runOf(d.run);
    if (!c) return {};
    const mod = c.module || E.featureOf(c) || "Regression", cause = causePhrase(c), P = E.jiraPhrase(c), pr = priorityOf(c);
    // 动作和功能名重复时（例如 Paid To Date Advance … when processing paid to date advance）省掉 when 子句
    const redundant = P.action.replace(/^(processing|running) /, "") === mod.toLowerCase() || /^running /.test(P.action);
    const summary = C.titleTpl.replace("{system}", C.system).replace("{market}", C.market).replace("{module}", mod).replace("{case}", c.id + (c.parent ? " (rerun)" : ""))
      .replace("{cases}", "case").replace("{n}", "1").replace("{cause}", cause.text).replace(/\s+/g, " ").trim();
    const open = (redundant ? C.descTpl.replace(/ when \{action\}/, "") : C.descTpl).replace("{env}", r.env || "").replace("{system}", C.system).replace("{market}", C.market).replace("{module}", mod).replace("{case}", c.id)
      .replace("{problem}", P.problem).replace("{action}", P.action).replace(/\s+/g, " ").replace(/^\s*-\s*/, "").trim();
    const chk = c.dataCheck ? "I checked the test data: " + (E.CHECK_EN[c.dataCheck] || E.DATA_CHECK[c.dataCheck]) + (c.dataNote ? " (" + c.dataNote + ")" : "") + "." : "";
    const td = E.testData(c);
    const environment = ["Environment: " + (r.env || "-"), "Device: " + (c.device || r.device || "-"), "Run: " + (r.name || "-"), "Test plan: " + (r.plan || "-"), "Executed at: " + (c.start || r.at || "-") + " (UTC+8)"].join("\n");
    const sh = shotList(c.shots, c.screenshot).concat(c.parent ? [] : shotList(c.shots2, c.r2 && c.r2.screenshot));
    return {
      summary, issueType: c.final === "ENVIRONMENT" ? C.issueTypeEnv : C.issueType, priority: pr.v, system: C.system, components: C.components, labels: C.labels, assignee: "", environment,
      desc: [open, chk].filter(Boolean).join("\n") + "\n\n" + runLines(c).join("\n"),
      data: Object.entries(td).map(([k, v]) => k + ": " + v).join("\n"),
      _priorityWhy: pr.why, _causeSure: cause.sure, _attach: Array.from(new Set(sh)),
    };
  }
  function newDraft(c) {
    const d = { id: "D" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), v: 2, run: c.run, cat: c.final, sig: c.sig, uids: [c.uid], status: "draft", mode: "create", target: "", f: {}, src: {}, created: now(), history: [] };
    applyScript(d, true);
    return d;
  }
  // 只覆盖仍是“脚本”来源的字段，人工/AI 改过的保留
  function applyScript(d, all) {
    const sf = scriptFields(d);
    Object.keys(FIELD_NAMES).forEach(k => { if (all || !d.src[k] || d.src[k] === "脚本") { d.f[k] = sf[k] || ""; d.src[k] = "脚本"; } });
    d.meta = { priorityWhy: sf._priorityWhy, causeSure: sf._causeSure, attach: sf._attach || [] };
  }
  // 旧版（按原因分组）草稿的 8 个小节，只用于显示已提交的旧单
  const OLD_SECS = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8"];
  const wiki = d => {
    const C = cfg();
    if (d.f.desc == null) return OLD_SECS.filter(k => d.f[k]).map(k => d.f[k]).join("\n\n");
    return (C.envMode === "description" ? "{noformat}\n" + d.f.environment + "\n{noformat}\n\n" : "") + d.f.desc +
      (d.f.data && d.f.data.trim() ? "\n\n*Test data:*\n" + d.f.data.trim().split("\n").filter(Boolean).map(l => "* " + l.trim()).join("\n") : "");
  };

  /* ============================== 校验 ============================== */
  function validate(d) {
    const errs = [], warns = [], c = caseOf(d);
    if (!c) errs.push("找不到这张单对应的用例（批次可能已删除）");
    if (!d.f.summary.trim()) errs.push("标题为空");
    if (/\{(system|market|module|case|cases|cause|n)\}/.test(d.f.summary)) errs.push("标题里还有未替换的占位符");
    if (d.f.summary.length > 255) errs.push("标题超过 255 个字符（" + d.f.summary.length + "）");
    if (/\[cause TBD\]/.test(d.f.summary)) errs.push("标题中的原因还是“[cause TBD]”（待确认），请写明原因");
    if (/\{(env|system|module|problem|action|case)\}/.test(d.f.desc || "")) errs.push("描述里还有未替换的占位符");
    if (d.mode === "comment" && !/^[A-Z][A-Z0-9]+-\d+$/.test(d.target.trim())) errs.push("追加评论需要填写正确的单号，例如 ROTQA-5339");
    const txt = [d.f.summary, d.f.environment, d.f.desc, d.f.data].join("\n");
    if (E.mask(txt) !== txt) errs.push("内容中有疑似个人信息（证件号、手机号、邮箱、卡号）");
    if (c && !c.override && c.auto.status === "suspected" && !d.ack) warns.push({ k: "sus", t: "这个用例的分类还是“待复核”（" + c.auto.brief + "）" });
    if (d.meta && !d.meta.causeSure && d.src.summary === "脚本") warns.push({ t: "标题中的原因由异常类型推出，不一定是真正原因，请对照证据修改" });
    if (c && !(d.meta && d.meta.attach.length)) warns.push({ t: "没有截图。可以在用例详情里粘贴截图，再点“按最新分诊刷新”" });
    const dup = dupOf(d);
    if (dup) warns.push({ t: dup.text });
    if (!d.f.assignee) warns.push({ t: "没有填写 Assignee（经办人），提交后需在 Jira 里指派" });
    return { errs, warns, ok: !errs.length && !warns.some(w => w.k === "sus") };
  }
  // 本地查重：之前提交过、或同时在起草的同一原因的单
  function dupOf(d) {
    const hit = S.drafts.find(x => x !== d && x.status === "submitted" && x.issueKey && x.sig === d.sig && x.cat === d.cat);
    if (hit && d.mode === "create") return { key: hit.issueKey, text: "可能重复：之前提交的 " + hit.issueKey + " 是同一原因。可以改为“追加评论到已有单”" };
    const same = S.drafts.filter(x => x !== d && !["discarded", "submitted"].includes(x.status) && x.sig === d.sig && x.cat === d.cat);
    if (same.length) return { key: "", text: "同一原因还有 " + same.length + " 张草稿（" + same.slice(0, 5).map(x => (caseOf(x) || {}).id).join("、") + "），提交前确认是否需要分别提单" };
    return null;
  }

  /* ============================== 起草与审核 ============================== */
  function draftPage(root, v) {
    const C = cfg();
    if (!S.runs.length) { root.innerHTML = '<div class="card">' + A.emptyBlock("还没有导入数据", "先导入执行结果，完成失败分诊，再来起草 Jira。", '<button class="btn pri" data-go="import">去导入</button>') + "</div>"; A.bindGo(root); return; }
    v.run = S.runs.find(r => r.id === v.run) ? v.run : S.runs[S.runs.length - 1].id; v.st = v.st || "open";
    // 旧版按原因分组的草稿停用（已提交的保留）
    let old = 0; S.drafts.forEach(d => { if (d.v !== 2 && ["draft", "approved"].includes(d.status)) { d.status = "discarded"; d.history.push(now() + " 旧版草稿（按原因分组）已停用，请按用例重新起草"); old++; } });
    if (old) { A.save(); A.toast("旧版按原因分组的 " + old + " 张草稿已停用，请按用例重新起草"); }
    const used = new Set(); S.drafts.filter(d => d.status !== "discarded").forEach(d => d.uids.forEach(u => used.add(u)));
    // 重跑通过的不提单；重跑失败且报错不同的第 2 次记录单独起草
    const avail = S.cases.filter(c => c.failed && c.run === v.run && !used.has(c.uid) && c.rerun !== "pass").sort((a, b) => a.seq - b.seq || (a.parent ? 1 : -1));
    const skipped = S.cases.filter(c => c.failed && c.run === v.run && c.rerun === "pass").length;
    if (!v.pick || v.pickRun !== v.run) { v.pick = avail.filter(c => C.draftCats.includes(c.final)).map(c => c.uid); v.pickRun = v.run; }
    v.pick = v.pick.filter(u => avail.some(c => c.uid === u));
    const drafts = S.drafts.filter(d => d.run === v.run && (v.st === "all" || (v.st === "open" ? ["draft", "approved"].includes(d.status) : d.status === v.st)))
      .sort((a, b) => { const x = caseOf(a), y = caseOf(b); return (x ? x.seq : 0) - (y ? y.seq : 0); });
    if (!v.cur || !drafts.find(d => d.id === v.cur)) v.cur = drafts[0] ? drafts[0].id : null;
    if (v.availOpen === undefined) v.availOpen = !drafts.length;

    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span><select class="sel" id="jRun">' + S.runs.map(r => '<option value="' + r.id + '"' + (r.id === v.run ? " selected" : "") + ">" + esc(r.name) + "</option>").join("") + "</select></label>" +
      '<span class="hint">一个用例一张单。可起草 <b class="ink">' + avail.length + "</b> 条" + (skipped ? "；重跑已通过 " + skipped + " 条是偶发，不提单" : "") + '</span><span class="sp"></span><a id="jAvail">' + (v.availOpen ? "收起可起草列表" : "选择要起草的用例（已选 " + v.pick.length + "）") + '</a><button class="btn sm pri" id="jGen"' + (v.pick.length ? "" : " disabled") + ">起草选中的 " + v.pick.length + " 个</button></div>";
    if (v.availOpen) html += '<div style="margin-top:8px"><div class="bar"><span class="hint">默认勾选：' + C.draftCats.map(k => E.CATS[k].name).join("、") + '（在“起草范围”修改）。重跑失败且同一问题的，两次情况会写进同一张单。</span><span class="sp"></span><button class="btn sm" id="jCats">起草范围</button><button class="btn sm" id="jPickAll">全选</button><button class="btn sm" id="jPickNone">全不选</button></div>' +
      (avail.length ? '<div class="tbl-wrap" style="max-height:300px"><table class="tbl"><thead><tr><th class="ck"></th><th>用例</th><th>名称</th><th>分类</th><th>判断依据</th><th>重跑</th></tr></thead><tbody>' + avail.map(c => '<tr class="' + (v.pick.includes(c.uid) ? "sel" : "") + '"><td class="ck"><input type="checkbox" data-jp="' + c.uid + '"' + (v.pick.includes(c.uid) ? " checked" : "") + '></td><td class="mono nw">' + A.caseLabel(c) + '</td><td class="nm">' + esc(c.name) + "</td><td>" + A.catTag(c.final) + '</td><td class="basis">' + esc(c.auto.brief) + '</td><td class="nw">' + A.planTag(c) + "</td></tr>").join("") + "</tbody></table></div>" : A.emptyBlock("没有可起草的用例", "都已起草，或重跑已通过。")) + "</div>";
    html += "</div>";

    html += '<div class="jlay"><div class="card jlist"><div class="subtabs">' + [["open", "进行中"], ["submitted", "已提交"], ["discarded", "已放弃"], ["all", "全部"]].map(([k, n]) => '<button data-jst="' + k + '" class="' + (v.st === k ? "on" : "") + '">' + n + "</button>").join("") + "</div>" +
      (drafts.length ? drafts.map(d => {
        const c = caseOf(d), val = validate(d);
        return '<div class="ji' + (d.id === v.cur ? " on" : "") + '" data-jd="' + d.id + '" title="' + esc((c ? c.name + " · " : "") + d.f.summary) + '"><span class="mono">' + esc(c ? c.id : "?") + (c && c.parent ? "·2" : "") + "</span>" + A.catTag(c ? c.final : d.cat) + '<span class="sp"></span>' + (d.status === "draft" && val.errs.length ? '<span class="tag red">' + val.errs.length + "</span>" : "") + '<span class="tag ' + ST[d.status][1] + '">' + ST[d.status][0] + "</span></div>";
      }).join("") : '<div class="empty">' + (avail.length ? "在上方选择用例后点“起草”" : "没有草稿") + "</div>") + "</div>";
    const d = v.cur ? S.drafts.find(x => x.id === v.cur) : null;
    html += '<div class="card jform" id="jForm">' + (d ? form(d, v) : A.emptyBlock("请选择左侧的草稿")) + "</div></div>";
    root.innerHTML = html;

    $("#jRun").onchange = e => { v.run = e.target.value; v.cur = null; A.render(); };
    $("#jAvail").onclick = () => { v.availOpen = !v.availOpen; A.render(); };
    if ($("#jCats")) $("#jCats").onclick = () => catsDialog(v);
    if ($("#jPickAll")) $("#jPickAll").onclick = () => { v.pick = avail.map(c => c.uid); A.render(); };
    if ($("#jPickNone")) $("#jPickNone").onclick = () => { v.pick = []; A.render(); };
    $$("[data-jp]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.jp; v.pick = cb.checked ? v.pick.concat(u) : v.pick.filter(x => x !== u); A.render(); });
    $("#jGen").onclick = () => {
      const cs = avail.filter(c => v.pick.includes(c.uid)), ds = cs.map(newDraft);
      S.drafts = S.drafts.concat(ds); A.save(); v.st = "open"; v.cur = ds[0] && ds[0].id; v.tab = "preview"; v.availOpen = false; A.render(); A.toast("已起草 " + ds.length + " 张（每个用例一张）");
    };
    $$("[data-jst]", root).forEach(b => b.onclick = () => { v.st = b.dataset.jst; v.cur = null; A.render(); });
    $$("[data-jd]", root).forEach(el => el.onclick = () => { v.cur = el.dataset.jd; v.tab = "preview"; A.render(); });
    if (d) bindForm(root, d, v);
  }
  function catsDialog(v) {
    const C = cfg();
    A.dialog("起草范围", '<p style="margin-top:0">起草时默认勾选哪些分类的用例？（重跑通过的不提单）</p>' + Object.keys(E.CATS).map(k => '<label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" data-dcat="' + k + '"' + (C.draftCats.includes(k) ? " checked" : "") + ">" + A.catTag(k) + '<span class="hint">' + E.CATS[k].owner + "</span></label>").join(""),
      [{ t: "取消" }, { t: "保存", pri: true, fn: () => { C.draftCats = $$("[data-dcat]").filter(x => x.checked).map(x => x.dataset.dcat); v.pick = null; A.save(); A.render(); } }]);
  }

  /* ---------- 草稿：① 预览 ② 编辑 ---------- */
  const srcTag = s => '<span class="tag ' + (SRC[s] || "gray") + ' xs">' + (s || "脚本") + "</span>";
  function form(d, v) {
    v.tab = v.tab || "preview";
    const c = caseOf(d), val = validate(d), lock = d.status === "submitted";
    let h = '<div class="bar"><span class="tag ' + ST[d.status][1] + '">' + ST[d.status][0] + "</span>" + (d.issueKey ? '<span class="tag green">' + esc(d.issueKey) + "</span>" : "") + '<span class="hint">' + esc(runOf(d.run).name) + " · 起草于 " + esc(d.created) + (d.reviewer ? " · 审核：" + esc(d.reviewer) + " " + esc(d.reviewedAt || "") : "") + '</span><span class="sp"></span>' +
      '<div class="seg"><button data-jt="preview" class="' + (v.tab === "preview" ? "on" : "") + '">① 预览</button><button data-jt="edit" class="' + (v.tab === "edit" ? "on" : "") + '"' + (lock || d.v !== 2 ? " disabled" : "") + ">② 编辑</button></div></div>";
    if (c) h += '<div class="verdict info"><b class="mono">' + esc(c.id) + "</b>" + (c.parent ? '<span class="tag orange">重跑第2次的新问题</span>' : c.rerun === "fail" ? '<span class="tag orange">重跑仍失败·同一问题</span>' : "") + " " + esc(c.name || "") + " · " + A.catTag(c.final) + " " + esc(c.auto.brief) + ' <a data-jopen="' + c.uid + '">看证据</a></div>';
    if (v.tab !== "edit" || lock || d.v !== 2) return h + preview(d) + checksBlock(d, val, lock) + actions(d, val, lock);
    const C = cfg(), dis = lock ? " disabled" : "";
    const row = (k, input, extra) => '<label class="frow"><span>' + FIELD_NAMES[k] + " " + srcTag(d.src[k]) + "</span><div>" + input + (extra || "") + "</div></label>";
    const txt = (k, ph) => '<input class="inp" style="width:100%" data-jf="' + k + '" value="' + esc(d.f[k]) + '" placeholder="' + esc(ph || "") + '"' + dis + ">";
    const sel = (k, opts) => '<select class="sel" data-jf="' + k + '"' + dis + ">" + opts.map(o => "<option" + (d.f[k] === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select>";
    h += '<div class="sec"><h5>1. Title</h5>' + row("summary", txt("summary"), '<div class="hint">' + d.f.summary.length + " / 255" + (d.meta && !d.meta.causeSure ? '　<span class="orange">原因由异常类型推出，请对照证据确认</span>' : "") + "</div>") + "</div>";
    h += '<div class="sec"><h5>2. Description <span class="sp"></span>' + (lock ? "" : '<button class="btn sm" id="jAI">复制给 AI 润色</button><button class="btn sm" id="jPaste">粘贴 AI 结果</button>') + "</h5>" +
      row("desc", '<textarea class="ta" rows="' + Math.min(14, Math.max(6, d.f.desc.split("\n").length + 1)) + '" data-jf="desc"' + dis + ">" + esc(d.f.desc) + "</textarea>", '<div class="hint">第一段用一两句话说清楚问题；*1st run* / *2nd run* 是两次执行的情况，<code>!文件名|thumbnail!</code> 是截图位置（建单后上传同名截图即可显示）</div>') +
      row("data", '<textarea class="ta" rows="3" data-jf="data" placeholder="每行一项，例如：agent code: 48100"' + dis + ">" + esc(d.f.data) + "</textarea>", '<div class="hint">只写业务编码（Agent code、Product code、Policy no.），不写姓名、证件号、手机号</div>') + "</div>";
    h += '<div class="sec"><h5>3. Details</h5><div class="form" style="margin-bottom:8px"><label class="fi"><span>提交方式</span><select class="sel" id="jMode"' + dis + '><option value="create"' + (d.mode === "create" ? " selected" : "") + '>新建 Jira 单</option><option value="comment"' + (d.mode === "comment" ? " selected" : "") + ">追加评论到已有单</option></select></label>" +
      (d.mode === "comment" ? '<label class="fi"><span>已有单号</span><input class="inp" id="jTarget" value="' + esc(d.target) + '" placeholder="ROTQA-5339"' + dis + "></label>" : "") + '<span class="hint">项目 ' + esc(C.project) + "</span></div>" +
      '<div class="fgrid">' + row("issueType", sel("issueType", Array.from(new Set([C.issueType, C.issueTypeEnv, "Bug", "Task"])))) +
      row("priority", sel("priority", ["Highest", "High", "Medium", "Low", "Lowest"]), d.meta ? '<div class="hint">建议依据：' + esc(d.meta.priorityWhy) + "</div>" : "") +
      row("system", txt("system")) + row("components", txt("components", "多个用逗号分隔")) + row("labels", txt("labels", "多个用逗号分隔")) + row("assignee", txt("assignee", "不自动填写，由你决定")) + "</div>" +
      row("environment", '<textarea class="ta" rows="4" data-jf="environment"' + dis + ">" + esc(d.f.environment) + "</textarea>") + "</div>";
    return h + checksBlock(d, val, lock) + actions(d, val, lock);
  }
  function checksBlock(d, val, lock) {
    return '<div class="sec"><h5>提交前检查</h5>' + (val.errs.length || val.warns.length ? "" : '<div class="verdict">全部通过</div>') +
      val.errs.map(e => '<div class="verdict err">必须修改：' + esc(e) + (/个人信息/.test(e) && !lock ? ' <a id="jMask">一键脱敏</a>' : "") + "</div>").join("") +
      val.warns.map(w => '<div class="verdict sus">请确认：' + esc(w.t) + (w.k === "sus" && !lock ? '<label style="display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" id="jAck"' + (d.ack ? " checked" : "") + ">我已看过证据，确认提这张单</label>" : "") + "</div>").join("") + "</div>" +
      (d.history.length ? '<details class="sec"><summary class="hint">记录（' + d.history.length + "）</summary><div class=\"hint\">" + d.history.slice(-8).map(esc).join("<br>") + "</div></details>" : "");
  }
  function actions(d, val, lock) {
    let h = '<div class="acts-row">';
    if (lock || d.v !== 2) h += '<button class="btn" id="jCopy">复制 Description</button>';
    else {
      h += '<button class="btn dang" id="jDiscard">' + (d.status === "discarded" ? "恢复草稿" : "放弃这张单") + '</button><button class="btn" id="jRefresh">按最新分诊刷新</button><button class="btn" id="jCopy">复制 Description</button>';
      h += d.status === "approved" ? '<button class="btn" id="jUnapprove">撤回审核</button><button class="btn pri" data-go="jira" data-opts=\'{"sub":"submit"}\'>去提交与导出</button>' : d.status === "draft" ? '<button class="btn pri" id="jApprove"' + (val.ok ? "" : " disabled") + ">审核通过</button>" : "";
    }
    return h + "</div>";
  }
  function bindForm(root, d, v) {
    A.bindGo(root);
    $$("[data-jt]", root).forEach(b => b.onclick = () => { v.tab = b.dataset.jt; A.render(); });
    $$("[data-jopen]", root).forEach(a => a.onclick = () => A.openCase(a.dataset.jopen));
    $$("[data-pimg]", root).forEach(img => img.onclick = () => { A.dialog("截图", '<img src="' + img.src + '" style="max-width:100%">', [{ t: "关闭" }]); $("#dlg").style.width = "90vw"; });
    const touch = msg => { if (d.status === "approved") { d.status = "draft"; d.history.push(now() + " 审核后又修改，需重新审核"); } if (msg) d.history.push(now() + " " + msg); A.save(); };
    $$("[data-jf]", root).forEach(el => el.onchange = () => { const k = el.dataset.jf; if (d.f[k] === el.value) return; d.f[k] = el.value; d.src[k] = "人工"; touch(); A.render(); });
    if ($("#jMode")) $("#jMode").onchange = e => { d.mode = e.target.value; touch(); A.render(); };
    if ($("#jTarget")) $("#jTarget").onchange = e => { d.target = e.target.value.trim().toUpperCase(); touch(); A.render(); };
    if ($("#jAck")) $("#jAck").onchange = e => { d.ack = e.target.checked; A.save(); A.render(); };
    if ($("#jMask")) $("#jMask").onclick = () => { Object.keys(d.f).forEach(k => { const m = E.mask(d.f[k]); if (m !== d.f[k]) { d.f[k] = m; d.src[k] = "人工"; } }); touch("一键脱敏"); A.render(); };
    if ($("#jAI")) $("#jAI").onclick = () => A.showText("给 AI 润色的材料（已脱敏，复制给公司批准的 AI 工具）", aiPrompt(d));
    if ($("#jPaste")) $("#jPaste").onclick = () => pasteDialog(d);
    $("#jCopy").onclick = () => A.copy(wiki(d));
    if ($("#jRefresh")) $("#jRefresh").onclick = () => { applyScript(d); touch("按最新分诊刷新"); A.render(); A.toast("已刷新；你和 AI 改过的字段没有变"); };
    if ($("#jDiscard")) $("#jDiscard").onclick = () => { d.status = d.status === "discarded" ? "draft" : "discarded"; d.history.push(now() + (d.status === "discarded" ? " 放弃" : " 恢复")); A.save(); A.render(); };
    if ($("#jUnapprove")) $("#jUnapprove").onclick = () => { d.status = "draft"; d.history.push(now() + " 撤回审核"); A.save(); A.render(); };
    if ($("#jApprove")) $("#jApprove").onclick = () => {
      const C = cfg();
      A.dialog("审核通过", '<p style="margin-top:0">确认这张单的内容已核对：原因有证据、没有编造内容、没有个人信息。审核通过后才能导出或提交。</p><label class="fi"><span>审核人</span><input class="inp" id="jRev" value="' + esc(C.reviewer) + '"></label>',
        [{ t: "取消" }, { t: "确认通过", pri: true, fn: () => { const r = $("#jRev").value.trim(); if (!r) { A.toast("请填写审核人", true); return false; } C.reviewer = r; d.status = "approved"; d.reviewer = r; d.reviewedAt = now(); d.history.push(now() + " " + r + " 审核通过"); A.save(); A.render(); A.toast("已审核通过"); } }]);
    };
  }

  /* ---------- 预览：三部分表格 —— 1. Title　2. Description（含截图）　3. Details ---------- */
  function renderWiki(t, srcOf) {
    const out = []; let list = null, inNo = false, pre = [];
    const inline = s => esc(s).replace(/\{\{(.+?)\}\}/g, "<code>$1</code>").replace(/\*([^*\n]+)\*/g, "<b>$1</b>")
      .replace(/!([^!|]+)\|thumbnail!/g, (_, n) => { const src = srcOf(n.replace(/&amp;/g, "&")); return src ? '<img class="pimg" src="' + src + '" data-pimg alt="" title="' + n + '">' : '<span class="tag gray">截图 ' + n + "</span>"; });
    const close = () => { if (list) { out.push("</ul>"); list = null; } };
    String(t || "").split("\n").forEach(l => {
      if (l.trim() === "{noformat}") { if (inNo) { out.push("<pre>" + esc(pre.join("\n")) + "</pre>"); pre = []; } else close(); inNo = !inNo; return; }
      if (inNo) { pre.push(l); return; }
      let m;
      if ((m = /^h(\d)\.\s*(.*)/.exec(l))) { close(); out.push("<h4>" + inline(m[2]) + "</h4>"); }
      else if ((m = /^[*#]\s+(.*)/.exec(l))) { if (!list) { out.push("<ul>"); list = "ul"; } out.push("<li>" + inline(m[1]) + "</li>"); }
      else { close(); if (l.trim()) out.push("<p>" + inline(l) + "</p>"); }
    });
    if (inNo && pre.length) out.push("<pre>" + esc(pre.join("\n")) + "</pre>");
    close();
    return out.join("");
  }
  function preview(d) {

    if (C.systemField) fields[C.systemField] = { value: d.f.system };
    if (d.f.assignee) fields.assignee = C.deploy === "cloud" ? { accountId: d.f.assignee } : { name: d.f.assignee };
    const c = cs[0] || {};
    const paths = String(c.screenshot || "").split(";").concat(String((c.r2 || {}).screenshot || "").split(";")).map(s => s.trim()).filter(Boolean);
    return {
      draftId: d.id, mode: d.mode, target: d.mode === "comment" ? d.target : null, idempotencyLabel: "triage-" + d.id,
      fields: d.mode === "create" ? fields : undefined,
      comment: d.mode === "comment" ? mk("h4. Automated regression " + runOf(d.run).name + ": occurred again in " + (c.id || "") + "\n\n" + wiki(d)) : undefined,
      attachments: (d.meta ? d.meta.attach : []).map(n => ({ fileName: n, sourcePath: paths.find(p => base(p) === n) || null })),
      cases: cs.map(x => ({ id: x.id, name: x.name, category: x.final, rule: x.override ? "人工" : x.auto.rule, attempt: x.parent ? 2 : 1 })),

  function jiraCSV(list) {

      const L = labelsOf(d), Cm = comps(d);
      return [mk(d.f.summary), d.f.issueType, d.f.priority].concat(Array.from({ length: maxC }, (_, i) => Cm[i] || ""), Array.from({ length: maxL }, (_, i) => L[i] || ""), C.envMode === "field" ? [mk(d.f.environment)] : [], [d.f.system, d.f.assignee, mk(wiki(d)), d.id]);
    }));
    return A.toCSV(rows);
  }

    html += '<div class="card"><div class="card-h"><b>已提交的单</b></div>' + (sub.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>单号</th><th>用例</th><th>标题</th><th>提交时间</th></tr></thead><tbody>' + sub.map(d => '<tr><td class="mono">' + (C.baseUrl && d.issueKey ? '<a href="' + esc(C.baseUrl.replace(/\/$/, "") + "/browse/" + d.issueKey) + '" target="_blank" rel="noopener">' + esc(d.issueKey) + "</a>" : esc(d.issueKey || "-")) + '</td><td class="mono nw">' + esc(caseId(d)) + '</td><td class="nm2">' + esc(d.f.summary) + "</td><td>" + esc(d.submittedAt || "") + "</td></tr>").join("") + "</tbody></table></div>" : '<p class="hint" style="margin:0">还没有。</p>') +

  // 后端接口：先预检（dryRun，只查重和校验字段），确认后再正式写入
  async function submitBackend(list, dryRun, log) {
    const C = cfg(), url = C.backendUrl.replace(/\/$/, "") + "/jira/submit";
    A.toast(dryRun ? "正在预检…" : "正在提交…");
    let res;
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dryRun, deploy: C.deploy, baseUrl: C.baseUrl, project: C.project, items: list.map(payload) }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      res = await r.json();
    } catch (e) {
      A.dialog("无法连接后端", "请求 " + esc(url) + " 失败：" + esc(e.message) + '<p class="hint">请确认后端已启动、地址正确，并允许这个页面跨域访问（CORS）。也可以先用 CSV 导出。</p>', [{ t: "关闭" }]);
      return;
    }
    const results = (res && res.results) || [];
    const rows = list.map(d => ({ d, r: results.find(x => x.draftId === d.id) || {} }));
    const body = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>用例</th><th>结果</th><th>说明</th></tr></thead><tbody>' + rows.map(({ d, r }) => '<tr><td class="mono">' + esc(caseId(d)) + "</td><td>" + (r.error ? '<span class="tag red">失败</span>' : r.duplicateOf ? '<span class="tag orange">疑似重复</span>' : r.key ? '<span class="tag green">' + esc(r.key) + "</span>" : dryRun ? '<span class="tag blue">可以提交</span>' : '<span class="tag gray">无返回</span>') + "</td><td>" + esc(r.error || (r.duplicateOf ? "已有 " + r.duplicateOf + "（" + (r.duplicateSummary || "") + "）" : r.message || "")) + "</td></tr>").join("") + "</tbody></table></div>";
    if (dryRun) {
      log("后端预检", list.length, results.filter(r => r.error).length + " 个问题");
      A.dialog("预检结果（尚未写入 Jira）", body + '<p class="hint">疑似重复的单建议先回到起草页改为“追加评论”。</p>', [{ t: "取消" }, { t: "正式提交到 Jira", pri: true, fn: () => { setTimeout(() => submitBackend(list.filter(d => !(results.find(x => x.draftId === d.id) || {}).error), false, log), 50); } }]);
      return;
    }
    rows.forEach(({ d, r }) => { if (r.key) { d.issueKey = r.key; d.status = "submitted"; d.submittedAt = now(); d.history.push(now() + " 后端提交成功 " + r.key + (r.attachmentsFailed ? "，附件失败 " + r.attachmentsFailed + " 个" : "")); } });
    log("后端提交", list.length, rows.filter(x => x.r.key).length + " 张成功");
    A.save(); A.render();
    A.dialog("提交结果", body, [{ t: "关闭" }]);
  }

      f("descTpl", "描述第一句", "", "可用：{env}（批次的测试环境，如 U401）{system} {module} {case} {problem}（出现的问题）{action}（在做什么操作）") +
      f("highKeywords", "高优先级关键字", "", "产品问题的用例名称、模块、报错中出现这些词时建议 High，逗号分隔") +
      '<label style="display:flex;gap:8px;align-items:center;margin:4px 0 8px"><input type="checkbox" data-c="maskOnExport"' + (C.maskOnExport ? " checked" : "") + ">导出和提交时再做一次个人信息脱敏</label>" +
      '<div class="verdict sus">上线前请和熟悉 ROTQA 建单的同事核对：字段名称、必填项、Issue Type、System 可选值、Components。字段名对不上，CSV 导入和接口提交都会失败。</div></div></div></div>';
    $("#cfgSave").onclick = () => {
      $$("[data-c]", root).forEach(el => { const k = el.dataset.c; C[k] = el.type === "checkbox" ? el.checked : Array.isArray(DEFAULT_CFG[k]) ? el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean) : el.value.trim(); });
      A.save(); A.toast("已保存。已有草稿可以点“按最新分诊刷新”更新");
    };
    $("#cfgReset").onclick = () => A.dialog("恢复默认", "确定把 Jira 与接口配置恢复为默认值？", [{ t: "取消" }, { t: "恢复", pri: true, fn: () => { S.jira = Object.assign({}, DEFAULT_CFG); A.save(); A.render(); } }]);
  }

  A.composite("jira", [["draft", "起草与审核", draftPage, () => S.drafts.filter(d => d.status === "draft").length], ["submit", "提交与导出", submitPage, () => S.drafts.filter(d => d.status === "approved").length]]);
  A.composite("config", [["rules", "判断规则", A.rulesPage], ["jira", "Jira 与接口", cfgPage]]);
})();
</script>
<script>APP.init();</script>
</body>
</html>
