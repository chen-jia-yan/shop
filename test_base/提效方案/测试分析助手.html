    ["桌面端控件异常（pywinauto）", [["masked_patterns", "掩盖型报错（前一步返回了空值）"], ["desk_ambiguous", "匹配到多个控件"], ["desk_not_found", "找不到窗口 / 控件"], ["desk_not_visible", "控件不可见"], ["desk_not_enabled", "控件不可用（灰色）"], ["desk_option_missing", "下拉框没有该选项"], ["desk_datetime", "日期控件设置失败"]], ""],
    ["日志解析", [["framework_paths", "框架和第三方库的路径（不算业务步骤）"], ["handler_funcs", "失败后才执行的处理函数（截图、清理）"], ["success_marks", "表示业务操作已成功的文字"]], "截图函数里的异常和程序退出不作为失败原因。"],
    ["其他", [["test_code_paths", "测试代码路径特征"], ["expected_actual", "断言中“期望值/实际值”的格式"], ["fail_words", "执行结果中表示失败的文字"]], ""],
  ];
  const RULE_TIPS = {
    "ENV1": "浏览器/驱动/设备无法启动 → 环境问题", "ENV2": "报错里有连接中断、数据库连不上等关键字 → 环境问题", "ENV-DESK": "执行机没有可交互桌面（远程桌面最小化、断开、锁屏）→ 环境问题",
    "ENV3": "同一报错在本批次大面积、连续出现 → 环境问题（待复核）",
    "SYS-EMPTY": "出现弹窗但没读到文字 → 需人工判断", "DATA-LOCK": "系统提示数据被占用 → 测试数据问题（需查占用来源）", "CHK-LOCK1": "核查确认被本批次前面用例占用 → 脚本问题",
    "SYS-CFG": "系统提示缺少配置 → 需人工核查", "CHK-CFG": "配置已核查 → 按核查结果分类", "SYS-CRASH": "被测程序弹出未处理异常 → 疑似产品缺陷",
    "POP1": "原生对话框文字在干扰清单中 → 弹窗干扰", "POP1-未知": "原生对话框不在任何清单中 → 需人工判断",
    "BIZ1": "业务报错 + 核查确认数据有问题 → 测试数据问题", "BIZ2": "业务报错 + 核查确认数据正常 → 疑似产品缺陷", "BIZ3": "业务报错，还没核查数据 → 需人工判断",
    "POP2": "页面有干扰弹框 → 弹窗干扰", "POP3": "点击被带弹框特征的元素挡住 → 弹窗干扰（待复核）", "POP3-弱": "点击被其他元素挡住 → 需人工判断",
    "MASK1": "前一步没找到控件/数据却继续执行，报错不是真实原因 → 需人工判断", "DSK-AMB": "定位条件匹配到多个控件 → 脚本问题", "DSK-OPT": "下拉框没有该选项 → 待复核",
    "DSK-DTP": "日期控件设置失败 → 需人工核查日期", "CHK-DTP": "日期已核查 → 按核查结果分类", "DSK-DIS": "控件是灰色不可用 → 需人工判断", "DSK-VIS": "控件存在但不可见 → 待复核",
    "DSK-NF": "找不到窗口或控件 → 需看截图判断", "GEN1": "只有笼统报错，没有原因 → 需人工判断",
    "SCR1": "找不到元素或等待超时，没有弹框和业务报错 → 脚本问题（待复核）", "SCR2": "定位表达式写错 → 脚本问题", "SCR3": "测试代码运行错误 → 脚本问题",
    "AST1": "断言期望值与实际值不同 → 疑似产品缺陷（待复核）", "AST2": "断言失败但没有数值 → 需人工判断", "NONE": "没有规则命中 → 需人工判断",
    "OBS-OK": "截图观察：页面正常、控件在屏幕上 → 脚本问题", "OBS-POP": "截图观察：有弹窗挡住（没抄文字）→ 弹窗干扰（待复核）", "OBS-POPN": "截图中的弹窗文字在干扰清单中 → 弹窗干扰",
    "OBS-POPU": "截图中的弹窗文字不在任何清单中 → 需人工判断", "OBS-BLANK": "截图观察：页面空白或报错页 → 疑似产品缺陷（待复核）", "OBS-OTHER": "截图观察：停在别的窗口/页面 → 先重跑",
    "OBS-DIS": "截图观察：控件灰色 → 需人工判断", "OBS-DESK": "截图观察：锁屏/黑屏/断开 → 环境问题",
  };
  const ruleBlock = ([t, items, note]) => '<div class="card"><div class="card-h"><b>' + t + "</b>" + (note ? '<span class="hint">' + note + "</span>" : "") + '</div><div class="rgrid">' +
    items.map(([k, label, type]) => '<label><div class="hint" style="margin-bottom:3px">' + label + "</div>" + (type === "num" ? '<input class="inp" type="number" data-r="' + k + '" value="' + S.rules[k] + '">' : '<textarea class="ta" rows="6" data-r="' + k + '" id="r_' + k + '">' + esc((S.rules[k] || []).join("\n")) + "</textarea>") + "</label>").join("") + "</div></div>";
  A.rulesPage = function (root, v) {
    let html = '<div class="card"><div class="card-h"><b>判断规则</b><span class="hint">每行一项；保存后所有用例立即重新分类，人工修改过的结论不受影响</span><span class="sp"></span><button class="btn sm" id="rReset">恢复默认</button><button class="btn sm" id="rImport">导入规则</button><button class="btn sm" id="rExport">导出规则</button><button class="btn sm pri" id="rSave">保存并重新分类</button></div>' +
      '<p class="hint" style="margin:0">判断顺序：先看整批（大面积相同报错、环境中断的起点）→ 环境 → 系统提示（数据占用、缺少配置、程序崩溃）→ 弹窗 → 业务报错 → 控件异常 → 脚本 → 断言 → 需人工；人工记录了截图观察的，再按截图修正。重跑结果不参与分类。</p>' +
      '<p class="hint" style="margin:4px 0 0">填写方法：每行写一段报错里会出现的文字，不区分大小写。以 <code>re:</code> 开头的行是“模糊匹配”，例如 <code>re:record .* not found</code> 能匹配 “record 40100 not found”；不熟悉的话只写普通文字即可。同事之间同步规则：一个人“导出规则”，其他人“导入规则”。</p></div>';
    html += '<div class="card"><details><summary><b>规则一览</b> <span class="hint">“失败分诊”里“规则”一列显示的名称，以及会判成什么</span></summary><div class="tbl-wrap" style="margin-top:6px"><table class="tbl mini"><thead><tr><th>规则名称</th><th>什么情况下命中</th></tr></thead><tbody>' +
      Object.entries(E.RULE_NAMES).map(([k, n]) => '<tr><td class="nw">' + esc(n) + "</td><td>" + esc(RULE_TIPS[k] || "") + "</td></tr>").join("") + "</tbody></table></div></details></div>";
    html += RULE_SECTIONS.map(ruleBlock).join("");
    html += '<details class="adv"' + (v.adv ? " open" : "") + '><summary>高级设置（异常名称、桌面端控件、日志解析，一般不用改）</summary>' + RULE_ADV.map(ruleBlock).join("") + "</details>";
    root.innerHTML = html;
    $("details.adv", root).ontoggle = e => { v.adv = e.target.open; };
    if (v.focus) { const el = $("#r_" + v.focus); if (el) { if (el.closest("details")) el.closest("details").open = true; el.scrollIntoView(); el.focus(); } v.focus = null; }
    $("#rSave").onclick = () => {
      const before = {}; S.cases.forEach(c => { if (c.failed) before[c.uid] = c.final; });
      $$("[data-r]", root).forEach(el => { const k = el.dataset.r; S.rules[k] = el.type === "number" ? +el.value : el.value.split("\n").map(s => s.trim()).filter(Boolean); });
      A.reclassify(); A.save();
      const changed = S.cases.filter(c => c.failed && before[c.uid] !== c.final).length;
      A.toast("已保存，" + changed + " 条用例的分类发生变化"); A.refreshMenu();
    };
    $("#rReset").onclick = () => A.dialog("恢复默认规则", "确定把所有规则恢复为默认值？你补充的弹窗文字和关键字会丢失。", [{ t: "取消" }, { t: "恢复", pri: true, fn: () => { S.rules = Object.assign({}, E.DEFAULT_RULES); A.reclassify(); A.save(); A.render(); A.toast("已恢复默认"); } }]);
    $("#rExport").onclick = () => A.showText("规则（复制后发给同事，对方在这里点“导入规则”粘贴）", JSON.stringify(S.rules, null, 2));
    $("#rImport").onclick = () => A.dialog("导入规则", '<p class="hint" style="margin-top:0">粘贴同事导出的规则。只更新粘贴内容里有的项，其他保持不变。</p><textarea class="ta" id="rImpIn" rows="12"></textarea>', [{ t: "取消" }, { t: "导入并重新分类", pri: true, fn: () => {
      let o; try { o = JSON.parse($("#rImpIn").value); } catch (e) { A.toast("内容不是有效的规则（JSON 格式不对）", true); return false; }
      const keys = Object.keys(o).filter(k => k in E.DEFAULT_RULES && (Array.isArray(o[k]) || typeof o[k] === "number"));
      if (!keys.length) { A.toast("没有识别到规则项", true); return false; }
      keys.forEach(k => { S.rules[k] = o[k]; }); A.reclassify(); A.save(); A.render(); A.toast("已导入 " + keys.length + " 项规则");
    } }]);
  };
})();
</script>
<script>
/* 页面：失败分诊（① 分诊：分类 → 原因 → 用例；② 重跑；③ 分派）与用例详情 */
(function () {
  const A = APP, E = ENG, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;
  const runName = id => (S.runs.find(r => r.id === id) || {}).name || "-";
  const runSelect = (id, val, all) => '<select class="sel" id="' + id + '">' + (all ? '<option value="">全部批次</option>' : "") + S.runs.map(r => '<option value="' + r.id + '"' + (val === r.id ? " selected" : "") + ">" + esc(r.name) + "</option>").join("") + "</select>";
  const catOptions = (val, blank) => (blank ? '<option value="">' + blank + "</option>" : "") + Object.keys(E.CATS).map(k => '<option value="' + k + '"' + (val === k ? " selected" : "") + ">" + E.CATS[k].name + "</option>").join("");
  const firstLine = c => (c.error || c.stack || "").split("\n").find(s => s.trim()) || "";
  const noData = root => { root.innerHTML = '<div class="card">' + A.emptyBlock("还没有导入数据", "先在“数据导入”导入一次执行结果。", '<button class="btn pri" data-go="import">去导入</button>') + "</div>"; A.bindGo(root); };
  const flagTags = c => c.auto.flags.filter(f => f !== "重跑第2次").length ? '<div class="flags">' + c.auto.flags.filter(f => f !== "重跑第2次").map(f => '<span class="tag ' + (f === "重跑通过" ? "green" : "orange") + '">' + esc(f) + "</span>").join("") + "</div>" : "";
  const CAT_ORDER = ["ENVIRONMENT", "PRODUCT_DEFECT", "SCRIPT_ISSUE", "TEST_DATA", "POPUP_INTERFERENCE", "NEEDS_HUMAN"];
  const NEXT = { ENVIRONMENT: "汇总给环境负责人，恢复后重跑", POPUP_INTERFERENCE: "补充弹窗处理，重跑确认", SCRIPT_ISSUE: "修脚本，修好后重跑", TEST_DATA: "补数据或换数据后重跑", PRODUCT_DEFECT: "确认后起草 Jira", NEEDS_HUMAN: "看截图，记录观察后重新分析" };
  const DISPATCH = [
    { k: "test", name: "交给测试", cats: ["SCRIPT_ISSUE", "TEST_DATA", "POPUP_INTERFERENCE"], todo: "修脚本、换测试数据、补弹窗处理，处理后重跑验证" },
    { k: "dev", name: "交给开发", cats: ["PRODUCT_DEFECT"], todo: "起草 Jira，附截图和执行情况" },
    { k: "env", name: "交给环境/运维", cats: ["ENVIRONMENT"], todo: "确认执行机、数据库、服务状态，恢复后重跑" },
    { k: "human", name: "待判断", cats: ["NEEDS_HUMAN"], todo: "看截图记录观察，或做人工核查" },
  ];
  // 原因名称：规则中文名 + 关键报错
  const causeName = c => { const h = c.auto.hits[0] || (c.L && c.L.root ? c.L.root.msg.split("\n")[0] : firstLine(c)); return E.ruleName(c) + (h && !c.override ? " · “" + String(h).replace(/\s+/g, " ").slice(0, 70) + "”" : ""); };
  function causesOf(cs) {
    const g = {}; cs.forEach(c => { const k = c.sig || "(无报错)"; (g[k] = g[k] || []).push(c); });
    return Object.entries(g).map(([sig, list]) => ({ sig, cs: list.sort((a, b) => a.seq - b.seq || (a.parent ? 1 : -1)) })).sort((a, b) => b.cs.length - a.cs.length);
  }
  const needCheck = c => !c.override && c.auto.checkKind && !c.dataCheck;
  const isSel = (v, u) => v.sel.includes(u);

  /* ============================== ① 分诊 ============================== */
  const ST = [["", "全部"], ["sus", "待复核"], ["check", "待人工核查"], ["manual", "人工已改"]];
  function filterCases(v, st) {
    const q = (v.q || "").toLowerCase(); st = st === undefined ? v.st : st;
    return S.cases.filter(c => c.failed && (!v.run || c.run === v.run) &&
      (!q || (c.id + " " + c.name + " " + c.error + " " + c.module).toLowerCase().includes(q)) &&
      (!v.sig || c.sig === v.sig) &&
      (st === "sus" ? !c.override && c.auto.status === "suspected" : st === "check" ? needCheck(c) : st === "manual" ? !!c.override : true));
  }
  function checkCell(c) {
    const k = c.auto.checkKind && !c.override ? E.CHECK_KINDS[c.auto.checkKind] : null;
    if (!k) return '<span class="hint">-</span>';
    return '<select class="sel xs' + (c.dataCheck ? "" : " todo") + '" data-dc="' + c.uid + '" title="要查什么：' + esc(k.what) + '"><option value="">待核查：' + esc(k.name.split(" → ")[0]) + "</option>" + Object.entries(k.options).map(([ok, o]) => '<option value="' + ok + '"' + (c.dataCheck === ok ? " selected" : "") + ">" + esc(o[0]) + " → " + E.CATS[o[1]].name + "</option>").join("") + "</select>";
  }
  const caseRow = (c, v) => '<tr class="' + (isSel(v, c.uid) ? "sel" : "") + '"><td class="ck"><input type="checkbox" data-sel="' + c.uid + '"' + (isSel(v, c.uid) ? " checked" : "") + '></td><td class="mono nw"><a data-open="' + c.uid + '">' + A.caseLabel(c) + "</a></td>" +
    '<td class="nm" title="' + esc(c.name) + '">' + esc(c.name || "-") + (v.run ? "" : '<div class="hint">' + esc(runName(c.run)) + "</div>") + "</td>" +
    '<td class="basis">' + esc(c.auto.brief) + flagTags(c) + '</td><td class="nw">' + A.statusTag(c) + '</td><td class="nw">' + A.planTag(c) + "</td><td>" + checkCell(c) + "</td>" +
    '<td class="ops nw"><a data-open="' + c.uid + '">证据' + ((c.shots || []).length ? "·图" : "") + '</a><a data-quick="' + c.uid + '">改分类</a></td></tr>';
  function mainPage(root, v) {
    if (!S.runs.length) return noData(root);
    v.sel = v.sel || []; v.open = v.open || [];
    if (v.st === undefined) v.st = "";
    if (v.run === undefined) v.run = S.runs[S.runs.length - 1].id;
    const list = filterCases(v);
    const byCat = {}; list.forEach(c => (byCat[c.final] = byCat[c.final] || []).push(c));
    const cats = CAT_ORDER.filter(k => byCat[k]);
    const n2 = list.filter(c => c.parent).length;
    let html = '<div class="card"><div class="form">' +
      '<label class="fi"><span>批次</span>' + runSelect("fRun", v.run, true) + "</label>" +
      '<label class="fi"><span>搜索</span><input class="inp" id="fQ" placeholder="编号 / 名称 / 报错关键字" value="' + esc(v.q || "") + '"></label>' +
      '<div class="chips">' + ST.map(([k, n]) => '<button data-st="' + k + '" class="' + (v.st === k ? "on" : "") + '">' + n + " " + filterCases(v, k).length + "</button>").join("") + "</div>" +
      '<span class="sp"></span><button class="btn sm" id="bAI" title="把用例的判断依据和证据整理成文字（已脱敏），用于复核或发给同事">复制复核材料</button><button class="btn sm" id="bCsv">导出 CSV</button></div>' +
      (v.sig ? '<div class="hint" style="margin-top:6px">只看同一原因：' + esc(list[0] ? causeName(list[0]) : "") + ' <a id="fSigX">显示全部</a></div>' : "") + "</div>";

    html += '<div class="card">' + (v.sel.length ? '<div class="selbar"><b>已选 ' + v.sel.length + ' 条</b><button class="btn sm" id="bBatch">批量改分类</button><button class="btn sm" id="bRerun">加入重跑名单</button><button class="btn sm" id="bAI2">复制复核材料</button><button class="btn sm" id="bClr">清空选择</button></div>' : "") +
      '<div class="card-h"><b>失败 ' + list.length + " 条</b>" + (n2 ? '<span class="hint">（含重跑第2次报错不同的 ' + n2 + " 条）</span>" : "") + '<span class="hint">按根本原因分类；点一行展开，看具体用例和判断依据</span><span class="sp"></span><a id="fAll">' + (cats.every(k => v.open.includes(k)) && cats.length ? "全部收起" : "全部展开") + "</a></div>";
    if (!list.length) html += A.emptyBlock("没有符合条件的用例", v.st === "sus" ? "所有失败用例都已由规则确认或人工处理。" : v.st === "check" ? "没有需要人工核查的用例。" : "调整筛选条件试试。");
    else {
      html += '<div class="tbl-wrap"><table class="tbl cat"><thead><tr><th style="width:24px"></th><th>分类</th><th>用例</th><th>原因</th><th>待复核</th><th>待核查</th><th>建议重跑</th><th>处理方</th><th>下一步</th></tr></thead><tbody>';
      cats.forEach(k => {
        const cs = byCat[k], open = v.open.includes(k), causes = causesOf(cs);
        const sus = cs.filter(c => !c.override && c.auto.status === "suspected").length, chk = cs.filter(needCheck).length, go = cs.filter(c => c.plan && c.plan.b === "go").length;
        html += '<tr class="crow' + (open ? " open" : "") + '" data-cat="' + k + '"><td class="fold">' + (open ? "▾" : "▸") + "</td><td>" + A.catTag(k) + '</td><td><b>' + cs.length + "</b></td><td>" + causes.length + "</td><td>" + (sus ? '<span class="num o">' + sus + "</span>" : "-") + "</td><td>" + (chk ? '<span class="num o">' + chk + "</span>" : "-") + "</td><td>" + (go ? '<span class="num b">' + go + "</span>" : "-") + "</td><td>" + E.CATS[k].owner + '</td><td class="hint">' + NEXT[k] + "</td></tr>";
        if (!open) return;
        html += '<tr class="cdet"><td colspan="9"><div class="cbox"><div class="cbar"><a data-gsel="' + k + '">全选本类</a><a data-gedit="' + k + '">整类改分类</a><a data-gcopy="' + k + '">复制用例编号</a></div>' +
          '<table class="tbl inner"><thead><tr><th class="ck"></th><th>用例</th><th>名称</th><th>判断依据</th><th>判定</th><th>重跑</th><th>人工核查</th><th>操作</th></tr></thead><tbody>' +
          causes.map((x, xi) => '<tr class="g2"><td colspan="8">原因 ' + (xi + 1) + "：" + esc(causeName(x.cs[0])) + " <b>" + x.cs.length + ' 条</b><span class="g-ops"><a data-gsel="' + k + "|" + xi + '">全选</a><a data-gedit="' + k + "|" + xi + '">整组改分类</a><a data-gcopy="' + k + "|" + xi + '">复制用例编号</a></span></td></tr>' + x.cs.map(c => caseRow(c, v)).join("")).join("") +
          "</tbody></table></div></td></tr>";
      });
      html += "</tbody></table></div>";
    }
    html += "</div>";
    root.innerHTML = html;

    const apply = () => { v.run = $("#fRun").value; v.q = $("#fQ").value.trim(); A.render(); };
    $("#fRun").onchange = apply;
    $("#fQ").onkeydown = e => { if (e.key === "Enter") apply(); };
    $("#fQ").onchange = apply;
    if ($("#fSigX")) $("#fSigX").onclick = () => { v.sig = ""; A.render(); };
    $$("[data-st]", root).forEach(b => b.onclick = () => { v.st = b.dataset.st; if (v.st) v.open = CAT_ORDER.slice(); A.render(); });
    if ($("#fAll")) $("#fAll").onclick = () => { v.open = cats.every(k => v.open.includes(k)) ? [] : cats.slice(); A.render(); };
    $$("tr.crow", root).forEach(tr => tr.onclick = () => { const k = tr.dataset.cat; v.open = v.open.includes(k) ? v.open.filter(x => x !== k) : v.open.concat(k); A.render(); });
    const groupOf = key => { const [k, xi] = key.split("|"); const cs = byCat[k] || []; return xi === undefined ? cs : causesOf(cs)[+xi].cs; };
    $$("[data-gsel]", root).forEach(a => a.onclick = () => { const ids = groupOf(a.dataset.gsel).map(c => c.uid); const on = ids.every(u => v.sel.includes(u)); v.sel = on ? v.sel.filter(u => !ids.includes(u)) : Array.from(new Set(v.sel.concat(ids))); A.render(); });
    $$("[data-gedit]", root).forEach(a => a.onclick = () => batchDialog(groupOf(a.dataset.gedit).map(c => c.uid)));
    $$("[data-gcopy]", root).forEach(a => a.onclick = () => A.copy(Array.from(new Set(groupOf(a.dataset.gcopy).map(c => c.id))).join("\n")));
    $$("[data-sel]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.sel; v.sel = cb.checked ? v.sel.concat(u) : v.sel.filter(x => x !== u); A.render(); });
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    $$("[data-quick]", root).forEach(a => a.onclick = () => batchDialog([a.dataset.quick]));
    $$("[data-dc]", root).forEach(s => { s.onclick = e => e.stopPropagation(); s.onchange = () => setCheck(s.dataset.dc, s.value); });
    if (v.sel.length) {
      $("#bBatch").onclick = () => batchDialog(v.sel, () => { v.sel = []; });
      $("#bRerun").onclick = () => addToRerun(S.cases.filter(c => v.sel.includes(c.uid)));
      $("#bAI2").onclick = () => material(S.cases.filter(c => v.sel.includes(c.uid)));
      $("#bClr").onclick = () => { v.sel = []; A.render(); };
    }
    $("#bAI").onclick = () => material(v.sel.length ? S.cases.filter(c => v.sel.includes(c.uid)) : list.filter(c => !c.override && c.auto.status === "suspected"));
    $("#bCsv").onclick = () => exportDialog(list);
  }
  function material(pick) {
    if (!pick.length) { A.toast("当前没有待复核的用例；也可以先勾选要复核的用例", true); return; }

  }
  function setCheck(uid, val) {
    const c = S.cases.find(x => x.uid === uid), before = c.final;
    c.dataCheck = val || null; A.reclassify(); A.save();
    const same = S.cases.filter(x => x !== c && x.failed && !x.override && x.auto.checkKind === c.auto.checkKind && x.sig === c.sig && x.dataCheck !== c.dataCheck);
    A.render();
    if (val && same.length) A.dialog("同一原因的其他用例", "核查结果已保存（" + E.CATS[before].name + " → " + E.CATS[c.final].name + "）。<br>还有 " + same.length + " 条用例是同一原因：" + same.map(x => esc(x.id)).join("、") + "。如果它们用的是同一组数据，可以沿用这个核查结果。",
      [{ t: "不用" }, { t: "沿用到这 " + same.length + " 条", pri: true, fn: () => { same.forEach(x => { x.dataCheck = c.dataCheck; x.dataNote = (c.dataNote || "") + "（沿用 " + c.id + " 的核查）"; }); A.reclassify(); A.save(); A.render(); A.toast("已沿用"); } }]);
    else A.toast("已保存：" + E.CATS[before].name + (before !== c.final ? " → " + E.CATS[c.final].name : "，分类不变"));
  }
  function addToRerun(list) {
    const cs = list.filter(c => !c.parent && !c.rerun);
    if (!cs.length) return A.toast("选中的用例都已重跑过，或是重跑产生的第2次记录", true);
    const rv = S.view["triage:rerun"] = S.view["triage:rerun"] || {};
    if (rv.run !== cs[0].run) rv.sel = [];
    rv.run = cs[0].run; rv.sel = Array.from(new Set((rv.sel || []).concat(cs.filter(c => c.run === cs[0].run).map(c => c.uid)))); rv.tab = "all";
    A.go("rerun"); A.toast("已加入重跑名单，确认后可一键重跑");
  }

  function batchDialog(uids, after) {
    const cs = S.cases.filter(c => uids.includes(c.uid));
    if (!cs.length) return;
    const one = cs.length === 1 ? cs[0] : null;
    A.dialog(one ? "修改分类：" + one.id : "批量修改分类（" + cs.length + " 条）",
      (one ? '<p class="hint" style="margin-top:0">自动分类：' + E.CATS[one.auto.cat].name + "（" + esc(E.RULE_NAMES[one.auto.rule] || one.auto.rule) + "）<br>判断依据：" + esc(one.override ? one.override.reason : one.auto.brief) + "</p>" : '<p class="hint" style="margin-top:0">' + cs.slice(0, 12).map(c => esc(c.id)).join("、") + (cs.length > 12 ? " 等" : "") + "</p>") +
      '<div style="display:grid;gap:8px"><label><div style="margin-bottom:4px">人工分类</div><select class="sel" id="bdCat" style="width:100%">' + catOptions(one && one.override ? one.override.cat : "", "请选择") + '</select></label>' +
      '<label><div style="margin-bottom:4px">修改原因 <span class="red">*</span></div><textarea class="ta" id="bdReason" rows="3" placeholder="写下看到的证据，例如：截图中有“系統公告”弹窗挡住了提交按钮">' + esc(one && one.override ? one.override.reason : "") + "</textarea></label></div>",
      [{ t: "取消" }].concat(cs.some(c => c.override) ? [{ t: "恢复自动分类", fn: () => { cs.forEach(c => { delete c.override; }); done(); } }] : []).concat([{ t: "保存", pri: true, fn: () => {
        const cat = $("#bdCat").value, reason = $("#bdReason").value.trim();
        if (!cat || !reason) { A.toast("请选择分类并填写原因", true); return false; }
        const at = new Date().toLocaleString();
        cs.forEach(c => { c.override = { cat, reason, at }; });
        done();
      } }]));
    function done() { A.reclassify(); A.save(); if (after) after(); A.render(); if ($("#drawer").classList.contains("open") && one) openCase(one.uid); A.toast("已保存"); }
  }
  A.batchDialog = batchDialog;

  /* ---------- 用例详情：判断依据 → 截图与截图观察 → 人工核查 → 证据 ---------- */
  let pasteUid = null;
  document.addEventListener("paste", e => {
    if (!pasteUid || !$("#drawer").classList.contains("open") || $("#dlg").classList.contains("open")) return;
    if (e.target && /^(TEXTAREA|INPUT)$/.test(e.target.tagName)) return;
    const items = Array.from((e.clipboardData || {}).items || []).filter(i => i.type.indexOf("image") === 0);
    if (!items.length) return;
    e.preventDefault();
    const uid = pasteUid, c = S.cases.find(x => x.uid === uid), n = (S.shots[uid] || []).length;
    items.forEach((it, i) => A.addShot(uid, it.getAsFile(), c.id + "_" + (n + i + 1) + ".png"));
    A.reclassify(); openCase(uid); A.toast("截图已保存。看完截图后，在“截图观察”记录看到的现象，页面会重新分析");
  });
  const shotsHtml = (list, del) => (list || []).map((s, i) => '<div class="shot"><img src="' + s.src + '" alt="" data-big title="' + esc(s.name) + '"><div class="hint">' + esc(s.name) + (del ? ' <a data-delshot="' + i + '" class="red">删除</a>' : "") + "</div></div>").join("");
  function openCase(uid) {
    const c = S.cases.find(x => x.uid === uid); if (!c) return;
    pasteUid = uid;
    const a = c.auto, sus = a.status === "suspected";
    const hits = a.hits.concat(c.exception ? [c.exception] : []);
    const kind = a.checkKind && !c.override && E.CHECK_KINDS[a.checkKind];
    const sameN = S.cases.filter(x => x.failed && x.sig === c.sig && x.final === c.final).length;
    const o = c.obs || {};
    let b = '<div class="sec"><h5>判断依据 ' + A.catTag(c.final) + A.statusTag(c) + '<span class="tag gray">' + esc(E.ruleName(c)) + "</span>" + A.planTag(c) + "</h5>" +
      '<div class="verdict' + (sus && !c.override ? " sus" : "") + '"><div class="brief">' + esc(a.brief) + "</div><ul>" + a.why.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" + (a.need.length ? '<b>还需确认 / 下一步</b><ul>' + a.need.map(w => "<li>" + esc(w) + "</li>").join("") + "</ul>" : "") + '<div class="hint">重跑：' + esc(c.plan ? c.plan.why : "-") + "</div></div></div>";
    if (c.override) b += '<div class="sec"><h5>人工结论 ' + A.catTag(c.override.cat) + '</h5><div class="verdict">' + esc(c.override.reason) + '<div class="hint">' + esc(c.override.at) + "；规则原本判为 " + E.CATS[a.cat].name + "</div></div></div>";
    // 截图 + 截图观察：看完截图记录现象，重新分析
    b += '<div class="sec"><h5>截图' + (c.shots2 ? "（第 1 次）" : "") + ' <span class="hint n">在这里按 Ctrl+V 可直接粘贴；保存在本机</span></h5><div class="shots">' + shotsHtml(c.shots, true) +
      '<label class="shot add"><input type="file" accept="image/*" multiple id="dShotF" hidden><span>＋ 选择图片<br><small>或按 Ctrl+V 粘贴</small></span></label></div>' +
      (!(c.shots || []).length && c.screenshot ? '<p class="hint">报告里的截图路径：' + esc(c.screenshot) + "（把图片粘贴或选择进来才能显示）</p>" : "") +
      (c.shots2 ? '<h5 style="margin-top:8px">截图（第 2 次 · 重跑）</h5><div class="shots">' + shotsHtml(c.shots2) + "</div>" : "") + "</div>";
    b += '<div class="sec obs"><h5>截图观察 <span class="hint n">看完截图记下看到的现象；抄下弹窗或页面上的文字。保存后重新分析</span></h5><div class="obs-k">' +
      Object.entries(E.OBS_KINDS).map(([k, n]) => '<label><input type="radio" name="obsK" value="' + k + '"' + (o.kind === k ? " checked" : "") + ">" + esc(n) + "</label>").join("") + "</div>" +
      '<input class="inp" id="obsT" style="width:100%;margin-top:6px" placeholder="截图中弹窗或页面上的文字（照抄原文，例如：Contract is currently used by other user）" value="' + esc(o.text || "") + '">' +
      '<div style="margin-top:6px;display:flex;gap:6px;align-items:center"><button class="btn sm pri" id="obsGo">保存并重新分析</button>' + (o.kind || o.text ? '<button class="btn sm" id="obsClr">清除观察</button>' : "") + '<span class="hint">只修正“待复核 / 需人工”的结论；规则已确认的结论不会被改</span></div></div>';
    if (kind) b += '<div class="sec"><h5>人工核查：' + esc(kind.name) + '</h5><div class="verdict sus"><div>要查什么：' + esc(kind.what) + '</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><select class="sel" id="dData"><option value="">未核查</option>' + Object.entries(kind.options).map(([k, op]) => '<option value="' + k + '"' + (c.dataCheck === k ? " selected" : "") + ">" + esc(op[0]) + " → " + E.CATS[op[1]].name + "</option>").join("") + '</select><input class="inp" id="dNote" placeholder="查了什么、谁查的（例如：查 agent 表，48100 存在且有效）" value="' + esc(c.dataNote || "") + '"></div><button class="btn sm pri" id="dSave" style="margin-top:6px">保存核查结果</button></div></div>';
    b += '<div class="sec"><h5>证据 <span class="hint n">黄色是规则命中的文字</span></h5>' + a.ev.map(e => '<div class="ev"><div class="eh"><b>' + e.id + "</b>" + esc(e.label) + (e.derived ? '<span class="tag gray">从报错中识别</span>' : "") + "</div>" + (e.kind === "shot" && e.src ? '<img class="evimg" src="' + e.src + '" data-big alt="">' : "<pre>" + A.highlight(e.text, hits) + "</pre>") + "</div>").join("") + "</div>";
    b += '<div class="sec"><h5>基本信息</h5><dl class="kv"><dt>批次</dt><dd>' + esc(runName(c.run)) + "</dd><dt>用例名称</dt><dd>" + esc(c.name || "-") + "</dd><dt>执行结果</dt><dd>" + esc(c.result) + (c.parent ? '（重跑第2次，报错与第一次不同；<a id="dPar">查看第一次</a>）' : "") + "</dd>" +
      (c.module ? "<dt>模块/套件</dt><dd>" + esc(c.module) + "</dd>" : "") + (c.device ? "<dt>执行设备</dt><dd>" + esc(c.device) + "</dd>" : "") + (c.start ? "<dt>开始时间</dt><dd>" + esc(c.start) + "</dd>" : "") +
      '<dt>同一原因</dt><dd><a id="dSig">共 ' + sameN + " 条，点击只看这些</a></dd>" +
      (!c.parent ? '<dt>重跑结果</dt><dd><select class="sel xs" id="dRerun"><option value="">未重跑</option><option value="pass"' + (c.rerun === "pass" ? " selected" : "") + '>重跑通过</option><option value="fail"' + (c.rerun === "fail" ? " selected" : "") + ">重跑仍失败（同一问题）</option></select></dd>" : "") + "</dl></div>";
    A.drawer(A.caseLabel(c) + ' <span class="hint n">' + esc(c.name || "") + "</span>", b,
      '<button class="btn" id="dAI">复制本条复核材料</button><button class="btn pri" id="dOver">' + (c.override ? "修改人工结论" : "确认 / 改分类") + "</button>");
    const reopen = (msg, before) => { A.reclassify(); A.save(); A.render(); openCase(c.uid); if (msg) A.toast(msg + (before ? (before !== c.final ? "：" + E.CATS[before].name + " → " + E.CATS[c.final].name : "：分类不变（" + E.CATS[c.final].name + "）") : "")); };
    $("#dSig").onclick = () => { A.closeDrawer(); A.go("triage", { sig: c.sig, st: "", run: "", open: [c.final] }); };
    if ($("#dPar")) $("#dPar").onclick = () => openCase(c.parent);
    $("#dAI").onclick = () => A.copy(aiMaterial([c]));
    $("#dOver").onclick = () => batchDialog([c.uid]);
    $("#dShotF").onchange = e => { Array.from(e.target.files).forEach(f => A.addShot(uid, f)); reopen("截图已保存"); };
    $$("[data-delshot]").forEach(x => x.onclick = () => { S.shots[uid].splice(+x.dataset.delshot, 1); A.saveShots(uid); reopen(); });
    $$("[data-big]").forEach(img => img.onclick = () => { A.dialog("截图", '<img src="' + img.src + '" style="max-width:100%">', [{ t: "关闭" }]); $("#dlg").style.width = "90vw"; });
    $("#obsGo").onclick = () => {
      const k = ($$('input[name="obsK"]').find(r => r.checked) || {}).value || "", t = $("#obsT").value.trim();
      if (!k && !t) { A.toast("请选择看到的现象，或填写截图中的文字", true); return; }
      const before = c.final; c.obs = { kind: k, text: t, at: new Date().toLocaleString() }; reopen("已重新分析", before);
    };
