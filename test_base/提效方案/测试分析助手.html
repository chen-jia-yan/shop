    "DSK-DTP": "日期控件设置失败 → 需人工核查日期", "CHK-DTP": "日期已核查 → 按核查结果分类", "DSK-DIS": "控件是灰色不可用 → 需人工判断", "DSK-VIS": "控件存在但不可见 → 待复核",
    "DSK-NF": "找不到窗口或控件 → 需看截图判断", "GEN1": "只有笼统报错，没有原因 → 需人工判断",
    "SCR1": "找不到元素或等待超时，没有弹框和业务报错 → 脚本问题（待复核）", "SCR2": "定位表达式写错 → 脚本问题", "SCR3": "测试代码运行错误 → 脚本问题",
    "AST1": "断言期望值与实际值不同 → 疑似产品缺陷（待复核）", "AST2": "断言失败但没有数值 → 需人工判断", "NONE": "没有规则命中 → 需人工判断",
  };
  A.PAGES.rules = function (root, v) {
    let html = '<div class="card"><h3>规则配置 <span class="sub">每行一项；保存后所有用例立即重新分类，人工修改过的结论不受影响</span><span class="acts"><button class="btn" id="rReset">恢复默认</button><button class="btn" id="rExport">导出规则</button><button class="btn pri" id="rSave">保存并重新分类</button></span></h3>' +
      '<p class="hint" style="margin:0">判断顺序：先看整批（大面积相同报错、环境中断的起点）→ 环境 → 重跑 → 系统提示（数据占用、缺少配置、程序崩溃、读不到文字的弹窗）→ 原生弹窗 → 业务报错 → 掩盖型报错 → 桌面端控件异常 → 网页弹框 → 脚本 → 断言 → 需人工。先命中的规则生效。</p>' +
      '<p class="hint" style="margin:6px 0 0">填写方法：每行写一段报错里会出现的文字，不区分大小写。以 <code>re:</code> 开头的行表示“模糊匹配”，可以匹配一类相似的文字，例如 <code>re:record .* not found</code> 能匹配 “record 40100 not found”；不熟悉的话只写普通文字即可。</p></div>';
    html += '<div class="card"><details><summary><b>规则一览</b> <span class="hint">“失败分诊”里“规则”一列显示的名称，以及会判成什么</span></summary><div class="tbl-wrap" style="margin-top:6px"><table class="tbl mini"><thead><tr><th>规则名称</th><th>什么情况下命中</th></tr></thead><tbody>' +
      Object.entries(E.RULE_NAMES).map(([k, n]) => "<tr><td class=\"nw\">" + esc(n) + "</td><td>" + esc(RULE_TIPS[k] || "") + "</td></tr>").join("") + "</tbody></table></div></details></div>";
    RULE_SECTIONS.forEach(([t, items, note]) => {
      html += '<div class="card"><h3>' + t + "</h3>" + (note ? '<p class="hint" style="margin:-4px 0 12px">' + note + "</p>" : "") + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">' +
        items.map(([k, label, type]) => '<label><div style="margin-bottom:6px;color:#606266">' + label + "</div>" + (type === "num" ? '<input class="inp" type="number" data-r="' + k + '" value="' + S.rules[k] + '">' : '<textarea class="ta" rows="7" data-r="' + k + '" id="r_' + k + '">' + esc((S.rules[k] || []).join("\n")) + "</textarea>") + "</label>").join("") + "</div></div>";
    });
    root.innerHTML = html;
    if (v.focus) { const el = $("#r_" + v.focus); if (el) { el.scrollIntoView(); el.focus(); } v.focus = null; }
    $("#rSave").onclick = () => {
      const before = {}; S.cases.forEach(c => { if (c.failed) before[c.uid] = c.final; });
      $$("[data-r]", root).forEach(el => { const k = el.dataset.r; S.rules[k] = el.type === "number" ? +el.value : el.value.split("\n").map(s => s.trim()).filter(Boolean); });
      A.reclassify(); A.save();
      const changed = S.cases.filter(c => c.failed && before[c.uid] !== c.final).length;
      A.toast("已保存，" + changed + " 条用例的分类发生变化"); A.refreshMenu();
    };
    $("#rReset").onclick = () => A.dialog("恢复默认规则", "确定把所有规则恢复为默认值？你补充的弹窗文字和关键字会丢失。", [{ t: "取消" }, { t: "恢复", pri: true, fn: () => { S.rules = Object.assign({}, E.DEFAULT_RULES); A.reclassify(); A.save(); A.render(); A.toast("已恢复默认"); } }]);
    $("#rExport").onclick = () => A.showText("规则（JSON，可以发给同事或留档）", JSON.stringify(S.rules, null, 2));
  };
})();
</script>
<script>
/* 页面：失败分诊（分类 → 原因两级分组、分派、证据详情）、重跑、人工核查 */
(function () {
  const A = APP, E = ENG, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;
  const runName = id => (S.runs.find(r => r.id === id) || {}).name || "-";
  const runSelect = (id, val, all) => '<select class="sel" id="' + id + '">' + (all ? '<option value="">全部批次</option>' : "") + S.runs.map(r => '<option value="' + r.id + '"' + (val === r.id ? " selected" : "") + ">" + esc(r.name) + "</option>").join("") + "</select>";
  const catOptions = (val, blank) => (blank ? '<option value="">' + blank + "</option>" : "") + Object.keys(E.CATS).map(k => '<option value="' + k + '"' + (val === k ? " selected" : "") + ">" + E.CATS[k].name + "</option>").join("");
  const firstLine = c => (c.error || c.stack || "").split("\n").find(s => s.trim()) || "";
  const noData = root => { root.innerHTML = '<div class="card">' + A.emptyBlock("还没有导入数据", "先在“数据导入”导入一次执行结果。", '<button class="btn pri" data-go="import">去导入</button>') + "</div>"; A.bindGo(root); };
  const flagTags = c => c.auto.flags.length ? '<div class="flags">' + c.auto.flags.map(f => '<span class="tag orange">' + esc(f) + "</span>").join("") + "</div>" : "";
  // 分类的展示顺序和分派对象
  const CAT_ORDER = ["ENVIRONMENT", "PRODUCT_DEFECT", "SCRIPT_ISSUE", "TEST_DATA", "POPUP_INTERFERENCE", "NEEDS_HUMAN", "RERUN_PASS"];
  const DISPATCH = [
    { k: "test", name: "交给测试", cats: ["SCRIPT_ISSUE", "TEST_DATA", "POPUP_INTERFERENCE"], todo: "修脚本、换测试数据、补弹窗处理，处理后重跑验证" },
    { k: "dev", name: "交给开发", cats: ["PRODUCT_DEFECT"], todo: "起草 Jira，附截图和执行摘要" },
    { k: "env", name: "交给环境/运维", cats: ["ENVIRONMENT"], todo: "确认执行机、数据库、服务状态，恢复后整批重跑" },
    { k: "human", name: "待判断", cats: ["NEEDS_HUMAN"], todo: "看证据和截图后改分类，或先做人工核查" },
  ];
  // 原因组名称：规则中文名 + 关键报错
  const causeName = c => { const h = c.auto.hits[0] || (c.L && c.L.root ? c.L.root.msg.split("\n")[0] : firstLine(c)); return E.ruleName(c) + (h && !c.override ? " · “" + String(h).replace(/\s+/g, " ").slice(0, 70) + "”" : ""); };
  function groupCases(list) {
    const byCat = {};
    list.forEach(c => { const g = byCat[c.final] = byCat[c.final] || {}; const k = c.sig || "(无报错)"; (g[k] = g[k] || []).push(c); });
    return CAT_ORDER.filter(k => byCat[k]).map(cat => ({ cat, causes: Object.entries(byCat[cat]).map(([sig, cs]) => ({ sig, cs: cs.sort((a, b) => a.seq - b.seq) })).sort((a, b) => b.cs.length - a.cs.length) }));
  }
  // 复制给处理人的清单：分类 → 原因 → 用例编号、判断依据、下一步
  function packText(cats, list, title) {
    const gs = groupCases(list.filter(c => cats.includes(c.final)));
    const n = gs.reduce((s, g) => s + g.causes.reduce((t, x) => t + x.cs.length, 0), 0);
    let s = "【" + title + "】共 " + n + " 条失败用例" + (gs.length ? "（" + gs.map(g => E.CATS[g.cat].name + " " + g.causes.reduce((t, x) => t + x.cs.length, 0)).join("，") + "）" : "") + "\n";
    gs.forEach(g => {
      s += "\n■ " + E.CATS[g.cat].name + "\n";
      g.causes.forEach((x, i) => {
        const c0 = x.cs[0];
        s += "  原因 " + (i + 1) + "：" + causeName(c0) + "（" + x.cs.length + " 条）\n";
        s += "    判断依据：" + c0.auto.brief + "\n";
        if (c0.auto.need.length) s += "    下一步：" + c0.auto.need[0] + "\n";
        s += "    用例：" + x.cs.map(c => c.id).join("、") + "\n";
      });
    });
    return E.mask(s);
  }

  /* ============================== 失败分诊 ============================== */
  const TABS = [["all", "全部失败"], ["sus", "待复核"], ["conf", "规则确认"], ["manual", "人工已改"]];
  function filterCases(v, tab) {
    const q = (v.q || "").toLowerCase(); tab = tab || v.tab;
    return S.cases.filter(c => c.failed &&
      (!v.run || c.run === v.run) &&
      (!v.cat || c.final === v.cat) &&
      (!v.owner || DISPATCH.find(d => d.k === v.owner).cats.includes(c.final)) &&
      (!v.sig || c.sig === v.sig) &&
      (!q || (c.id + " " + c.name + " " + c.error + " " + c.module).toLowerCase().includes(q)) &&
      (tab === "sus" ? !c.override && c.auto.status === "suspected" : tab === "conf" ? !c.override && c.auto.status === "confirmed" : tab === "manual" ? !!c.override : true));
  }
  const caseRow = (c, v, withCat) => '<tr class="' + (v.sel.includes(c.uid) ? "sel" : "") + '"><td class="ck"><input type="checkbox" data-sel="' + c.uid + '"' + (v.sel.includes(c.uid) ? " checked" : "") + '></td><td class="mono nw"><a data-open="' + c.uid + '">' + A.caseLabel(c) + "</a></td>" +
    '<td class="nm" title="' + esc(c.name) + '">' + esc(c.name || "-") + (v.run ? "" : '<div class="hint">' + esc(runName(c.run)) + "</div>") + "</td>" +
    (withCat ? "<td>" + A.catTag(c.final) + "</td>" : "") +
    '<td class="basis">' + esc(c.auto.brief) + flagTags(c) + "</td><td class=\"nw\">" + A.statusTag(c) + '</td><td class="nw">' + esc(E.ruleName(c)) + "</td>" +
    (withCat ? '<td class="nw">' + E.CATS[c.final].owner + "</td>" : "") +
    '<td class="ops nw"><a data-open="' + c.uid + '">证据</a><a data-quick="' + c.uid + '">改分类</a></td></tr>';
  A.PAGES.triage = function (root, v) {
    if (!S.runs.length) return noData(root);
    v.tab = v.tab || "all"; v.page = v.page || 1; v.sel = v.sel || []; v.mode = v.mode || "group"; v.fold = v.fold || {};
    const list = filterCases(v);
    const scope = S.cases.filter(c => c.failed && (!v.run || c.run === v.run));
    let html = '<div class="card"><div class="form">' +
      '<label class="fi"><span>批次</span>' + runSelect("fRun", v.run, true) + "</label>" +
      '<label class="fi"><span>用例</span><input class="inp" id="fQ" placeholder="编号 / 名称 / 报错关键字" value="' + esc(v.q || "") + '"></label>' +
      '<label class="fi"><span>分类</span><select class="sel" id="fCat">' + catOptions(v.cat, "全部分类") + "</select></label>" +
      '<label class="fi"><span>处理方</span><select class="sel" id="fOwner"><option value="">全部</option>' + DISPATCH.map(d => '<option value="' + d.k + '"' + (v.owner === d.k ? " selected" : "") + ">" + d.name + "</option>").join("") + "</select></label>" +
      '<button class="btn pri" id="fGo">查询</button><button class="btn" id="fReset">重置</button></div>' +
      (v.sig ? '<div class="hint" style="margin-top:8px">只看同一原因：' + esc(list[0] ? causeName(list[0]) : v.sig.slice(0, 80)) + ' <a id="fSigX">显示全部</a></div>' : "") + "</div>";

    // 分派汇总：按处理方打包
    html += '<div class="card"><div class="card-h"><b>分派汇总</b><span class="hint">按处理方汇总当前批次的失败用例。“复制清单”复制的是：分类 → 原因 → 判断依据、下一步、用例编号，可直接发给对应的人。</span></div><div class="dispatch">' +
      DISPATCH.map(d => {
        const cs = scope.filter(c => d.cats.includes(c.final));
        const nCause = new Set(cs.map(c => c.final + "|" + c.sig)).size;
        return '<div class="dp' + (cs.length ? "" : " zero") + '"><div class="dp-h"><b>' + d.name + '</b><span class="num">' + cs.length + '</span><span class="hint">条 · ' + nCause + " 个原因</span></div>" +
          '<div class="hint dp-c">' + d.cats.map(k => E.CATS[k].name + " " + cs.filter(c => c.final === k).length).join(" · ") + "</div>" +
          '<div class="hint dp-t">' + d.todo + '</div><div class="dp-a"><button class="btn sm" data-pack="' + d.k + '"' + (cs.length ? "" : " disabled") + '>复制清单</button><button class="btn sm" data-only="' + d.k + '"' + (cs.length ? "" : " disabled") + ">只看这些</button></div></div>";
      }).join("") + "</div>" +
      (scope.some(c => c.final === "RERUN_PASS") ? '<div class="hint" style="margin-top:6px">另有 ' + scope.filter(c => c.final === "RERUN_PASS").length + " 条重跑已通过，不需要处理。</div>" : "") + "</div>";

    html += '<div class="card"><div class="bar"><div class="subtabs">' + TABS.map(([k, n]) => '<button data-tab="' + k + '" class="' + (v.tab === k ? "on" : "") + '">' + n + "（" + filterCases(v, k).length + "）</button>").join("") + '</div><span class="sp"></span>' +
      '<div class="seg"><button data-mode="group" class="' + (v.mode === "group" ? "on" : "") + '">按分类分组</button><button data-mode="flat" class="' + (v.mode === "flat" ? "on" : "") + '">列表</button></div>' +
      '<button class="btn sm" id="bBatch"' + (v.sel.length ? "" : " disabled") + ">批量改分类" + (v.sel.length ? "（" + v.sel.length + "）" : "") + "</button>" +
      '<button class="btn sm" id="bRerun"' + (v.sel.length ? "" : " disabled") + ">加入重跑" + "</button>" +
      '<button class="btn sm" id="bAI" title="把待复核用例的证据整理成文字（已脱敏），可发给 AI 辅助判断">复制复核材料</button><button class="btn sm" id="bCsv">导出 CSV</button></div>';

    let pg = null;
    if (!list.length) html += A.emptyBlock("没有符合条件的用例", v.tab === "sus" ? "所有失败用例都已由规则确认或人工处理。" : "调整筛选条件试试。");
    else if (v.mode === "group") {
      const gs = groupCases(list);
      html += '<div class="hint" style="margin-bottom:6px">先按分类，再按原因（报错去掉数字、时间等变化部分后相同）分组。点组标题可折叠。“复制用例编号”复制这一组的用例编号，每行一个，可粘贴到平台筛选或重跑。</div>';
      html += '<div class="tbl-wrap"><table class="tbl grp"><thead><tr><th class="ck"></th><th>用例</th><th>名称</th><th>判断依据</th><th>判定状态</th><th>规则</th><th>操作</th></tr></thead><tbody>' +
        gs.map((g, gi) => {
          const all = g.causes.reduce((a, x) => a.concat(x.cs), []);
          const fk = "c:" + g.cat, fold = v.fold[fk];
          let h = '<tr class="g1"><td colspan="7"><a class="fold" data-fold="' + esc(fk) + '">' + (fold ? "▸" : "▾") + "</a>" + A.catTag(g.cat) + "<b>" + all.length + ' 条</b><span class="hint">' + g.causes.length + " 个原因 · 处理方：" + E.CATS[g.cat].owner + '</span><span class="g-ops"><a data-gsel="c' + gi + '">全选本类</a><a data-gedit="c' + gi + '">整类改分类</a><a data-gcopy="c' + gi + '">复制用例编号</a></span></td></tr>';
          if (fold) return h;
          g.causes.forEach((x, xi) => {
            const ck = "s:" + g.cat + "|" + x.sig, f2 = v.fold[ck], c0 = x.cs[0], id = gi + "_" + xi;
            h += '<tr class="g2"><td colspan="7"><a class="fold" data-fold="' + esc(ck) + '">' + (f2 ? "▸" : "▾") + "</a>原因：" + esc(causeName(c0)) + " <b>" + x.cs.length + ' 条</b><span class="g-ops"><a data-gsel="s' + id + '">全选</a><a data-gedit="s' + id + '">整组改分类</a><a data-gcopy="s' + id + '">复制用例编号</a></span></td></tr>';
            if (!f2) h += x.cs.map(c => caseRow(c, v, false)).join("");
          });
          return h;
        }).join("") + "</tbody></table></div>";
      v._groups = gs;
    } else {
      const size = 30, pages = Math.max(1, Math.ceil(list.length / size));
      if (v.page > pages) v.page = pages;
      const rows = list.slice((v.page - 1) * size, v.page * size);
      html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="ck"><input type="checkbox" id="selAll"' + (rows.every(c => v.sel.includes(c.uid)) ? " checked" : "") + '></th><th>用例</th><th>名称</th><th>分类</th><th>判断依据</th><th>判定状态</th><th>规则</th><th>处理方</th><th>操作</th></tr></thead><tbody>' +
        rows.map(c => caseRow(c, v, true)).join("") + "</tbody></table></div>";
      pg = A.pager(list.length, v.page, size, p => { v.page = p; A.render(); });
      html += pg.html;
      v._rows = rows;
    }
    html += "</div>";
    root.innerHTML = html;
    if (pg) pg.bind(root);

    const apply = () => { v.run = $("#fRun").value; v.q = $("#fQ").value.trim(); v.cat = $("#fCat").value; v.owner = $("#fOwner").value; v.page = 1; A.render(); };
    $("#fGo").onclick = apply;
    $("#fQ").onkeydown = e => { if (e.key === "Enter") apply(); };
    $("#fReset").onclick = () => { Object.assign(v, { run: "", q: "", cat: "", owner: "", sig: "", page: 1, sel: [] }); A.render(); };
    if ($("#fSigX")) $("#fSigX").onclick = () => { v.sig = ""; A.render(); };
    $$("[data-pack]", root).forEach(b => b.onclick = () => { const d = DISPATCH.find(x => x.k === b.dataset.pack); A.showText(d.name + "的清单（已脱敏）", packText(d.cats, scope, d.name)); });
    $$("[data-only]", root).forEach(b => b.onclick = () => { v.owner = b.dataset.only; v.cat = ""; v.page = 1; A.render(); });
    $$("[data-tab]", root).forEach(b => b.onclick = () => { v.tab = b.dataset.tab; v.page = 1; A.render(); });
    $$("[data-mode]", root).forEach(b => b.onclick = () => { v.mode = b.dataset.mode; A.render(); });
    $$("[data-fold]", root).forEach(a => a.onclick = () => { const k = a.dataset.fold; v.fold[k] = !v.fold[k]; A.render(); });
    $$("[data-sel]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.sel; v.sel = cb.checked ? v.sel.concat(u) : v.sel.filter(x => x !== u); A.render(); });
    if ($("#selAll")) $("#selAll").onchange = e => { const ids = v._rows.map(c => c.uid); v.sel = e.target.checked ? Array.from(new Set(v.sel.concat(ids))) : v.sel.filter(x => !ids.includes(x)); A.render(); };
    const groupOf = key => {
      const gs = v._groups;
      if (key[0] === "c") { const g = gs[+key.slice(1)]; return g.causes.reduce((a, x) => a.concat(x.cs), []); }
      const [gi, xi] = key.slice(1).split("_").map(Number); return gs[gi].causes[xi].cs;
    };
    $$("[data-gsel]", root).forEach(a => a.onclick = () => { const ids = groupOf(a.dataset.gsel).map(c => c.uid); const on = ids.every(u => v.sel.includes(u)); v.sel = on ? v.sel.filter(u => !ids.includes(u)) : Array.from(new Set(v.sel.concat(ids))); A.render(); });
    $$("[data-gedit]", root).forEach(a => a.onclick = () => batchDialog(groupOf(a.dataset.gedit).map(c => c.uid)));
    $$("[data-gcopy]", root).forEach(a => a.onclick = () => A.copy(groupOf(a.dataset.gcopy).map(c => c.id).join("\n")));
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    $$("[data-quick]", root).forEach(a => a.onclick = () => batchDialog([a.dataset.quick]));
    $("#bBatch").onclick = () => batchDialog(v.sel, () => { v.sel = []; });
    $("#bRerun").onclick = () => {
      const cs = S.cases.filter(c => v.sel.includes(c.uid) && !c.parent && !c.rerun);
      if (!cs.length) return A.toast("选中的用例都已重跑过，或是重跑产生的第2次记录", true);
      const rv = S.view.rerun = S.view.rerun || {};
      rv.run = cs[0].run; rv.sel = Array.from(new Set((rv.run === cs[0].run && rv.sel || []).concat(cs.filter(c => c.run === cs[0].run).map(c => c.uid)))); rv.tab = "all";
      A.go("rerun"); A.toast("已加入重跑页的勾选，确认后可一键重跑");
    };

    };

  };

  function batchDialog(uids, after) {

      [{ t: "取消" }].concat(cs.some(c => c.override) ? [{ t: "恢复自动分类", fn: () => { cs.forEach(c => { delete c.override; }); done(); } }] : []).concat([{ t: "保存", pri: true, fn: () => {

  /* ---------- 用例详情（证据） ---------- */
  let pasteUid = null;

  });
  function openCase(uid) {
    const c = S.cases.find(x => x.uid === uid); if (!c) return;
    pasteUid = uid;
    const a = c.auto, sus = a.status === "suspected";

    if (c.override) b += '<div class="sec"><h5>人工结论 ' + A.catTag(c.override.cat) + '</h5><div class="verdict">' + esc(c.override.reason) + '<div class="hint">' + esc(c.override.at) + "；规则原本判为 " + E.CATS[a.cat].name + "</div></div></div>";
    b += '<div class="sec"><h5>基本信息</h5><dl class="kv"><dt>批次</dt><dd>' + esc(runName(c.run)) + "</dd><dt>用例名称</dt><dd>" + esc(c.name || "-") + "</dd><dt>执行结果</dt><dd>" + esc(c.result) + (c.parent ? '（重跑第2次，报错与第一次不同；<a id="dPar">查看第一次</a>）' : c.r2 ? "（已重跑：" + (c.rerun === "pass" ? "通过" : c.r2.same === false ? "失败，报错不同" : "失败，报错相同") + "）" : "") + "</dd>" +

      '<dt>同一原因</dt><dd><a id="dSig">共 ' + sameN + " 条，点击只看这些</a></dd></dl></div>";
    const shots = S.shots[uid] || [];

      shots.map((s, i) => '<div class="shot"><img src="' + s.src + '" alt="" data-big="' + i + '"><div class="hint">' + esc(s.name) + ' <a data-delshot="' + i + '">删除</a></div></div>').join("") +

    b += '<div class="sec"><h5>证据 <span class="hint" style="font-weight:400">黄色是规则命中的文字</span></h5>' + (a.ev.filter(e => e.kind !== "shot").length ? a.ev.filter(e => e.kind !== "shot").map(e => '<div class="ev"><div class="eh"><b>' + e.id + "</b>" + esc(e.label) + (e.derived ? '<span class="tag gray">从报错中识别</span>' : "") + "</div><pre>" + A.highlight(e.text, hits) + "</pre></div>").join("") : '<p class="hint">没有任何证据材料。</p>') + "</div>";
    b += '<div class="sec"><h5>补充记录</h5><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
      '<label><div class="hint">重跑结果</div><select class="sel" id="dRerun" style="width:100%"' + (c.parent ? " disabled" : "") + '><option value="">未重跑</option><option value="pass"' + (c.rerun === "pass" ? " selected" : "") + '>重跑通过</option><option value="fail"' + (c.rerun === "fail" ? " selected" : "") + ">重跑仍失败</option></select></label>" +
      '<label><div class="hint">人工核查' + (kind ? "：" + esc(kind.name) : "") + '</div><select class="sel" id="dData" style="width:100%"' + (kind ? "" : " disabled") + ">" + (kind ? '<option value="">未核查</option>' + Object.entries(kind.options).map(([k, o]) => '<option value="' + k + '"' + (c.dataCheck === k ? " selected" : "") + ">" + esc(o[0]) + "</option>").join("") : "<option>这条用例不需要人工核查</option>") + "</select></label>" +

    A.drawer(A.caseLabel(c) + ' <span class="hint" style="font-weight:400">' + esc(c.name || "") + "</span>", b,

    $("#dSig").onclick = () => { A.closeDrawer(); A.go("triage", { sig: c.sig, tab: "all", page: 1, run: "", cat: "", owner: "", mode: "flat" }); };

    $("#dShotF").onchange = e => { Array.from(e.target.files).forEach(f => A.addShot(uid, f)); A.reclassify(); openCase(uid); A.toast("截图已保存到本机"); };
    $$("[data-delshot]").forEach(x => x.onclick = () => { S.shots[uid].splice(+x.dataset.delshot, 1); A.saveShots(uid); A.reclassify(); openCase(uid); });
    $$("[data-big]").forEach(img => img.onclick = () => { A.dialog("截图", '<img src="' + img.src + '" style="max-width:100%">', [{ t: "关闭" }]); $("#dlg").style.width = "90vw"; });
    $("#dSave").onclick = () => {
      if (!c.parent) c.rerun = $("#dRerun").value || null;
      if (kind) c.dataCheck = $("#dData").value || null;
      const note = $("#dNote").value.trim();
      if (c.dataCheck) c.dataNote = note; else if (c.rerun) c.rerunNote = note;
      A.reclassify(); A.save(); A.render(); openCase(c.uid); A.toast("已保存，分类已重新计算");
    };
  }
  A.openCase = openCase;

  /* ---------- 复核材料（给 AI） ---------- */
  function aiMaterial(list) {
    const head = "你是测试失败分析助手。请根据下面每条用例的证据，给出初步分类。要求：\n" +
      "1. 只能使用给出的证据，结论必须引用证据编号（E1、E2…）；\n" +
      "2. 看截图时只描述能看到的页面状态（例如“保单录入页完整显示，Submit 按钮可见”），不要推测数据库或后台状态；\n" +
      "3. 证据不足时回答“需人工判断”，并写明还缺什么证据；\n" +
      "4. 如果你的结论与“规则初步结论”不同，说明理由；\n" +
      "5. 按表格输出：用例编号 | 分类 | 依据（含证据编号）| 还需确认。\n" +
      "可选分类：环境问题、重跑可过、弹窗干扰、脚本问题、测试数据问题、疑似产品缺陷、需人工判断。\n" +
      "判断要点：找不到元素可能是脚本定位过时，也可能是页面没加载出来（产品问题）或被弹窗挡住；弹窗文字是业务报错（如 record not found）时不是干扰；断言的期望值可能已过时。\n";
    const shots = [];
    const body = list.map(c => {
      const a = c.auto;
      let s = "\n==========\n用例 " + c.id + (c.name ? " " + c.name : "") + "\n规则初步结论：" + E.CATS[a.cat].name + "（" + (a.status === "confirmed" ? "规则确认" : "待复核") + "，" + (E.RULE_NAMES[a.rule] || a.rule) + "）\n判断依据：" + a.brief + "\n详细依据：" + a.why.join("；") + "\n";
      a.ev.forEach(e => {
        if (e.kind === "shot") { s += e.id + " 截图：" + e.text + "（请随本材料上传这张截图）\n"; shots.push(e.text); return; }
        let t = e.text; if (e.kind === "stack" && t.length > 1500) t = t.slice(0, 1500) + "\n…（已截断）";
        s += e.id + " " + e.label + "：\n" + t + "\n";
      });
      return s;
    }).join("");
    return E.mask(head + body + (shots.length ? "\n需要一并上传的截图：\n" + shots.join("\n") + "\n截图中如有客户姓名、证件号等个人信息，请先打码。\n" : ""));
  }

  /* ---------- 导出 ---------- */
  function exportDialog(list) {
    A.dialog("导出 CSV", '<p style="margin-top:0">导出当前筛选结果，共 ' + list.length + " 条。Excel 可直接打开。</p>" +
      '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="exMask" checked>导出时脱敏个人信息（证件号、手机号、邮箱、卡号）</label>',
      [{ t: "取消" }, { t: "复制内容", fn: () => { A.copy(csvOf(list, $("#exMask").checked)); } }, { t: "下载文件", pri: true, fn: () => { A.download("失败分诊_" + new Date().toISOString().slice(0, 10) + ".csv", csvOf(list, $("#exMask").checked), "text/csv;charset=utf-8"); } }]);
  }
  function csvOf(list, doMask) {
    const m = s => doMask ? E.mask(s) : s;
    const rows = [["批次", "用例编号", "用例名称", "执行次数", "最终分类", "处理方", "判断依据", "判定状态", "命中规则", "详细依据", "还需确认", "自动分类", "人工分类", "修改原因", "重跑", "人工核查", "备注", "报错首行", "原因"]];
    list.forEach(c => rows.push([runName(c.run), c.id, c.name, c.parent ? "重跑第2次" : "第1次", E.CATS[c.final].name, E.CATS[c.final].owner, m(c.auto.brief), c.override ? "人工已改" : c.auto.status === "confirmed" ? "规则确认" : "待复核", E.ruleName(c),
      m(c.auto.why.join("；")), c.auto.need.join("；"), E.CATS[c.auto.cat].name, c.override ? E.CATS[c.override.cat].name : "", c.override ? m(c.override.reason) : "",
      c.rerun === "pass" ? "重跑通过" : c.rerun === "fail" ? (c.r2 && c.r2.same === false ? "重跑失败（报错不同）" : "重跑失败（报错相同）") : "", c.dataCheck ? E.DATA_CHECK[c.dataCheck] : "", m(c.dataNote || c.rerunNote || ""), m(firstLine(c)), causeName(c)]));
    return A.toCSV(rows);
  }

  /* ============================== 重跑 ============================== */
  // 重跑标准：建议立即重跑（可能是偶发）/ 处理后再重跑（不处理重跑也会失败）/ 不重跑
  const GO_RULES = { "DSK-NF": "窗口没出现可能是前一步偶发没生效，重跑一次可区分", "SCR1": "找不到元素可能是页面加载慢，重跑一次可区分偶发和定位失效", "DSK-VIS": "控件不可见可能是页面没切换完，重跑一次确认",
    "SYS-EMPTY": "重跑一次看弹窗是否再出现，同时截下弹窗文字", "POP1-未知": "对话框可能是偶发，重跑一次确认", "POP3": "遮挡多为偶发弹框，重跑一次确认", "POP3-弱": "遮挡多为偶发，重跑一次确认", "AST1": "断言不一致先重跑一次排除偶发；仍失败就提 Jira" };
  function rerunAdvice(c) {
    const a = c.auto, f = c.final, r = a.rule;
    if (c.parent) return { b: "no", why: "这是重跑产生的第2次记录，结果已在第一次的用例上体现" };
    if (c.rerun) return { b: "done", why: c.rerun === "pass" ? "重跑已通过" : c.r2 && c.r2.same === false ? "重跑失败，报错与第一次不同（第2次已单独成一条）" : "重跑失败，报错与第一次相同（问题必现）" };
    if (f === "RERUN_PASS") return { b: "no", why: "重跑已通过" };
    if (a.checkKind && !c.dataCheck && !c.override) return { b: "fix", why: "先到“人工核查”完成：" + E.CHECK_KINDS[a.checkKind].name + "；不核查直接重跑结果不会变" };
    if (a.flags.includes("环境中断边界")) return { b: "go", why: "紧挨环境中断的起点，很可能也受环境影响" };
    if (f === "ENVIRONMENT") return c.dataCheck === "cfg_missing" ? { b: "fix", why: "先补上测试环境缺失的配置，再重跑" } : { b: "go", why: "环境问题与用例无关；确认环境已恢复后重跑" };
    if (f === "POPUP_INTERFERENCE") return { b: "go", why: "弹窗多为偶发，重跑可确认；反复出现就给脚本加弹窗处理" };
    if (f === "PRODUCT_DEFECT") return GO_RULES[r] && !c.override ? { b: "go", why: GO_RULES[r] } : { b: "no", why: "已确认是系统问题，直接起草 Jira，重跑不会改变结果" };
    if (f === "TEST_DATA") return { b: "fix", why: r === "DATA-LOCK" ? "先释放被占用的保单（或换一张），再重跑" : "先补数据或换数据，再重跑" };
    if (f === "SCRIPT_ISSUE") return { b: "fix", why: r === "CHK-LOCK1" ? "先修前面用例的清理步骤（失败后关闭窗口、释放保单），再重跑" : "脚本本身有错，直接重跑结果不会变；修好脚本后再重跑验证" };
    if (GO_RULES[r] && !c.override) return { b: "go", why: GO_RULES[r] };
    if (a.flags.includes("有残留窗口")) return { b: "go", why: "屏幕上有前面用例留下的窗口，单独重跑可排除干扰" };
    if (r === "MASK1") return { b: "fix", why: "真实原因被掩盖，先看截图确认没找到的是什么，否则重跑多半同样失败" };
    return { b: "fix", why: "证据不足，先看截图和日志判断原因；能判断后再决定是否重跑" };
  }
  const BUCKETS = [["go", "建议立即重跑", "blue"], ["fix", "处理后再重跑", "orange"], ["no", "不重跑", "gray"], ["done", "已重跑", "green"]];
  A.PAGES.rerun = function (root, v) {
    if (!S.runs.length) return noData(root);
    v.run = v.run || S.runs[S.runs.length - 1].id; v.tab = v.tab || "all";
    const fs = S.cases.filter(c => c.failed && c.run === v.run).sort((a, b) => a.seq - b.seq).map(c => Object.assign(c, { _adv: rerunAdvice(c) }));
    if (!v.sel) v.sel = fs.filter(c => c._adv.b === "go").map(c => c.uid);
    v.sel = v.sel.filter(u => fs.some(c => c.uid === u && !c.parent && !c.rerun));
    const cnt = k => fs.filter(c => c._adv.b === k).length;
    const shown = fs.filter(c => v.tab === "all" || c._adv.b === v.tab);
    const sent = fs.filter(c => c.rerunReq && !c.rerun && !c.parent);
    const C = S.jira || {};
    let html = '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("rRun", v.run) + '</label><span class="hint">失败 ' + fs.filter(c => !c.parent).length + " 条：建议立即重跑 " + cnt("go") + "，处理后再重跑 " + cnt("fix") + "，不重跑 " + cnt("no") + "，已重跑 " + cnt("done") + (sent.length ? "；已提交重跑、等待结果 " + sent.length + " 条" : "") + "</span></div>" +
      '<details class="std"' + (v.stdOpen === false ? "" : " open") + '><summary>重跑标准（点击收起）</summary><table class="tbl mini"><thead><tr><th style="width:120px">建议</th><th>适用情况</th><th>为什么</th></tr></thead><tbody>' +
      '<tr><td><span class="tag blue">建议立即重跑</span></td><td>环境问题（环境恢复后）、紧挨环境中断起点的用例、弹窗干扰、找不到窗口/元素、控件不可见、弹窗文字没读到、断言不一致（先排除偶发）、有前面用例残留的窗口</td><td>这些失败可能是偶发的，重跑一次就能区分“偶发”和“必现”</td></tr>' +
      '<tr><td><span class="tag orange">处理后再重跑</span></td><td>需要人工核查但还没核查的；测试数据问题（换数据后）；数据被占用（释放后）；缺少配置（补配置后）；脚本问题（修脚本后）；真实原因被掩盖的；证据不足、原因不明的</td><td>不先处理，重跑结果不会变，只会浪费执行时间</td></tr>' +
      '<tr><td><span class="tag gray">不重跑</span></td><td>已确认的系统问题（直接提 Jira）、重跑已通过、重跑产生的第2次记录</td><td>结论已经明确</td></tr>' +
      '</tbody></table><p class="hint" style="margin:6px 0 0">重跑后：通过 → 改为“重跑可过”，不提单；失败且报错相同 → 问题必现，两次情况写进同一张 Jira；失败但报错不同 → 第2次单独成一条记录，单独分析、单独提单。</p></details></div>';
    html += '<div class="card"><div class="bar"><div class="subtabs"><button data-rt="all" class="' + (v.tab === "all" ? "on" : "") + '">全部（' + fs.length + "）</button>" + BUCKETS.map(([k, n]) => '<button data-rt="' + k + '" class="' + (v.tab === k ? "on" : "") + '">' + n + "（" + cnt(k) + "）</button>").join("") + '</div><span class="sp"></span>' +
      '<span class="hint">已勾选 ' + v.sel.length + ' 条</span><button class="btn sm" id="rPickGo">勾选“建议立即重跑”</button><button class="btn sm" id="rClear">清空勾选</button><button class="btn sm" id="rCopy">复制用例编号</button><button class="btn sm" id="rImp">导入重跑结果</button><button class="btn sm pri" id="rRun1"' + (v.sel.length ? "" : " disabled") + ">一键重跑（" + v.sel.length + "）</button></div>" +
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="ck"><input type="checkbox" id="rAll"></th><th>用例</th><th>名称</th><th>分类</th><th>判断依据</th><th>重跑建议</th><th>原因</th><th>重跑结果</th></tr></thead><tbody>' +
      shown.map(c => {
        const ad = c._adv, bk = BUCKETS.find(x => x[0] === ad.b), can = !c.parent && !c.rerun;
        return '<tr class="' + (v.sel.includes(c.uid) ? "sel" : "") + '"><td class="ck">' + (can ? '<input type="checkbox" data-rs="' + c.uid + '"' + (v.sel.includes(c.uid) ? " checked" : "") + ">" : "") + '</td><td class="mono nw"><a data-open="' + c.uid + '">' + A.caseLabel(c) + '</a></td><td class="nm">' + esc(c.name) + "</td><td>" + A.catTag(c.final) + '</td><td class="basis">' + esc(c.auto.brief) + '</td><td class="nw"><span class="tag ' + bk[2] + '">' + bk[1] + "</span>" + (c.rerunReq && can ? '<div class="hint">已提交 ' + esc(String(c.rerunReq).slice(0, 16)) + "</div>" : "") + '</td><td class="hint">' + esc(ad.why) + "</td>" +
          "<td>" + (c.parent ? "-" : '<select class="sel" style="min-width:96px" data-rr="' + c.uid + '"><option value="">未重跑</option><option value="pass"' + (c.rerun === "pass" ? " selected" : "") + '>通过</option><option value="fail"' + (c.rerun === "fail" ? " selected" : "") + ">仍失败</option></select>") + "</td></tr>";
      }).join("") + "</tbody></table></div>" + (shown.length ? "" : A.emptyBlock("这一类没有用例")) + "</div>";
    root.innerHTML = html;
    $("details.std", root).ontoggle = e => { v.stdOpen = e.target.open; };
    $("#rRun").onchange = e => { v.run = e.target.value; v.sel = null; A.render(); };
    $$("[data-rt]", root).forEach(b => b.onclick = () => { v.tab = b.dataset.rt; A.render(); });
    $$("[data-rs]", root).forEach(cb => cb.onchange = () => { const u = cb.dataset.rs; v.sel = cb.checked ? v.sel.concat(u) : v.sel.filter(x => x !== u); A.render(); });
    $("#rAll").onchange = e => { const ids = shown.filter(c => !c.parent && !c.rerun).map(c => c.uid); v.sel = e.target.checked ? Array.from(new Set(v.sel.concat(ids))) : v.sel.filter(x => !ids.includes(x)); A.render(); };
    $("#rPickGo").onclick = () => { v.sel = Array.from(new Set(v.sel.concat(fs.filter(c => c._adv.b === "go").map(c => c.uid)))); A.render(); };
    $("#rClear").onclick = () => { v.sel = []; A.render(); };
    $$("[data-rr]", root).forEach(s => s.onchange = () => {
      const c = S.cases.find(x => x.uid === s.dataset.rr);
      c.rerun = s.value || null; c.rerunNote = s.value ? "手工填写 " + new Date().toLocaleString() : "";
      if (c.rerun) { c.rerunReq = null; c.r2 = c.r2 || { same: c.rerun === "fail" ? true : null }; } else delete c.r2;
      A.reclassify(); A.save(); A.render(); A.toast("已保存，分类已重新计算");
    });
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    const picked = () => S.cases.filter(c => v.sel.includes(c.uid));
    $("#rCopy").onclick = () => { if (!v.sel.length) return A.toast("请先勾选用例", true); A.copy(picked().map(c => c.id).join("\n")); };
    $("#rImp").onclick = () => A.go("import", { info: { name: "", plan: "", device: "", env: "", mode: "rerun", rerunOf: v.run } });
    $("#rRun1").onclick = () => {
      const cs = picked(), fixN = cs.filter(c => c._adv.b === "fix").length, url = (C.rerunUrl || "").trim();
      A.dialog("一键重跑（" + cs.length + " 条）",
        (fixN ? '<p style="margin-top:0;color:#e6a23c">其中 ' + fixN + " 条属于“处理后再重跑”，请确认已经处理（核查、换数据、修脚本等），否则重跑多半仍会失败。</p>" : "") +
        '<p class="hint" style="margin-top:0">' + cs.map(c => esc(c.id)).join("、") + "</p>" +
        (url ? "<p>将发送到重跑接口：<code>" + esc(url) + "</code>（批次 " + esc(runName(v.run)) + "）。</p>" : '<p>还没有配置重跑接口（在“配置 → 接口与 Jira 配置”填写）。现在会复制用例编号，请粘贴到 SmartAutoTest 平台发起重跑。</p>') +
        '<p class="hint">重跑完成后，在本页点“导入重跑结果”，工具会自动对比两次报错。</p>',
        [{ t: "取消" }, { t: url ? "确认并发送" : "确认并复制编号", pri: true, fn: () => {
          const at = new Date().toLocaleString();
          const mark = () => { cs.forEach(c => { c.rerunReq = at; }); A.save(); A.render(); };
          if (!url) { A.copy(cs.map(c => c.id).join("\n")); mark(); return; }
          fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ run: runName(v.run), cases: cs.map(c => c.id) }) })
            .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); mark(); A.toast("已提交重跑 " + cs.length + " 条"); })
            .catch(e => { A.copy(cs.map(c => c.id).join("\n")); A.toast("重跑接口调用失败（" + e.message + "），已改为复制用例编号", true); });
        } }]);
    };
  };

  /* ============================== 人工核查 ============================== */
  A.PAGES.datacheck = function (root, v) {
    if (!S.runs.length) return noData(root);
    v.st = v.st || "all";
    const all = S.cases.filter(c => c.failed && (!v.run || c.run === v.run) && c.auto.checkKind && !c.override);
    const fs = all.filter(c => v.st === "all" || (v.st === "todo" ? !c.dataCheck : !!c.dataCheck));
    const pend = all.filter(c => !c.dataCheck).length;
    let html = '<div class="card"><div class="card-h"><b>这一页做什么</b></div><p class="hint" style="margin:0 0 6px">有些失败只看日志分不清原因，必须有人去查系统或数据库，例如：页面提示“记录不存在”，可能是测试数据不对，也可能是系统有问题。工具把这类用例列在这里，告诉你要查什么；你查完选结果，工具会<b>自动重新分类</b>。</p>' +
      '<div class="steps3"><div><b>1</b>看“要查什么”</div><div><b>2</b>到系统/数据库里查（只读查询）</div><div><b>3</b>选核查结果、写一句说明</div><div><b>4</b>分类自动更新；相同原因可一键沿用</div></div>' +
      '<p class="hint" style="margin:6px 0 0">会出现在这里的四种情况：' + Object.values(E.CHECK_KINDS).map(k => esc(k.name)).join("；") + "。数据库状态必须由人核查，不能根据截图推断。</p></div>";
    html += '<div class="card"><div class="form"><label class="fi"><span>批次</span>' + runSelect("dcRun", v.run, true) + '</label><div class="seg">' + [["all", "全部"], ["todo", "待核查"], ["done", "已核查"]].map(([k, n]) => '<button data-st="' + k + '" class="' + (v.st === k ? "on" : "") + '">' + n + "</button>").join("") + '</div><span class="hint">需要核查 ' + all.length + " 条，待核查 " + pend + " 条</span></div></div>";
    if (!all.length) html += '<div class="card">' + A.emptyBlock("当前批次没有需要人工核查的用例", "只有出现业务报错、数据被占用、缺少配置、日期设置失败的用例才需要核查。这次导入的失败用例都能直接从日志判断，所以这里是空的。") + "</div>";
    Object.entries(E.CHECK_KINDS).forEach(([k, kind]) => {
      const cs = fs.filter(c => c.auto.checkKind === k);
      if (!cs.length) return;
      html += '<div class="card"><div class="card-h"><b>' + esc(kind.name) + "</b><span class=\"hint\">" + cs.length + ' 条</span></div><p class="hint" style="margin:0 0 6px">要查什么：' + esc(kind.what) + "。结果对应：" + Object.values(kind.options).map(o => esc(o[0]) + " → " + E.CATS[o[1]].name).join("；") + "</p>" +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>用例</th><th>名称</th><th>报错原文</th><th>核查结果</th><th>核查说明（查了什么、谁查的）</th><th>当前分类</th><th>操作</th></tr></thead><tbody>' +
        cs.map(c => {
          const same = all.filter(x => x !== c && x.auto.checkKind === k && x.sig === c.sig).length;
          const raw = c.pageText || c.alertText || (c.L && c.L.popupText) || c.auto.hits[0] || firstLine(c);
          return '<tr><td class="mono nw"><a data-open="' + c.uid + '">' + A.caseLabel(c) + '</a></td><td class="nm">' + esc(c.name) + '</td><td class="clip" style="max-width:260px" title="' + esc(raw) + '">' + esc(raw) +
            '</td><td><select class="sel" style="min-width:150px" data-dc="' + c.uid + '"><option value="">未核查</option>' + Object.entries(kind.options).map(([ok, o]) => '<option value="' + ok + '"' + (c.dataCheck === ok ? " selected" : "") + ">" + esc(o[0]) + "</option>").join("") + '</select></td><td><input class="inp" style="min-width:180px" data-dn="' + c.uid + '" value="' + esc(c.dataNote || "") + '" placeholder="如：查 agent 表，40100 存在且有效"></td><td>' + A.catTag(c.final) +
            '</td><td class="ops nw">' + (same ? '<a data-same="' + c.uid + '">沿用到相同原因 ' + same + " 条</a>" : "") + "</td></tr>";
        }).join("") + "</tbody></table></div></div>";
    });
    root.innerHTML = html;
    $("#dcRun").onchange = e => { v.run = e.target.value; A.render(); };
    $$("[data-st]", root).forEach(b => b.onclick = () => { v.st = b.dataset.st; A.render(); });
    $$("[data-open]", root).forEach(a => a.onclick = () => openCase(a.dataset.open));
    const upd = () => { A.reclassify(); A.save(); A.render(); };
    $$("[data-dc]", root).forEach(s => s.onchange = () => { const c = S.cases.find(x => x.uid === s.dataset.dc); c.dataCheck = s.value || null; upd(); A.toast("已保存，分类已重新计算"); });
    $$("[data-dn]", root).forEach(i => i.onchange = () => { const c = S.cases.find(x => x.uid === i.dataset.dn); c.dataNote = i.value.trim(); A.save(); });
    $$("[data-same]", root).forEach(a => a.onclick = () => {
      const c = S.cases.find(x => x.uid === a.dataset.same);
      if (!c.dataCheck) { A.toast("请先填写这一条的核查结果", true); return; }
      const others = all.filter(x => x !== c && x.auto.checkKind === c.auto.checkKind && x.sig === c.sig);
      A.dialog("沿用核查结果", "把“" + esc(E.DATA_CHECK[c.dataCheck]) + "”沿用到以下 " + others.length + " 条用例？只有它们用的是同一组数据时才适用。<p class=\"hint\">" + others.map(x => esc(x.id)).join("、") + "</p>",
        [{ t: "取消" }, { t: "沿用", pri: true, fn: () => { others.forEach(x => { x.dataCheck = c.dataCheck; x.dataNote = (c.dataNote || "") + "（沿用 " + c.id + " 的核查）"; }); upd(); A.toast("已沿用"); } }]);
    });
  };
})();
</script>
<script>
/* 页面：回归对比（读取 difflib 生成的 Total / Ignore HTML 报告，合并在一页查看） */
(function () {
  const A = APP, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;

  /* ---------- 解析 difflib.HtmlDiff 报告 ---------- */
  // 把单元格内容转成安全的 HTML：只保留文字和 diff_add / diff_chg / diff_sub 标记
  function cellHTML(td) {
    let out = "", changed = false;
    const walk = n => {
      n.childNodes.forEach(ch => {
        if (ch.nodeType === 3) out += esc(ch.nodeValue.replace(/ /g, " "));
        else if (ch.nodeType === 1) {
          const cls = (ch.className || "").match(/diff_(add|chg|sub)/);
          if (cls) { changed = true; out += '<span class="d_' + cls[1] + '">'; walk(ch); out += "</span>"; }
          else if (ch.tagName === "BR") out += "";
          else walk(ch);
        }
      });
    };
    walk(td);
    return { html: out, text: td.textContent.replace(/ /g, " "), changed };
  }
  function parseDiff(html) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const tables = Array.from(doc.querySelectorAll("table.diff")).filter(t => (t.getAttribute("summary") || "").toLowerCase() !== "legends" && t.querySelector("td.diff_header"));
    if (!tables.length) return { ok: false };
    const heads = Array.from(doc.querySelectorAll("table.diff thead th.diff_header, table.diff thead th[colspan]")).map(th => th.textContent.trim()).filter(Boolean);
    const rows = [];
    tables.forEach(t => {
      Array.from(t.tBodies).forEach((tb, bi) => {
        if (bi > 0 || rows.length) rows.push({ gap: true });
        Array.from(tb.rows).forEach(tr => {
          const tds = Array.from(tr.cells);
          const sides = [];
          tds.forEach((td, i) => { if (td.classList.contains("diff_header")) { const tx = tds[i + 1]; sides.push({ no: td.textContent.trim(), cell: tx ? cellHTML(tx) : { html: "", text: "", changed: false } }); } });
          if (sides.length < 2) {
            const txt = tr.textContent.trim();
            if (txt) rows.push({ note: txt });
            return;
          }
          const [L, R] = sides;
          rows.push({ ln: L.no, lh: L.cell.html, lt: L.cell.text, rn: R.no, rh: R.cell.html, rt: R.cell.text, chg: L.cell.changed || R.cell.changed || (!L.no !== !R.no) });
        });
      });
    });
    while (rows.length && rows[0].gap) rows.shift();
    const nd = rows.filter(r => r.chg).length;
    const noDiff = /No Differences Found/i.test(doc.body ? doc.body.textContent : "");
    return { ok: true, rows, nd: noDiff ? 0 : nd, from: heads[0] || "基线", to: heads[1] || "本次" };
  }

  const KIND_RE = /(^|[_\-\s.()\[\]])(total|ignore|ignored|full|filtered)(?=$|[_\-\s.()\[\]])/gi;
  function caseKey(name) { return name.replace(/\.[^.]+$/, "").replace(KIND_RE, "$1").replace(/[_\-\s.]+$/g, "").replace(/^[_\-\s.]+/g, "").replace(/[_\-\s.]{2,}/g, "_").toLowerCase(); }
  function kindOf(path, fallback) {
    const p = path.toLowerCase();
    if (/(^|[^a-z])ignored?([^a-z]|$)|filtered/.test(p.split("/").pop())) return "ignore";
    if (/(^|[^a-z])(total|full)([^a-z]|$)/.test(p.split("/").pop())) return "total";
    if (/(^|\/)(ignored?|filtered)[^/]*\//.test(p)) return "ignore";
    if (/(^|\/)(total|full)[^/]*\//.test(p)) return "total";
    return fallback;
  }

  async function loadFiles(files, fallback) {
    const C = S.cmp || (S.cmp = { items: {}, order: [] });
    const html = files.filter(f => /\.html?$/i.test(f.name));
    let n = 0, bad = 0;
    for (const f of html) {
      const text = await A.readFile(f);
      const kind = kindOf(f.webkitRelativePath || f.name, fallback);
      const key = caseKey(f.name);
      const p = parseDiff(text);
      const it = C.items[key] || (C.items[key] = { key, name: f.name.replace(/\.[^.]+$/, "").replace(KIND_RE, "$1").replace(/[_\-\s.]+$/, ""), total: null, ignore: null });
      it[kind] = Object.assign(p, { file: f.webkitRelativePath || f.name, raw: text });
      if (!p.ok) bad++;
      n++;
    }
    C.order = Object.keys(C.items).sort((a, b) => a.localeCompare(b, "zh", { numeric: true }));
    A.toast("已读取 " + n + " 个报告" + (bad ? "，其中 " + bad + " 个不是 difflib 格式" : "") + (files.length - html.length ? "，跳过 " + (files.length - html.length) + " 个非 HTML 文件" : ""), bad > 0);
    A.render();
  }

  const statusOf = it => {
    const ig = it.ignore, to = it.total;
    if ((ig && !ig.ok) || (to && !to.ok)) return "bad";
    if (!ig || !to) return "single";
    if (ig.nd > 0) return "real";
    if (to.nd > 0) return "noise";
    return "same";
  };
  const ST = { real: ["过滤后仍有差异", "red"], noise: ["只有噪声差异", "gray"], same: ["完全一致", "green"], single: ["缺少配对报告", "orange"], bad: ["无法识别", "orange"] };

  function clusters(C) {
    const m = {};
    C.order.forEach(k => {
      const it = C.items[k], d = it.ignore && it.ignore.ok ? it.ignore : (!it.total || !it.total.ok ? null : (it.ignore ? null : it.total));
      if (!d) return;
      const seen = new Set();
      d.rows.forEach(r => {
        if (!r.chg) return;
        const key = (r.lt || "").replace(/\s+/g, " ").trim() + " → " + (r.rt || "").replace(/\s+/g, " ").trim();
        if (seen.has(key)) return; seen.add(key);
        (m[key] = m[key] || { key, l: r.lt, r: r.rt, cases: [] }).cases.push(k);
      });
    });
    return Object.values(m).sort((a, b) => b.cases.length - a.cases.length);
  }

  A.PAGES.compare = function (root, v) {
    const C = S.cmp;
    v.view = v.view || "ignore"; v.mode = v.mode || "diff"; v.open = v.open || {};
    let html = '<div class="card"><h3>回归对比汇总 <span class="sub">读取已有的 Total / Ignore 对比报告（Python difflib 生成的 HTML），在一页里查看</span><span class="acts">' +
      '<button class="btn" id="cTot">导入 Total 报告</button><button class="btn" id="cIgn">导入 Ignore 报告</button><button class="btn" id="cDir">导入整个文件夹</button>' + (C ? '<button class="btn dang" id="cClr">清空</button>' : "") + "</span></h3>" +
      '<input type="file" id="cTotIn" multiple accept=".html,.htm" style="display:none"><input type="file" id="cIgnIn" multiple accept=".html,.htm" style="display:none"><input type="file" id="cDirIn" webkitdirectory multiple style="display:none">' +
      '<p class="hint" style="margin:0">Total、Ignore 可以分别选择文件（可多选），也可以选包含两者的文件夹：文件名或上级文件夹名含 total / ignore 的会自动区分。文件名去掉 total / ignore 字样后相同的，视为同一个 Case。报告只在本次打开页面期间有效，不会保存。</p></div>';
    if (!C || !C.order.length) {
      root.innerHTML = html + '<div class="card">' + A.emptyBlock("还没有导入对比报告", "选择同事 A 生成的 total 和 ignore HTML 报告后，这里会显示所有 Case 的差异汇总。") + "</div>";
      bindTop(root); return;
    }
    const items = C.order.map(k => C.items[k]);
    const cnt = s => items.filter(it => statusOf(it) === s).length;
    html += '<div class="kpis">' + [["", "报告 Case 数", items.length, "#409eff"], ["real", "过滤后仍有差异", cnt("real"), "#f56c6c"], ["noise", "只有噪声差异", cnt("noise"), "#909399"], ["same", "完全一致", cnt("same"), "#67c23a"], ["single", "缺少配对报告", cnt("single") + cnt("bad"), "#e6a23c"]]
      .map(([k, l, n, c]) => '<button class="kpi" style="--c:' + c + (v.st === k ? ";box-shadow:0 0 0 2px " + c : "") + '" data-st="' + k + '"><b>' + n + "</b><span>" + l + "</span></button>").join("") + "</div>";

    const cl = clusters(C);
    html += '<div class="card"><h3>差异聚类 <span class="sub">Ignore 报告中相同的“基线 → 本次”变化合并显示，点击只看相关 Case</span>' + (v.cl != null ? '<span class="acts"><button class="btn sm" id="clX">取消聚类筛选</button></span>' : "") + "</h3>" +
      (cl.length ? '<div class="tbl-wrap" style="max-height:260px;overflow-y:auto"><table class="tbl"><thead><tr><th>Case 数</th><th>基线</th><th>本次</th><th></th></tr></thead><tbody>' +
        cl.slice(0, 100).map((x, i) => '<tr class="' + (v.cl === i ? "sel" : "") + '"><td><b>' + x.cases.length + '</b></td><td class="mono clip" style="max-width:420px" title="' + esc(x.l) + '">' + esc(x.l || "（无此行）") + '</td><td class="mono clip" style="max-width:420px" title="' + esc(x.r) + '">' + esc(x.r || "（无此行）") + '</td><td class="ops"><a data-cl="' + i + '">只看这些 Case</a></td></tr>').join("") + "</tbody></table></div>"
        : '<p class="hint" style="margin:0">Ignore 报告中没有差异。</p>') + "</div>";

    let list = items;
    if (v.st) list = list.filter(it => v.st === "single" ? ["single", "bad"].includes(statusOf(it)) : statusOf(it) === v.st);
    if (v.cl != null && cl[v.cl]) list = list.filter(it => cl[v.cl].cases.includes(it.key));
    if (v.q) list = list.filter(it => (it.name + " " + (it.total ? it.total.file : "") + " " + (it.ignore ? it.ignore.file : "")).toLowerCase().includes(v.q.toLowerCase()));
    if (!v.cur || !list.find(it => it.key === v.cur)) v.cur = list[0] ? list[0].key : null;
    const it = v.cur ? C.items[v.cur] : null;

    html += '<div class="cmp"><div class="card" style="padding:12px;margin:0"><input class="inp" id="cQ" style="width:100%;min-width:0;margin-bottom:10px" placeholder="搜索 Case / 文件名" value="' + esc(v.q || "") + '"><div class="clist">' +
      list.map(x => { const s = statusOf(x), st = ST[s]; return '<button class="ci' + (x.key === v.cur ? " on" : "") + '" data-ci="' + esc(x.key) + '"><div><div class="nm" title="' + esc(x.name) + '">' + esc(x.name) + '</div><div class="meta">Ignore ' + (x.ignore ? (x.ignore.ok ? x.ignore.nd : "?") : "-") + " 处 · Total " + (x.total ? (x.total.ok ? x.total.nd : "?") : "-") + ' 处</div></div><span class="tag ' + st[1] + '">' + st[0] + "</span></button>"; }).join("") +
      (list.length ? "" : '<div class="empty">没有符合条件的 Case</div>') + '</div><div class="hint" style="margin-top:8px">快捷键 j / k 切换 Case</div></div>';
    html += '<div class="card" style="margin:0;min-width:0" id="cView">' + (it ? viewer(it, v) : A.emptyBlock("请选择 Case")) + "</div></div>";
    root.innerHTML = html;
    bindTop(root);
    $$("[data-st]", root).forEach(b => b.onclick = () => { v.st = v.st === b.dataset.st || !b.dataset.st ? "" : b.dataset.st; A.render(); });
    $$("[data-cl]", root).forEach(a => a.onclick = () => { v.cl = +a.dataset.cl; A.render(); });
    if ($("#clX")) $("#clX").onclick = () => { v.cl = null; A.render(); };
    $$("[data-ci]", root).forEach(b => b.onclick = () => { v.cur = b.dataset.ci; v.open = {}; A.render(); });
    $("#cQ").onchange = e => { v.q = e.target.value.trim(); A.render(); };
    if (it) bindViewer(root, it, v, list);
  };
  function bindTop(root) {
    $("#cTot").onclick = () => $("#cTotIn").click();
    $("#cIgn").onclick = () => $("#cIgnIn").click();
    $("#cDir").onclick = () => $("#cDirIn").click();
    $("#cTotIn").onchange = e => loadFiles(Array.from(e.target.files), "total");
    $("#cIgnIn").onchange = e => loadFiles(Array.from(e.target.files), "ignore");
    $("#cDirIn").onchange = e => loadFiles(Array.from(e.target.files), "total");
    if ($("#cClr")) $("#cClr").onclick = () => { S.cmp = null; A.S.view.compare = {}; A.render(); };
  }

  function viewer(it, v) {
    const has = { ignore: !!it.ignore, total: !!it.total };
    if (!has[v.view]) v.view = has.ignore ? "ignore" : "total";
    const d = it[v.view];
    let h = '<div class="bar" style="margin-bottom:12px"><b style="font-size:14px">' + esc(it.name) + '</b><span class="tag ' + ST[statusOf(it)][1] + '">' + ST[statusOf(it)][0] + '</span><span class="sp"></span>' +
      '<span class="seg"><button data-view="ignore" class="' + (v.view === "ignore" ? "on" : "") + '"' + (has.ignore ? "" : " disabled") + ">过滤版 Ignore" + (it.ignore && it.ignore.ok ? "（" + it.ignore.nd + "）" : "") + '</button><button data-view="total" class="' + (v.view === "total" ? "on" : "") + '"' + (has.total ? "" : " disabled") + ">完整版 Total" + (it.total && it.total.ok ? "（" + it.total.nd + "）" : "") + "</button></span>" +
      '<span class="seg"><button data-mode="diff" class="' + (v.mode === "diff" ? "on" : "") + '">只看差异</button><button data-mode="all" class="' + (v.mode === "all" ? "on" : "") + '">全文</button></span>' +
      '<button class="btn sm" id="cRaw">查看原报告</button><button class="btn sm" id="cCsv">导出差异</button></div>' +
      '<div class="hint" style="margin-bottom:8px;word-break:break-all">' + esc(d.file) + "</div>";
    if (!d.ok) return h + '<div class="empty"><b>无法识别这个报告的格式</b>目前只支持 Python difflib.HtmlDiff 生成的报告。可以点“查看原报告”直接查看。</div>';
    if (!d.nd) h += '<div class="verdict" style="margin-bottom:10px">' + (v.view === "ignore" ? "过滤后没有差异。" + (it.total && it.total.nd ? "完整版中有 " + it.total.nd + " 处差异，都已被过滤规则忽略，可切换到 Total 查看。" : "") : "完整版中没有差异。") + "</div>";
    h += '<div class="dv"><div class="row hd"><div class="no"></div><div class="tx">' + esc(d.from) + '</div><div class="no"></div><div class="tx">' + esc(d.to) + "</div></div>";
    const rows = d.rows, CTX = 2;
    const show = rows.map((r, i) => v.mode === "all" || r.gap || r.note || rows.slice(Math.max(0, i - CTX), i + CTX + 1).some(x => x.chg));
    let i = 0;
    while (i < rows.length) {
      if (!show[i] && !v.open[i]) {
        let j = i; while (j < rows.length && !show[j]) j++;
        h += '<button class="fold" data-fold="' + i + "-" + j + '">⋯ 折叠了 ' + (j - i) + " 行相同内容，点击展开</button>";
        i = j; continue;
      }
      const r = rows[i];
      if (r.gap) h += '<div class="row"><div class="tx" style="grid-column:1/-1;text-align:center;color:#c0c4cc;font-family:var(--sans)">⋯</div></div>';
      else if (r.note) h += '<div class="row"><div class="tx" style="grid-column:1/-1;font-family:var(--sans);color:#909399">' + esc(r.note) + "</div></div>";
      else h += '<div class="row' + (r.chg ? " chg" : "") + '"><div class="no">' + esc(r.ln) + '</div><div class="tx' + (r.ln ? "" : " blank") + '">' + r.lh + '</div><div class="no">' + esc(r.rn) + '</div><div class="tx' + (r.rn ? "" : " blank") + '">' + r.rh + "</div></div>";
      i++;
    }
    h += '</div><div class="hint" style="margin-top:8px"><span class="d_add" style="padding:0 4px">新增</span> <span class="d_chg" style="padding:0 4px">修改</span> <span class="d_sub" style="padding:0 4px">删除</span>　颜色与原报告一致</div>';
    return h;
  }
  function bindViewer(root, it, v, list) {
    $$("[data-view]", root).forEach(b => b.onclick = () => { if (b.disabled) return; v.view = b.dataset.view; v.open = {}; A.render(); });
    $$("[data-mode]", root).forEach(b => b.onclick = () => { v.mode = b.dataset.mode; A.render(); });
    $$("[data-fold]", root).forEach(b => b.onclick = () => { const [a, z] = b.dataset.fold.split("-").map(Number); for (let k = a; k < z; k++) v.open[k] = true; const top = $("#content").scrollTop; A.render(); $("#content").scrollTop = top; });
    $("#cRaw").onclick = () => {
      const d = it[v.view];
      A.dialog("原报告：" + d.file, '<iframe sandbox="" style="width:100%;height:62vh;border:1px solid #ebeef5" id="rawF"></iframe>', [{ t: "关闭" }]);
      $("#dlg").style.width = "min(1100px, 96vw)";
      $("#rawF").srcdoc = d.raw;
    };
    $("#cCsv").onclick = () => {
      const rows = [["Case", "报告类型", "基线行号", "基线内容", "本次行号", "本次内容"]];
      S.cmp.order.forEach(k => { const x = S.cmp.items[k], d = x[v.view]; if (!d || !d.ok) return; d.rows.filter(r => r.chg).forEach(r => rows.push([x.name, v.view, r.ln, r.lt, r.rn, r.rt])); });
      const text = A.toCSV(rows);
      A.dialog("导出差异（" + (v.view === "ignore" ? "过滤版" : "完整版") + "，全部 Case）", "共 " + (rows.length - 1) + " 行差异。", [{ t: "取消" }, { t: "复制内容", fn: () => A.copy(text) }, { t: "下载文件", pri: true, fn: () => A.download("回归差异_" + v.view + ".csv", text, "text/csv;charset=utf-8") }]);
    };
    document.onkeydown = e => {
      if (A.S.view && document.querySelector(".tab.on") && document.querySelector(".tab.on").dataset.tab !== "compare") return;
      if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
      if (e.key !== "j" && e.key !== "k") return;
      const i = list.findIndex(x => x.key === v.cur), n = i + (e.key === "j" ? 1 : -1);
      if (list[n]) { v.cur = list[n].key; v.open = {}; A.render(); }
    };
  }
})();
</script>
<script>
/* 页面：Jira 起草、提交与导出、Jira 配置。
   一组失败用例（同一分类 + 同一报错特征）= 一张 Jira 单。
   页面负责起草、审核、导出 CSV、生成接口请求；真正写入 Jira 由后端完成（见“流程讲解 → Jira 提报与接口”）。 */
(function () {
  const A = APP, E = ENG, S = A.S, esc = A.esc, $ = A.$, $$ = A.$$;

  /* ============================== 配置 ============================== */
  const DEFAULT_CFG = {
    deploy: "cloud", baseUrl: "", project: "ROTQA", issueType: "Bug", issueTypeEnv: "Task",
    system: "NBS", systemField: "", market: "HK", components: "SYSTEM-QA", labels: "regression, auto-triage",
    envMode: "field", titleTpl: "[{system} Regression] {market} - {module} {cases} failed due to {cause}",
    highKeywords: ["issue", "underwriting", "核保", "payment", "支付", "premium", "保费", "amount", "金额", "quotation", "报价"],
    draftCats: ["PRODUCT_DEFECT", "TEST_DATA", "ENVIRONMENT", "SCRIPT_ISSUE", "POPUP_INTERFERENCE", "NEEDS_HUMAN"],
    backendUrl: "", rerunUrl: "", maskOnExport: true, reviewer: "",
  };
  const cfg = () => (S.jira = Object.assign({}, DEFAULT_CFG, S.jira || {}));
  S.drafts = S.drafts || []; S.jiraLog = S.jiraLog || [];

  // Description 用英文；第三项是给填写人看的中文说明
  const SECS = [["s1", "1. Execution Summary", "执行摘要（含重跑情况）"], ["s2", "2. Affected Cases", "受影响的用例和截图"], ["s3", "3. Steps to Reproduce", "重现步骤"], ["s4", "4. Expected Result", "预期结果"],
    ["s5", "5. Actual Result", "实际结果（报错原文）"], ["s6", "6. Investigation Done", "已做的排查"], ["s7", "7. Test Data", "测试数据"], ["s8", "8. Suspected Cause / To Be Confirmed", "推测与待确认"]];
  const TODO = /To be added|待补充/;
  const FIELD_NAMES = { summary: "Summary 标题", issueType: "Issue Type", priority: "Priority", system: "System", components: "Components", labels: "Labels", assignee: "Assignee", environment: "Environment" };
  const SRC = { 脚本: "blue", AI: "purple", 人工: "orange" };
  const ST = { draft: ["待审核", "orange"], approved: ["已审核", "blue"], submitted: ["已提交", "green"], discarded: ["已放弃", "gray"] };
  const runOf = id => S.runs.find(r => r.id === id) || {};
  const casesOf = d => d.uids.map(u => S.cases.find(c => c.uid === u)).filter(Boolean);
  const base = p => String(p || "").split(/[\\/]/).pop().trim();
  const firstLine = c => (c.error || c.stack || "").split("\n").find(s => s.trim()) || "";
  const most = arr => { const m = {}; arr.filter(Boolean).forEach(x => { m[x] = (m[x] || 0) + 1; }); return Object.keys(m).sort((a, b) => m[b] - m[a])[0] || ""; };
  const now = () => new Date().toLocaleString();

  /* ============================== 起草（脚本部分） ============================== */
  const EXC_EN = {
    NoSuchElementException: "element not found", TimeoutException: "page element wait timeout", StaleElementReferenceException: "stale element reference",
    ElementNotInteractableException: "element not interactable", ElementClickInterceptedException: "click intercepted by another element",
    InvalidSelectorException: "invalid element locator", SessionNotCreatedException: "browser session could not be created",
  };
  function causePhrase(cs) {
    const c = cs[0], a = c.auto, cat = c.final, hit = a.hits[0] || "";
    const words = s => s.replace(/\s+/g, " ").trim().split(" ").slice(0, 12).join(" ");
    if (/^BIZ/.test(a.rule) && hit) {
      const src = [c.pageText, c.alertText, c.error].filter(Boolean).join("\n");
      const line = src.split(/\n/).find(l => l.toLowerCase().includes(hit.toLowerCase())) || hit;
      return { text: words(line).toLowerCase(), sure: true };
    }
    if (cat === "ENVIRONMENT") return { text: "test environment error (" + words(hit || c.exception || "unknown") + ")", sure: !!hit };
    if (cat === "POPUP_INTERFERENCE") return { text: "unexpected popup" + (hit ? ' "' + words(hit) + '"' : ""), sure: !!hit };
    if (cat === "RERUN_PASS") return { text: "intermittent failure (passed on rerun)", sure: true };
    if (EXC_EN[c.exception]) return { text: EXC_EN[c.exception] + (c.module ? " on " + c.module : ""), sure: false };
    if (/^AST/.test(a.rule)) return { text: "assertion failed - " + words(firstLine(c).replace(/^[\w.]*(Error|Exception|Failure)\s*:?\s*/, "")), sure: false };
    // 桌面端和系统提示类规则：按规则给出英文原因短语
    const L = c.L || {}, fn = L.rootAt ? " in " + L.rootAt.func : "";
    const R = {
      "DSK-AMB": "locator matched multiple controls" + fn, "DSK-NF": (L.expectWin ? 'window "' + words(L.expectWin) + '" not found' : "window/control not found") + fn,
      "DSK-VIS": "control not visible" + fn, "DSK-DIS": "control disabled" + fn, "DSK-OPT": "dropdown option not found (" + words(hit) + ")", "DSK-DTP": "date picker value could not be set" + fn, "CHK-DTP": "date picker value could not be set" + fn,
      "MASK1": "control/data lookup returned empty" + fn, "GEN1": "generic error" + fn, "SYS-EMPTY": "unreadable popup after submission",
      "SYS-CFG": 'missing system configuration ("' + words(hit) + '")', "CHK-CFG": 'system configuration issue ("' + words(hit) + '")', "SYS-CRASH": "application unhandled exception",
      "DATA-LOCK": "policy locked by another session", "CHK-LOCK1": "policy locked by an earlier failed case", "SCR2": "invalid locator", "SCR3": "test code error (" + c.exception + ")" + fn,
    };
    if (R[a.rule]) return { text: R[a.rule], sure: a.status === "confirmed" || !!c.override };
    return { text: "[cause TBD]", sure: false };
  }
  function priorityOf(cs, d) {
    const c = cs[0], cat = c.final, k = cfg().highKeywords;
    const runFailed = S.cases.filter(x => x.failed && x.run === d.run).length;
    if (cs.length >= 10) return { v: "High", why: "同一组影响用例 ≥ 10 个" };
    if (cat === "ENVIRONMENT" && cs.length * 2 >= runFailed) return { v: "High", why: "环境问题影响本次一半以上失败用例" };
    if (cat === "PRODUCT_DEFECT") {
      const txt = cs.map(x => [x.name, x.module, x.error].join(" ")).join(" ").toLowerCase();
      const kw = k.find(w => txt.includes(w.toLowerCase()));
      return kw ? { v: "High", why: "产品缺陷，涉及“" + kw + "”（出单/核保/支付/金额类）" } : { v: "Medium", why: "其他产品缺陷" };
    }
    if (["TEST_DATA", "SCRIPT_ISSUE", "POPUP_INTERFERENCE", "RERUN_PASS"].includes(cat)) return { v: "Low", why: "测试数据 / 脚本 / 弹窗类问题" };
    return { v: "Medium", why: "默认" };
  }
  // 每个用例两次执行的截图文件名：第 1 次（页面里粘贴的优先，其次报告路径），第 2 次（重跑结果里的路径）
  const shot1 = c => (c.shots && c.shots[0] && base(c.shots[0].name)) || base((c.screenshot || "").split(";")[0]);
  const shot2 = c => c.rerun === "fail" && c.r2 && c.r2.same !== false ? base((c.r2.screenshot || "").split(";")[0]) : "";
  const rerunSame = c => c.rerun === "fail" && !(c.r2 && c.r2.same === false);
  function shotNames(cs) { return Array.from(new Set(cs.reduce((a, c) => a.concat((c.shots || []).map(s => base(s.name)), [shot1(c), shot2(c)]), []).filter(Boolean))); }
  const oneLine = s => String(s || "").replace(/[{}|]/g, "").replace(/\s+/g, " ").trim();

  function scriptFields(d) {
    const C = cfg(), cs = casesOf(d), r = runOf(d.run), c0 = cs[0];
    if (!c0) return {};
    const mod = most(cs.map(c => c.module)) || "Regression";
    const cause = causePhrase(cs);
    const summary = C.titleTpl.replace("{system}", C.system).replace("{market}", C.market).replace("{module}", mod)
      .replace("{cases}", cs.length > 1 ? "cases" : "case").replace("{n}", cs.length).replace("{cause}", cause.text);
    const pr = priorityOf(cs, d);
    const starts = cs.map(c => c.start).filter(Boolean).sort();
    const environment = ["Environment: " + (r.env || "To be added"), "Device / Browser: " + (Array.from(new Set(cs.map(c => c.device).filter(Boolean))).join(", ") || r.device || "To be added"),
      "Run: " + (r.name || "-"), "Test plan: " + (r.plan || "-"), "Executed at: " + (starts[0] || r.at || "-") + " (UTC+8)"].join("\n");
    const en = E.english(c0), same = cs.filter(rerunSame), second = cs.filter(c => c.parent);
    // 1. 执行摘要：第 1 次 + 重跑（重跑失败且报错相同时，两次写在同一张单里）
    let s1 = "* *Run:* " + (r.name || "-") + " — " + cs.length + " case" + (cs.length > 1 ? "s" : "") + " failed (" + mod + ")\n" +
      "* *Category:* " + en.cat + " (" + en.status + ")\n";
    if (second.length) {
      const p = S.cases.find(x => x.uid === c0.parent);
      s1 += "* *Note:* this failure occurred on the *rerun (attempt 2)*. The first attempt failed with a different error" + (p && p.auto ? ": " + E.english(p).basis : "") + "\n";
      s1 += "* *Attempt 2:* " + en.basis + "\n";
    } else {
      s1 += "* *Attempt 1:* " + en.basis + "\n";
      if (same.length) s1 += "* *Attempt 2 (rerun" + (same[0].r2 && same[0].r2.start ? ", " + same[0].r2.start : "") + "):* " + (same.length === cs.length ? "all " : same.length + " of the ") + "case(s) failed again with the *same error* — the issue is reproducible.\n";
      else if (cs.some(c => c.rerun === "fail")) s1 += "* *Attempt 2 (rerun):* failed with a different error; the second failure is reported separately.\n";
      else s1 += "* *Attempt 2:* not rerun yet.\n";
    }
    s1 += "* *Next step:* " + en.next;
    const two = cs.some(c => shot2(c));
    const table = "|| Case ID || Case Name || " + (two ? "Attempt 1 Screenshot || Attempt 2 Screenshot ||" : "Screenshot ||") + "\n" + cs.slice(0, 20).map(c => {
      const a1 = shot1(c), a2 = shot2(c);
      return "| " + c.id + " | " + (c.name || "-").replace(/\|/g, "/") + " | " + (a1 ? "!" + a1 + "|thumbnail!" : "-") + (two ? " | " + (a2 ? "!" + a2 + "|thumbnail!" : "-") : "") + " |";
    }).join("\n") + (cs.length > 20 ? "\nThe other " + (cs.length - 20) + " cases are listed in the attachment affected_cases.csv" : "");
    const err = (c0.pageText || c0.alertText) ? (c0.pageText || c0.alertText) + "\n" + firstLine(c0) : (c0.error || c0.stack || "").slice(0, 800);
    const err2 = same.find(c => c.r2 && c.r2.error);
    const checks = [];
    const rr = cs.filter(c => c.rerun), rp = rr.filter(c => c.rerun === "pass").length;
    if (rr.length) checks.push("* Rerun " + rr.length + " case(s): " + rp + " passed, " + same.length + " failed with the same error" + (rr.length - rp - same.length ? ", " + (rr.length - rp - same.length) + " failed with a different error" : ""));
    if (second.length) checks.push("* This ticket covers the second attempt of: " + second.map(c => c.id).join(", "));
    Array.from(new Set(cs.filter(c => c.dataCheck).map(c => (E.CHECK_EN[c.dataCheck] || E.DATA_CHECK[c.dataCheck]) + (c.dataNote ? " (" + c.dataNote + ")" : "")))).forEach(t => checks.push("* Manual check: " + t));
    Array.from(new Set(cs.filter(c => c.override).map(c => c.override.reason))).forEach(t => checks.push("* Reviewer note: " + t));
    return {
      summary, issueType: c0.final === "ENVIRONMENT" ? C.issueTypeEnv : C.issueType, priority: pr.v, system: C.system, components: C.components,
      labels: C.labels, assignee: "", environment,
      s1,
      s2: "Total " + cs.length + "\n" + table,
      s3: "To be added: copy the test steps from the platform",
      s4: "To be added: expected result from the case description or the assertion",
      s5: (second.length ? "Attempt 2 error:\n" : same.length ? "Attempt 1 error:\n" : "") + "{noformat}\n" + err.slice(0, 1200) + "\n{noformat}" + (err2 ? "\nAttempt 2 error (same as attempt 1):\n{noformat}\n" + err2.r2.error.slice(0, 600) + "\n{noformat}" : ""),
      s6: checks.join("\n") || "To be added: no extra investigation yet (rerun, data check)",
      s7: "To be added: business codes only (agent code, product code, policy no.); no names, ID numbers or phone numbers",
      s8: "* Suspected (" + en.status + "): " + en.basis + "\n* To be confirmed: " + en.next,
      _priorityWhy: pr.why, _causeSure: cause.sure, _attach: shotNames(cs).concat(cs.length > 20 ? ["affected_cases.csv"] : []),
    };
  }
  function newDraft(run, cat, sig, uids) {
    const d = { id: "D" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), run, cat, sig, uids, status: "draft", mode: "create", target: "", f: {}, src: {}, created: now(), history: [] };
    applyScript(d, true);
    return d;
  }
  // 只覆盖仍是“脚本”来源的字段，人工/AI 改过的保留
  function applyScript(d, all) {
    const sf = scriptFields(d);
    Object.keys(FIELD_NAMES).concat(SECS.map(s => s[0])).forEach(k => { if (all || !d.src[k] || d.src[k] === "脚本") { d.f[k] = sf[k] || ""; d.src[k] = "脚本"; } });
    d.meta = { priorityWhy: sf._priorityWhy, causeSure: sf._causeSure, attach: sf._attach };
  }
  const wiki = d => {
    const C = cfg();
    return (C.envMode === "description" ? "h3. Environment\n{noformat}\n" + d.f.environment + "\n{noformat}\n\n" : "") +
      SECS.map(([k, n]) => "h3. " + (k === "s2" ? n + " (" + casesOf(d).length + ")" : n) + "\n" + (k === "s2" ? d.f.s2.replace(/^(Total \d+|共 \d+ 个)\n/, "") : d.f[k])).join("\n\n");
  };

  /* ============================== 校验 ============================== */
  function validate(d) {
    const errs = [], warns = [], cs = casesOf(d);
    if (!cs.length) errs.push("这张单没有用例");
    if (!d.f.summary.trim()) errs.push("标题为空");
    if (/\{(system|market|module|cases|cause|n)\}/.test(d.f.summary)) errs.push("标题里还有未替换的占位符");
    if (d.f.summary.length > 255) errs.push("标题超过 255 个字符（" + d.f.summary.length + "）");
    if (/\[cause TBD\]/.test(d.f.summary)) errs.push("标题中的原因还是“[cause TBD]”（待确认），请写明原因");
    if (d.mode === "comment" && !/^[A-Z][A-Z0-9]+-\d+$/.test(d.target.trim())) errs.push("追加评论需要填写正确的单号，例如 ROTQA-5339");
    const txt = [d.f.summary, d.f.environment].concat(SECS.map(s => d.f[s[0]])).join("\n");
    if (E.mask(txt) !== txt) errs.push("内容中有疑似个人信息（证件号、手机号、邮箱、卡号）");
    const sus = cs.filter(c => !c.override && c.auto.status === "suspected");
    if (sus.length && !d.ack) warns.push({ k: "sus", t: sus.length + " 个用例的分类仍是“待复核”：" + sus.slice(0, 6).map(c => c.id).join("、") + (sus.length > 6 ? "…" : "") });
    if (d.meta && !d.meta.causeSure && d.src.summary === "脚本") warns.push({ t: "标题中的原因由异常类型推出，不一定是真正原因，请对照证据修改" });
    const todo = SECS.filter(s => TODO.test(d.f[s[0]])).map(s => s[1]);
    if (todo.length) warns.push({ t: "以下小节还是“To be added”（待补充）：" + todo.join("、") });
    const dup = dupOf(d);
    if (dup && d.mode === "create") warns.push({ t: "可能重复：" + dup.text + "。建议改为“追加评论到已有单”" });
    if (!d.f.assignee) warns.push({ t: "没有填写 Assignee（经办人），提交后需在 Jira 里指派" });
    return { errs, warns, ok: !errs.length && !warns.some(w => w.k === "sus") };
  }
  // 本地查重：之前提交过、报错特征相同的单
  function dupOf(d) {
    const hit = S.drafts.find(x => x !== d && x.status === "submitted" && x.issueKey && x.sig === d.sig && x.cat === d.cat);
    if (hit) return { key: hit.issueKey, text: "之前提交的 " + hit.issueKey + " 报错特征相同" };
    const same = S.drafts.find(x => x !== d && x.status !== "discarded" && x.status !== "submitted" && x.sig === d.sig && x.cat === d.cat);
    if (same) return { key: "", text: "另一张草稿（" + runOf(same.run).name + "）报错特征相同，可以合并" };
    return null;
  }

  /* ============================== Jira 起草 ============================== */

    v.run = v.run || S.runs[S.runs.length - 1].id; v.st = v.st || "open";

      '<span class="hint">可起草的失败用例 <b style="color:#303133">' + avail.length + "</b> 条，可分为 <b style=\"color:#303133\">" + nG + '</b> 组（一组 = 一张 Jira 单）' + (skipped ? "；重跑已通过 " + skipped + " 条，不提单" : "") + '</span><span style="flex:1"></span>' +
      '<button class="btn" id="jCats">起草范围</button><button class="btn pri" id="jGen"' + (nG ? "" : " disabled") + ">为 " + nG + " 组起草</button></div>" +

    html += '<div class="cmp" style="grid-template-columns:330px minmax(0,1fr)"><div class="card" style="padding:12px;margin:0">' +

          '</div></div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span class="tag ' + ST[d.status][1] + '">' + ST[d.status][0] + "</span>" + (d.status === "draft" && val.errs.length ? '<span class="tag red">' + val.errs.length + " 个问题</span>" : "") + "</div></div>";
      }).join("") : '<div class="empty">' + (nG ? "点击上方“为 " + nG + " 组起草”" : "没有草稿") + "</div>") + "</div></div>";

    $("#jCats").onclick = catsDialog;
    $("#jGen").onclick = () => {
      Object.values(availGroups).forEach(cs => S.drafts.push(newDraft(v.run, cs[0].final, cs[0].sig, cs.map(c => c.uid))));
      A.save(); v.st = "open"; A.render(); A.toast("已起草 " + nG + " 张");

  function catsDialog() {

      [{ t: "取消" }, { t: "保存", pri: true, fn: () => { C.draftCats = $$("[data-dcat]").filter(x => x.checked).map(x => x.dataset.dcat); A.save(); A.render(); } }]);
  }
  function mergeDialog(v) {

  /* ---------- 草稿表单 ---------- */
  const srcTag = s => '<span class="tag ' + (SRC[s] || "gray") + '" style="font-size:11px;line-height:17px">' + (s || "脚本") + "</span>";

    let h = '<div class="bar"><span class="tag ' + ST[d.status][1] + '">' + ST[d.status][0] + "</span>" + (d.issueKey ? '<span class="tag green">' + esc(d.issueKey) + "</span>" : "") + '<span class="hint">' + esc(runOf(d.run).name) + " · 起草于 " + esc(d.created) + (d.reviewer ? " · 审核：" + esc(d.reviewer) + " " + esc(d.reviewedAt || "") : "") + '</span><span class="sp"></span>' +
      '<div class="seg"><button data-jt="preview" class="' + (v.tab === "preview" ? "on" : "") + '">① 预览</button><button data-jt="edit" class="' + (v.tab === "edit" ? "on" : "") + '">② 编辑</button><button data-jt="cases" class="' + (v.tab === "cases" ? "on" : "") + '">用例（' + cs.length + ")</button></div></div>";

    const txt = (k, ph) => '<input class="inp" style="width:100%" data-jf="' + k + '" value="' + esc(d.f[k]) + '" placeholder="' + esc(ph || "") + '"' + dis + ">";
    const sel = (k, opts) => '<select class="sel" data-jf="' + k + '"' + dis + ">" + opts.map(o => "<option" + (d.f[k] === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select>";
    h += '<div class="form" style="margin-bottom:14px"><label class="fi"><span>提交方式</span><select class="sel" id="jMode"' + dis + '><option value="create"' + (d.mode === "create" ? " selected" : "") + '>新建 Jira 单</option><option value="comment"' + (d.mode === "comment" ? " selected" : "") + ">追加评论到已有单</option></select></label>" +
      (d.mode === "comment" ? '<label class="fi"><span>已有单号</span><input class="inp" id="jTarget" value="' + esc(d.target) + '" placeholder="ROTQA-5339"' + dis + "></label>" : "") + '<span class="hint">项目 ' + esc(C.project) + "</span></div>";

    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 18px">' +
      row("issueType", sel("issueType", Array.from(new Set([C.issueType, C.issueTypeEnv, "Bug", "Task"])))) +

      row("system", txt("system")) + row("components", txt("components", "多个用逗号分隔")) + row("labels", txt("labels", "多个用逗号分隔"), '<div class="hint" style="margin-top:4px">提交时会自动加上 triage-' + esc(d.id) + "，后端用它防止重复建单</div>") +
      row("assignee", txt("assignee", "不自动填写，由你决定")) + "</div>";
    h += row("environment", '<textarea class="ta" rows="5" data-jf="environment"' + dis + ">" + esc(d.f.environment) + "</textarea>", C.envMode === "description" ? '<div class="hint">当前配置：Environment 写在 Description 最前面</div>' : "");
    h += '<div style="margin:6px 0 8px;display:flex;align-items:center;gap:10px"><b>Description</b><span class="hint">英文填写；8 个小节，没有信息的写“To be added: 缺什么”，不要删除小节，不要编造</span><span style="flex:1"></span>' + (lock ? "" : '<button class="btn sm" id="jAI">复制起草材料给 AI</button><button class="btn sm" id="jPaste">粘贴 AI 结果</button>') + "</div>";
    SECS.forEach(([k, n, zh]) => {
      h += '<div style="margin-bottom:8px"><div style="display:flex;gap:8px;align-items:center;margin-bottom:3px"><span style="color:#606266">' + n + '</span><span class="hint">' + zh + "</span>" + srcTag(d.src[k]) + (TODO.test(d.f[k]) ? '<span class="tag orange" style="font-size:11px;line-height:16px">待补充</span>' : "") + '</div><textarea class="ta" rows="' + Math.min(10, Math.max(2, d.f[k].split("\n").length + 1)) + '" data-jf="' + k + '"' + dis + ">" + esc(d.f[k]) + "</textarea></div>";
    });
    return h + checksBlock(d, val, lock) + actions(d, val, lock);
  }
  function checksBlock(d, val, lock) {
    return '<div class="sec"><h5>提交前检查</h5>' + (val.errs.length || val.warns.length ? "" : '<div class="verdict">全部通过</div>') +
      val.errs.map(e => '<div class="verdict" style="border-color:#fde2e2;background:#fef0f0;margin-bottom:6px;color:#f56c6c">必须修改：' + esc(e) + (/个人信息/.test(e) && !lock ? ' <a id="jMask">一键脱敏</a>' : "") + "</div>").join("") +
      val.warns.map(w => '<div class="verdict sus" style="margin-bottom:6px">请确认：' + esc(w.t) + (w.k === "sus" && !lock ? '<label style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="jAck"' + (d.ack ? " checked" : "") + ">我已看过这些用例的证据，确认归入这张单</label>" : "") + "</div>").join("") + "</div>" +
      (d.history.length ? '<div class="sec"><h5>记录</h5><div class="hint">' + d.history.slice(-8).map(esc).join("<br>") + "</div></div>" : "");
  }
  function actions(d, val, lock) {

      h += '<button class="btn dang" id="jDiscard">' + (d.status === "discarded" ? "恢复草稿" : "放弃这张单") + '</button><button class="btn" id="jRefresh">按最新分诊刷新</button><button class="btn" id="jCopy">复制 Description</button>' + (d.status !== "discarded" ? '<button class="btn" data-jt="edit">去编辑</button>' : "");

  }
  function caseTab(d) {
    const cs = casesOf(d), lock = d.status === "submitted";
    const others = S.drafts.filter(x => x !== d && x.run === d.run && ["draft", "approved"].includes(x.status));
    return '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>用例</th><th>名称</th><th>分类</th><th>判定状态</th><th>判断依据</th><th>重跑</th><th>操作</th></tr></thead><tbody>' +

        (lock ? "" : '<a data-jrm="' + c.uid + '">移出本单</a>' + (others.length ? '<select class="sel" style="min-width:0;height:22px;font-size:12px" data-jmv="' + c.uid + '"><option value="">移到其他单…</option>' + others.map(o => '<option value="' + o.id + '">' + esc(o.f.summary.slice(0, 40)) + "</option>").join("") + "</select>" : "")) + "</td></tr>").join("") +

  /* ---------- 预览（简单渲染 Jira wiki 格式） ---------- */
  function renderWiki(t) {
    const out = []; let list = null, table = false, inNo = false, pre = [];
    const thumbs = [];
    const inline = s => esc(s).replace(/\{\{(.+?)\}\}/g, "<code>$1</code>").replace(/\u0001(\d+)\u0001/g, (_, i) => '<span class="tag gray">截图 ' + esc(thumbs[+i]) + "</span>").replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
    const close = () => { if (list) { out.push("</" + list + ">"); list = null; } if (table) { out.push("</table>"); table = false; } };
    t.split("\n").forEach(l => {
      if (l.trim() === "{noformat}") { if (inNo) { out.push('<pre style="background:#f5f7fa;padding:8px;font-size:11.5px;white-space:pre-wrap">' + esc(pre.join("\n")) + "</pre>"); pre = []; } else close(); inNo = !inNo; return; }
      if (inNo) { pre.push(l); return; }
      l = l.replace(/!([^!|]+)\|thumbnail!/g, (_, n) => { thumbs.push(n); return "\u0001" + (thumbs.length - 1) + "\u0001"; });
      let m;
      if ((m = /^h(\d)\.\s*(.*)/.exec(l))) { close(); out.push('<h4 style="margin:14px 0 6px;font-size:14px">' + inline(m[2]) + "</h4>"); }
      else if (/^\|/.test(l)) {
        if (list) { out.push("</" + list + ">"); list = null; }
        if (!table) { out.push('<table class="tbl" style="margin:4px 0">'); table = true; }
        const th = /^\|\|/.test(l), cells = l.split(th ? "||" : "|").slice(1, -1);
        out.push("<tr>" + cells.map(c => (th ? "<th>" : "<td>") + inline(c.trim()) + (th ? "</th>" : "</td>")).join("") + "</tr>");
      }
      else if ((m = /^([#*])\s+(.*)/.exec(l))) { const tg = m[1] === "#" ? "ol" : "ul"; if (table) { out.push("</table>"); table = false; } if (list !== tg) { if (list) out.push("</" + list + ">"); out.push("<" + tg + ' style="margin:4px 0;padding-left:20px">'); list = tg; } out.push("<li>" + inline(m[2]) + "</li>"); }
      else { close(); if (l.trim()) out.push('<p style="margin:4px 0">' + inline(l) + "</p>"); }
    });
    if (inNo && pre.length) out.push("<pre>" + esc(pre.join("\n")) + "</pre>");
    close();
    return out.join("");
  }
  // 预览：三部分表格 —— 1. Title　2. Description（执行摘要 + 截图 + 其他小节）　3. Details（字段）
  function preview(d) {

    // 截图：页面里粘贴/匹配的图片直接显示；只有报告路径时显示文件名
    const imgs = cs.slice(0, 12).map(c => {
      const pics = (c.shots || []).map(s => '<img src="' + s.src + '" data-pimg alt="" title="' + esc(s.name) + '">').join("");
      const a2 = shot2(c);
      return '<div class="pshot"><div class="hint mono">' + esc(c.id) + (c.parent ? "（第2次）" : "") + "</div>" + (pics || (shot1(c) ? '<span class="tag gray">Attempt 1：' + esc(shot1(c)) + "</span>" : '<span class="hint">没有截图</span>')) + (a2 ? '<span class="tag gray">Attempt 2：' + esc(a2) + "</span>" : "") + "</div>";

    return '<table class="ptbl">' +
      '<tr class="ph"><td colspan="2">1. Title</td></tr><tr><th class="pk">Summary</th><td class="pv"><b>' + esc(d.f.summary) + '</b><div class="hint">' + d.f.summary.length + " / 255</div></td></tr>" +
      '<tr class="ph"><td colspan="2">2. Description <span class="hint">英文；截图和执行摘要在最前面</span></td></tr>' +
      (C.envMode === "description" ? '<tr><th class="pk">Environment</th><td class="pv" style="white-space:pre-wrap">' + esc(d.f.environment) + "</td></tr>" : "") +
      sec("s1", SECS[0][1]) + '<tr><th class="pk">Screenshots</th><td class="pv"><div class="pshots">' + imgs + "</div></td></tr>" +
      SECS.slice(1).map(([k, n]) => sec(k, n)).join("") +
      '<tr class="ph"><td colspan="2">3. Details</td></tr>' + det.map(([k, val]) => '<tr><th class="pk">' + k + '</th><td class="pv" style="white-space:pre-wrap">' + esc(val) + "</td></tr>").join("") +
      "</table>";
  }

  /* ---------- AI 起草材料 ---------- */
  function aiPrompt(d) {
    const cs = casesOf(d);
    const s = "你是测试缺陷单起草助手。请根据下面的证据，为这张 Jira 单补写内容。要求：\n" +
      "1. 输出用英文；只能使用给出的证据，不能编造步骤、数据或原因；证据不足的地方写 “To be added: 缺什么”；\n" +
      "2. 引用报错原文时不要改写；\n" +
      "3. 所有推测写在 Suspected Cause 里，并标明 “Suspected”；\n" +
      "4. 标题原因用英文短语，不超过 12 个单词，必须来自证据；\n" +
      "5. 如果有重跑：重跑失败且报错相同，Execution Summary 里分别写 Attempt 1 和 Attempt 2；\n" +
      "6. 严格按下面的格式输出，每个【】标记单独一行，不要输出其他内容：\n" +
      "【Title cause】\n【1. Execution Summary】\n【4. Expected Result】\n【8. Suspected Cause】\n\n" +
      "========== 当前草稿 ==========\nTitle: " + d.f.summary + "\nCategory: " + E.CAT_EN[cs[0].final] + "\n" + SECS.map(([k, n]) => n + ":\n" + d.f[k]).join("\n\n") +
      "\n\n========== 用例证据（最多 5 个） ==========\n" + cs.slice(0, 5).map(c => "Case " + c.id + " " + (c.name || "") + (c.parent ? "（重跑第2次）" : "") + "\n" + c.auto.ev.filter(e => e.kind !== "shot").map(e => e.id + " " + e.label + "：" + (e.text.length > 1200 ? e.text.slice(0, 1200) + "…（已截断）" : e.text)).join("\n") + (c.r2 && c.r2.error ? "\n重跑（第2次）报错：" + c.r2.error.slice(0, 800) : "")).join("\n\n");
    return E.mask(s);
  }
