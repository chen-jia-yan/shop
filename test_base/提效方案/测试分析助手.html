  /* ============================== 提交与导出 ============================== */
  const labelsOf = d => Array.from(new Set(d.f.labels.split(/[,，\s]+/).filter(Boolean).concat(["triage-" + d.id]))).map(s => s.replace(/\s+/g, "-"));
  const comps = d => d.f.components.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const mk = s => cfg().maskOnExport ? E.mask(s) : s;
  function payload(d) {
    const C = cfg(), cs = casesOf(d);
    const fields = { project: { key: C.project }, issuetype: { name: d.f.issueType }, summary: mk(d.f.summary), priority: { name: d.f.priority }, labels: labelsOf(d), components: comps(d).map(n => ({ name: n })), description: mk(wiki(d)) };
    if (C.envMode === "field") fields.environment = mk(d.f.environment);
    if (C.systemField) fields[C.systemField] = { value: d.f.system };
    if (d.f.assignee) fields.assignee = C.deploy === "cloud" ? { accountId: d.f.assignee } : { name: d.f.assignee };
    return {
      draftId: d.id, mode: d.mode, target: d.mode === "comment" ? d.target : null, idempotencyLabel: "triage-" + d.id,
      fields: d.mode === "create" ? fields : undefined,
      comment: d.mode === "comment" ? mk("h4. 自动回归 " + runOf(d.run).name + " 再次出现（" + cs.length + " 个用例）\n* 环境：" + (runOf(d.run).env || "-") + "\n* 受影响用例：" + cs.map(c => c.id).join(", ") + "\n* 报错原文：{{" + firstLine(cs[0] || {}).slice(0, 200).replace(/[{}]/g, "") + "}}\n\n" + wiki(d)) : undefined,
      attachments: (d.meta ? d.meta.attach : []).map(n => ({ fileName: n, sourcePath: n === "affected_cases.csv" ? null : ((cs.find(c => (c.screenshot || "").includes(n)) || {}).screenshot || "").split(";")[0].trim() || null })),
      cases: cs.map(c => ({ id: c.id, name: c.name, category: c.final, rule: c.override ? "人工" : c.auto.rule })),
      reviewer: d.reviewer, reviewedAt: d.reviewedAt,
    };
  }
  function jiraCSV(list) {
    const C = cfg(), maxL = Math.max(1, ...list.map(d => labelsOf(d).length)), maxC = Math.max(1, ...list.map(d => comps(d).length));
    const head = ["Summary", "Issue Type", "Priority"].concat(Array(maxC).fill("Component/s"), Array(maxL).fill("Labels"), C.envMode === "field" ? ["Environment"] : [], ["System", "Assignee", "Description", "Draft ID"]);
    const rows = [head].concat(list.map(d => {
      const L = labelsOf(d), Cm = comps(d);
      return [mk(d.f.summary), d.f.issueType, d.f.priority].concat(Array.from({ length: maxC }, (_, i) => Cm[i] || ""), Array.from({ length: maxL }, (_, i) => L[i] || ""), C.envMode === "field" ? [mk(d.f.environment)] : [], [d.f.system, d.f.assignee, mk(wiki(d)), d.id]);
    }));
    return A.toCSV(rows);
  }
  A.PAGES.jirasub = function (root, v) {
    const C = cfg();
    const ready = S.drafts.filter(d => d.status === "approved");
    const createList = ready.filter(d => d.mode === "create"), commentList = ready.filter(d => d.mode === "comment");
    v.sel = (v.sel || ready.map(d => d.id)).filter(id => ready.find(d => d.id === id));
    const pick = ready.filter(d => v.sel.includes(d.id));
    const sub = S.drafts.filter(d => d.status === "submitted");
    let html = '<div class="kpis">' + [["待审核", S.drafts.filter(d => d.status === "draft").length, "#e6a23c"], ["已审核待提交", ready.length, "#409eff"], ["已提交", sub.length, "#67c23a"], ["已放弃", S.drafts.filter(d => d.status === "discarded").length, "#909399"]]
      .map(([l, n, c]) => '<div class="kpi" style="--c:' + c + '"><b>' + n + "</b><span>" + l + "</span></div>").join("") + "</div>";
    html += '<div class="card"><h3>已审核待提交 <span class="sub">新建 ' + createList.length + " 张 · 追加评论 " + commentList.length + ' 张</span><span class="acts"><button class="btn" data-go="jira">回到起草</button></span></h3>' +
      (ready.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th><input type="checkbox" id="sAll"' + (pick.length === ready.length ? " checked" : "") + "></th><th>标题</th><th>方式</th><th>Priority</th><th>用例数</th><th>附件</th><th>审核人</th><th>操作</th></tr></thead><tbody>" +
        ready.map(d => '<tr><td><input type="checkbox" data-ss="' + d.id + '"' + (v.sel.includes(d.id) ? " checked" : "") + '></td><td style="min-width:260px">' + esc(d.f.summary) + '<div class="hint">' + esc(runOf(d.run).name) + "</div></td><td>" + (d.mode === "create" ? '<span class="tag blue">新建</span>' : '<span class="tag purple">追加到 ' + esc(d.target) + "</span>") + "</td><td>" + esc(d.f.priority) + "</td><td>" + d.uids.length + "</td><td>" + (d.meta ? d.meta.attach.length : 0) + "</td><td>" + esc(d.reviewer || "") + '<div class="hint">' + esc(d.reviewedAt || "") + '</div></td><td class="ops"><a data-sopen="' + d.id + '">查看</a><a data-skey="' + d.id + '">回填单号</a></td></tr>').join("") + "</tbody></table></div>"
        : A.emptyBlock("没有已审核的单", "在“Jira 起草”里审核通过后会出现在这里。", '<button class="btn pri" data-go="jira">去起草</button>')) + "</div>";
    html += '<div class="card"><h3>提交方式 <span class="sub">已选 ' + pick.length + " 张</span></h3>" +
      '<div class="flow">' +
      '<div class="step"><h6><span class="n">A</span>导出 Jira CSV（现在就能用）</h6><p>用 Jira 自带的 CSV 导入（系统 → 外部系统导入 → CSV）批量建单。CSV 不能带附件，截图要在建单后手动上传。只包含“新建”的单。</p><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm pri" id="sCsv"' + (pick.some(d => d.mode === "create") ? "" : " disabled") + '>导出 CSV</button><button class="btn sm" id="sCsvCopy"' + (pick.some(d => d.mode === "create") ? "" : " disabled") + ">复制内容</button></div></div>" +
      '<div class="step"><h6><span class="n">B</span>复制到 Jira 网页手动建单</h6><p>逐张打开“查看”，复制标题和 Description（Jira 文本格式），粘贴到 Jira 建单页面。适合单数少、或者没有导入权限时。</p><div style="margin-top:10px"><button class="btn sm" id="sCopyAll"' + (pick.length ? "" : " disabled") + ">复制全部标题和描述</button></div></div>" +
      '<div class="step' + (C.backendUrl ? "" : " later") + '"><h6><span class="n">C</span>通过后端接口提交' + (C.backendUrl ? "" : ' <span class="tag gray" style="margin-left:6px">后续</span>') + "</h6><p>页面把审核过的单发给后端，后端查重、建单、上传附件、回读确认，返回单号后自动回填。Jira 账号和 Token 只放在后端。" + (C.backendUrl ? "当前后端：" + esc(C.backendUrl) : "需要先在“Jira 配置”填写后端地址。") + '</p><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" id="sPayload"' + (pick.length ? "" : " disabled") + '>查看请求内容</button><button class="btn sm pri" id="sSubmit"' + (pick.length && C.backendUrl ? "" : " disabled") + ">先预检（不写入）</button></div></div>" +
      "</div><p class=\"hint\" style=\"margin:12px 0 0\">用 A 或 B 方式建好单后，请点表格里的“回填单号”，把 Jira 单号填回来。这样之后出现相同报错时，起草页会提示“可能重复”，并建议改为追加评论。</p></div>";
    html += '<div class="card"><h3>提交记录</h3>' + (S.jiraLog.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>时间</th><th>方式</th><th>单数</th><th>结果</th><th>操作人</th></tr></thead><tbody>' + S.jiraLog.slice().reverse().slice(0, 50).map(l => "<tr><td>" + esc(l.at) + "</td><td>" + esc(l.how) + "</td><td>" + l.n + "</td><td>" + esc(l.result) + "</td><td>" + esc(l.by || "") + "</td></tr>").join("") + "</tbody></table></div>" : '<p class="hint" style="margin:0">还没有记录。</p>') +
      (sub.length ? '<h3 style="margin-top:16px">已提交的单</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>单号</th><th>标题</th><th>用例数</th><th>提交时间</th></tr></thead><tbody>' + sub.map(d => '<tr><td class="mono">' + (C.baseUrl && d.issueKey ? '<a href="' + esc(C.baseUrl.replace(/\/$/, "") + "/browse/" + d.issueKey) + '" target="_blank" rel="noopener">' + esc(d.issueKey) + "</a>" : esc(d.issueKey || "-")) + "</td><td>" + esc(d.f.summary) + "</td><td>" + d.uids.length + "</td><td>" + esc(d.submittedAt || "") + "</td></tr>").join("") + "</tbody></table></div>" : "") + "</div>";
    root.innerHTML = html;
    A.bindGo(root);
    $$("[data-ss]", root).forEach(cb => cb.onchange = () => { const id = cb.dataset.ss; v.sel = cb.checked ? v.sel.concat(id) : v.sel.filter(x => x !== id); A.render(); });
    if ($("#sAll")) $("#sAll").onchange = e => { v.sel = e.target.checked ? ready.map(d => d.id) : []; A.render(); };
    $$("[data-sopen]", root).forEach(a => a.onclick = () => { const d = S.drafts.find(x => x.id === a.dataset.sopen); A.go("jira", { run: d.run, cur: d.id, st: "open", tab: "preview" }); });
    $$("[data-skey]", root).forEach(a => a.onclick = () => keyDialog(S.drafts.find(x => x.id === a.dataset.skey)));
    const log = (how, n, result) => { S.jiraLog.push({ at: now(), how, n, result, by: C.reviewer }); A.save(); };
    const csvList = () => pick.filter(d => d.mode === "create");
    $("#sCsv").onclick = () => { A.download("jira_import_" + new Date().toISOString().slice(0, 10) + ".csv", jiraCSV(csvList()), "text/csv;charset=utf-8"); log("导出 CSV", csvList().length, "已导出，待在 Jira 导入"); A.render(); };
    $("#sCsvCopy").onclick = () => { A.copy(jiraCSV(csvList())); log("复制 CSV", csvList().length, "已复制"); };
    $("#sCopyAll").onclick = () => A.showText("标题和描述（Jira 文本格式）", pick.map((d, i) => "#" + (i + 1) + (d.mode === "comment" ? " 追加评论到 " + d.target : "") + "\nSummary: " + mk(d.f.summary) + "\nPriority: " + d.f.priority + "\nLabels: " + labelsOf(d).join(", ") + (C.envMode === "field" ? "\nEnvironment:\n" + mk(d.f.environment) : "") + "\n\nDescription:\n" + mk(wiki(d))).join("\n\n====================\n\n"));
    $("#sPayload").onclick = () => A.showText("发给后端的请求内容（POST " + (C.backendUrl || "<后端地址>") + "/jira/submit）", JSON.stringify({ dryRun: true, deploy: C.deploy, baseUrl: C.baseUrl, project: C.project, items: pick.map(payload) }, null, 2));
    $("#sSubmit").onclick = () => submitBackend(pick, true, log);
  }

  function keyDialog(d) {
    A.dialog("回填 Jira 单号", '<p style="margin-top:0">' + esc(d.f.summary) + '</p><label class="fi"><span>单号</span><input class="inp" id="kIn" value="' + esc(d.mode === "comment" ? d.target : d.issueKey || "") + '" placeholder="ROTQA-5339"></label>',
      [{ t: "取消" }, { t: "保存", pri: true, fn: () => {
        const k = $("#kIn").value.trim().toUpperCase();
        if (!/^[A-Z][A-Z0-9]+-\d+$/.test(k)) { A.toast("单号格式不对，例如 ROTQA-5339", true); return false; }
        d.issueKey = k; d.status = "submitted"; d.submittedAt = now(); d.history.push(now() + " 回填单号 " + k);
        S.jiraLog.push({ at: now(), how: "手动回填", n: 1, result: k, by: cfg().reviewer }); A.save(); A.render(); A.toast("已回填");
      } }]);
  }

  // 后端接口：先预检（dryRun，只查重和校验字段），确认后再正式写入
  async function submitBackend(list, dryRun, log) {
    const C = cfg(), url = C.backendUrl.replace(/\/$/, "") + "/jira/submit";
    A.toast(dryRun ? "正在预检…" : "正在提交…");
    let res;
    try {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dryRun, deploy: C.deploy, baseUrl: C.baseUrl, project: C.project, items: list.map(payload) }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      res = await r.json();
    } catch (e) {
      A.dialog("无法连接后端", "请求 " + esc(url) + " 失败：" + esc(e.message) + "<p class=\"hint\">请确认后端已启动、地址正确，并允许这个页面跨域访问（CORS）。也可以先用 CSV 导出方式。</p>", [{ t: "关闭" }]);
      return;
    }
    const results = (res && res.results) || [];
    const rows = list.map(d => { const r = results.find(x => x.draftId === d.id) || {}; return { d, r }; });
    const body = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>标题</th><th>结果</th><th>说明</th></tr></thead><tbody>' + rows.map(({ d, r }) => "<tr><td>" + esc(d.f.summary) + "</td><td>" + (r.error ? '<span class="tag red">失败</span>' : r.duplicateOf ? '<span class="tag orange">疑似重复</span>' : r.key ? '<span class="tag green">' + esc(r.key) + "</span>" : dryRun ? '<span class="tag blue">可以提交</span>' : '<span class="tag gray">无返回</span>') + "</td><td>" + esc(r.error || (r.duplicateOf ? "已有 " + r.duplicateOf + "（" + (r.duplicateSummary || "") + "）" : r.message || "")) + "</td></tr>").join("") + "</tbody></table></div>";
    if (dryRun) {
      log("后端预检", list.length, results.filter(r => r.error).length + " 个问题");
      A.dialog("预检结果（尚未写入 Jira）", body + '<p class="hint">疑似重复的单建议先回到起草页改为“追加评论”。确认无误后再正式提交。</p>', [{ t: "取消" }, { t: "正式提交到 Jira", pri: true, fn: () => { setTimeout(() => submitBackend(list.filter(d => !(results.find(x => x.draftId === d.id) || {}).error), false, log), 50); } }]);
      return;
    }
    rows.forEach(({ d, r }) => { if (r.key) { d.issueKey = r.key; d.status = "submitted"; d.submittedAt = now(); d.history.push(now() + " 后端提交成功 " + r.key + (r.attachmentsFailed ? "，附件失败 " + r.attachmentsFailed + " 个" : "")); } });
    log("后端提交", list.length, rows.filter(x => x.r.key).length + " 张成功");
    A.save(); A.render();
    A.dialog("提交结果", body, [{ t: "关闭" }]);
  }

  /* ============================== Jira 配置 ============================== */
  A.PAGES.jiracfg = function (root) {
    const C = cfg();
    const f = (k, label, ph, note) => '<label style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:12px"><span style="padding-top:6px;color:#606266">' + label + '</span><div><input class="inp" style="width:100%" data-c="' + k + '" value="' + esc(Array.isArray(C[k]) ? C[k].join(", ") : C[k]) + '" placeholder="' + esc(ph || "") + '">' + (note ? '<div class="hint" style="margin-top:4px">' + note + "</div>" : "") + "</div></label>";
    root.innerHTML = '<div class="card"><h3>Jira 配置 <span class="sub">保存在本机浏览器；这里不填写也不保存 Jira 账号和 Token</span><span class="acts"><button class="btn" id="cfgReset">恢复默认</button><button class="btn pri" id="cfgSave">保存</button></span></h3>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:0 28px">' +
      '<div><h4 style="margin:4px 0 12px">连接</h4>' +
      '<label style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px"><span style="color:#606266">Jira 类型</span><select class="sel" data-c="deploy"><option value="cloud"' + (C.deploy === "cloud" ? " selected" : "") + '>Jira Cloud（网址是 xxx.atlassian.net）</option><option value="dc"' + (C.deploy === "dc" ? " selected" : "") + ">Jira Data Center / Server（公司自建）</option></select></label>" +
      f("baseUrl", "Jira 地址", "https://xxx.atlassian.net", "用于生成单号链接。不确定类型时，打开 <code>Jira地址/rest/api/2/serverInfo</code>，看 deploymentType 是 Cloud 还是 Server/DataCenter") +
      f("backendUrl", "后端接口地址", "http://内网地址:端口/api", "后端做好后填写。留空时“通过后端接口提交”不可用，其他功能不受影响") +
      '<h4 style="margin:18px 0 12px">字段</h4>' +
      f("project", "Project Key", "ROTQA") + f("issueType", "Issue Type", "Bug") + f("issueTypeEnv", "环境问题用的类型", "Task") +
      f("system", "System 默认值", "NBS") + f("systemField", "System 字段 ID", "customfield_10xxx", "自定义字段的 ID，后端或 Jira 管理员可以查到；留空则不提交这个字段") +
      f("components", "默认 Components", "SYSTEM-QA") + f("labels", "默认 Labels", "regression, auto-triage") +
      '<label style="display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px"><span style="color:#606266">Environment 放在</span><select class="sel" data-c="envMode"><option value="field"' + (C.envMode === "field" ? " selected" : "") + '>单独的 Environment 字段</option><option value="description"' + (C.envMode === "description" ? " selected" : "") + ">Description 最前面（项目没有这个字段时）</option></select></label></div>" +
      '<div><h4 style="margin:4px 0 12px">起草规则</h4>' +
      f("market", "市场", "HK") +
      f("titleTpl", "标题模板", "", "可用：{system} {market} {module} {cases}（case / cases）{n}（用例数）{cause}（原因）") +
      f("highKeywords", "高优先级关键字", "", "产品缺陷的用例名称、模块、报错中出现这些词时建议 High，逗号分隔") +
      '<label style="display:flex;gap:8px;align-items:center;margin:4px 0 12px"><input type="checkbox" data-c="maskOnExport"' + (C.maskOnExport ? " checked" : "") + ">导出和提交时再做一次个人信息脱敏</label>" +
      '<div class="verdict sus" style="margin-top:8px">上线前请和熟悉 ROTQA 建单的同事核对：字段名称、必填项、Issue Type 名称、System 可选值、Components 名称。字段名对不上，CSV 导入和接口提交都会失败。</div></div></div></div>';
    $("#cfgSave").onclick = () => {
      $$("[data-c]", root).forEach(el => { const k = el.dataset.c; C[k] = el.type === "checkbox" ? el.checked : Array.isArray(DEFAULT_CFG[k]) ? el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean) : el.value.trim(); });
      A.save(); A.toast("已保存。已有草稿的脚本字段可以在起草页点“按最新分诊刷新脚本字段”更新");
    };
    $("#cfgReset").onclick = () => A.dialog("恢复默认", "确定把 Jira 配置恢复为默认值？", [{ t: "取消" }, { t: "恢复", pri: true, fn: () => { S.jira = Object.assign({}, DEFAULT_CFG); A.save(); A.render(); } }]);
  };

  A.jiraBadge = () => S.drafts.filter(d => d.status === "draft").length;
})();

</script>
<script>APP.init();</script>
</body>
</html>
