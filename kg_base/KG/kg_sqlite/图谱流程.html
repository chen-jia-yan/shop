<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识图谱增量同步 流程图</title>
<style>
  :root{
    --surface:#eef5f3; --canvas:#f7fbfa; --card:#fff; --ink:#17302c; --ink-soft:#5c716c; --line:#d4e7e2;
    --io:#0891b2; --sys:#0d9488; --store:#059669; --model:#6d4bd8; --dec:#d98a0b; --end:#64748b;
    --shadow:0 1px 2px rgba(16,48,44,.05),0 6px 18px rgba(16,48,44,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--surface);color:var(--ink);font-size:14px}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 22px 70px}
  header h1{margin:0;font-size:22px;font-weight:700}
  header p{margin:6px 0 0;color:var(--ink-soft);font-size:13px}
  .bar{display:flex;align-items:center;gap:12px;margin:16px 0 10px;min-height:34px}
  .back{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;display:none}
  .back:hover{border-color:var(--io);color:var(--io)}
  .crumb{font-size:13px;color:var(--ink-soft)}
  .crumb b{color:var(--ink)}
  .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);margin-left:auto}
  .legend .lg{display:flex;align-items:center;gap:5px}
  .legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .stage{background:var(--canvas);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto}
  .home{position:relative;width:860px;height:800px;margin:0 auto}
  .home svg{position:absolute;inset:0;width:860px;height:800px}
  .node{position:absolute;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sys);border-radius:11px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px 10px;font-weight:700;font-size:14px;box-shadow:var(--shadow);z-index:2}
  .node.io{border-top-color:var(--io)} .node.store{border-top-color:var(--store)} .node.model{border-top-color:var(--model)}
  .node.drill{cursor:pointer}
  .node.drill:hover{border-color:var(--io);transform:translateY(-1px)}
  .node.drill::after{content:"▸ 展开";position:absolute;right:8px;bottom:5px;font-size:10px;font-weight:600;color:var(--io);opacity:.8}
  .node.end{border:1px dashed var(--end);border-top:1px dashed var(--end);background:#f1f5f6;color:var(--end);font-weight:600;border-radius:999px;font-size:13px}
  .node.dec{background:transparent;border:none;box-shadow:none}
  .node.dec .dia{position:absolute;inset:6px;transform:rotate(45deg);background:#fdf1dc;border:2px solid var(--dec);border-radius:9px;box-shadow:var(--shadow)}
  .node.dec .lab{position:relative;z-index:1;color:#8a5a12;font-weight:700;font-size:13.5px}
  .elabel{position:absolute;z-index:6;transform:translate(-50%,-50%);background:#fff;border:1px solid #e2d4b4;color:#8a5a12;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;box-shadow:0 1px 4px rgba(16,48,44,.1)}
  .sub{max-width:660px;margin:0 auto;padding:22px 18px 26px}
  .sub-title{font-size:16px;font-weight:700;margin:0 0 4px;text-align:center}
  .sub-note{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0 0 18px}
  .snode{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sys);border-radius:10px;padding:12px 15px;box-shadow:var(--shadow)}
  .snode .st{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .snode .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--sys);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .snode.exp{cursor:pointer}
  .snode .plus{margin-left:auto;font-size:12px;color:var(--io);font-weight:600;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .snode .more{display:none;margin:10px 0 0 30px;font-size:13px;line-height:1.6;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:12px}
  .snode.open .more{display:block}
  .snode.open .plus{color:var(--ink-soft)}
  .sarrow{display:flex;justify-content:center;color:var(--ink-soft);font-size:17px;padding:5px 0}
  @media(max-width:720px){.legend{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>知识图谱 · 增量同步流程图</h1>
    <p>首页看整条增量流程（含分支）· 点带 ▸ 的框进入该步的内部实现</p>
  </header>
  <div class="bar">
    <button class="back" id="back">← 返回总览</button>
    <span class="crumb" id="crumb"><b>总览</b> · 知识图谱增量同步</span>
    <span class="legend" id="legend">
      <span class="lg"><i style="background:var(--io)"></i>入口/出口</span>
      <span class="lg"><i style="background:var(--sys)"></i>系统处理</span>
      <span class="lg"><i style="background:var(--store)"></i>写入存储</span>
      <span class="lg"><i style="background:var(--dec)"></i>判断分支</span>
    </span>
  </div>
  <div class="stage" id="stage"></div>
</div>
<script>
"use strict";
const stage=document.getElementById('stage'), back=document.getElementById('back'), crumb=document.getElementById('crumb'), legend=document.getElementById('legend');
const HN={
 N1:{x:330,y:18,w:200,h:52,t:'文档变更',role:'io',drill:'N1'},
 N2:{x:330,y:100,w:200,h:52,t:'识别身份',role:'sys',drill:'N2'},
 D1:{x:340,y:182,w:180,h:66,t:'删除操作？',role:'dec'},
 N3:{x:330,y:288,w:200,h:52,t:'抽取子图',role:'sys',drill:'N3'},
 N4:{x:330,y:370,w:200,h:52,t:'合并·引用计数',role:'sys',drill:'N4'},
 N5:{x:330,y:452,w:200,h:52,t:'预演 delta',role:'sys',drill:'N5'},
 D2:{x:340,y:534,w:180,h:66,t:'审核通过？',role:'dec'},
 E1:{x:620,y:544,w:180,h:46,t:'放弃（不写盘）',role:'end'},
 N6:{x:330,y:640,w:200,h:52,t:'应用落库',role:'store',drill:'N6'},
 N7:{x:330,y:722,w:200,h:52,t:'完成 · 可回滚',role:'io',drill:'N7'},
};
const HE=[
 ['N1','b','N2','t'],
 ['N2','b','D1','t'],
 ['D1','b','N3','t','新增/更新',488,268],
 ['D1','r','N4','r','删除',586,300],
 ['N3','b','N4','t'],
 ['N4','b','N5','t'],
 ['N5','b','D2','t'],
 ['D2','b','N6','t','通过',486,620],
 ['D2','r','E1','l','未通过',568,552],
 ['N6','b','N7','t'],
];
function anc(n,s){const o=HN[n];if(s==='t')return[o.x+o.w/2,o.y];if(s==='b')return[o.x+o.w/2,o.y+o.h];if(s==='l')return[o.x,o.y+o.h/2];return[o.x+o.w,o.y+o.h/2];}
function pathFor(a,fa,b,fb){
  const [sx,sy]=anc(a,fa),[ex,ey]=anc(b,fb);
  if(fa==='b'&&fb==='t'){const m=(sy+ey)/2;return sx===ex?`M${sx} ${sy} V${ey}`:`M${sx} ${sy} V${m} H${ex} V${ey}`;}
  if(fa==='r'&&fb==='l'){const m=(sx+ex)/2;return `M${sx} ${sy} H${m} V${ey} H${ex}`;}
  if(fa==='r'&&fb==='r'){const m=Math.max(sx,ex)+56;return `M${sx} ${sy} H${m} V${ey} H${ex}`;}
  if(fa==='r'&&fb==='t')return `M${sx} ${sy} H${ex} V${ey}`;
  if(fa==='t'&&fb==='r')return `M${sx} ${sy} V${ey} H${ex}`;
  return `M${sx} ${sy} L${ex} ${ey}`;
}
function renderHome(){
  back.style.display='none'; legend.style.display='flex';
  crumb.innerHTML='<b>总览</b> · 知识图谱增量同步';
  let edges='',labels='';
  HE.forEach(([a,fa,b,fb,lb,lx,ly])=>{
    edges+=`<path d="${pathFor(a,fa,b,fb)}" fill="none" stroke="#9fc4bc" stroke-width="2" marker-end="url(#ar)"/>`;
    if(lb)labels+=`<div class="elabel" style="left:${lx}px;top:${ly}px">${lb}</div>`;
  });
  let nodes='';
  for(const k in HN){const n=HN[k];
    if(n.role==='dec')nodes+=`<div class="node dec" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px"><div class="dia"></div><div class="lab">${n.t}</div></div>`;
    else nodes+=`<div class="node ${n.role}${n.drill?' drill':''}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px" ${n.drill?`data-k="${n.drill}"`:''}>${n.t}</div>`;
  }
  stage.innerHTML=`<div class="home"><svg viewBox="0 0 860 800"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#7fb3a9"/></marker></defs>${edges}</svg>${labels}${nodes}</div>`;
  stage.querySelectorAll('.node.drill').forEach(el=>el.onclick=()=>renderSub(el.dataset.k));
}
const SUB={
 N1:{title:'文档变更 / 入口',note:'有文档变化时，启动图谱同步',steps:[
   {t:'有文档被新增 / 更新 / 删除'},
   {t:'发起同步（人工或入库完成后触发）',more:'没有文档变化时不需要动图谱；每次只针对发生变化的文档。'},
 ]},
 N2:{title:'识别身份',note:'认出"这是哪份文档、是增还是删"',steps:[
   {t:'对文件内容算 sha256 指纹'},
   {t:'生成 doc_id = doc:: + 指纹前16位',more:'内容只要变一个字，指纹就变——天然区分新旧版本，不会撞车。'},
   {t:'比对映射表 → 判定 新增 / 更新 / 删除'},
   {t:'把 doc_id + 操作类型交给下一步'},
 ]},
 N3:{title:'抽取子图',note:'从切片正文里读出实体和关系（删除时跳过本步）',steps:[
   {t:'按 doc_id 读该文档的切片正文',more:'从 jsonl 读；删除文档时不需要这步，直接去合并。'},
   {t:'规则抽取（默认·离线免费）或 LLM 抽取（开关）',more:'规则靠词典 + 结构匹配，稳定省钱；LLM 更聪明但要联网花钱。'},
   {t:'产出子图：新实体 + 新关系'},
   {t:'每个产出打来源标签 source_docs = [本文档]'},
 ]},
 N4:{title:'合并 · 引用计数',note:'把子图并进现有图谱，按来源增减',steps:[
   {t:'把子图并入现有图谱'},
   {t:'新增：已存在的只加来源，全新的才新增',more:'一个实体被多份文档提到，只会存一个，来源表里记多条。'},
   {t:'删除：从 source_docs 划掉这个 doc',more:'引用归零才真删；别的文档还引用着就保留，不会误删共享实体。'},
   {t:'得到合并后的预期图谱（内存，未写盘）'},
 ]},
 N5:{title:'预演 delta',note:'先算清这次会改什么，不写盘',steps:[
   {t:'对比合并前后，算出 加 / 删 / 改 清单'},
   {t:'列出待人工确认的"规则新实体"'},
   {t:'预演态：绝不写盘',more:'delta 既用来给人预览，也会存进 changelog，日后回滚就靠它反着执行。'},
 ]},
 N6:{title:'应用落库',note:'在一个事务里把变更写进 kg.db',steps:[
   {t:'开启事务，写入 kg.db',more:'中途失败整体回滚，不会写一半脏数据；首次写前建议先备份 kg.db.bak。'},
   {t:'更新 nodes / edges / 来源表'},
   {t:'写 changelog（committed，含可回滚 delta），last_seq + 1'},
   {t:'原子提交'},
 ]},
 N7:{title:'完成 · 可回滚',note:'返回结果；出问题可一键回退',steps:[
   {t:'返回本次变更结果（新版本号）'},
   {t:'可回滚：取最近 committed，反向执行 delta',more:'changelog 存了"变更前的样子"，回滚是精确撤销，不是猜。'},
   {t:'回滚后标 rolled_back，last_seq 回退一版'},
 ]},
};
function renderSub(key){
  const s=SUB[key]; if(!s)return;
  back.style.display='inline-block'; legend.style.display='none';
  crumb.innerHTML=`<b>总览</b> ›› <b>${s.title}</b> · 内部实现流程`;
  let html=`<div class="sub"><div class="sub-title">${s.title}</div><div class="sub-note">${s.note}</div>`;
  s.steps.forEach((st,i)=>{
    if(i>0)html+='<div class="sarrow">↓</div>';
    html+=`<div class="snode${st.more?' exp':''}">
      <div class="st"><span class="num">${i+1}</span>${st.t}${st.more?'<span class="plus">＋ 展开</span>':''}</div>
      ${st.more?`<div class="more">${st.more}</div>`:''}</div>`;
  });
  html+='</div>';
  stage.innerHTML=html;
  stage.querySelectorAll('.snode.exp').forEach(el=>el.onclick=()=>{
    el.classList.toggle('open');
    const p=el.querySelector('.plus'); if(p)p.textContent=el.classList.contains('open')?'收起':'＋ 展开';
  });
}
back.onclick=renderHome;
renderHome();
</script>
</body>
</html>
