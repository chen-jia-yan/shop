<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark"><svg viewBox="0 0 32 32" width="18" height="18" fill="none">
      <circle cx="16" cy="15" r="4" fill="#fff"/><circle cx="7" cy="8" r="2.4" fill="#fff" opacity=".9"/>
      <circle cx="25" cy="9" r="2.4" fill="#fff" opacity=".9"/><circle cx="8" cy="24" r="2.4" fill="#fff" opacity=".9"/>
      <circle cx="24" cy="24" r="2.4" fill="#fff" opacity=".9"/>
      <path d="M16 15 L7 8 M16 15 L25 9 M16 15 L8 24 M16 15 L24 24" stroke="#fff" stroke-width="1.5" opacity=".7"/>
    </svg></div>
    <div class="brand-name">知识库智能体<small>知识库管理</small></div>
  </div>
  <div class="crumb" id="crumb"><b>知识库管理</b></div>
  <div class="spacer"></div>
  <button class="btn primary" id="newKbTop">＋ 新建知识库</button>
</div>

<div class="content" id="content">

  <!-- 列表 -->
  <div class="view show" id="view-list">
    <div class="page-h"><h2>知识库</h2><span class="cnt" id="kbCount"></span></div>
    <div class="page-sub">管理全部知识库：进入任意库可增删文档、上传、过滤、重建索引、查看分块与清洗配置。</div>
    <div class="kb-grid" id="kbGrid"></div>
  </div>

  <!-- 详情 -->
  <div class="view" id="view-detail">
    <button class="btn sm" id="backBtn" style="margin-bottom:14px">← 返回知识库列表</button>
    <div class="mini-cards" id="kbMini"></div>

    <div class="sec-title">文档管理</div>
    <div class="kb-tools">
      <button class="btn primary" id="uploadBtn">↥ 上传文件</button>
      <div class="search-in">⌕<input type="text" id="docSearch" placeholder="搜索文件名…"></div>
      <select id="docTypeFilter"><option value="">全部类型</option><option>PDF</option><option>Word</option><option>Markdown</option><option>网页</option></select>
      <select id="docStatusFilter"><option value="">全部状态</option><option>已索引</option><option>索引中</option><option>待处理</option><option>失败</option></select>
      <div class="spacer"></div>
      <button class="btn sm danger" id="batchDelBtn">🗑 批量删除</button>
      <button class="btn sm" id="rebuildBtn">⟳ 重建索引</button>
    </div>
    <div class="card">
      <table>
        <thead><tr>
          <th class="checkcol"><input type="checkbox" id="checkAll"></th>
          <th>文件名</th><th class="num">大小</th><th class="num">分块</th><th>状态</th><th>更新时间</th><th>操作</th>
        </tr></thead>
        <tbody id="docRows"></tbody>
      </table>
      <div style="padding:9px 14px;font-size:11.5px;color:var(--ink-faint);border-top:1px solid var(--line-soft)" id="docCap"></div>
    </div>

    <div class="grid2">
      <div class="card"><div class="card-h"><h3>分块与向量化配置</h3><span class="hint">embedding / chunk</span></div>
        <div class="pad" id="chunkCfg"></div></div>
      <div class="card"><div class="card-h"><h3>索引健康 &amp; 维护</h3><span class="hint">碎片率 / 操作</span></div>
        <div class="pad" id="idxHealth"></div></div>
    </div>

    <div class="sec-title">过滤与清洗规则</div>
    <div class="card"><div class="pad" id="filterRules"></div></div>

    <div class="sec-title">操作日志</div>
    <div class="card"><div class="pad" id="kbLog" style="padding-top:8px"></div></div>
  </div>

</div>

<!-- 上传弹窗 -->
<div class="mask" id="uploadMask">
  <div class="modal">
    <div class="modal-h"><h3>↥ 上传文件到知识库</h3><button class="x" data-close="uploadMask">×</button></div>
    <div class="modal-b">
      <div class="field"><label>目标知识库</label><select id="upKb"></select></div>
      <div class="field"><label>文件</label>
        <div class="dropzone" onclick="document.getElementById('upFile').click()">
          <div style="font-size:26px;color:var(--navy)">⬆</div>
          <div style="font-weight:600;margin-top:6px" id="upName">点击选择或拖拽文件</div>
          <div class="hintline">支持 PDF / Word / Markdown / TXT / HTML · 单次最多 50 个</div>
          <input type="file" id="upFile" style="display:none">
        </div>
      </div>
      <div class="field"><div class="row2">
        <div><label>分块大小 (tokens)</label><select id="upChunk"><option>256</option><option selected>512</option><option>1024</option></select></div>
        <div><label>重叠 (overlap)</label><select id="upOverlap"><option>0</option><option selected>64</option><option>128</option></select></div>
      </div></div>
      <div class="field"><label class="toggle"><input type="checkbox" id="upIndexNow" checked> 上传后立即建立索引</label></div>
    </div>
    <div class="modal-f"><button class="btn" data-close="uploadMask">取消</button>
      <button class="btn primary" id="doUploadBtn">开始上传</button></div>
  </div>
</div>

<!-- 新建知识库弹窗 -->
<div class="mask" id="newKbMask">
  <div class="modal">
    <div class="modal-h"><h3>＋ 新建知识库</h3><button class="x" data-close="newKbMask">×</button></div>
    <div class="modal-b">
      <div class="field"><label>知识库名称</label><input type="text" id="nkName" placeholder="例如 法务合同库"></div>
      <div class="field"><label>描述</label><textarea id="nkDesc" placeholder="简要说明用途与内容范围"></textarea></div>
      <div class="field"><div class="row2">
        <div><label>Embedding 模型</label><select id="nkModel"><option>bge-large-zh-v1.5</option><option>text-embedding-3-large</option><option>m3e-base</option></select></div>
        <div><label>向量维度</label><select id="nkDim"><option>1024</option><option>1536</option><option>768</option></select></div>
      </div></div>
    </div>
    <div class="modal-f"><button class="btn" data-close="newKbMask">取消</button>
      <button class="btn primary" id="doNewKbBtn">创建</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
